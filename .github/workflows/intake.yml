name: Daily arXiv intake
on:
  schedule:
    - cron: "17 2 * * *"   # daily 02:17 UTC, after arXiv's daily announcement
  workflow_dispatch:
    inputs:
      days:
        description: Look-back window in days
        default: "3"
permissions:
  contents: write
concurrency:
  group: arxiv-api
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch new papers
        run: python scripts/intake_arxiv.py --days "${{ github.event.inputs.days || '3' }}"
      - name: Validate
        run: python scripts/validate.py
      - name: Commit and push
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arxiv
          if git diff --cached --quiet; then echo "no new papers"; exit 0; fi
          git commit -m "data: daily arXiv intake $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
