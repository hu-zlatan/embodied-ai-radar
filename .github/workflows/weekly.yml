name: Weekly digest
on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC, digest for the previous ISO week
    - cron: "11 13 * * 1"  # backup slot (scheduled runs can be dropped); skips if the digest exists
  workflow_dispatch:
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/make_digest.py
      - name: Commit and push
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "digest: weekly digest $(date -u +%G-W%V)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
