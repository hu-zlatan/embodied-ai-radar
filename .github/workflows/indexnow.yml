name: IndexNow
on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/indexnow.py
      - name: Commit and push
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .autopilot/indexnow_sent.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: IndexNow sent list"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
