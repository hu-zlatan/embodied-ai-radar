# "Start here" reading path (site page start.html).
# Each step lists curated entry ids (see scripts/radar.py entry_id: "arxiv-<id>" or a title slug).
# Every id must exist in data/curated/ (checked by scripts/validate.py). Notes are editorial, in our own words.
- en: "1 · Robot learning basics: RL and imitation"
  zh: "1 · 机器人学习基础：强化学习与模仿学习"
  why_en: "Almost every later paper builds on these: an on-policy and an off-policy RL workhorse, the classic fix for compounding errors in behavior cloning, and a careful study of what matters when learning from human demos."
  why_zh: "后面几乎所有工作都建立在这些之上：一个 on-policy 和一个 off-policy 的常用强化学习算法、行为克隆误差累积问题的经典解法，以及一项关于从人类演示学习时哪些因素最重要的系统研究。"
  entries: [arxiv-1707.06347, arxiv-1801.01290, arxiv-1011.0686, arxiv-2108.03298]
- en: "2 · Visuomotor policies for manipulation"
  zh: "2 · 操作任务的视觉运动策略"
  why_en: "The policy classes most labs start from today (Diffusion Policy, ACT and its 3D variant), plus UMI, which shows how to collect demos without a robot."
  why_zh: "如今多数实验室的起点策略（Diffusion Policy、ACT 及其 3D 版本），以及 UMI——不用机器人也能采集演示数据的方法。"
  entries: [arxiv-2303.04137, arxiv-2304.13705, arxiv-2403.03954, arxiv-2402.10329]
- en: "3 · Data, benchmarks and tooling"
  zh: "3 · 数据、基准与工具链"
  why_en: "The large shared datasets behind generalist policies, a standard simulated benchmark for comparing methods, and LeRobot, the easiest open stack to train and run policies with."
  why_zh: "通用策略背后的大规模共享数据集、用于横向比较方法的标准仿真基准，以及 LeRobot——训练和部署策略最容易上手的开源工具链。"
  entries: [arxiv-2310.08864, arxiv-2403.12945, arxiv-2306.03310, lerobot]
- en: "4 · Vision-language-action models"
  zh: "4 · 视觉-语言-动作模型（VLA）"
  why_en: "Read in order: RT-2 introduced the idea, OpenVLA made it open, π0 added a flow-matching action expert, and GR00T N1 / SmolVLA are open models you can fine-tune yourself."
  why_zh: "建议按顺序读：RT-2 提出了这一思路，OpenVLA 将其开源，π0 引入了 flow matching 动作专家，GR00T N1 和 SmolVLA 是可以自己微调的开源模型。"
  entries: [arxiv-2307.15818, arxiv-2406.09246, arxiv-2410.24164, arxiv-2503.14734, arxiv-2506.01844]
- en: "5 · Simulation and sim-to-real"
  zh: "5 · 仿真与 sim-to-real"
  why_en: "A physics engine widely used in robot-learning research, two GPU-parallel frameworks for training at scale, and the domain-randomization paper that popularized randomizing the simulator for sim-to-real transfer."
  why_zh: "机器人学习研究中广泛使用的物理引擎、两个用于大规模训练的 GPU 并行框架，以及让“随机化仿真器参数以实现 sim-to-real 迁移”广为流行的域随机化论文。"
  entries: [mujoco, arxiv-2511.04831, arxiv-2410.00425, arxiv-1703.06907]
- en: "6 · Legged locomotion and humanoids"
  zh: "6 · 足式运动与人形机器人"
  why_en: "The massively parallel RL recipe, rapid adaptation to new terrain, a learned transformer controller for real-world humanoid walking, and a sim-to-real alignment method for agile humanoid skills. Unitree RL Gym is the practical starting code."
  why_zh: "大规模并行强化学习的训练范式、对新地形的快速自适应、在真实人形机器人上行走的学习型 Transformer 控制器，以及面向敏捷人形技能的 sim-to-real 对齐方法。Unitree RL Gym 是实际上手的起点代码。"
  entries: [arxiv-2109.11978, arxiv-2107.04034, arxiv-2303.03381, arxiv-2502.01143, unitree-rl-gym]
- en: "7 · World models"
  zh: "7 · 世界模型"
  why_en: "From latent-imagination RL (DreamerV3) to learned video simulators (UniSim), self-supervised video models used for planning (V-JEPA 2) and a world-foundation-model platform for physical AI (Cosmos)."
  why_zh: "从隐空间想象式强化学习（DreamerV3），到学习得到的视频仿真器（UniSim）、用于规划的自监督视频模型（V-JEPA 2），再到面向物理 AI 的世界基础模型平台（Cosmos）。"
  entries: [arxiv-2301.04104, arxiv-2310.06114, arxiv-2506.09985, arxiv-2501.03575]
- en: "8 · Language, planning and navigation"
  zh: "8 · 语言、规划与导航"
  why_en: "How large language models were first connected to robot skills (SayCan, Code as Policies), language-indexed maps for navigation, and a general visual navigation foundation model."
  why_zh: "大语言模型最早如何与机器人技能结合（SayCan、Code as Policies），可用语言索引的导航地图，以及一个通用的视觉导航基础模型。"
  entries: [arxiv-2204.01691, arxiv-2209.07753, arxiv-2210.05714, arxiv-2306.14846]
- en: "9 · Perception for robots"
  zh: "9 · 机器人感知"
  why_en: "Off-the-shelf models that save weeks of work: segmentation and tracking (SAM 2), 6D pose of novel objects (FoundationPose) and 3D reconstruction from a few images (DUSt3R)."
  why_zh: "能省下数周工作量的现成模型：分割与跟踪（SAM 2）、新物体 6D 位姿估计（FoundationPose），以及由少量图像做三维重建（DUSt3R）。"
  entries: [arxiv-2408.00714, arxiv-2312.08344, arxiv-2312.14132]
- en: "10 · Hardware to get your hands dirty"
  zh: "10 · 动手用的硬件"
  why_en: "Low-cost, open designs you can build or buy: a hobby-grade arm that works with LeRobot, a leader-arm teleoperation kit, a dexterous hand, and the bimanual ALOHA 2 setup."
  why_zh: "可以自己搭建或购买的低成本开源设计：可配合 LeRobot 使用的入门机械臂、主从臂遥操作套件、灵巧手，以及双臂 ALOHA 2 平台。"
  entries: [so-arm100-so-101, arxiv-2309.13037, arxiv-2309.06440, arxiv-2405.02292]
