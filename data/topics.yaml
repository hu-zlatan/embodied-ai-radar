# Topic taxonomy. `id` is used in data/curated/<id>.yaml and in tags.
# `keywords` drive the rule-based tagging of the daily arXiv feed (lowercase, matched on title + abstract).
- id: vla
  en: VLA & Robot Foundation Models
  zh: VLA 与机器人基础模型
  desc_en: Vision-language-action models and generalist robot policies.
  desc_zh: 视觉-语言-动作模型与通用机器人策略。
  keywords: [vision-language-action, "vla ", " vla", vlas, generalist policy, generalist robot, robot foundation model, foundation model for robot, embodied foundation, cross-embodiment]
- id: manipulation
  en: Manipulation & Dexterous Hands
  zh: 操作与灵巧手
  desc_en: Imitation learning, diffusion policies, grasping, bimanual and dexterous manipulation.
  desc_zh: 模仿学习、扩散策略、抓取、双臂与灵巧操作。
  keywords: [manipulation, grasp, dexterous, in-hand, bimanual, pick-and-place, pick and place, diffusion policy, imitation learning, teleoperation, deformable object, peg-in-hole, assembly task, robotic assembly, visuomotor, rearrangement, non-prehensile, dexterous retargeting, hand retargeting]
- id: tactile
  en: Tactile & Visuotactile Sensing
  zh: 触觉与视触觉感知
  desc_en: Tactile sensors, touch representations and contact-rich control.
  desc_zh: 触觉传感器、触觉表征与接触丰富的控制。
  keywords: [tactile, visuotactile, visuo-tactile, gelsight, touch sensing, haptic, force sensing, contact-rich]
- id: locomotion
  en: Locomotion & Humanoids
  zh: 运动控制与人形机器人
  desc_en: Legged locomotion, humanoid whole-body control and parkour.
  desc_zh: 足式运动、人形全身控制与跑酷。
  keywords: [locomotion, humanoid, legged, quadruped, biped, whole-body control, parkour, gait]
- id: world-models
  en: World Models
  zh: 世界模型
  desc_en: Learned dynamics, video world models and model-based RL for embodied agents.
  desc_zh: 学习的动力学模型、视频世界模型与基于模型的强化学习。
  keywords: [world model, world action model, world-action model, action world model, " wam ", " wams ", video action model, video-action model, world-language-action, video prediction, model-based reinforcement, learned simulator, dynamics model, video generation for robot]
- id: navigation
  en: Navigation & Embodied Agents
  zh: 导航与具身智能体
  desc_en: Vision-language navigation, embodied question answering, mobile manipulation and LLM planners.
  desc_zh: 视觉语言导航、具身问答、移动操作与大模型规划。
  keywords: [navigation, vision-and-language navigation, vln, embodied agent, embodied question, mobile manipulation, task planning, llm planner, object goal]
- id: perception
  en: Perception, SLAM & 3D Mapping
  zh: 感知、SLAM 与三维建图
  desc_en: Visual / LiDAR SLAM and odometry, 3D reconstruction, object pose, depth and open-vocabulary scene maps for robots.
  desc_zh: 视觉/激光 SLAM 与里程计、三维重建、物体位姿、深度估计与开放词汇场景地图。
  keywords: [slam, odometry, simultaneous localization, semantic mapping, 3d mapping, occupancy grid, lidar, point cloud, 3d reconstruction, pose estimation, 6d pose, scene graph, depth estimation, semantic occupancy, occupancy prediction, gaussian splatting, neural radiance, nerf, place recognition]
- id: control
  en: Planning, Control & Safety
  zh: 规划、控制与安全
  desc_en: Motion planning, trajectory optimization, MPC, safety filters and safe learning-based control.
  desc_zh: 运动规划、轨迹优化、模型预测控制、安全滤波器与安全的学习型控制。
  keywords: [model predictive control, " mpc", control barrier, safety filter, reachability, hamilton-jacobi, motion planning, trajectory optimization, collision avoidance, collision-free, safe reinforcement, safety-critical, path planning, optimal control, motion generation, lyapunov, impedance control, admittance control, behavior tree, multi-agent path, trajectory planning, trajectory tracking, pursuit-evasion]
- id: learning
  en: "Robot Learning: RL & Imitation"
  zh: 机器人学习：强化学习与模仿学习
  desc_en: Reinforcement learning, imitation learning and policy post-training methods for robots, on any embodiment.
  desc_zh: 面向机器人的强化学习、模仿学习与策略后训练方法，不限机器人形态。
  keywords: [reinforcement learning, " rl ", imitation learning, behavior cloning, behaviour cloning, policy learning, robot policy, robot policies, offline rl, offline reinforcement, reward model, reward shaping, action chunk, flow matching polic, diffusion polic, policy improvement, learning from demonstration, inverse reinforcement, human video, lifelong robot learning, continual learning, policy search, preference optimization, residual policy, fleet learning]
- id: sim
  en: Sim-to-Real & Simulators
  zh: 仿真与 Sim-to-Real
  desc_en: Physics simulators, GPU-parallel training and transfer to real robots.
  desc_zh: 物理仿真器、GPU 并行训练与向真实机器人迁移。
  keywords: [sim-to-real, sim2real, simulator, simulation platform, domain randomization, real-to-sim, digital twin, isaac, mujoco]
- id: datasets
  en: Datasets & Benchmarks
  zh: 数据集与基准
  desc_en: Large robot datasets, egocentric data and evaluation suites.
  desc_zh: 大规模机器人数据集、第一视角数据与评测基准。
  keywords: [dataset, benchmark, data collection, demonstrations at scale, evaluation suite]
- id: hardware
  en: Hardware & Open-Source Robots
  zh: 硬件与开源机器人
  desc_en: Low-cost arms, hands, grippers and data-collection rigs you can build.
  desc_zh: 可自行搭建的低成本机械臂、灵巧手、夹爪与数据采集设备。
  keywords: [low-cost, open-source hardware, open-source robot, gripper design, hand design, robot hardware, handheld gripper, soft robot, continuum robot, continuum arm, exoskeleton]
