- title: "When the Simulator Fails, Not the Policy: Auditing Contact Artifacts in Simulated Robot Benchmarks"
  type: paper
  arxiv: "2610.41857"
  year: 2026
  code: https://github.com/ALEXander22568/simuguard
  added: 2026-11-02
  rating: 2
  tags: [benchmark-audit, physx, robotwin, libero, contact]
  takeaway_en: "Many benchmark 'policy failures' are physics-engine ejections. SimuGuard traced RoboTwin artifacts to one collision constant; changing it cut artifact episodes from 12/100 to none and lifted five tasks 89% → 98%."
  takeaway_zh: "审计仿真基准：不少“策略失败”其实是物理引擎把物体弹飞。SimuGuard 为 LIBERO、RoboTwin、RoboCasa、RoboDojo 提供审计插件，把 RoboTwin 上的问题追溯到碰撞检测的一个常量；仅改动它，异常回合由 100 回合 12 次降到 0，五个容器任务成功率由 89% 升到 98%。"

