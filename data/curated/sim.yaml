  takeaway_en: 'Treats simulator parameters as effective, frequency- and resolution-dependent values and derives closed-form PD damping and inertia corrections for rigid-body PD, cables, and underwater swimming, with a 4-step workflow.'
  takeaway_zh: '将物理学中的重整化思想引入 sim-to-real：模拟器参数不该照抄真机数值，而应取依赖仿真频率和分辨率的"有效值"，才能让仿真与真机最接近。论文闭式推导了有限仿真频率下 PD 控制的有效阻尼与惯量修正，覆盖刚体 PD 控制、绳索和水下游动，并给出 4 步实操流程。'
