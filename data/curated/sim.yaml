- title: "MuJoCo"
  type: simulator
  year: 2012
  org: Google DeepMind
  url: https://mujoco.org/
  code: https://github.com/google-deepmind/mujoco
  highlight: true
  tags: [physics, open-source]
  takeaway_en: Fast, accurate contact physics; the default simulator for robot learning research, open-sourced by DeepMind.
  takeaway_zh: 快速准确的接触物理仿真，机器人学习研究的默认仿真器，由 DeepMind 开源。
- title: "MuJoCo Playground"
  type: paper
  arxiv: "2502.08844"
  year: 2025
  org: Google DeepMind, UC Berkeley
  code: https://github.com/google-deepmind/mujoco_playground
  tags: [gpu-parallel, sim2real, open-source]
  takeaway_en: GPU-accelerated MJX environments for locomotion and manipulation that train in minutes and transfer to real robots.
  takeaway_zh: 基于 MJX 的 GPU 加速运动与操作环境，几分钟即可训练并迁移到真实机器人。
- title: "Isaac Gym: High Performance GPU-Based Physics Simulation For Robot Learning"
  type: paper
  arxiv: "2108.10470"
  year: 2021
  org: NVIDIA
  tags: [gpu-parallel, physics]
  takeaway_en: Keeps physics and policy on the GPU end-to-end, enabling thousands of parallel environments on one card.
  takeaway_zh: 物理仿真与策略全程在 GPU 上运行，单卡即可并行数千个环境。
- title: "Orbit: A Unified Simulation Framework for Interactive Robot Learning Environments"
  type: paper
  arxiv: "2301.04195"
  year: 2023
  org: ETH Zurich, NVIDIA, Toronto
  code: https://github.com/isaac-sim/IsaacLab
  tags: [gpu-parallel, framework, open-source]
  takeaway_en: The framework that became Isaac Lab — modular robots, sensors and tasks on top of Isaac Sim.
  takeaway_zh: Isaac Lab 的前身，在 Isaac Sim 之上提供模块化的机器人、传感器与任务。
- title: "ManiSkill3: GPU Parallelized Robotics Simulation and Rendering for Generalizable Embodied AI"
  type: paper
  arxiv: "2410.00425"
  year: 2024
  org: UC San Diego
  code: https://github.com/haosulab/ManiSkill
  tags: [gpu-parallel, rendering, benchmark, open-source]
  takeaway_en: GPU-parallel simulation and rendering with many manipulation tasks; fast visual RL and data generation.
  takeaway_zh: GPU 并行仿真与渲染，内置大量操作任务，适合快速视觉强化学习与数据生成。
- title: "Genesis"
  type: simulator
  year: 2024
  org: Genesis Embodied AI
  code: https://github.com/Genesis-Embodied-AI/Genesis
  tags: [physics, gpu-parallel, open-source]
  takeaway_en: An open-source, Python-native physics platform covering rigid bodies, soft bodies, fluids and fast GPU simulation.
  takeaway_zh: 开源、Python 原生的物理平台，覆盖刚体、软体、流体，支持高速 GPU 仿真。
- title: "robosuite: A Modular Simulation Framework and Benchmark for Robot Learning"
  type: paper
  arxiv: "2009.12293"
  year: 2020
  org: Stanford, UT Austin
  code: https://github.com/ARISE-Initiative/robosuite
  topics: [datasets]
  tags: [mujoco, benchmark, open-source]
  takeaway_en: Modular MuJoCo-based manipulation environments behind many imitation-learning benchmarks.
  takeaway_zh: 基于 MuJoCo 的模块化操作环境，是众多模仿学习基准的底座。
- title: "RoboCasa: Large-Scale Simulation of Everyday Tasks for Generalist Robots"
  type: paper
  arxiv: "2406.02523"
  year: 2024
  org: UT Austin, NVIDIA
  code: https://github.com/robocasa/robocasa
  topics: [datasets]
  tags: [kitchen, benchmark, synthetic-data]
  takeaway_en: 120 kitchen scenes, 2,500+ objects and 100 tasks with generated demonstrations for training generalist policies.
  takeaway_zh: 120 个厨房场景、2500 多个物体与 100 个任务，并附生成演示，用于训练通用策略。
- title: "SAPIEN: A SimulAted Part-based Interactive ENvironment"
  type: paper
  arxiv: "2003.08515"
  year: 2020
  org: UC San Diego
  tags: [articulated-objects, physics]
  takeaway_en: A simulator with large-scale articulated objects (PartNet-Mobility) for interaction tasks like opening drawers.
  takeaway_zh: 包含大规模铰接物体（PartNet-Mobility）的仿真器，适合开抽屉等交互任务。
- title: "Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World"
  type: paper
  arxiv: "1703.06907"
  year: 2017
  org: OpenAI
  tags: [sim2real, domain-randomization]
  takeaway_en: Randomizing textures, lighting and cameras in sim makes vision models work on real images with no real data.
  takeaway_zh: 在仿真中随机化纹理、光照和相机，使视觉模型无需真实数据即可在真实图像上工作。
- title: "Sim-to-Real Transfer of Robotic Control with Dynamics Randomization"
  type: paper
  arxiv: "1710.06537"
  year: 2017
  org: OpenAI, UC Berkeley
  tags: [sim2real, domain-randomization, rl]
  takeaway_en: Randomizing physical parameters during training yields control policies robust enough to run on a real arm.
  takeaway_zh: 训练中随机化物理参数，得到足以在真实机械臂上运行的鲁棒控制策略。
- title: "Active Generative Simulation: Meta-Learning What to Simulate for Sim-and-Real Policy Co-Training"
  type: paper
  arxiv: "2610.19479"
  year: 2026
  org: Georgia Tech
  venue: CoRL 2026
  project: https://meta-gensim.github.io
  added: 2026-10-19
  tags: [sim-and-real, co-training, meta-learning]
  takeaway_en: MetaGenSim learns which simulated data to generate, using meta-gradients from real-world performance, instead of sampling the simulator uniformly.
  takeaway_zh: MetaGenSim 利用来自真实世界表现的元梯度，学习应该生成哪些仿真数据，而不是对仿真器做均匀采样。
- title: "RoboTwin 2.0: A Scalable Data Generator and Benchmark with Strong Domain Randomization for Robust Bimanual Robotic Manipulation"
  type: paper
  arxiv: "2506.18088"
  year: 2025
  code: https://github.com/RoboTwin-Platform/RoboTwin
  topics: [manipulation, datasets]
  tags: [sim, dual-arm, data-generation, domain-randomization, benchmark]
  takeaway_en: Simulation pipeline that writes and checks task code with multimodal LLMs to mass-produce bimanual demos under heavy randomization (clutter, lighting, backgrounds, instructions); also a 50-task dual-arm benchmark.
  takeaway_zh: 用多模态大模型自动生成并校验任务代码，在强域随机化（杂物、光照、背景、指令）下批量产出双臂演示数据的仿真管线，同时提供 50 个双臂任务的基准。
- title: "MimicGen: A Data Generation System for Scalable Robot Learning using Human Demonstrations"
  type: paper
  arxiv: "2310.17596"
  year: 2023
  venue: CoRL 2023
  org: NVIDIA, UT Austin
  code: https://github.com/NVlabs/mimicgen
  topics: [manipulation, datasets]
  tags: [sim, data-generation, imitation]
  takeaway_en: Turns a handful of human demos into thousands by splitting them into object-centric segments and replaying those segments in new scenes; widely reused to scale imitation data.
  takeaway_zh: 把少量人类演示切分为以物体为中心的片段，并在新场景中变换重放，从而扩增为数千条演示；被广泛用于扩充模仿学习数据。
- title: "BEHAVIOR-1K: A Human-Centered, Embodied AI Benchmark with 1,000 Everyday Activities and Realistic Simulation"
  type: paper
  arxiv: "2403.09227"
  year: 2022
  venue: CoRL 2022
  org: Stanford
  code: https://github.com/StanfordVL/BEHAVIOR-1K
  topics: [datasets]
  tags: [sim, household, long-horizon, benchmark]
  takeaway_en: 1,000 household activities chosen from a survey of what people want robots to do, defined in a logic language and simulated in OmniGibson with realistic physics and rendering.
  takeaway_zh: 依据人们希望机器人做什么的调查挑选出 1000 项家务活动，用逻辑语言定义，并在具备真实物理与渲染的 OmniGibson 中仿真。
- title: "Isaac Lab: A GPU-Accelerated Simulation Framework for Multi-Modal Robot Learning"
  type: paper
  arxiv: "2511.04831"
  year: 2025
  org: NVIDIA
  code: https://github.com/isaac-sim/IsaacLab
  tags: [gpu-parallel, framework, sensors, open-source]
  takeaway_en: The reference paper for Isaac Lab, Orbit's successor — GPU-parallel physics, rendering and sensor simulation with ready-made robots and tasks for RL and imitation.
  takeaway_zh: Isaac Lab（Orbit 的后继）的正式论文：GPU 并行的物理、渲染与传感器仿真，内置机器人与任务，面向强化学习和模仿学习。
- title: "AI2-THOR: An Interactive 3D Environment for Visual AI"
  type: paper
  arxiv: "1712.05474"
  year: 2017
  org: Allen Institute for AI
  code: https://github.com/allenai/ai2thor
  tags: [household, interactive, embodied-agents, open-source]
  takeaway_en: Photorealistic interactive indoor scenes where agents open, pick up and change objects; the base of many embodied-AI benchmarks such as ALFRED.
  takeaway_zh: 具有可交互物体的逼真室内场景，智能体可开关、拾取和改变物体，是 ALFRED 等众多具身智能基准的基础。
- title: "Habitat 3.0: A Co-Habitat for Humans, Avatars and Robots"
  type: paper
  arxiv: "2310.13724"
  year: 2023
  org: Meta AI
  venue: ICLR 2024
  code: https://github.com/facebookresearch/habitat-lab
  topics: [navigation]
  tags: [sim, human-robot-collaboration, humanoid-avatars, social-navigation]
  takeaway_en: Adds simulated humanoid avatars and a human-in-the-loop interface to Habitat, so robots can be trained and evaluated on tasks shared with people, such as social navigation and social rearrangement.
  takeaway_zh: 为 Habitat 加入仿真人形化身和真人在环交互接口，可在与人协作的任务（如社交导航、社交重排）上训练和评测机器人。
- title: "HyperDrone: Simulation-to-Reality Transfer at Millions of Frames per Second"
  type: paper
  arxiv: "2610.28950"
  year: 2026
  venue: CoRL 2026
  added: 2026-10-22
  tags: [aerial, quadrotor, simulator, gpu, rendering, sim-to-real]
  takeaway_en: GPU batch-rendering quadrotor simulator; reports 20×+ the speed of existing batch quadrotor sims, with a new ray tracer rendering RGB, depth, segmentation, normals and optical flow (CoRL 2026).
  takeaway_zh: 以 GPU 批量渲染为核心的四旋翼仿真器；报告比现有批量四旋翼仿真器快 20 倍以上，新的光线追踪引擎（支持 OptiX、Vulkan、Metal、WebGPU）可渲染 RGB、深度、分割、法向和光流（CoRL 2026）。
- title: "Brax: A Differentiable Physics Engine for Large Scale Rigid Body Simulation"
  type: paper
  arxiv: "2106.13281"
  year: 2021
  org: Google
  venue: NeurIPS 2021 Datasets and Benchmarks
  code: https://github.com/google/brax
  topics: [learning]
  tags: [physics, jax, gpu, tpu, differentiable]
  takeaway_en: JAX physics engine that runs thousands of environments in parallel on GPU/TPU together with the RL training loop, cutting locomotion training from hours to minutes.
  takeaway_zh: 基于 JAX 的物理引擎，在 GPU/TPU 上与强化学习训练循环一起并行运行数千个环境，把运动控制训练从数小时缩短到数分钟。
- title: "Habitat 2.0: Training Home Assistants to Rearrange their Habitat"
  type: paper
  arxiv: "2106.14405"
  year: 2021
  org: Meta AI
  venue: NeurIPS 2021
  topics: [navigation, manipulation]
  tags: [rearrangement, mobile-manipulation, home, benchmark]
  takeaway_en: Adds fast rigid-body physics and an interactive apartment dataset (ReplicaCAD) to Habitat, plus a home-rearrangement benchmark for mobile manipulators.
  takeaway_zh: 为 Habitat 加入快速刚体物理与可交互公寓数据集 ReplicaCAD，并提出面向移动操作机器人的家居物品重排基准。
- title: "Humanoid-Gym: Reinforcement Learning for Humanoid Robot with Zero-Shot Sim2Real Transfer"
  type: paper
  arxiv: "2404.05695"
  year: 2024
  org: RobotEra
  code: https://github.com/roboterax/humanoid-gym
  topics: [locomotion]
  tags: [humanoid, rl, isaac-gym, sim-to-sim, sim-to-real]
  takeaway_en: Isaac Gym–based RL framework for humanoid locomotion with a sim-to-sim check in MuJoCo before deploying zero-shot to real humanoids; a common starting point for humanoid RL.
  takeaway_zh: 基于 Isaac Gym 的人形机器人运动强化学习框架，先在 MuJoCo 中做 sim2sim 验证，再零样本部署到真实人形机器人，是人形 RL 的常用起点。
- title: "Gazebo"
  type: simulator
  year: 2004
  org: Open Robotics
  url: https://gazebosim.org/
  code: https://github.com/gazebosim/gz-sim
  tags: [ros, ros2, physics, open-source]
  takeaway_en: The long-standing open-source robot simulator of the ROS ecosystem — sensors, plugins and ROS 2 integration; the usual choice for testing full robot software stacks rather than training policies.
  takeaway_zh: ROS 生态中历史悠久的开源机器人仿真器，提供传感器、插件与 ROS 2 集成；通常用于测试完整的机器人软件栈，而非训练策略。
- title: "dm_control: Software and Tasks for Continuous Control"
  type: paper
  arxiv: "2006.12983"
  year: 2020
  org: DeepMind
  code: https://github.com/google-deepmind/dm_control
  topics: [sim, learning]
  tags: [mujoco, benchmark, rl, open-source]
  takeaway_en: DeepMind's Python stack on top of MuJoCo — bindings, PyMJCF and Composer for building models and tasks, the standard Control Suite benchmarks, plus locomotion and arm-and-bricks manipulation tasks.
  takeaway_zh: DeepMind 基于 MuJoCo 的 Python 工具栈：底层绑定、用于程序化建模与编写任务的 PyMJCF 和 Composer、作为标准基准的 Control Suite，以及运动控制和机械臂拼积木操作任务。
- title: "SoftGym: Benchmarking Deep Reinforcement Learning for Deformable Object Manipulation"
  type: paper
  arxiv: "2011.07215"
  year: 2020
  org: Carnegie Mellon University
  venue: CoRL 2020
  code: https://github.com/Xingyu-Lin/softgym
  project: https://sites.google.com/view/softgym
  topics: [sim, manipulation]
  tags: [deformable, cloth, rope, liquid, benchmark, rl]
  takeaway_en: Open-source Gym-style benchmark for manipulating deformable objects such as cloth, rope and liquids; shows that high-dimensional, partially observable states make these tasks hard for standard RL.
  takeaway_zh: 开源、Gym 接口的可变形物体操作基准（布料、绳子、液体等）；实验表明高维且部分可观测的状态让这类任务对常规强化学习方法很困难。
- title: "Newton"
  type: simulator
  year: 2025
  org: Disney Research, Google DeepMind, NVIDIA (Linux Foundation project)
  code: https://github.com/newton-physics/newton
  tags: [physics, gpu-parallel, open-source, warp, openusd]
  takeaway_en: Open, GPU-accelerated physics engine built on NVIDIA Warp and OpenUSD with multiple solvers for contact-rich robot learning; co-developed by Disney Research, Google DeepMind and NVIDIA, hosted by the Linux Foundation.
  takeaway_zh: 基于 NVIDIA Warp 和 OpenUSD 的开源 GPU 物理引擎，支持多种求解器，面向接触丰富的机器人学习；由 Disney Research、Google DeepMind 和 NVIDIA 联合开发，由 Linux 基金会托管。
- title: "DexMimicGen: Automated Data Generation for Bimanual Dexterous Manipulation via Imitation Learning"
  type: paper
  arxiv: "2410.24185"
  year: 2024
  org: NVIDIA, UT Austin
  venue: ICRA 2025
  code: https://github.com/NVlabs/dexmimicgen
  project: https://dexmimicgen.github.io/
  topics: [manipulation, datasets]
  tags: [sim, humanoid, dexterous-hand, bimanual, data-generation, imitation]
  takeaway_en: Extends MimicGen to humanoids with two dexterous hands, turning 60 human demos into 21K simulated ones across bimanual tasks, plus a real-to-sim-to-real pipeline tested on real can sorting.
  takeaway_zh: 把 MimicGen 扩展到双灵巧手人形机器人，从 60 条人类演示生成 2.1 万条双臂仿真演示，并给出在真实分拣罐子任务上验证的 real-to-sim-to-real 流程。
- title: "SceneBloom: Agentic Indoor Environment Generation with Realistic and Diverse Layouts for Embodied Learning"
  type: paper
  arxiv: "2610.32978"
  year: 2026
  code: https://github.com/Tinaliu0123/scenebloom
  added: 2026-10-26
  topics: [navigation]
  tags: [scene-generation, diffusion, simulation-ready, object-navigation]
  takeaway_en: "Generates sim-ready rooms by sampling furniture layouts with diffusion priors, then compiling them into collision-free 3D scenes; nav policies trained there beat ones trained on real scans on held-out real scans."
  takeaway_zh: 先用扩散先验在功能分区内采样家具布局，再“编译”为无碰撞、可直接仿真的 3D 场景；论文报告在其场景中训练的物体导航策略，在留出的真实扫描场景上优于用等量真实扫描训练的策略。
