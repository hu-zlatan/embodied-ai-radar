  added: 2026-10-28
  topics: [learning]
  tags: [humanoid, behavior-foundation-model, residual, terrain, depth, unitree-g1, real]
  takeaway_en: "Keeps a humanoid behavior foundation model frozen and trains a small lower-body residual adapter for stairs, gaps and platforms, distilled to onboard depth; tested on four trackers and on a Unitree G1 with SONIC."
