  tags: [humanoid, teleoperation, payload, full-size, real]
  takeaway_en: "Teleoperation for a full-size humanoid carrying heavy loads: privileged motion guidance cleans noisy VR references and a payload curriculum builds robustness. A 175 cm, 65 kg robot tracks motions with up to 24 kg."
  takeaway_zh: "面向全尺寸人形机器人的重载遥操作：特权运动引导修正带噪 VR 参考，窗口化载荷课程提升鲁棒性。175 cm、65 kg 的机器人可携带最多 24 kg 负载跟踪动作。"
- title: "Constrained Whole-Body Tracking for Humanoid Robots"
  type: paper
  arxiv: "2606.00374"
  year: 2026
  code: https://github.com/StanfordASL/constrainedmimic
  venue: CoRL 2026
  project: https://stanfordasl.github.io/constrainedmimic
  added: 2026-11-06
  tags: [humanoid, safety, control-barrier-functions, motion-tracking, real]
  takeaway_en: "Adds runtime constraints (collisions, joint limits, CoM stability) to RL humanoid tracking policies via operational-space control and CBFs at over 1 kHz, even for constraints set after training."
  takeaway_zh: "借助操作空间控制与控制障碍函数，以 1 kHz 以上频率为强化学习人形跟踪策略施加运行时约束（碰撞、关节限位、质心稳定），训练后新增的约束也能满足。"
- title: "Towards Professional Tennis Styles for Humanoid Robots with Adaptive Motion Planning and Tracking"
  type: paper
  arxiv: "2608.20087"
  year: 2026
  code: https://github.com/noitom-robotics/AdaPT
  venue: CoRL 2026
  project: https://humanoidtennis.github.io/AdaPT/
  added: 2026-11-06
  tags: [humanoid, sports, motion-planning, sim-to-real, unitree-g1]
  takeaway_en: "Learns professional tennis serve and rally styles from broadcast video with a planner-plus-tracker design and speed adaptation for sim-to-real. Deployed on a G1 and a 1.7 m Dobot Atom serving without mocap."
  takeaway_zh: "从比赛转播视频学习职业网球发球与对打风格，采用“规划器+跟踪器”分层结构并加入速度自适应缩小仿真-真机差距。部署在 G1 和 1.7 m 的 Dobot Atom 上，无需动捕即可发球。"
- title: "TextOp: Real-time Interactive Text-Driven Humanoid Robot Motion Generation and Control"
  type: paper
  arxiv: "2602.07439"
  year: 2026
  code: https://github.com/TeleHuman/TextOp
  venue: CoRL 2026
  project: https://text-op.github.io/
  added: 2026-11-06
  tags: [humanoid, text-to-motion, diffusion, motion-tracking, real]
  takeaway_en: "Real-time text-driven humanoid control: an autoregressive motion diffusion model streams short trajectories from the current command, which can change mid-motion, and a tracking policy executes them on hardware."
  takeaway_zh: "实时文本驱动的人形机器人控制：自回归运动扩散模型根据当前（可随时修改的）文字指令持续生成短时轨迹，再由运动跟踪策略在真机上执行，可流畅切换舞蹈、跳跃等动作。"
- title: "TEXEDO : Test Time Scaling for Controller-aware Language-conditioned Humanoid Motion Generation"
  type: paper
  arxiv: "2606.22998"
  year: 2026
  code: https://github.com/JianuoCao/TEXEDO
  venue: CoRL 2026
  project: https://jianuocao.github.io/TEXEDO/
  added: 2026-11-06
  tags: [humanoid, text-to-motion, test-time-scaling, feasibility, unitree-g1]
  takeaway_en: "Samples many motions from a text-to-motion generator and picks one that a learned verifier says the humanoid can track and that matches the text. Improves tracking and text alignment, incl. on a real G1."
  takeaway_zh: "从文本生成运动模型采样多个候选，用学习到的动态可行性验证器与语义对齐验证器挑选人形机器人既能跟踪又符合文字的动作。仿真与真实 G1 上跟踪精度与文本一致性均提升。"
- title: "ADAPT: Agile Diffusion Action Priors for Robust and Steerable Online Text-Driven Humanoid Control"
  type: paper
  arxiv: "2609.00677"
  year: 2026
  venue: CoRL 2026
  project: https://wuyan01.github.io/ADAPT-project/
  added: 2026-11-06
  tags: [humanoid, diffusion-policy, text-conditioned, residual-rl, real]
  takeaway_en: "End-to-end text-conditioned humanoid control: a diffusion action prior learned from text-labelled state-action data, plus a light residual RL policy for robustness and smooth switching between commands."
  takeaway_zh: "端到端的文本条件人形全身控制：从带文本标签的状态-动作轨迹学习扩散动作先验，再叠加轻量残差强化学习策略提升长时鲁棒性和指令切换的平滑度。"
- title: "FADA: Few-Shot Domain Adaptation via Dynamics Alignment for Humanoid Control"
  type: paper
  arxiv: "2606.28476"
  year: 2026
  venue: CoRL 2026
  project: https://lecar-lab.github.io/FADA-humanoid/
  added: 2026-11-06
  tags: [humanoid, domain-adaptation, inverse-dynamics, few-shot, real]
  takeaway_en: "Planner plus inverse-dynamics student distilled from a privileged policy; at deployment only the IDM is fine-tuned on about 2 minutes of target-domain rollouts. Beats in-context and end-to-end adaptation baselines."
  takeaway_zh: "从特权策略蒸馏出“规划器+逆动力学模型”学生策略；部署时冻结规划器，只用约 2 分钟目标域数据微调逆动力学模型。优于上下文自适应与端到端适应基线。"
- title: "Eye, Robot: Learning Expressive Gaze Dynamics via a VLM-Guided Transformer-VAE"
  type: paper
  arxiv: "2610.19635"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, gaze, transformer-vae, hri, real]
  takeaway_en: "Humanoid gaze system: a VLM picks where to look and a Transformer-VAE trained on retargeted human recordings generates coordinated eye, neck and eyelid motion. Lowest joint error on a 2-second benchmark."
  takeaway_zh: "人形机器人注视系统：VLM 选择注视目标，基于重定向人类录像训练的 Transformer-VAE 生成协调的眼、颈与眼睑运动。在 2 秒基准上关节误差最低。"
- title: "MotionDisco: Motion Discovery for Extreme Humanoid Loco-Manipulation"
  type: paper
  arxiv: "2606.06139"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, loco-manipulation, llm, evolutionary-search, trajectory-optimization, real]
  takeaway_en: "Discovers long-horizon, contact-rich humanoid loco-manipulation from scratch: LLM-guided evolutionary search over interaction sequences plus kinodynamic trajectory optimization, then RL tracking on a real humanoid."
  takeaway_zh: "从零发现长时域、多接触的人形机器人移动操作动作：由大模型引导的进化搜索交互序列，配合运动动力学轨迹优化，再训练强化学习跟踪策略部署到真实人形机器人。"
- title: "ZeroWBC: Learning Natural Whole-Body Humanoid Interaction from Human Egocentric Data"
  type: paper
  arxiv: "2603.09170"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, whole-body, egocentric-video, vlm, motion-tracking, real]
  takeaway_en: "Teleop-free humanoid interaction: a fine-tuned VLM generates human whole-body motion from an egocentric image and instruction, retargeted and run by an interaction-aware tracker on a Unitree G1."
  takeaway_zh: "无需遥操作的人形交互：微调后的 VLM 根据第一人称图像和语言指令生成人体全身运动 token，重定向到机器人后由注重交互的跟踪策略在 Unitree G1 上执行。"
- title: "TAC-LOCO: Unified Whole-Body Control for Quadrupedal TACtile-Informed LOCO-Manipulation"
  type: paper
  arxiv: "2607.10132"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [quadruped, loco-manipulation, tactile, rl, real]
  takeaway_en: "One RL policy for legs, arm and gripper that adds a tactile latent from compliant grippers to proprioception, regulating grasp force and preventing slip. Zero-shot on a Unitree Go2 with a WidowX 250 arm."
  takeaway_zh: "单一强化学习策略同时控制腿、机械臂与夹爪，把柔顺夹爪的触觉潜表示与本体感觉结合，调节握力并防止物体滑落。零样本部署在装有 WidowX 250 机械臂的 Unitree Go2 上。"
- title: "Pro-HOI: Perceptive Root-guided Humanoid-Object Interaction"
  type: paper
  arxiv: "2603.01126"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, loco-manipulation, box-carrying, digital-twin, real]
  takeaway_en: "Box-carrying humanoid policy conditioned on a desired root trajectory, with reference motion used only in the reward; a persistent object estimator fuses detection with a digital twin to spot slips and re-grasp."
  takeaway_zh: "人形机器人搬箱策略以期望的根轨迹为条件，参考动作只用于奖励；持续物体估计模块融合实时检测与数字孪生，发现滑落后自动重新抓取。"
- title: "OmniContact: Chaining Meta-Skills via Contact Flow for Generalizable Humanoid Loco-Manipulation"
  type: paper
  arxiv: "2606.26201"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, loco-manipulation, skill-chaining, dataset]
  takeaway_en: "Uses 'contact flow' (key body trajectories plus binary contact signals) as the interface between a skill-tracking policy and a planner that generates future contact flows; releases a MoCap humanoid-object dataset."
  takeaway_zh: "以“接触流”（关键身体轨迹 + 二值接触信号）作为接口：底层策略跟踪统一的移动操作技能库，高层模块生成未来接触流来串联技能；并发布基于动捕的人-物交互数据集。"
- title: "Humanoid Badminton: Learning Dynamic Racket Skills from Limited Human Motion Data"
  type: paper
  arxiv: "2609.31840"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, badminton, hierarchical-rl, motion-prior]
  takeaway_en: "Three-stage hierarchical RL for humanoid badminton: sparse human strokes are augmented into a latent skill space, and a high-level planner composes skills online from the observed shuttle."
  takeaway_zh: "三阶段分层强化学习实现人形机器人打羽毛球：把少量人类击球动作扩充为连续的潜技能空间，高层规划器再根据观测到的羽毛球在线组合技能。"
- title: "X-WBC: A Cross-Embodiment Foundation Model for Humanoid Whole-Body Control"
  type: paper
  arxiv: "2609.15213"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, whole-body-control, cross-embodiment, foundation-model, real]
  takeaway_en: "Cross-embodiment humanoid whole-body controller: shared human-motion command tokens and a causal transformer trained on mixed multi-robot rollouts, with small robot-specific modules. Nine sim bodies, four real robots."
  takeaway_zh: "跨本体的人形全身控制基础模型：共享的人体运动指令 token 与在多机器人混合数据上训练的因果 Transformer，加上轻量的机器人专属模块。覆盖 9 种仿真本体与 4 台真机。"
- title: "Closing the Loop in Humanoid VLA: Persistent 3D Object Tokens for Verifiable Loco-Manipulation"
  type: paper
  arxiv: "2607.18016"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, vla, object-tokens, loco-manipulation, real]
  takeaway_en: "POT-VLA keeps role-indexed 3D object records from RGB-D as tokens for the whole-body action expert and for checking whether actions succeeded. On a Unitree G1: 71/80 successes vs 39/80 for GR00T-N1.7."
  takeaway_zh: "POT-VLA 从 RGB-D 维护按角色索引的 3D 物体记录，既作为全身动作专家的输入 token，也用于检验动作是否达成。在 Unitree G1 上成功 71/80 次，GR00T-N1.7 基线为 39/80。"
- title: "SwingBot: Learning Whole-Body Brachiation for Humanoid Robots"
  type: paper
  arxiv: "2609.10283"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, brachiation, rl, real]
  takeaway_en: "Humanoid brachiation with passive wrist hooks: biomimetic keyframes make release-swing-capture reachable early in training, and a recurrent estimator gives position/contact latents. Continuous bar traversal on hardware."
  takeaway_zh: "带被动腕钩的人形机器人臂荡移动：仿生关键帧让“松手-摆荡-抓杆”在训练早期就能被探索到，循环网络估计位置与接触潜变量。真机实现连续过杆。"
- title: "S2M-Trek: From Single to Multi-Sphere Transport via Per-Frame Deep Sets on a Wheel-Legged Robot"
  type: paper
  arxiv: "2606.01332"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [wheel-legged, loco-manipulation, deep-sets, curriculum-rl]
  takeaway_en: "Carries several free-rolling balls on a wheel-legged robot's back with no fences: per-frame Deep Sets respect that ball order can change every frame, which standard history encoders miss and exploit as a shortcut."
  takeaway_zh: "在轮腿机器人背上无围栏地同时运送多个自由滚动的球：逐帧 Deep Sets 编码器考虑到球的顺序每帧都可能变化，而常规历史拼接编码器忽略这一点并把槽位当作捷径。"
- title: "FT-WBC: Learning Fault-Tolerant Whole-Body Control for Legged Loco-Manipulation"
  type: paper
  arxiv: "2606.24466"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [legged-manipulator, fault-tolerance, whole-body-control, rl]
  takeaway_en: "Fault-tolerant whole-body control for legged manipulators: a fault estimator finds failed leg joints from proprioception, and a posture module turns arm-driven base requests into safe ones."
  takeaway_zh: "面向腿足机械臂的容错全身控制：故障估计器从下肢本体感觉历史中识别失效关节，姿态适配模块把机械臂策略提出的底盘姿态请求转为安全可执行的指令。"
- title: "General Humanoid Whole-Body Control via Pretraining and Fast Adaptation"
  type: paper
  arxiv: "2602.11929"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, whole-body-control, motion-tracking, adaptation]
  takeaway_en: "FAST: a general humanoid motion tracker with a small residual adaptation policy under orthogonality and KL constraints for new motions without forgetting, plus center-of-mass-aware terms for balance."
  takeaway_zh: "FAST：通用人形运动跟踪控制器，在正交与 KL 约束下学习轻量残差策略来快速适配新动作且不遗忘，并加入质心相关观测与目标提升平衡。"
- title: "Playing Soccer Like Humans Do: Learning Versatile and Agile Humanoid Soccer via Latent Motion Priors"
  type: paper
  arxiv: "2611.06564"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, soccer, motion-prior, hierarchical-rl, real]
  takeaway_en: "A latent motion prior distilled from human soccer MoCap lets one skill-conditioned policy move, dribble, trap and kick with human-like motion; transfers zero-shot to a Unitree G1."
  takeaway_zh: "从人类足球动捕数据蒸馏出潜在运动先验，使单一技能条件策略能完成移动、带球、停球和射门，动作自然流畅；零样本迁移到 Unitree G1。"
- title: "Unleashing Infinite Motion: Scaling Expressive Quadrupedal Motion via Generative Video Priors"
  type: paper
  arxiv: "2606.28237"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [quadruped, video-generation, motion-dataset, motion-tracking]
  takeaway_en: "Uni-Mo generates quadruped motions with an LLM plus a video diffusion model and lifts them to 3D references for tracking policies; the Quad-Imaginarium dataset has 7,488 motions, 96.7% of 392 sampled ran on a Go2."
  takeaway_zh: "Uni-Mo 用大语言模型和视频扩散模型生成四足动作，并提升为 3D 参考轨迹训练跟踪策略；Quad-Imaginarium 数据集含 7488 个动作，抽样的 392 个在 Go2 真机上 96.7% 成功执行。"
- title: "MorFiC: Fixing Value Miscalibration for Zero-Shot Quadruped Transfer"
  type: paper
  arxiv: "2603.14554"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [quadruped, cross-embodiment, critic, zero-shot]
  takeaway_en: "MorFiC finds that a shared critic averages incompatible values across robot bodies and fixes it with multiplicative morphology conditioning; trained on one robot, it transfers zero-shot to seven quadrupeds."
  takeaway_zh: "MorFiC 指出共享价值网络会把不同机身的价值目标混为一谈，并用乘性形态条件化修正该问题；只在一台机器人上训练即可零样本迁移到七种四足机器人。"
- title: "Morphology-Conditioned World Model for Cross-Embodiment Quadrupedal Locomotion"
  type: paper
  arxiv: "2604.08780"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [quadruped, world-model, cross-embodiment, zero-shot]
  takeaway_en: "QWM conditions one latent world model on scale-invariant morphology features and trains policies in imagination; unlike a model-free policy, it transfers zero-shot to unseen quadruped morphologies."
  takeaway_zh: "QWM 以尺度无关的形态特征作为条件训练单一潜空间世界模型，并在想象中训练策略；与无模型策略不同，它能零样本迁移到未见过的四足形态。"
- title: "LoComposition: Terrain-Adaptive Energy-Efficient Quadruped Locomotion without Gait Priors"
  type: paper
  arxiv: "2606.15896"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [quadruped, energy-efficiency, constraints, perceptive]
  takeaway_en: "Splits quadruped training into rewards for the task, constraints for limits and energy minimization for gait, with no gait priors; reports 56% lower cost of transport and 96% fewer limit violations, on a Go2."
  takeaway_zh: "将四足训练拆分为：奖励定义任务、约束保证运行限制、能耗最小化决定步态，且不使用任何步态先验；报告运输代价降低 56%、越限减少 96%，并在 Go2 上部署。"
- title: "Physics-Guided Biomechanical Gait Adaptation for Humanoid Locomotion on Extreme Sloped Terrains"
  type: paper
  arxiv: "2607.07830"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, slopes, zmp, blind]
  takeaway_en: "HumoSlope trains humanoid walking on steep slopes with a slope-aware ZMP balance prior and a gait adapter that avoids crouching; the blind policy walks outdoor grass slopes up to 32.1 degrees."
  takeaway_zh: "HumoSlope 用基于斜坡支撑面的 ZMP 平衡先验和避免蹲伏步态的适配器训练人形机器人陡坡行走；纯本体感知策略可在户外草坡上行走，坡度最高 32.1 度。"
- title: "RPL: Learning Robust Humanoid Perceptive Locomotion on Challenging Terrains"
  type: paper
  arxiv: "2602.03002"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, perceptive, depth, distillation]
  takeaway_en: "RPL distills terrain-specific experts into one multi-depth-camera transformer for multi-directional humanoid walking with payloads, with a ray-casting depth renderer about 5x faster than existing pipelines."
  takeaway_zh: "RPL 将各地形专家策略蒸馏为一个多深度相机 Transformer 策略，实现可负重的人形多方向行走，并配套比现有管线快约 5 倍的光线投射深度渲染器。"
- title: "Echo in the Steps: Learning Perceptive Humanoid Parkour with Gated Memory"
  type: paper
  arxiv: "2609.28960"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, parkour, depth, memory]
  takeaway_en: "Humanoid parkour over sparse footholds from onboard depth: a saliency-guided gated memory keeps useful depth features across frames, and an alternation loss enforces left-right foot placement."
  takeaway_zh: "基于机载深度相机的人形跑酷，跨越稀疏落脚点：显著性引导的门控记忆跨帧保留有用的深度特征，交替损失约束左右脚交替落步。"
- title: "MeshMimic: Geometry-Aware Humanoid Motion Learning through 3D Scene Reconstruction"
  type: paper
  arxiv: "2602.15733"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, motion-imitation, scene-reconstruction, video]
  takeaway_en: "MeshMimic reconstructs both human motion and terrain geometry from monocular video, then retargets with contact constraints, so humanoids learn motion-terrain interactions without MoCap."
  takeaway_zh: "MeshMimic 从单目视频中同时重建人体运动与地形几何，再以接触约束进行重定向，使人形机器人无需动捕即可学习动作与地形的交互。"
- title: "Perceptive Behavior Foundation Model: Adapting Human Motion Priors to Robot-Centric Terrain"
  type: paper
  arxiv: "2606.08059"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, behavior-foundation-model, terrain, motion-tracking]
  takeaway_en: "Perceptive BFM grounds human motion references in the robot's local terrain: synthesized terrain-conformal references train a teacher, and a student tracker adds terrain corrections only when needed."
  takeaway_zh: "Perceptive BFM 让人类动作参考适配机器人所处的局部地形：用合成的贴合地形参考训练教师策略，学生跟踪器仅在必要时加入地形修正。"
- title: "MARCH: Model-Assisted Reinforcement Learning for the Perceptive Control of Humanoids over Sparse Footholds"
  type: paper
  arxiv: "2606.10288"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, stepping-stones, clf, model-assisted-rl]
  takeaway_en: "MARCH guides RL with a safe reference from simplified models and a control-Lyapunov reward, then distills to a vision policy; a Unitree G1 crosses sparse footholds with lateral constraints."
  takeaway_zh: "MARCH 用简化模型生成的安全参考轨迹和控制李雅普诺夫奖励引导强化学习，再蒸馏为视觉策略；Unitree G1 可通过带侧向约束的稀疏落脚点。"
- title: "CAP: Continuously Adaptive Perception-Blind Humanoid Locomotion via Learned Denoising"
  type: paper
  arxiv: "2609.11553"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, perception-robustness, depth, denoising]
  takeaway_en: "CAP keeps one humanoid policy working as depth degrades: a world-model encoder learns to denoise corrupted depth, alongside a proprioceptive encoder; tested on a G1 indoors and outdoors."
  takeaway_zh: "CAP 让单一人形策略在深度感知退化时仍能工作：世界模型编码器学习对受损深度去噪，并配合本体感知编码器；在 G1 上进行了室内外测试。"
- title: "RoboDreamer: Anticipatory Humanoid Locomotion with Predictive State-Space Models"
  type: paper
  arxiv: "2609.07096"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, motion-tracking, mamba, distillation]
  takeaway_en: "RoboDreamer distills a humanoid teacher into a Mamba student that sees randomly masked recent observations, so it infers missing state from history; tested in IsaacLab, MuJoCo and on a G1."
  takeaway_zh: "RoboDreamer 将人形教师策略蒸馏为 Mamba 学生策略，训练时随机遮蔽最近观测，使其从历史推断缺失状态；在 IsaacLab、MuJoCo 和 G1 上验证。"
- title: "ADAPT: Analytical Disturbance-Aware Policy Training for Humanoid Locomotion"
  type: paper
  arxiv: "2606.16542"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, disturbance-observer, force-interaction]
  takeaway_en: "ADAPT feeds a humanoid policy an analytical whole-body disturbance observer that estimates external force/torque from robot dynamics without F/T sensors; more robust to pushes and payloads on a G1."
  takeaway_zh: "ADAPT 为人形策略提供解析式全身扰动观测器，无需力/力矩传感器即可由机器人动力学在线估计外力与力矩；在 G1 上对推搡和负载更鲁棒。"
- title: "Walk Like This: Stylized Locomotion for Physics-Based Characters through Example-Driven Diffusion"
  type: paper
  arxiv: "2610.18147"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [stylized-locomotion, diffusion, character-animation, motion-tracking]
  takeaway_en: "Walk Like This: give a style clip and a joystick velocity; a style-conditioned autoregressive diffusion model generates the reference and an RL controller tracks it, in simulation and on a robot."
  takeaway_zh: "Walk Like This：给定风格参考片段和摇杆速度指令，风格条件自回归扩散模型生成运动参考，再由强化学习控制器跟踪，在仿真角色和真实机器人上均可运行。"
- title: "Actuator Dynamics Curricula for Narrow-Viability Tasks in Legged Robot Learning"
  type: paper
  arxiv: "2609.09492"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [legged, curriculum, actuator, spot]
  takeaway_en: "Starts RL with stiff joints and anneals stiffness to the identified value as episodes lengthen, which enlarges the viable set; enables a quadruped-to-handstand transition on Spot that otherwise never succeeds."
  takeaway_zh: "强化学习训练初期使用较高的关节刚度，随回合变长逐步退火到辨识值，从而扩大可行状态集；使原本无法学会的 Spot 由四足站立转为倒立的动作得以完成并上真机。"
- title: "Trajectory-Level Automatic Curriculum Learning for Legged Locomotion on Unstructured Terrain"
  type: paper
  arxiv: "2608.16164"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [legged, curriculum, unstructured-terrain]
  takeaway_en: "TACL builds curricula from trajectory tasks on unstructured terrain maps: an evaluator learns difficulty for the current policy and a sampler proposes the next tasks; +18.5% on the hardest terrain vs handcrafted."
  takeaway_zh: "TACL 直接在非结构化地形图上以轨迹任务构建课程：评估器学习当前策略的任务难度，采样器据此提出下一批任务；在最难地形上比人工课程成功率高 18.5%。"
- title: "SHOES: Sim-to-real Hardware-adaptation via On-policy Expansion of Skills for Legged Robots"
  type: paper
  arxiv: "2610.16457"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [quadruped, adaptation, sim-to-real, morphology]
  takeaway_en: "SHOES adapts a frozen sim-trained quadruped policy to footwear by fine-tuning only small identity-initialized modulation modules on the robot, with a workspace-bounded sampler; Go2 tested with shoes."
  takeaway_zh: "SHOES 冻结仿真训练的四足策略，仅在真机上微调以恒等初始化的轻量调制模块来适应穿鞋带来的形态变化，并用限定工作空间的采样器保证安全；在穿鞋的 Go2 上测试。"
- title: "Mind the Phase: Effective Rank and Representation Health in Legged Locomotion"
  type: paper
  arxiv: "2609.06958"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [legged, representation, analysis, rl]
  takeaway_en: "Studies locomotion policies via effective rank of the network Jacobian conditioned on gait phase; normalization and residual connections help, giving up to 2x lower joint jitter on a real Spot."
  takeaway_zh: "以步态相位为条件分析运动策略网络雅可比的有效秩；发现归一化与残差连接更健康，在真实 Spot 上关节抖动最多降低 2 倍。"
- title: "Push the Limit: Learning High-Speed Sprinting and Aggressive Cornering on a Full-Scale Humanoid"
  type: paper
  arxiv: "2610.14840"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [humanoid, sprinting, agility, amp]
  takeaway_en: "A full-scale humanoid sprints above 7 m/s and corners with up to 25 degrees of trunk lean, using causal attention over feedback, a heading-direction reward and skill-conditioned motion-prior discriminators."
  takeaway_zh: "全尺寸人形机器人以超过 7 m/s 冲刺，并以最高 25 度躯干侧倾高速过弯；方法包括对反馈的因果注意力、航向奖励以及按技能条件化的运动先验判别器。"
- title: "DKWBC: Decoupling Motion Tracking and Balancing for Humanoid Whole-Body Control"
  type: paper
  arxiv: "2611.09605"
  year: 2026
  org: Robbyant, Zhejiang University
  project: https://robbyant-research.github.io/DKWBC/
  added: 2026-11-09
  topics: [control]
  tags: [humanoid, whole-body-control, inverse-dynamics, residual-rl]
  takeaway_en: "Splits humanoid whole-body control: inverse-dynamics feedforward plus PD give tracking torques, an RL residual adds only balance corrections; one balance policy carries across motion datasets, payloads and contact."
  takeaway_zh: "拆分人形全身控制：逆动力学前馈加 PD 反馈提供跟踪力矩，强化学习残差只负责平衡修正；同一平衡策略可跨动作数据集、负载与物理交互泛化，仿真与真机均有验证。"
- title: "SUGARv2: Learning Diverse Visual Humanoid Loco-Manipulation Skills from Synthesized Interaction References"
  type: paper
  arxiv: "2611.09266"
  year: 2026
  project: https://tianshuwu.github.io/sugarv2-humanoid/
  added: 2026-11-09
  topics: [manipulation]
  tags: [humanoid, loco-manipulation, motion-synthesis, teacher-student, sim-to-real]
  takeaway_en: "Follow-up to SUGAR: synthesizes robot and object reference motions from reusable task templates, then trains visual policies with one mimic reward and teacher distillation; 91.0% mean sim success on five tasks."
  takeaway_zh: "SUGAR 的后续：用可复用的任务模板合成机器人与物体参考动作，再以统一的模仿奖励和教师蒸馏训练视觉策略；五项任务仿真平均成功率 91.0%，并完成真机迁移。"
- title: "AHEADance: Anticipatory Humanoid Dance from Streaming Audio"
  type: paper
  arxiv: "2611.13370"
  year: 2026
  project: https://ihcr.github.io/AHEADance
  added: 2026-11-11
  tags: [humanoid, unitree-g1, music-to-motion, streaming, whole-body-tracking, real]
  takeaway_en: "A humanoid dances to streamed music by conditioning each motion chunk on a music model's forecast of upcoming beats; 'Commit Forcing' trains continuation from its own committed chunks. Runs on a real Unitree G1."
  takeaway_zh: "人形机器人跟随流式音乐跳舞：每个动作块以音乐模型对即将到来节拍的预测为条件；“Commit Forcing”让模型基于自己已执行的动作块继续生成。在真实 Unitree G1 上运行无摔倒。"
- title: "RedirectMimic: Local Motion Content Redaction for Humanoid Whole-Body Control"
  type: paper
  arxiv: "2611.14049"
  year: 2026
  project: https://xiaopeng-whu.github.io/RedirectMimic/
  added: 2026-11-11
  topics: [control]
  tags: [humanoid, unitree-g1, motion-tracking, ppo, sim]
  takeaway_en: "A motion tracker replaces selected movements (e.g. overhead arms) while still seeing the original reference; rewards use an edited one. In G1 sim, unwanted content drops to 2.7% vs 58.9% for reward zeroing."
  takeaway_zh: "让动作跟踪控制器在仍接收原始参考动作的情况下替换指定片段（如举臂过头）：训练奖励使用编辑后的参考。G1 仿真中不希望出现的动作占比降至 2.7%，奖励置零基线为 58.9%。"
- title: "HuMI: Humanoid Whole-Body Manipulation from Humanoid-Free Demonstrations"
  type: paper
  arxiv: "2602.06643"
  year: 2026
  venue: CoRL 2026
  project: https://humanoid-manipulation-interface.github.io
  added: 2026-11-12
  topics: [manipulation]
  tags: [humanoid, whole-body-manipulation, portable-data-collection, human-motion, real]
  takeaway_en: "HuMI records whole-body human motion with portable hardware, no humanoid needed; a hierarchical pipeline turns it into feasible humanoid skills. 3x faster data collection than teleop, 70% success in unseen places."
  takeaway_zh: "HuMI 用便携设备采集人的全身动作，无需人形机器人在场，再通过分层学习流程转化为可行的人形技能（跪、蹲、抛、走、双臂操作）。报告数据采集效率比遥操作高 3 倍，在未见环境中成功率 70%。"
- title: "SSR: Scaling Surefooted and Symmetric Humanoid Traversal Toward the Open World"
  type: paper
  arxiv: "2605.30770"
  year: 2026
  venue: CoRL 2026
  project: https://ssr-humanoid.github.io/
  added: 2026-11-12
  tags: [humanoid, perceptive-locomotion, egocentric-vision, symmetry, motion-priors, real]
  takeaway_en: "Egocentric-vision humanoid traversal: imagined foothold guidance steers swings to stable support, latent symmetry augmentation adds bilateral coordination. Real stairs, wide gaps, high platforms, long outdoor walks."
  takeaway_zh: "端到端的第一人称视觉人形地形穿越：“想象落脚点”引导摆动腿落向稳定支撑区域减少踩边打滑，潜空间对称增强带来左右协调，分地形运动先验使动作更自然。真机可过多种楼梯、宽沟、高台并完成户外长距离行走。"
