- title: "Learning to Walk in Minutes Using Massively Parallel Deep Reinforcement Learning"
  type: paper
  arxiv: "2109.11978"
  year: 2021
  org: ETH Zurich, NVIDIA
  code: https://github.com/leggedrobotics/legged_gym
  highlight: true
  topics: [sim]
  tags: [sim2real, quadruped, rl, gpu-parallel]
  takeaway_en: Thousands of parallel GPU environments train a quadruped walking policy in minutes; legged_gym became a standard starter.
  takeaway_zh: 数千个 GPU 并行环境几分钟就能训练出四足行走策略；legged_gym 成为标准入门框架。
- title: "Learning Quadrupedal Locomotion over Challenging Terrain"
  type: paper
  arxiv: "2010.11251"
  year: 2020
  org: ETH Zurich
  tags: [sim2real, quadruped, rl, proprioception]
  takeaway_en: A teacher-student, proprioception-only policy that walks ANYmal over mud, snow and rubble in the wild.
  takeaway_zh: 仅依赖本体感知的师生策略，让 ANYmal 在泥地、雪地和碎石等野外地形行走。
- title: "Learning Agile and Dynamic Motor Skills for Legged Robots"
  type: paper
  arxiv: "1901.08652"
  year: 2019
  org: ETH Zurich
  tags: [sim2real, quadruped, rl, actuator-net]
  takeaway_en: A learned actuator model closes the sim-to-real gap so RL policies run and recover from falls on ANYmal.
  takeaway_zh: 学习的执行器模型缩小仿真与现实差距，使强化学习策略能让 ANYmal 奔跑并摔倒后起身。
- title: "RMA: Rapid Motor Adaptation for Legged Robots"
  type: paper
  arxiv: "2107.04034"
  year: 2021
  org: UC Berkeley, CMU, Meta AI
  tags: [sim2real, quadruped, rl, adaptation]
  takeaway_en: An adaptation module infers environment parameters online, so one policy handles new terrains and payloads in real time.
  takeaway_zh: 自适应模块在线估计环境参数，使同一策略实时适应新地形和负载。
- title: "Robot Parkour Learning"
  type: paper
  arxiv: "2309.05665"
  year: 2023
  org: Shanghai Qi Zhi, Stanford
  code: https://github.com/ZiwenZhuang/parkour
  tags: [sim2real, quadruped, rl, vision]
  takeaway_en: Distills specialist parkour skills into a single vision-based policy that climbs, leaps and crawls on low-cost quadrupeds.
  takeaway_zh: 将多个跑酷专家技能蒸馏为单一视觉策略，让低成本四足机器人攀爬、跳跃和匍匐。
- title: "Extreme Parkour with Legged Robots"
  type: paper
  arxiv: "2309.14341"
  year: 2023
  org: CMU
  code: https://github.com/chengxuxin/extreme-parkour
  tags: [sim2real, quadruped, rl, vision]
  takeaway_en: An end-to-end depth-camera policy makes a small quadruped do long jumps, high jumps and handstands.
  takeaway_zh: 端到端深度相机策略让小型四足机器人完成跳远、跳高和倒立。
- title: "Real-World Humanoid Locomotion with Reinforcement Learning"
  type: paper
  arxiv: "2303.03381"
  year: 2023
  org: UC Berkeley
  highlight: true
  tags: [sim2real, humanoid, rl, transformer]
  takeaway_en: A causal Transformer policy trained in simulation walks a full-size humanoid outdoors, zero-shot.
  takeaway_zh: 在仿真中训练的因果 Transformer 策略零样本驱动全尺寸人形机器人在户外行走。
- title: "Expressive Whole-Body Control for Humanoid Robots"
  type: paper
  arxiv: "2402.16796"
  year: 2024
  org: UC San Diego
  tags: [sim2real, humanoid, rl, motion-imitation]
  takeaway_en: Imitates upper-body human motion capture while keeping robust legs, giving humanoids expressive gestures and dance.
  takeaway_zh: 上半身模仿人类动捕、下肢保持鲁棒行走，让人形机器人做出富有表现力的动作和舞蹈。
- title: "Learning Human-to-Humanoid Real-Time Whole-Body Teleoperation"
  type: paper
  arxiv: "2403.04436"
  year: 2024
  org: CMU
  tags: [sim2real, humanoid, teleoperation]
  takeaway_en: H2O — an RL tracking policy lets an RGB camera stream a person's whole-body motion onto a humanoid in real time.
  takeaway_zh: H2O：强化学习跟踪策略借助 RGB 相机，把人的全身动作实时映射到人形机器人。
- title: "HumanPlus: Humanoid Shadowing and Imitation from Humans"
  type: paper
  arxiv: "2406.10454"
  year: 2024
  org: Stanford
  code: https://github.com/MarkFzp/humanplus
  tags: [real, humanoid, teleoperation, imitation]
  takeaway_en: A humanoid shadows a human from one RGB camera, then learns autonomous skills from the collected data.
  takeaway_zh: 人形机器人通过单个 RGB 相机实时模仿人类，再用采集的数据学习自主技能。
- title: "ASAP: Aligning Simulation and Real-World Physics for Learning Agile Humanoid Whole-Body Skills"
  type: paper
  arxiv: "2502.01143"
  year: 2025
  org: CMU, NVIDIA
  code: https://github.com/LeCAR-Lab/ASAP
  tags: [sim2real, humanoid, rl, delta-action]
  takeaway_en: Learns a residual "delta action" model from real rollouts to fix sim physics, enabling agile athletic humanoid motions.
  takeaway_zh: 从真实轨迹学习残差"增量动作"模型来修正仿真物理，实现敏捷的人形运动技能。
- title: "Unitree RL Gym"
  type: code
  year: 2024
  org: Unitree
  code: https://github.com/unitreerobotics/unitree_rl_gym
  topics: [hardware, learning]
  tags: [sim2real, humanoid, quadruped, rl, isaac-gym]
  takeaway_en: Unitree's official starting point for RL locomotion on Go2, H1 and G1 — train in Isaac Gym, check sim-to-sim in MuJoCo, then deploy to the real robot.
  takeaway_zh: 宇树官方的强化学习运动控制入门仓库，支持 Go2、H1、G1：在 Isaac Gym 中训练，在 MuJoCo 中做 sim2sim 验证，再部署到真机。
- title: "SuperMimic: Scaling Humanoid Whole-Body Control with One Differentiable World Model"
  type: paper
  arxiv: "2610.28480"
  year: 2026
  venue: CoRL 2026
  project: https://supermimic.github.io
  added: 2026-10-21
  topics: [world-models, learning]
  tags: [humanoid, motion-tracking, whole-body-control, differentiable-model]
  takeaway_en: Rather than distilling per-motion experts or brute-forcing one RL policy, trains a humanoid tracking policy jointly with one differentiable world model of shared dynamics, fit from simulator logs (CoRL 2026 oral).
  takeaway_zh: SuperMimic 不再蒸馏逐动作专家或用大算力硬训单一 RL 策略，而是把人形机器人动作跟踪策略与一个从仿真日志拟合的、共享动力学的可微世界模型联合训练（CoRL 2026 口头报告）。
- title: "Learning robust perceptive locomotion for quadrupedal robots in the wild"
  type: paper
  arxiv: "2201.08117"
  year: 2022
  org: ETH Zurich, Intel
  venue: Science Robotics 2022
  tags: [quadruped, rl, perception, real, sim-to-real]
  takeaway_en: ANYmal fuses proprioception with noisy height-map perception through a learned belief encoder, and is shown hiking an alpine trail and other rough terrain.
  takeaway_zh: ANYmal 通过学习的信念编码器融合本体感知与带噪声的高程图感知，在高山徒步路线等复杂地形上完成行走。
- title: "OmniH2O: Universal and Dexterous Human-to-Humanoid Whole-Body Teleoperation and Learning"
  type: paper
  arxiv: "2406.08858"
  year: 2024
  org: CMU
  venue: CoRL 2024
  tags: [humanoid, teleoperation, whole-body, rl, sim-to-real]
  takeaway_en: One RL whole-body controller that a humanoid can follow from a VR headset, verbal commands or an RGB camera, and that also runs learned autonomous policies.
  takeaway_zh: 一个强化学习全身控制器：人形机器人可跟随 VR 头显、语音指令或 RGB 相机的输入，也可执行学习得到的自主策略。
- title: "HOVER: Versatile Neural Whole-Body Controller for Humanoid Robots"
  type: paper
  arxiv: "2410.21229"
  year: 2024
  org: NVIDIA, CMU
  venue: ICRA 2025
  tags: [humanoid, whole-body, rl, distillation]
  takeaway_en: Distills one policy that supports several humanoid control modes (root velocity, joint angles, keypoint tracking) instead of training a separate controller per mode.
  takeaway_zh: 蒸馏出单一策略，支持多种人形控制模式（根部速度、关节角、关键点跟踪），不必为每种模式各训练一个控制器。
- title: "Walk These Ways: Tuning Robot Control for Generalization with Multiplicity of Behavior"
  type: paper
  arxiv: "2212.03238"
  year: 2022
  venue: CoRL 2022
  org: MIT
  code: https://github.com/Improbable-AI/walk-these-ways
  tags: [real, quadruped, sim2real, rl, unitree-go1]
  takeaway_en: Trains one quadruped policy that exposes gait parameters (frequency, foot swing, posture) as commands, so a human can tune behavior at deploy time for new tasks; open sim-to-real stack for the Unitree Go1.
  takeaway_zh: 训练一个把步态参数（频率、抬脚高度、姿态等）作为指令开放的四足策略，部署时可由人调节行为以适应新任务；附带面向 Unitree Go1 的开源仿真到真实工具链。
- title: "DreamWaQ: Learning Robust Quadrupedal Locomotion With Implicit Terrain Imagination via Deep Reinforcement Learning"
  type: paper
  arxiv: "2301.10602"
  year: 2023
  venue: ICRA 2023
  org: KAIST
  tags: [real, quadruped, blind, sim2real, rl]
  takeaway_en: A blind quadruped policy that infers terrain properties implicitly from proprioception history with a context-aided estimator, enabling robust walking on stairs and rough ground without cameras.
  takeaway_zh: 盲视四足策略：借助上下文辅助估计器从本体感觉历史中隐式推断地形特性，无需相机即可稳健地走楼梯和崎岖地面。
- title: "ANYmal Parkour: Learning Agile Navigation for Quadrupedal Robots"
  type: paper
  arxiv: "2306.14874"
  year: 2023
  org: ETH Zurich, NVIDIA
  tags: [real, quadruped, parkour, hierarchical, perception]
  takeaway_en: A learned navigation policy sequences pre-trained skills (walk, jump, climb, crouch) using a learned obstacle reconstruction; reports up to 2 m/s on hardware (Science Robotics).
  takeaway_zh: 分层的全学习系统：导航策略结合学习到的障碍物重建来调度预训练技能（行走、跳跃、攀爬、下蹲）；报告实机速度可达 2 米/秒。发表于 Science Robotics。
- title: "Humanoid Parkour Learning"
  type: paper
  arxiv: "2406.10759"
  year: 2024
  venue: CoRL 2024
  org: Shanghai Qi Zhi, ShanghaiTech, Tsinghua
  tags: [real, humanoid, parkour, vision, unitree-h1, sim2real]
  takeaway_en: Learns a vision-based whole-body parkour policy for the Unitree H1 without motion references, covering skills such as jumping onto platforms and leaping over gaps, and transfers it to the real robot.
  takeaway_zh: 无需动作参考，为 Unitree H1 学习基于视觉的全身跑酷策略，涵盖跳上平台、跨越沟壑等技能，并迁移到真实机器人。
- title: "Watch Your Step: Anticipated Perception for Humanoid Locomotion"
  type: paper
  arxiv: "2610.29612"
  code: https://github.com/leggedrobotics/foothold-prediction-model
  year: 2026
  project: https://leggedrobotics.github.io/watch-your-step
  added: 2026-10-22
  topics: [perception]
  tags: [humanoid, perceptive-locomotion, elevation-map, rl]
  takeaway_en: A lightweight foothold prediction model strips terrain irrelevant to the next steps from the elevation map before the humanoid policy sees it, aiming at faster training and better transfer to new terrain.
  takeaway_zh: 不再把整张高程图输入人形机器人运动策略，而是先用轻量的落脚点预测模型去掉与接下来几步无关的地形信息，以加快训练并提升对新地形的泛化。
- title: "AMP: Adversarial Motion Priors for Stylized Physics-Based Character Control"
  type: paper
  arxiv: "2104.02180"
  year: 2021
  org: UC Berkeley, Shanghai Jiao Tong University
  venue: SIGGRAPH 2021
  topics: [learning]
  tags: [sim, humanoid, rl, motion-prior, imitation]
  takeaway_en: A discriminator trained on unstructured mocap clips acts as a style reward, so RL learns tasks with natural motion without hand-picked reference clips; widely reused as a gait prior for legged robots.
  takeaway_zh: 用在无结构动捕片段上训练的判别器作为"风格奖励"，强化学习无需逐段指定参考动作即可学到自然的动作；后来被广泛用作足式机器人的步态先验。
- title: "Agile But Safe: Learning Collision-Free High-Speed Legged Locomotion"
  type: paper
  arxiv: "2401.17583"
  year: 2024
  org: CMU, ETH Zurich
  venue: RSS 2024
  code: https://github.com/LeCAR-Lab/ABS
  topics: [navigation]
  tags: [sim2real, quadruped, rl, safety, reach-avoid]
  takeaway_en: ABS pairs an agile RL locomotion policy with a learned reach-avoid value network and a recovery policy that takes over near obstacles, so a quadruped can run fast without crashing.
  takeaway_zh: ABS 将敏捷的强化学习运动策略与学习的可达-规避价值网络及恢复策略结合，接近障碍时由恢复策略接管，让四足机器人高速奔跑而不碰撞。
- title: "$λ_0$: Scaling Open-World Egocentric Human Data for Humanoid Loco-Manipulation"
  type: paper
  arxiv: "2610.18950"
  year: 2026
  org: Alibaba (Lambda-humanoid Team)
  code: https://github.com/LambdaHumanoid/openlambda
  project: https://lambdahumanoid.github.io/
  added: 2026-10-24
  topics: [manipulation, datasets]
  tags: [real, humanoid, unitree-g1, human-video, egocentric, whole-body, foundation-model]
  takeaway_en: HumanVerse, 500 h of egocentric human video with body and hand motion, aligned to the Unitree G1 for mid-training a humanoid model; reports 90% on SIMPLE and 62.5% on real loco-manipulation tasks.
  takeaway_zh: 构建 500 小时的第一视角人类数据集 HumanVerse（含同步的身体与手部动作），对齐到 Unitree G1 后用于人形基础模型 λ0 的中期训练；论文报告 SIMPLE 上成功率 90%、真实移动操作任务 62.5%，人类数据越多下游表现越好。
- title: "BeyondMimic: From Motion Tracking to Versatile Humanoid Control via Guided Diffusion"
  type: paper
  arxiv: "2508.08241"
  year: 2025
  org: UC Berkeley, Stanford
  code: https://github.com/HybridRobotics/whole_body_tracking
  highlight: true
  tags: [sim2real, humanoid, motion-tracking, diffusion, whole-body]
  takeaway_en: One motion-tracking recipe with shared hyperparameters learns agile skills (cartwheels, flip-kicks); a guided latent diffusion model composes them for new goals like joystick control, zero-shot on hardware.
  takeaway_zh: 用同一套超参数的运动跟踪方案学会侧手翻、飞踢、冲刺等敏捷技能，再用带引导的潜空间扩散模型组合这些技能以完成摇杆遥控、避障等新目标，零样本迁移到真机。
- title: "ViT-H: Generative Video-To-Humanoid Control with Motion Tracking Feedback"
  type: paper
  arxiv: "2610.32966"
  year: 2026
  project: https://awfuact.github.io/vit-h/
  added: 2026-10-26
  tags: [real, humanoid, motion-tracking, human-video, diffusion, teleoperation]
  takeaway_en: "Skips reconstruction and retargeting: a diffusion model turns monocular human video straight into humanoid reference motion, post-trained with DPO on tracking outcomes; real-time variant teleoperates a G1 under 400 ms."
  takeaway_zh: 跳过人体重建与重定向：扩散模型直接把单目人类视频生成为人形机器人参考动作，并以运动跟踪结果做 DPO 后训练；自回归版本可在 Unitree G1 上实现低于 400 ms 延迟的实时视频遥操作。
- title: "Solving a Giant Rubik's Cube with a Quadruped Robot"
  type: paper
  arxiv: "2610.24610"
  year: 2026
  project: https://leggedrobotics.github.io/rubik-skills/
  added: 2026-10-26
  topics: [manipulation, perception]
  tags: [real, quadruped, loco-manipulation, rl, sim2real, distillation, rgbd]
  takeaway_en: "A quadruped solves a giant Rubik's Cube with its feet: onboard RGB-D estimates cube pose and colours, a planner sequences skills, and RL whole-body skills turn layers. Reports three full autonomous solves."
  takeaway_zh: 四足机器人只用脚完成巨型魔方：机载 RGB-D 估计魔方位姿与颜色状态，规划器把解法转成技能序列，强化学习训练的全身技能负责翻转魔方、一脚固定一脚推动转层。报告完成三次完全自主求解。
- title: "Learning Force-Reactive Humanoid Loco-Manipulation"
  type: paper
  arxiv: "2610.35862"
  year: 2026
  added: 2026-10-27
  topics: [manipulation, control]
  tags: [humanoid, force-control, whole-body, diffusion-policy, umi, real]
  takeaway_en: "FLoRe: robot-free demos from force-sensing UMI-style grippers + body trackers train a diffusion policy that outputs per-hand force commands for a compliant whole-body controller; reports 80% vs. 26.7% for position-only."
  takeaway_zh: FLoRe：用带力传感的 UMI 式手持夹爪与人体追踪器采集无机器人示教，训练扩散策略输出每只手的力指令，由柔顺全身控制器执行；报告在三个接触密集任务上成功率 80%，仅位置控制为 26.7%。
- title: "Zero-HLM: Generalizable Humanoid Loco-Manipulation without Real Robot Data"
  type: paper
  arxiv: "2610.35075"
  code: https://github.com/BIGAI-General-Vision-Lab/Zero-HLM
  year: 2026
  project: https://young-bit.github.io/zero-hlm/
  added: 2026-10-27
  topics: [manipulation, sim]
  tags: [humanoid, real-to-sim, gaussian-splatting, data-generation, unitree-g1, sim2real]
  takeaway_en: "Real-to-sim-to-real: smartphone scans become physics-ready sim scenes, whole-body motions are corrected by rollouts, giving 4,800 demos; a sim-only GR00T N1.7 on Unitree G1 reports 66.7% vs. 46.7% trained on real data."
  takeaway_zh: 真实到仿真再到真实：用手机拍摄重建可物理仿真的场景，并根据仿真回放修正全身动作，生成 4800 条示教；仅用仿真数据训练的 GR00T N1.7 在宇树 G1 上报告平均成功率 66.7%，真实数据训练为 46.7%。
- title: "HumanoidNDM: Closing the Training-Deployment Gap of Motion Tracking via Humanoid Neural Dynamics Model"
  type: paper
  arxiv: "2610.34126"
  year: 2026
  venue: CoRL 2026
  added: 2026-10-27
  topics: [learning]
  tags: [humanoid, motion-tracking, real-world-finetuning, neural-dynamics, unitree-g1]
  takeaway_en: "Fine-tunes humanoid motion-tracking policies online on the real robot: a proprioceptive neural dynamics model learned from real data supplies gradients, no motion capture needed. Shown on Unitree G1."
  takeaway_zh: 在真机上在线微调人形机器人动作跟踪策略：用真实数据训练的本体感知神经动力学模型提供可反传梯度，无需动捕系统。在 Unitree G1 上验证对多种扰动的快速适应。
- title: "DiffContact: Differentiable Contact Dynamics for Policy Learning and Contact-Implicit Trajectory Optimization"
  type: paper
  arxiv: "2610.35852"
  year: 2026
  project: https://diffcontact.github.io
  added: 2026-10-27
  topics: [control, learning]
  tags: [quadruped, differentiable-simulation, contact, trajectory-optimization, sim2real, real]
  takeaway_en: "Smooth analytic contact gradients only in the backward pass, hard-contact forward rollout unchanged: a quadruped trotting policy trains in under 2 min on a desktop and transfers to hardware without fine-tuning."
  takeaway_zh: "只在反向传播中换用平滑的解析摩擦接触梯度，前向仍是硬接触仿真：四足小跑策略在台式机上不到 2 分钟训练完成，无需微调即可迁移到真机；在接触隐式轨迹优化中也能找到更丰富的接触解。"
- title: "HuMiT: Low-Latency Whole-Body Humanoid Teleoperation via Compact Reference Tracking"
  type: paper
  arxiv: "2610.29903"
  code: https://github.com/xiaohu-art/Track
  year: 2026
  project: https://xiaohu-art.github.io/Track/
  added: 2026-10-27
  topics: [manipulation]
  tags: [humanoid, teleoperation, motion-tracking, unitree-g1, real, vr]
  takeaway_en: "Whole-body humanoid teleoperation from a compact target (root height and velocity + 4 keypoint poses, current frame only): ~20 ms headset-to-policy latency; a Unitree G1 catches a tossed ball."
  takeaway_zh: "只用紧凑参考目标（根高度、根速度与 4 个稀疏关键点的当前帧位姿）实现人形机器人全身遥操作：头显到策略输出延迟约 20 ms，Unitree G1 能接住抛来的球并完成移动操作。"
- title: "SWAP: Test-Time Steerable Humanoid Whole-Body Collision Avoidance"
  type: paper
  arxiv: "2610.25711"
  year: 2026
  project: https://iscoyizj.github.io/SWAP-steerable-humanoid-oa-website/
  added: 2026-10-27
  topics: [locomotion, control]
  tags: [humanoid, collision-avoidance, diffusion-policy, whole-body-control, unitree-g1, real]
  takeaway_en: "Diffusion planner proposes multimodal collision-aware motions; a whole-body RL controller tracks them. Trained by placing obstacles outside each motion's swept space. Real G1; steering reports +34% on target rewards."
  takeaway_zh: "分层框架：感知条件扩散策略生成多模态、考虑碰撞的动作提议，底层全身 RL 控制器负责跟踪与平衡；训练数据靠事后标注获得（只在已执行动作未扫过的空间放置障碍物）。在真实 Unitree G1 上验证，测试时引导使目标奖励平均提升 34%。"
- title: "Action-Aligned Latent Planning for Versatile Humanoid Loco-Manipulation"
  type: paper
  arxiv: "2610.24675"
  year: 2026
  project: https://fiberaa.github.io/
  added: 2026-10-27
  topics: [locomotion, manipulation]
  tags: [humanoid, loco-manipulation, behavior-foundation-model, latent-planning, unitree-g1, sim-to-real]
  takeaway_en: "FIBER plans in the latent space of a frozen behavioral foundation model: skills are projected into it, one perceptive flow planner is trained offline. Reports 42.0% mean sim success (latent replay: 11.6%); real G1."
  takeaway_zh: "FIBER 以冻结的行为基础模型（BFM）潜在空间作为统一规划表示，把各任务专用策略投影进该空间，再离线训练单一感知流匹配规划器；仿真中搬箱、开门、抓取平均成功率 42.0%（潜在回放基线 11.6%），并在真实 Unitree G1 上验证。"
- title: "REACH: An RL-based Hierarchical Humanoid Crawling Framework for Adaptable Confined Space Traversal"
  type: paper
  arxiv: "2610.36546"
  year: 2026
  venue: Humanoids 2026
  org: SUSTech
  project: https://aislab-sustech.github.io/REACH/
  added: 2026-10-28
  topics: [locomotion]
  tags: [humanoid, crawling, rl, unitree-g1, lidar, real]
  takeaway_en: "Unitree G1 walks at variable height (1.27–0.50 m) and crawls (0.50–0.20 m), with a learned transition policy between modes and a LiDAR planner that sets height targets for confined-space traversal on hardware."
  takeaway_zh: "让 Unitree G1 在 1.27–0.50 米高度范围内变高步行、在 0.50–0.20 米范围内爬行，并用学习到的过渡策略在两种模式间切换；结合 LiDAR 规划器给出高度目标，在真机上穿越低矮受限空间。"
- title: "GRAFT: Geometry-Aware Residual Adaptation for Foundation Trackers"
  type: paper
  arxiv: "2610.36507"
  year: 2026
  project: https://graft-humanoid.github.io/
  added: 2026-10-28
  topics: [learning]
  tags: [humanoid, behavior-foundation-model, residual, terrain, depth, unitree-g1, real]
  takeaway_en: "Keeps a humanoid behavior foundation model frozen and trains a small lower-body residual adapter for stairs, gaps and platforms, distilled to onboard depth; tested on four trackers and on a Unitree G1 with SONIC."
  takeaway_zh: "冻结人形行为基础模型，仅训练一个作用于下肢目标的轻量残差适配器来应对台阶、沟壑和平台，并从特权地形信息蒸馏到机载深度；在四种跟踪器上验证，并在 Unitree G1（SONIC）上真机部署。"
- title: "Whole-Body Humanoid Control via Stochastic Motion Tokenization"
  type: paper
  arxiv: "2610.36452"
  year: 2026
  venue: Humanoids 2026
  added: 2026-10-28
  topics: [learning]
  tags: [humanoid, motion-tokenizer, whole-body-tracking, text-to-motion, unitree-g1, real]
  takeaway_en: "A stochastic motion tokenizer gives a high-level generator a compact interface to a whole-body tracking policy; reports better G1 motion reconstruction than FSQ/VQ-VAE and real dance/fight/walk sequences."
  takeaway_zh: "用随机运动分词器把行为标签或文本生成的动作压缩成离散表示，直接作为全身跟踪策略的参考；报告在 Unitree G1 动作重建上优于 FSQ 与 VQ-VAE，并在真机上执行舞蹈、格斗、行走及 35 秒的格斗转舞蹈序列。"
- title: "Test-Time Motion Steering for Perceptive Humanoid Fall Recovery"
  type: paper
  arxiv: "2610.30061"
  year: 2026
  project: https://osheraz.github.io/RISE/
  added: 2026-10-28
  topics: [locomotion]
  tags: [humanoid, fall-recovery, diffusion-planner, perception, unitree-g1, real]
  takeaway_en: "RISE learns a vocabulary of recovery movements plus a visual diffusion planner whose predicted intent is steered at test time by task costs (heading, speed, path), no retraining; sim and real Unitree G1."
  takeaway_zh: "RISE 学习一组可组合的起身动作词表，并用视觉扩散规划器预测未来身体状态作为动作意图；推理时用任务代价（朝向、起身速度、路径）引导该意图，无需重新训练即可选择不同起身方式；仿真实验并在 Unitree G1 真机演示。"
- title: "SMR: Learning streaming motion retargeting for humanoids from human semantic"
  type: paper
  arxiv: "2610.29169"
  year: 2026
  project: https://logosroboticsgroup.github.io/SMR/
  added: 2026-10-29
  topics: [control]
  tags: [humanoid, motion-retargeting, streaming, transformer, whole-body-control, sim]
  takeaway_en: "SMR distils physics experts that track robot-aware targets into a strictly causal Transformer, retargeting human motion to humanoids frame by frame. Reports better closed-loop results than kinematic baselines."
  takeaway_zh: "SMR 先让物理专家在仿真中跟踪由人体动作转换来的机器人任务空间目标，再用其执行轨迹训练严格因果的 Transformer，实现逐帧流式的人形动作重定向；报告在相同全身控制器下闭环表现优于运动学与物理精修基线。"

- title: "METATRON: A Promptable Whole-Body Execution Layer for Humanoids"
  type: paper
  arxiv: "2610.38027"
  year: 2026
  org: NVIDIA
  project: https://research.nvidia.com/labs/par/projects/metatron/
  added: 2026-11-01
  topics: [control]
  tags: [humanoid, whole-body-control, generative-policy, prompting, coding-agents, unitree-g1, real]
  takeaway_en: "One frozen humanoid policy driven by prompts (timed body-part targets, velocity, style); skills are plain code, refined by coding agents. On a Unitree G1 it walks, recovers, picks up objects and sits."
  takeaway_zh: 可“提示”的人形全身执行层：冻结的生成式基础策略接收部分目标（定时的身体部位目标、速度指令、风格）生成全身动作；技能是普通代码，可由编码智能体分析动作数据后自动改进，无需按任务重训。在 Unitree G1 上一个检查点即可行走、恢复、遥操作抓取和坐下。

- title: "SONIC-K1: Porting a Universal Humanoid Motion Tracker to a Small Humanoid on a Single GPU"
  type: paper
  arxiv: "2610.39327"
  code: https://github.com/Kyk0/sonic-k1
  year: 2026
  project: https://huggingface.co/Kyry10/sonic-k1
  added: 2026-11-01
  tags: [humanoid, motion-tracking, booster-k1, open-weights, low-compute, sim-to-real]
  takeaway_en: "Open-weights whole-body motion tracker for the small Booster K1, adapting SONIC and trained on one shared GPU. Tracks most held-out clips in MuJoCo; on hardware, upper-body and slow motions work, stepping less so."
  takeaway_zh: 将 SONIC 通用动作跟踪框架移植到小型人形 Booster K1，在一张共享 GPU 上从头训练并开放权重与代码。MuJoCo 中几乎能跟踪所有留出动作片段；真机上上半身和慢速动作表现良好，迈步与转身仍不稳定，作者坦诚指出对动作延迟敏感。

- title: "ELEVATE: Agentic Controller Acquisition from Task Failure for Quadrupedal Manipulation"
  type: paper
  arxiv: "2610.38388"
  year: 2026
  project: https://agentic-quad-elevate.github.io/public/
  added: 2026-11-01
  topics: [locomotion, manipulation, learning]
  tags: [quadruped, loco-manipulation, coding-agent, llm, reinforcement-learning, skill-library, sim-to-real, real]
  takeaway_en: "When a quadruped manipulator keeps failing, a coding agent writes an RL problem to learn the missing whole-body skill, adds it to a library and retries; transfers to a real robot (18/20 rack retrieval)."
  takeaway_zh: 四足机械臂反复失败时，由编码智能体判断缺少哪种全身控制能力，自动编写强化学习问题（奖励、课程、终止条件）训练新控制器并加入技能库再重试；习得扶墙抬升等技能，仿真五项超出初始能力的任务成功率 98.4–100%，无需真机训练即迁移到实体机器人（货架取物 18/20）。

- title: "Movens-Zero: Scaling Humanoid Motion Foundation Models with Large-Scale Human Videos"
  type: paper
  arxiv: "2610.41877"
  code: https://github.com/wendell0218/Movens-Zero
  year: 2026
  project: https://movens-zero.github.io
  added: 2026-11-02
  tags: [humanoid, motion-foundation-model, dataset, flow-matching]
  takeaway_en: "Movens-5M: 5M execution-verified humanoid motions from web videos, aligned with text, RGB, speech and music. Movens-Zero trains one flow-matching action expert on seven tasks for real-time closed-loop control."
  takeaway_zh: "Movens-5M 从互联网视频构建 500 万条经执行验证的人形动作（超 1 万小时），对齐文本、RGB、语音和音乐。Movens-Zero 用一个流匹配动作专家联合训练七种生成任务，支持实时闭环执行；另有四赛道基准 Movens-Intent。"

- title: "DiffWBC: Unlocking Steerable General Humanoid Motion Tracking via One-Step Diffusion Whole-Body Control"
  type: paper
  arxiv: "2610.41354"
  year: 2026
  project: https://diffwbc.github.io/
  added: 2026-11-02
  tags: [humanoid, whole-body-control, diffusion, unitree-g1, real]
  takeaway_en: "Humanoid tracker as a one-step diffusion model: one forward pass per 50 Hz step, test-time steering via cost gradients, failure discovery from plan dispersion without simulation. Deployed on a Unitree G1."
  takeaway_zh: "用一步扩散模型做人形全身跟踪：每个 50 Hz 控制步只需一次前向；用可微代价梯度在测试时操控冻结的控制器，无需重训；用规划分散度在不做物理仿真的情况下发现跟踪失败。已部署到 Unitree G1。"

- title: "ROOF: Learning Humanoid Fall Recovery under Overhead Constraints"
  type: paper
  arxiv: "2610.42097"
  year: 2026
  project: https://lu-yidan.github.io/ROOF/
  added: 2026-11-02
  tags: [humanoid, fall-recovery, proprioception, unitree-g1, real]
  takeaway_en: "Fall recovery beneath overhead obstacles from proprioception alone: rewards reducing robot-obstacle overlap, no prescribed path. Reports 95 of 150 recoveries on a Unitree G1 across seven real obstacle scenes."
  takeaway_zh: "人形在头顶障碍物下跌倒后的恢复，仅用本体感知：奖励减少机器人与障碍物的重叠，而不预设逃脱路径，由单一策略学会何时清障、建立支撑并站起。报告 Unitree G1 在七个真实场景中 150 次尝试成功 95 次。"

- title: "CMP: Robust Whole-Body Tracking for Loco-Manipulation via Competence Manifold Projection"
  type: paper
  arxiv: "2604.07457"
  year: 2026
  venue: CoRL 2026
  project: https://shepherd1226.github.io/CMP
  added: 2026-11-02
  tags: [loco-manipulation, whole-body-control, safety, ood]
  takeaway_en: "CoRL 2026 Spotlight. Hardens whole-body end-effector tracking for legged manipulators against out-of-distribution inputs such as sensor noise or infeasible commands, using a frame-wise single-step safety manifold."
  takeaway_zh: "CoRL 2026 Spotlight。提升足式移动操作臂全身末端跟踪对分布外输入（传感器噪声、不可行指令）的鲁棒性：用逐帧安全方案把无限时域安全约束转化为计算高效的单步流形约束。"

- title: "FORGE: Feasible Online Reduced-Order Reference Generation and Whole-Body Execution for Agile Humanoid Locomotion"
  type: paper
  arxiv: "2610.37974"
  year: 2026
  venue: Humanoids 2026
  added: 2026-11-02
  tags: [humanoid, reduced-order-model, unitree-g1, real]
  takeaway_en: "Learns a reduced-order reference generator, then trains a whole-body tracker on its online rollouts, so one pair of policies covers many gaits. On a Unitree G1: -2.0 to 2.8 m/s, hopping and continuous transitions."
  takeaway_zh: "先学习降阶模型参考生成器，再用其在线输出训练全身跟踪策略，一对策略即可覆盖多种步态。Unitree G1 实机实现 -2.0 到 2.8 m/s 行走、单腿跳与连续切换。"

- title: "HIPC: Humanoid Iterative Planning and Control via Goal-Conditioned Motion Closure"
  type: paper
  arxiv: "2610.41334"
  year: 2026
  project: https://hipc-humanoid.github.io/
  added: 2026-11-02
  tags: [humanoid, generative-motion, closed-loop]
  takeaway_en: "Closes the loop between a generative motion model and a humanoid tracker, which usually run open-loop and drift. Deviation-decayed recovery and history re-anchoring keep the feedback from causing jitter or falls."
  takeaway_zh: "把通常开环运行、会累积漂移的生成式运动模型与人形跟踪器闭环耦合。真实状态反馈易致抖动甚至摔倒，因此加入偏差衰减恢复、历史重锚定与延迟补偿。"

- title: "GRAIL: Generating Humanoid Loco-Manipulation from World Models"
  type: paper
  arxiv: "2606.05160"
  year: 2026
  org: NVIDIA
  venue: CoRL 2026
  code: https://github.com/NVlabs/GRAIL
  project: https://research.nvidia.com/labs/dair/grail/
  added: 2026-11-02
  tags: [humanoid, loco-manipulation, data-generation, world-models]
  takeaway_en: "CoRL 2026 Oral. A fully virtual pipeline for humanoid loco-manipulation data: grounds video world models in 3D assets and simulator-ready scenes, with no teleoperation or physical setups."
  takeaway_zh: "CoRL 2026 Oral。全虚拟的人形移动操作数据管线：把视频世界模型落到 3D 资产与可仿真场景中，无需遥操作或搭建实体环境。"

- title: "RoboNaldo: Accurate, Stable and Powerful Humanoid Soccer Shooting via Motion-Guided Curriculum Reinforcement Learning"
  type: paper
  arxiv: "2606.11092"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-02
  tags: [humanoid, soccer, curriculum-rl]
  takeaway_en: "CoRL 2026 Oral. Three-stage curriculum for humanoid soccer shooting: a single human-kick reference serves as a scaffold, bridging stable motion tracking and goal-driven RL that struggles to discover kicks."
  takeaway_zh: "CoRL 2026 Oral。人形足球射门的三阶段课程：以单条人类踢球参考为脚手架，兼顾动作跟踪的稳定性与任务奖励 RL 的目标适应能力。"

- title: "TANGO: Humanoid Navigation in Cluttered Environments with a Whole-Body Vision-Language-Action Model"
  type: paper
  arxiv: "2609.09158"
  year: 2026
  venue: CoRL 2026
  project: https://tango-vla.github.io/
  added: 2026-11-02
  tags: [humanoid, whole-body, navigation, vla]
  takeaway_en: "CoRL 2026 Spotlight. Language-conditioned humanoid traversal of cluttered rooms that treats navigation as whole-body adaptation of arms, torso and gait rather than 2D path planning."
  takeaway_zh: "CoRL 2026 Spotlight。语言条件下的人形机器人杂乱环境穿行：不把导航当二维路径规划，而是手臂、躯干与步态的全身协同调整。"

- title: "OpenHLM: An Empirical Recipe for Whole-Body Humanoid Loco-Manipulation"
  type: paper
  arxiv: "2606.22174"
  code: https://github.com/OpenHLM-project/OpenHLM
  year: 2026
  venue: CoRL 2026
  project: https://openhlm-project.github.io/
  added: 2026-11-02
  tags: [humanoid, loco-manipulation, vla]
  takeaway_en: "CoRL 2026 Spotlight. A one-variable-at-a-time empirical study of what a whole-body native VLA needs, mapping language and pixels directly to all humanoid degrees of freedom."
  takeaway_zh: "CoRL 2026 Spotlight。逐变量对照的实证研究：探索直接把语言与图像映射到人形全部自由度的全身原生 VLA 需要哪些条件。"

- title: "LadderMan: Learning Humanoid Perceptive Ladder Climbing"
  type: paper
  arxiv: "2606.05873"
  year: 2026
  venue: CoRL 2026
  project: https://ladderman-robot.github.io
  added: 2026-11-02
  tags: [humanoid, climbing, perceptive]
  takeaway_en: "CoRL 2026 Spotlight. A humanoid system for climbing diverse ladders and manipulating while on them; a two-stage pipeline learns climbing experts through hybrid motion tracking."
  takeaway_zh: "CoRL 2026 Spotlight。让人形机器人攀爬多种梯子并在梯上操作；两阶段流程用混合动作跟踪学习多个攀爬专家策略。"

- title: "HoloBoxing: A Simple Recipe for Humanoid Boxing with 7 Minutes of Single-GPU Training"
  type: paper
  arxiv: "2610.32909"
  year: 2026
  added: 2026-11-03
  tags: [humanoid, whole-body-control, simulation]
  takeaway_en: "A compact planner sends body-point targets to a frozen pretrained whole-body controller; the seven minutes excludes controller pretraining. Evaluated in simulation."
  takeaway_zh: "紧凑规划器向冻结的预训练全身控制器发送身体点目标；所称七分钟不含控制器预训练。评估在仿真中进行。"

- title: "TACOS: Terrain-Aware COntact Supervision for Visual Footstep Planning"
  type: paper
  arxiv: "2610.37806"
  year: 2026
  code: https://github.com/norlab-ulaval/TACOS
  added: 2026-11-03
  tags: [legged, self-supervised, footstep-planning]
  takeaway_en: "Scores footstep instability from factor-graph residuals in legged state estimation and projects it into earlier images to supervise a dense visual predictor."
  takeaway_zh: "用足式状态估计因子图的残差给落足不稳定性打分，并投影到之前的图像上，监督稠密视觉预测器。"
- title: "HuG: Learning Humanoid Whole-Body Affordance-Aware Grasping with Active Perception"
  type: paper
  arxiv: "2611.01659"
  year: 2026
  venue: CoRL 2026
  project: https://xuanbinpeng.com/hug
  added: 2026-11-03
  topics: [manipulation]
  tags: [humanoid, grasping, active-perception, sim-to-real, real]
  takeaway_en: "Trained in simulation with no real demos. Controller-in-the-loop filtering rejects 73% of kinematically valid grasps that would destabilize the robot; reports 87.5% real-world success on a multi-level shelf task."
  takeaway_zh: "完全在仿真中训练，无真实示范。把控制器放进回路筛选数据，剔除 73% 运动学可行但会使机器人失稳的抓取；作者报告多层货架任务真实成功率 87.5%。"
- title: "Energy-Based Policy Orchestration"
  type: paper
  arxiv: "2611.02546"
  year: 2026
  venue: CoRL 2026
  project: https://yewr.github.io/epo
  added: 2026-11-03
  topics: [control]
  tags: [hierarchical, humanoid, energy-based, sim-to-real]
  takeaway_en: "Picks at runtime which low-level policy to run and with which goal, using a learned energy per policy. New policies join by training their own energy model, with no retraining of others. Deployed on a real humanoid."
  takeaway_zh: "运行时为每个底层策略学习能量函数，据此选择执行哪个策略、给它什么目标。新增策略只需训练自己的能量模型，无需重训其他策略或中央调度器；已部署到真实人形的移动操作任务。"
- title: "MAPO: Mixture of Experts with Alternating Policy Optimization for Universal Humanoid Motion Tracking"
  type: paper
  arxiv: "2611.02613"
  year: 2026
  project: https://mapo-corl2026.github.io/MAPO/
  added: 2026-11-03
  topics: [learning]
  tags: [humanoid, motion-tracking, mixture-of-experts, ppo]
  takeaway_en: "Dynamic routing makes policy-update divergence misestimated in mixture-of-experts policies, so MAPO optimizes router and experts in turn. Reports tracking 182 motions PPO with MoE fails on, against one the other way."
  takeaway_zh: "动态路由会让混合专家策略的更新散度估计失准，MAPO 因此交替优化路由与专家。报告可跟踪 182 个 PPO+MoE 失败的动作，反过来只有 1 个。"
- title: "WholeBodyVLA: Towards Unified Latent VLA for Whole-Body Loco-Manipulation Control"
  type: paper
  arxiv: "2512.11047"
  year: 2025
  venue: ICLR 2026
  code: https://github.com/OpenDriveLab/WholebodyVLA
  topics: [vla]
  tags: [humanoid, real, loco-manipulation, human-demonstrations]
  takeaway_en: "Latent VLA that learns from cheap action-free egocentric video, paired with an RL controller for advancing, turning and squatting; reports a 21.3% improvement over a baseline on the AgiBot X2."
  takeaway_zh: "潜空间 VLA 从低成本、无动作标注的第一视角视频学习，再配合面向前进、转向、下蹲的强化学习控制器；在智元 X2 上报告比基线提升 21.3%。"
- title: "Learning Smooth Humanoid Locomotion through Lipschitz-Constrained Policies"
  type: paper
  arxiv: "2410.11825"
  year: 2024
  code: https://github.com/zixuan417/smooth-humanoid-locomotion
  added: 2026-11-04
  tags: [humanoid, sim-to-real, rl, lipschitz]
  takeaway_en: "Imposes a Lipschitz constraint on the learned policy as a general route to smooth motion, replacing hand-tuned low-pass filters and smoothness rewards."
  takeaway_zh: "对学习到的策略施加 Lipschitz 约束，作为获得平滑动作的通用方法，取代需手动调参的低通滤波和平滑奖励。"
- title: "DeepMimic: Example-Guided Deep Reinforcement Learning of Physics-Based Character Skills"
  type: paper
  arxiv: "1804.02717"
  year: 2018
  venue: SIGGRAPH 2018
  org: UC Berkeley
  code: https://github.com/xbpeng/DeepMimic
  highlight: true
  added: 2026-11-04
  topics: [control]
  tags: [character, motion-imitation, rl]
  takeaway_en: "Showed RL can imitate a wide range of motion clips, flips and spins included, while staying robust. The motion-imitation template much humanoid work builds on."
  takeaway_zh: "证明强化学习能模仿包括空翻在内的大量动作片段并保持鲁棒，是后续人形动作模仿工作的基本范式。"
- title: "ASE: Large-Scale Reusable Adversarial Skill Embeddings for Physically Simulated Characters"
  type: paper
  arxiv: "2205.01906"
  year: 2022
  venue: SIGGRAPH 2022
  org: NVIDIA
  code: https://github.com/nv-tlabs/ASE
  added: 2026-11-04
  topics: [control]
  tags: [character, skill-embedding, adversarial]
  takeaway_en: "Learns reusable skill embeddings for simulated characters by combining adversarial imitation and unsupervised RL, so new tasks need not start from scratch."
  takeaway_zh: "结合对抗模仿与无监督强化学习，为仿真角色学习可复用的技能嵌入，新任务不必从零训练。"
- title: "Perpetual Humanoid Control for Real-time Simulated Avatars"
  type: paper
  arxiv: "2305.06456"
  year: 2023
