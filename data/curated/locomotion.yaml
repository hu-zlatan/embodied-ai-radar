- title: "Learning to Walk in Minutes Using Massively Parallel Deep Reinforcement Learning"
  type: paper
  arxiv: "2109.11978"
  year: 2021
  org: ETH Zurich, NVIDIA
  code: https://github.com/leggedrobotics/legged_gym
  highlight: true
  topics: [sim]
  tags: [sim2real, quadruped, rl, gpu-parallel]
  takeaway_en: Thousands of parallel GPU environments train a quadruped walking policy in minutes; legged_gym became a standard starter.
  takeaway_zh: 数千个 GPU 并行环境几分钟就能训练出四足行走策略；legged_gym 成为标准入门框架。
- title: "Learning Quadrupedal Locomotion over Challenging Terrain"
  type: paper
  arxiv: "2010.11251"
  year: 2020
  org: ETH Zurich
  tags: [sim2real, quadruped, rl, proprioception]
  takeaway_en: A teacher-student, proprioception-only policy that walks ANYmal over mud, snow and rubble in the wild.
  takeaway_zh: 仅依赖本体感知的师生策略，让 ANYmal 在泥地、雪地和碎石等野外地形行走。
- title: "Learning Agile and Dynamic Motor Skills for Legged Robots"
  type: paper
  arxiv: "1901.08652"
  year: 2019
  org: ETH Zurich
  tags: [sim2real, quadruped, rl, actuator-net]
  takeaway_en: A learned actuator model closes the sim-to-real gap so RL policies run and recover from falls on ANYmal.
  takeaway_zh: 学习的执行器模型缩小仿真与现实差距，使强化学习策略能让 ANYmal 奔跑并摔倒后起身。
- title: "RMA: Rapid Motor Adaptation for Legged Robots"
  type: paper
  arxiv: "2107.04034"
  year: 2021
  org: UC Berkeley, CMU, Meta AI
  tags: [sim2real, quadruped, rl, adaptation]
  takeaway_en: An adaptation module infers environment parameters online, so one policy handles new terrains and payloads in real time.
  takeaway_zh: 自适应模块在线估计环境参数，使同一策略实时适应新地形和负载。
- title: "Robot Parkour Learning"
  type: paper
  arxiv: "2309.05665"
  year: 2023
  org: Shanghai Qi Zhi, Stanford
  code: https://github.com/ZiwenZhuang/parkour
  tags: [sim2real, quadruped, rl, vision]
  takeaway_en: Distills specialist parkour skills into a single vision-based policy that climbs, leaps and crawls on low-cost quadrupeds.
  takeaway_zh: 将多个跑酷专家技能蒸馏为单一视觉策略，让低成本四足机器人攀爬、跳跃和匍匐。
- title: "Extreme Parkour with Legged Robots"
  type: paper
  arxiv: "2309.14341"
  year: 2023
  org: CMU
  code: https://github.com/chengxuxin/extreme-parkour
  tags: [sim2real, quadruped, rl, vision]
  takeaway_en: An end-to-end depth-camera policy makes a small quadruped do long jumps, high jumps and handstands.
  takeaway_zh: 端到端深度相机策略让小型四足机器人完成跳远、跳高和倒立。
- title: "Real-World Humanoid Locomotion with Reinforcement Learning"
  type: paper
  arxiv: "2303.03381"
  year: 2023
  org: UC Berkeley
  highlight: true
  tags: [sim2real, humanoid, rl, transformer]
  takeaway_en: A causal Transformer policy trained in simulation walks a full-size humanoid outdoors, zero-shot.
  takeaway_zh: 在仿真中训练的因果 Transformer 策略零样本驱动全尺寸人形机器人在户外行走。
- title: "Expressive Whole-Body Control for Humanoid Robots"
  type: paper
  arxiv: "2402.16796"
  year: 2024
  org: UC San Diego
  tags: [sim2real, humanoid, rl, motion-imitation]
  takeaway_en: Imitates upper-body human motion capture while keeping robust legs, giving humanoids expressive gestures and dance.
  takeaway_zh: 上半身模仿人类动捕、下肢保持鲁棒行走，让人形机器人做出富有表现力的动作和舞蹈。
- title: "Learning Human-to-Humanoid Real-Time Whole-Body Teleoperation"
  type: paper
  arxiv: "2403.04436"
  year: 2024
  org: CMU
  tags: [sim2real, humanoid, teleoperation]
  takeaway_en: H2O — an RL tracking policy lets an RGB camera stream a person's whole-body motion onto a humanoid in real time.
  takeaway_zh: H2O：强化学习跟踪策略借助 RGB 相机，把人的全身动作实时映射到人形机器人。
- title: "HumanPlus: Humanoid Shadowing and Imitation from Humans"
  type: paper
  arxiv: "2406.10454"
  year: 2024
  org: Stanford
  code: https://github.com/MarkFzp/humanplus
  tags: [real, humanoid, teleoperation, imitation]
  takeaway_en: A humanoid shadows a human from one RGB camera, then learns autonomous skills from the collected data.
  takeaway_zh: 人形机器人通过单个 RGB 相机实时模仿人类，再用采集的数据学习自主技能。
- title: "ASAP: Aligning Simulation and Real-World Physics for Learning Agile Humanoid Whole-Body Skills"
  type: paper
  arxiv: "2502.01143"
  year: 2025
  org: CMU, NVIDIA
  code: https://github.com/LeCAR-Lab/ASAP
  tags: [sim2real, humanoid, rl, delta-action]
  takeaway_en: Learns a residual "delta action" model from real rollouts to fix sim physics, enabling agile athletic humanoid motions.
  takeaway_zh: 从真实轨迹学习残差"增量动作"模型来修正仿真物理，实现敏捷的人形运动技能。
- title: "Unitree RL Gym"
  type: code
  year: 2024
  org: Unitree
  code: https://github.com/unitreerobotics/unitree_rl_gym
  topics: [hardware, learning]
  tags: [sim2real, humanoid, quadruped, rl, isaac-gym]
  takeaway_en: Unitree's official starting point for RL locomotion on Go2, H1 and G1 — train in Isaac Gym, check sim-to-sim in MuJoCo, then deploy to the real robot.
  takeaway_zh: 宇树官方的强化学习运动控制入门仓库，支持 Go2、H1、G1：在 Isaac Gym 中训练，在 MuJoCo 中做 sim2sim 验证，再部署到真机。
- title: "SuperMimic: Scaling Humanoid Whole-Body Control with One Differentiable World Model"
  type: paper
  arxiv: "2610.28480"
  year: 2026
  venue: CoRL 2026
  project: https://supermimic.github.io
  added: 2026-10-21
  topics: [world-models, learning]
  tags: [humanoid, motion-tracking, whole-body-control, differentiable-model]
  takeaway_en: Rather than distilling per-motion experts or brute-forcing one RL policy, trains a humanoid tracking policy jointly with one differentiable world model of shared dynamics, fit from simulator logs (CoRL 2026 oral).
  takeaway_zh: SuperMimic 不再蒸馏逐动作专家或用大算力硬训单一 RL 策略，而是把人形机器人动作跟踪策略与一个从仿真日志拟合的、共享动力学的可微世界模型联合训练（CoRL 2026 口头报告）。
- title: "Learning robust perceptive locomotion for quadrupedal robots in the wild"
  type: paper
  arxiv: "2201.08117"
  year: 2022
  org: ETH Zurich, Intel
  venue: Science Robotics 2022
  tags: [quadruped, rl, perception, real, sim-to-real]
  takeaway_en: ANYmal fuses proprioception with noisy height-map perception through a learned belief encoder, and is shown hiking an alpine trail and other rough terrain.
  takeaway_zh: ANYmal 通过学习的信念编码器融合本体感知与带噪声的高程图感知，在高山徒步路线等复杂地形上完成行走。
- title: "OmniH2O: Universal and Dexterous Human-to-Humanoid Whole-Body Teleoperation and Learning"
  type: paper
  arxiv: "2406.08858"
  year: 2024
  org: CMU
  venue: CoRL 2024
  tags: [humanoid, teleoperation, whole-body, rl, sim-to-real]
  takeaway_en: One RL whole-body controller that a humanoid can follow from a VR headset, verbal commands or an RGB camera, and that also runs learned autonomous policies.
  takeaway_zh: 一个强化学习全身控制器：人形机器人可跟随 VR 头显、语音指令或 RGB 相机的输入，也可执行学习得到的自主策略。
- title: "HOVER: Versatile Neural Whole-Body Controller for Humanoid Robots"
  type: paper
  arxiv: "2410.21229"
  year: 2024
  org: NVIDIA, CMU
  venue: ICRA 2025
  tags: [humanoid, whole-body, rl, distillation]
  takeaway_en: Distills one policy that supports several humanoid control modes (root velocity, joint angles, keypoint tracking) instead of training a separate controller per mode.
  takeaway_zh: 蒸馏出单一策略，支持多种人形控制模式（根部速度、关节角、关键点跟踪），不必为每种模式各训练一个控制器。
- title: "Walk These Ways: Tuning Robot Control for Generalization with Multiplicity of Behavior"
  type: paper
  arxiv: "2212.03238"
  year: 2022
  venue: CoRL 2022
  org: MIT
  code: https://github.com/Improbable-AI/walk-these-ways
  tags: [real, quadruped, sim2real, rl, unitree-go1]
  takeaway_en: Trains one quadruped policy that exposes gait parameters (frequency, foot swing, posture) as commands, so a human can tune behavior at deploy time for new tasks; open sim-to-real stack for the Unitree Go1.
  takeaway_zh: 训练一个把步态参数（频率、抬脚高度、姿态等）作为指令开放的四足策略，部署时可由人调节行为以适应新任务；附带面向 Unitree Go1 的开源仿真到真实工具链。
- title: "DreamWaQ: Learning Robust Quadrupedal Locomotion With Implicit Terrain Imagination via Deep Reinforcement Learning"
  type: paper
  arxiv: "2301.10602"
  year: 2023
  venue: ICRA 2023
  org: KAIST
  tags: [real, quadruped, blind, sim2real, rl]
  takeaway_en: A blind quadruped policy that infers terrain properties implicitly from proprioception history with a context-aided estimator, enabling robust walking on stairs and rough ground without cameras.
  takeaway_zh: 盲视四足策略：借助上下文辅助估计器从本体感觉历史中隐式推断地形特性，无需相机即可稳健地走楼梯和崎岖地面。
- title: "ANYmal Parkour: Learning Agile Navigation for Quadrupedal Robots"
  type: paper
  arxiv: "2306.14874"
  year: 2023
  org: ETH Zurich, NVIDIA
  tags: [real, quadruped, parkour, hierarchical, perception]
  takeaway_en: A learned navigation policy sequences pre-trained skills (walk, jump, climb, crouch) using a learned obstacle reconstruction; reports up to 2 m/s on hardware (Science Robotics).
  takeaway_zh: 分层的全学习系统：导航策略结合学习到的障碍物重建来调度预训练技能（行走、跳跃、攀爬、下蹲）；报告实机速度可达 2 米/秒。发表于 Science Robotics。
- title: "Humanoid Parkour Learning"
  type: paper
  arxiv: "2406.10759"
  year: 2024
  venue: CoRL 2024
  org: Shanghai Qi Zhi, ShanghaiTech, Tsinghua
  tags: [real, humanoid, parkour, vision, unitree-h1, sim2real]
  takeaway_en: Learns a vision-based whole-body parkour policy for the Unitree H1 without motion references, covering skills such as jumping onto platforms and leaping over gaps, and transfers it to the real robot.
  takeaway_zh: 无需动作参考，为 Unitree H1 学习基于视觉的全身跑酷策略，涵盖跳上平台、跨越沟壑等技能，并迁移到真实机器人。
- title: "Watch Your Step: Anticipated Perception for Humanoid Locomotion"
  type: paper
  arxiv: "2610.29612"
  year: 2026
  project: https://leggedrobotics.github.io/watch-your-step
  added: 2026-10-22
  topics: [perception]
  tags: [humanoid, perceptive-locomotion, elevation-map, rl]
  takeaway_en: A lightweight foothold prediction model strips terrain irrelevant to the next steps from the elevation map before the humanoid policy sees it, aiming at faster training and better transfer to new terrain.
  takeaway_zh: 不再把整张高程图输入人形机器人运动策略，而是先用轻量的落脚点预测模型去掉与接下来几步无关的地形信息，以加快训练并提升对新地形的泛化。
