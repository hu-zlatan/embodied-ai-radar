- title: "Proximal Policy Optimization Algorithms"
  type: paper
  arxiv: "1707.06347"
  year: 2017
  rating: 3
  org: OpenAI
  tags: [rl, on-policy, sim]
  takeaway_en: The clipped policy-gradient method behind most GPU-parallel sim-to-real locomotion and dexterity training.
  takeaway_zh: 采用截断目标的策略梯度方法，是大多数 GPU 并行仿真训练（运动控制、灵巧操作）背后的算法。
- title: "Soft Actor-Critic: Off-Policy Maximum Entropy Deep Reinforcement Learning with a Stochastic Actor"
  type: paper
  arxiv: "1801.01290"
  year: 2018
  org: UC Berkeley
  tags: [rl, off-policy, max-entropy]
  takeaway_en: Off-policy RL with an entropy bonus; sample-efficient enough to become the default for learning directly on real robots.
  takeaway_zh: 带熵奖励的离策略强化学习；样本效率较高，成为真机上直接学习的常用默认算法。
- title: "A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning"
  type: paper
  arxiv: "1011.0686"
  year: 2010
  org: CMU
  tags: [imitation, dagger, interactive]
  takeaway_en: DAgger — query the expert on the states the learner itself visits, fixing the compounding errors of plain behavior cloning.
  takeaway_zh: DAgger：在学习者自己访问到的状态上向专家查询标注，解决单纯行为克隆的误差累积问题。
- title: "Efficient Online Reinforcement Learning with Offline Data"
  type: paper
  arxiv: "2302.02948"
  year: 2023
  org: UC Berkeley
  code: https://github.com/ikostrikov/rlpd
  tags: [rl, offline-to-online, sample-efficiency]
  takeaway_en: RLPD — a few simple changes to off-policy RL (symmetric sampling of offline and online data, layer norm, ensembles) make prior data speed up online learning.
  takeaway_zh: RLPD：对离策略强化学习做几处简单改动（离线/在线数据对称采样、层归一化、集成），让已有数据加速在线学习。
- title: "SERL: A Software Suite for Sample-Efficient Robotic Reinforcement Learning"
  type: paper
  arxiv: "2401.16013"
  year: 2024
  org: UC Berkeley
  code: https://github.com/rail-berkeley/serl
  topics: [manipulation]
  tags: [rl, real, arm, open-source]
  takeaway_en: An open-source stack for training manipulation policies with RL on a real arm — learned reward classifiers, reset-free training and an impedance controller.
  takeaway_zh: 在真实机械臂上用强化学习训练操作策略的开源软件栈：学习式奖励分类器、免重置训练与阻抗控制器。
- title: "Precise and Dexterous Robotic Manipulation via Human-in-the-Loop Reinforcement Learning"
  type: paper
  arxiv: "2410.21845"
  year: 2024
  rating: 2
  org: UC Berkeley
  code: https://github.com/rail-berkeley/hil-serl
  topics: [manipulation]
  tags: [rl, real, arm, human-in-the-loop]
  takeaway_en: HIL-SERL — real-world RL with human corrections, reported to reach near-perfect success on precise assembly and dynamic tasks after a few hours of training.
  takeaway_zh: HIL-SERL：结合人类纠正的真机强化学习，报告称在精密装配与动态任务上经数小时训练即可接近满分成功率。
- title: "What Matters in Learning from Offline Human Demonstrations for Robot Manipulation"
  type: paper
  arxiv: "2108.03298"
  year: 2021
  rating: 1
  org: Stanford
  venue: CoRL 2021
  code: https://github.com/ARISE-Initiative/robomimic
  topics: [manipulation, datasets]
  tags: [imitation, offline-rl, benchmark, human-demos]
  takeaway_en: robomimic — a controlled study of imitation and offline RL on human-collected manipulation demos (demo quality, observation choices, history-aware BC), released with the framework and datasets.
  takeaway_zh: robomimic：在人类采集的操作示教数据上系统比较模仿学习与离线强化学习（示教质量、观测选择、带历史的行为克隆），并开源框架与数据集。
- title: "Offline Reinforcement Learning with Implicit Q-Learning"
  type: paper
  arxiv: "2110.06169"
  year: 2021
  org: UC Berkeley
  venue: ICLR 2022
  code: https://github.com/ikostrikov/implicit_q_learning
  tags: [offline-rl, expectile-regression, offline-to-online]
  takeaway_en: IQL — learns values with expectile regression without ever querying actions outside the dataset, then extracts a policy by advantage-weighted regression; a common base for offline-to-online robot RL.
  takeaway_zh: IQL：用期望分位数回归学习价值函数、从不查询数据集外的动作，再用优势加权回归提取策略；是机器人离线到在线强化学习的常用基础。
- title: "Behavior Transformers: Cloning $k$ modes with one stone"
  type: paper
  arxiv: "2206.11251"
  year: 2022
  org: NYU
  venue: NeurIPS 2022
  code: https://github.com/notmahi/bet
  tags: [imitation, multimodal, transformer]
  takeaway_en: BeT — clusters actions into k bins plus a continuous offset so a transformer can imitate multimodal demonstrations instead of averaging them.
  takeaway_zh: BeT：把动作聚成 k 个类别再加连续偏移，让 Transformer 能模仿多模态示教，而不是把不同模式平均掉。
- title: "Diffusion Policy Policy Optimization"
  type: paper
  arxiv: "2409.00588"
  year: 2024
  org: Princeton
  venue: ICLR 2025
  code: https://github.com/irom-princeton/dppo
  topics: [manipulation]
  tags: [rl, diffusion-policy, fine-tuning, sim-to-real]
  takeaway_en: DPPO — fine-tunes a pre-trained diffusion policy with PPO by treating the denoising steps as part of the MDP; reports stable gains over other RL fine-tuning methods and sim-to-real transfer.
  takeaway_zh: DPPO：把去噪步骤视为 MDP 的一部分，用 PPO 微调预训练扩散策略；报告称比其他强化学习微调方法更稳定，并实现了仿真到真机迁移。
- title: "Conservative Q-Learning for Offline Reinforcement Learning"
  type: paper
  arxiv: "2006.04779"
  year: 2020
  org: UC Berkeley
  venue: NeurIPS 2020
  code: https://github.com/aviralkumar2907/CQL
  tags: [offline-rl, value-learning]
  takeaway_en: CQL — penalizes Q-values on actions outside the dataset so the learned value is a lower bound; a standard offline-RL baseline for learning from fixed robot logs.
  takeaway_zh: CQL：压低数据集外动作的 Q 值，使学到的价值成为下界；是从固定机器人日志中学习的标准离线强化学习基线。
- title: "Decision Transformer: Reinforcement Learning via Sequence Modeling"
  type: paper
  arxiv: "2106.01345"
  year: 2021
  rating: 1
  org: UC Berkeley · Google · FAIR
  venue: NeurIPS 2021
  code: https://github.com/kzl/decision-transformer
  tags: [offline-rl, transformer, sequence-modeling]
  takeaway_en: Recasts RL as sequence modeling — a GPT-style model predicts actions conditioned on the desired return; an early bridge between transformers and control.
  takeaway_zh: 把强化学习改写成序列建模：GPT 式模型以期望回报为条件预测动作；是 Transformer 与控制结合的早期代表。
- title: "Addressing Function Approximation Error in Actor-Critic Methods"
  type: paper
  arxiv: "1802.09477"
  year: 2018
  rating: 1
  org: McGill University
  venue: ICML 2018
  code: https://github.com/sfujim/TD3
  tags: [rl, off-policy, continuous-control]
  takeaway_en: TD3 — fixes DDPG's value overestimation with twin critics, delayed policy updates and target smoothing; still a standard continuous-control baseline.
  takeaway_zh: TD3：通过双 Critic、延迟策略更新和目标策略平滑解决 DDPG 的价值高估问题，至今仍是连续控制的常用基线。
- title: "Generative Adversarial Imitation Learning"
  type: paper
  arxiv: "1606.03476"
  year: 2016
  org: Stanford
  venue: NeurIPS 2016
  tags: [imitation, adversarial, inverse-rl]
  takeaway_en: GAIL — learns a policy whose state-action distribution a discriminator cannot tell apart from the expert's, skipping explicit reward recovery.
  takeaway_zh: GAIL：训练策略使判别器无法区分其状态-动作分布与专家数据，无需显式恢复奖励函数。
- title: "Implicit Behavioral Cloning"
  type: paper
  arxiv: "2109.00137"
  year: 2021
  org: Google
  venue: CoRL 2021
  tags: [imitation, energy-based, multimodal]
  takeaway_en: Represents the policy as an energy-based model over actions instead of a regressor, which handles multimodal and discontinuous demonstrations much better.
  takeaway_zh: 用基于能量的模型（而非直接回归）表示策略，更好地处理多模态、不连续的示范数据。
- title: "AWAC: Accelerating Online Reinforcement Learning with Offline Datasets"
  type: paper
  arxiv: "2006.09359"
  year: 2020
  org: UC Berkeley
  tags: [rl, offline-to-online, real]
  takeaway_en: Advantage-weighted actor-critic that pre-trains on prior demonstrations and keeps improving online, shown on real dexterous-hand tasks.
  takeaway_zh: 优势加权的 Actor-Critic：先用已有示范数据预训练，再在线持续提升，并在真实灵巧手任务上验证。
- title: "QT-Opt: Scalable Deep Reinforcement Learning for Vision-Based Robotic Manipulation"
  type: paper
  arxiv: "1806.10293"
  year: 2018
  venue: CoRL 2018
  org: Google
  topics: [manipulation]
  tags: [real, grasping, off-policy, q-learning, large-scale]
  takeaway_en: Off-policy Q-learning with a cross-entropy-method action optimizer, trained on several hundred thousand real grasp attempts collected by a fleet of robots; reports 96% grasp success on unseen objects.
  takeaway_zh: 使用交叉熵方法优化动作的离策略 Q 学习，在机器人集群采集的数十万次真实抓取上训练；报告对未见物体的抓取成功率为 96%。
- title: "Mastering Visual Continuous Control: Improved Data-Augmented Reinforcement Learning"
  type: paper
  arxiv: "2107.09645"
  year: 2021
  venue: ICLR 2022
  org: NYU, Meta AI
  code: https://github.com/facebookresearch/drqv2
  tags: [sim, pixels, data-augmentation, off-policy]
  takeaway_en: DrQ-v2 - a simple model-free actor-critic with image augmentation that learns continuous control from pixels (incl. humanoid tasks in the DeepMind Control Suite) on a single GPU; a common visual-RL baseline.
  takeaway_zh: DrQ-v2：带图像增强的简单无模型 actor-critic，单 GPU 即可从像素学习连续控制（包括 DeepMind Control Suite 的人形任务），是常用的视觉强化学习基线。
- title: "Steering Your Diffusion Policy with Latent Space Reinforcement Learning"
  type: paper
  arxiv: "2506.15799"
  year: 2025
  org: UC Berkeley, University of Washington
  venue: CoRL 2025
  code: https://github.com/ajwagen/dsrl
  project: https://diffusion-steering.github.io
  topics: [manipulation]
  tags: [real, rl-finetuning, diffusion-policy, sample-efficient]
  takeaway_en: DSRL — adapts a frozen diffusion policy by running RL over its input noise, not its weights; needs only forward passes, works with π0, and reports real-robot success rising from 20% to 90% in under 50 online episodes.
  takeaway_zh: DSRL：不改扩散策略的权重，而是对其输入的初始噪声做强化学习来"引导"输出动作；只需前向推理、可用于 π0，论文报告真机任务在不到 50 次在线交互内成功率从 20% 升至 90%。
- title: "Flow Q-Learning"
  type: paper
  arxiv: "2502.02538"
  year: 2025
  org: UC Berkeley
  venue: ICML 2025
  code: https://github.com/seohongpark/fql
  project: https://seohong.me/projects/fql/
  tags: [sim, offline-rl, flow-matching, ogbench]
  takeaway_en: FQL — a flow-matching BC policy plus a one-step policy that maximizes Q while distilling from it; no backprop through flow steps, strong on 73 OGBench / D4RL offline and offline-to-online tasks.
  takeaway_zh: FQL：先用行为克隆训练流匹配策略，再训练一个最大化 Q 值、同时向流策略蒸馏的单步策略；避免对多步流采样反向传播，在 73 个 OGBench / D4RL 离线及离线转在线任务上表现突出。
- title: "SimpleVLA-RL: Scaling VLA Training via Reinforcement Learning"
  type: paper
  arxiv: "2509.09674"
  year: 2025
  rating: 1
  org: Shanghai Jiao Tong University, Peking University, HKU, Shanghai AI Lab
  venue: ICLR 2026
  code: https://github.com/PRIME-RL/SimpleVLA-RL
  topics: [vla]
  tags: [sim, rl-finetuning, grpo, libero, robotwin]
  takeaway_en: Online RL for VLAs with GRPO and only binary success rewards on OpenVLA-OFT, plus exploration tweaks; reports 99.1% on LIBERO and 70.4% on RoboTwin 1.0 (vs 39.8% for the SFT baseline).
  takeaway_zh: 在 OpenVLA-OFT 上用 GRPO 与仅"成功/失败"二值奖励做在线强化学习，并加入若干促进探索的改动；论文报告 LIBERO 成功率 99.1%、RoboTwin 1.0 为 70.4%（SFT 基线 39.8%）。
- title: "Cal-QL: Calibrated Offline RL Pre-Training for Efficient Online Fine-Tuning"
  type: paper
  arxiv: "2303.05479"
  year: 2023
  org: UC Berkeley, Stanford
  venue: NeurIPS 2023
  code: https://github.com/nakamotoo/Cal-QL
  tags: [offline-to-online, rl, conservative-q]
  takeaway_en: Keeps conservative offline Q-values from dropping below a reference policy's value, which avoids the early performance dip when an offline-pretrained policy starts online fine-tuning.
  takeaway_zh: 约束保守的离线 Q 值不低于参考策略的价值，从而避免离线预训练策略开始在线微调时常见的性能先降后升。
- title: "Q-Transformer: Scalable Offline Reinforcement Learning via Autoregressive Q-Functions"
  type: paper
  arxiv: "2309.10150"
  year: 2023
  org: Google DeepMind
  venue: CoRL 2023
  topics: [manipulation]
  tags: [real, offline-rl, transformer, large-scale]
  takeaway_en: Discretizes each action dimension and predicts Q-values per dimension autoregressively with a Transformer, plus a conservative regularizer; trained offline on large real robot datasets mixing demos and autonomous data.
  takeaway_zh: 将每个动作维度离散化，用 Transformer 自回归地逐维预测 Q 值，并加入保守正则；在混合演示与自主采集数据的大规模真实机器人数据集上离线训练。
- title: "RLinf-VLA: A Unified and Efficient Framework for Reinforcement Learning of Vision-Language-Action Models"
  type: paper
  arxiv: "2510.06710"
  year: 2025
  rating: 1
  code: https://github.com/RLinf/RLinf
  topics: [vla]
  tags: [sim, rl-finetuning, ppo, grpo, infrastructure, libero, maniskill, robotwin]
  takeaway_en: Open RL training framework for VLAs (PPO/GRPO across GPU-parallel simulators); reports 98.11% on 130 LIBERO tasks and 97.66% on 25 ManiSkill tasks after RL — a common base for VLA+RL work.
  takeaway_zh: 面向 VLA 的开源强化学习训练框架（PPO/GRPO，支持 GPU 并行仿真器）；论文报告经 RL 后在 130 个 LIBERO 任务上成功率 98.11%、25 个 ManiSkill 任务上 97.66%，是 VLA+RL 研究常用的底座。
- title: "Learning from Fleet Experience: Collective Experience Learning Across 96 Robots"
  type: paper
  arxiv: "2610.25736"
  year: 2026
  org: Tsinghua, AgiBot, Infinigence AI
  code: https://github.com/RLinf/RLinf
  project: https://cel-robot-learning.github.io
  added: 2026-10-23
  rating: 1
  topics: [manipulation]
  tags: [real, fleet-learning, deployment, failure-retrieval]
  takeaway_en: Deployed robots pool their runs; failures retrieve matching successful segments from the fleet buffer to fine-tune on, with no new demos. Reports 93–99% on five real tasks; 96 robots lift phone packing 79% → 98%.
  takeaway_zh: 部署中的机器人共享执行经验：用失败片段在机群经验库中检索相似的成功片段来微调策略，无需新增示教或人工纠正。论文报告五个真机任务成功率 93–99%，96 台机器人把手机装盒任务从 79% 提升到 98%。
- title: "ACCRUE: Continual Off-Policy Reinforcement Learning for Robot Foundation Models"
  type: paper
  arxiv: "2610.18596"
  year: 2026
  org: NVIDIA, KAIST
  project: https://accrue-rl.github.io
  added: 2026-10-24
  topics: [vla, manipulation]
  tags: [real, sim, continual-learning, off-policy-rl, rl-finetuning, assembly]
  takeaway_en: Continual off-policy RL for VLAs — small actor/critic networks carry over between tasks, distilled on a few kept episodes to avoid forgetting; reports 31–68.5% less real-robot time on new assembly tasks.
  takeaway_zh: 面向 VLA 的持续离策略强化学习：轻量 actor/critic 在任务间延续，用少量保留的旧任务轨迹做蒸馏以防遗忘。论文报告新的接触式装配任务所需真机训练时间减少 31–68.5%，旧任务几乎不遗忘。
- title: "AgenticRoboRL: Bringing Coding-Agent Post-Training to Agentic Robotics"
  type: paper
  arxiv: "2610.28589"
  year: 2026
  org: University of Central Florida
  code: https://github.com/xinxinliu-ai/AgenticRoboRL
  project: https://xinxinliu-ai.github.io/AgenticRoboRL/
  added: 2026-10-24
  topics: [learning, vla]
  tags: [llm-planner, reinforcement-learning, agentic, sim]
  takeaway_en: Post-trains an open 9B robot planner (SFT + multi-turn RL) across harnesses that call VLA skills or write control code; reports LIBERO-PRO success rising from 18.1% to 71.0% without external memory.
  takeaway_zh: 像训练编程智能体一样对 9B 开源机器人规划器做后训练（SFT + 多轮强化学习），适配调用 VLA 技能和生成控制代码两类执行框架；报告在 LIBERO-PRO 上无外部记忆成功率从 18.1% 提升到 71.0%。
- title: "Scaling in Games: Continued Pre-Training For Embodied Agents In Diverse Virtual Worlds"
  type: paper
  arxiv: "2610.28698"
  year: 2026
  org: Tsinghua Spatial Intelligence Lab
  code: https://github.com/THUSI-Lab/GameScaling
  project: https://gamescaling.github.io
  added: 2026-10-24
  rating: 1
  topics: [learning]
  tags: [scaling-law, games, virtual-worlds, continued-pretraining, sim]
  takeaway_en: "Continued pre-training study for game-playing agents: 120 runs over 0.8B–27B models, 50–1,600 h of data and multi-world mixes; reports diversity aids transfer to related worlds, little to distant ones."
  takeaway_zh: 针对游戏中的具身智能体做持续预训练的对照研究：120 组配置覆盖 0.8B–27B 模型、50–1600 小时数据和多世界混合；报告数据多样性有助于迁移到相近世界，对差异大的世界帮助有限。
- title: "Toward Recursive Self-Improvement in Physical AI"
  type: paper
  arxiv: "2610.29677"
  year: 2026
  org: National University of Singapore
  project: https://github.com/Physical2RSI/Awesome-Physical2RSI
  added: 2026-10-25
  tags: [survey, self-improvement, awesome-list]
  takeaway_en: Survey of recursive self-improvement in robot learning — improving skills, then the process that makes them — and when gains carry forward; notes no physical study has yet isolated gains from recursion itself.
  takeaway_zh: 把"递归自我改进"放到机器人学习语境下的综述：从提升技能到改进产生技能的过程，并总结增益能持续累积的条件；指出现有真机研究尚未单独验证"递归"本身带来的收益。附论文列表。
- title: "Where is Physical RSI capability from? An Observational Scaling Law of LLM-as-policy"
  type: paper
  arxiv: "2610.26848"
  code: https://github.com/PhysRSI-Eval/PhysRSI-Eval-code
  year: 2026
  org: Galbot
  project: https://physrsi-eval.github.io/
  added: 2026-10-25
  topics: [learning, datasets]
  tags: [benchmark, self-improvement, vlm-agent, scaling-law, technical-report]
  takeaway_en: PhysRSI-eval scores VLM agents on 18 manipulation tasks under a fixed trial budget on five axes, incl. learning from failure; reports similar benchmark averages hide different improvement speeds.
  takeaway_zh: PhysRSI-eval 在固定交互预算下用 18 个操作任务、五个维度（含从失败中改进）评测 VLM 智能体；报告公开基准平均分相近的模型改进速度差别很大，且早期物理反馈可用于预测后续进展。
- title: "TILDE: Teacher-in-the-Loop Distillation from Embodied Foundation Models"
  type: paper
  arxiv: "2610.25376"
  year: 2026
  org: The University of Hong Kong
  code: https://github.com/hku-sail/TILDE
  project: https://hku-sail.github.io/TILDE/
  added: 2026-10-25
  topics: [learning, vla]
  tags: [distillation, dagger, recovery, reward-model, real]
  takeaway_en: Distills a pretrained VLA teacher into a policy without action pretraining via on-policy supervision plus teacher-run recoveries, triggered by a reward model (AutoDAgger); reports up to 4.1x over BC on 3 real tasks.
  takeaway_zh: 把预训练具身基础模型（教师）蒸馏到未做动作预训练的策略：在学生访问的状态上做在线监督，并由奖励模型监控进度、自动触发教师接管采集纠错轨迹（AutoDAgger，无需人工看护）；报告在 3 个真机任务上比行为克隆最高提升 4.1 倍。
- title: "EgoForesight: Effectively Scaling Policy Learning with Noisy Egocentric Actions"
  type: paper
  arxiv: "2610.31845"
  code: https://github.com/LinShan-Bin/EgoForesight
  year: 2026
  project: https://lin-shan.com/EgoForesight
  added: 2026-10-26
  topics: [vla]
  tags: [real, sim, human-video, egocentric, scaling, dexterous-hand]
  takeaway_en: "Co-trains a VLA on robot demos and noisy egocentric-video actions by weighting each source by reliability and distilling from clean future frames; reports steeper scaling than the baseline up to 30k hours of data."
  takeaway_zh: 将机器人示教与动作标签噪声较大的第一视角视频联合训练 VLA：按数据源可靠性分配监督权重，并从干净的未来画面蒸馏表征；报告在最多 3 万小时预训练数据范围内扩展斜率高于基线。
- title: "Training in Deployment: Human-in-the-loop Online Post-Training for Robot Manipulation"
  type: paper
  arxiv: "2610.29264"
  year: 2026
  project: https://logosroboticsgroup.github.io/TIDE/
  added: 2026-10-26
  topics: [manipulation]
  tags: [human-in-the-loop, online-learning, post-training, bimanual, real]
  takeaway_en: "TIDE updates a pretrained policy online from human interventions and its own rollouts, with no critic or reward model; reports gains on four real bimanual tasks, each session finishing in under an hour."
  takeaway_zh: TIDE 在部署过程中利用人类干预和策略自身的执行数据在线更新预训练策略，无需价值函数或奖励模型；报告在四个真实双臂任务上优于初始策略，每次在线后训练不到一小时完成。
- title: "DiscoDemo: Discovering Efficient and Diverse Robot Demonstrations for Imitation Learning"
  type: paper
  arxiv: "2610.32093"
  year: 2026
  code: https://github.com/DAVIAN-Robotics/DiscoDemo
  project: https://davian-robotics.github.io/DiscoDemo
  added: 2026-10-27
  topics: [manipulation]
  tags: [rl, data-generation, imitation-learning, diversity, sim, real]
  takeaway_en: "Uses RL as a demo generator, not a controller: a latent-conditioned policy finds several distinct successful solutions, exported as an imitation dataset; reports 78% real-robot success vs. 39% for the best baseline."
  takeaway_zh: 把强化学习当作示教数据生成器而非部署控制器：以隐变量为条件的策略为同一任务找到多种不同的成功解法，导出为模仿学习数据集；报告真机下游成功率从最强基线的 39% 提升到 78%。
- title: "HIDRA: Hierarchical Dual-Routing Attention for Replay-Free Lifelong Imitation Learning"
  type: paper
  arxiv: "2610.36374"
  year: 2026
  venue: NeurIPS 2026
  code: https://github.com/yfqi/HIDRA
  added: 2026-10-28
  topics: [manipulation]
  tags: [lifelong-learning, imitation-learning, mixture-of-experts, libero]
  takeaway_en: "Replay-free lifelong imitation learning: hierarchical dual-routing attention retrieves experts by instruction, then refines by context, plus key regularization against drift. Reports beating replay baselines on LIBERO."
  takeaway_zh: "无回放的终身模仿学习：分层双路由注意力先按指令检索专家、再按上下文细化，并用键级几何正则抑制表征漂移带来的路由干扰；报告在多个 LIBERO 任务序列上优于无回放和有回放基线。"
- title: "Progress-Guided Preference Generation for Aligning Generative Control Policies"
  type: paper
  arxiv: "2610.25692"
  year: 2026
  venue: CoRL 2026
  project: https://pgpg2026.github.io/
  added: 2026-10-28
  topics: [manipulation]
  tags: [preference-learning, diffusion-policy, flow-matching, fine-tuning, long-horizon]
  takeaway_en: "Fine-tunes diffusion and flow policies with automatic preference labels: rollouts are ranked by progress measured against a few expert demos, no human labels or reward design. Reports beating SFT on long-horizon tasks."
  takeaway_zh: "用自动生成的偏好标签微调扩散与流匹配策略：以少量专家示教为参照衡量自主回放的顺序进度并据此排序，无需人工标注或手工奖励；报告在长时程操作任务上优于监督微调基线。"
- title: "Flexible Language-Guided Representation Editing for Adaptive Robot Behavior"
  type: paper
  arxiv: "2610.28893"
  year: 2026
  venue: CoRL 2026
  org: MIT
  project: https://mit-clear-lab.github.io/FLEX/
  added: 2026-10-29
  topics: [manipulation]
  tags: [language-corrections, reward-features, representation-learning, llm, real]
  takeaway_en: "FLEX lets language corrections edit a robot's task features via add, generalize and mask (not add-only). Reports higher normalized reward than other editing methods in 2D nav, Franka tabletop and a real user study."
  takeaway_zh: "FLEX 用自然语言纠正来迭代修改机器人的任务特征集合，支持添加、泛化、屏蔽三种操作（而非只能添加）；在二维导航、Franka 桌面操作和真实用户研究中报告比其他特征编辑方法获得更高的归一化奖励。"

- title: "CuraEval: Evaluating Demonstration Curation on Mixed-Skill Robot Data"
  type: paper
  arxiv: "2610.38221"
  year: 2026
  code: https://github.com/jiuyixu25/CuraEval
  added: 2026-11-01
  topics: [learning, datasets]
  tags: [data-curation, imitation-learning, diffusion-policy, robomimic, evaluation, sim]
  takeaway_en: "Sanity check for demo-curation methods on mixed-skill robomimic data: one score ranks demos almost exactly like episode length, and after Holm correction no curated subset significantly beats training on all data."
  takeaway_zh: 对示范数据筛选方法做严格对照：在混合技能的 robomimic 数据上与等量随机子集和全量训练比较，发现某评分几乎等同于按轨迹长度排序；经多重比较校正后，没有任何筛选条件显著优于全量数据训练（CoRL 2026 Workshop 论文）。

- title: "Recursive Self-Improvement in Physical AI: Mechanisms, Evidence, and Evaluation"
  type: paper
  arxiv: "2610.38266"
  year: 2026
  project: https://github.com/nkd-lkz/physical-ai-rsi-survey
  added: 2026-11-02
  tags: [survey, self-improvement, evaluation]
  takeaway_en: "Survey separating ordinary learner updates from improvers that revise how a robot learns, with an L0–L3 rubric from task-local adaptation to verified improver gain, and proposed comparisons from shared learner starts."
  takeaway_zh: "综述：区分普通的学习器更新与会修改学习过程本身的“改进器”，给出从任务内适应到已验证改进增益的 L0–L3 分级，并提出从相同起点比较的评测方法。"

- title: "Flow Policy Gradients for Robot Control"
  type: paper
  arxiv: "2602.02481"
  code: https://github.com/amazon-far/fpo-control
  year: 2026
  venue: CoRL 2026
  project: https://hongsukchoi.github.io/fpo-control
  added: 2026-11-02
  tags: [flow-matching, policy-gradient, locomotion]
  takeaway_en: "CoRL 2026 Oral. Makes flow matching policy gradients work for robot control, bypassing action likelihoods, so policies need not be Gaussian. Applied to legged locomotion, humanoid motion tracking and manipulation."
  takeaway_zh: "CoRL 2026 Oral。让流匹配策略梯度可用于机器人控制：绕过动作似然计算，策略不再限于高斯分布。应用于足式运动、人形动作跟踪与操作。"

- title: "RL Token: Bootstrapping Online RL with Vision-Language-Action Models"
  type: paper
  arxiv: "2604.23073"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-02
  tags: [online-rl, vla-finetuning, real]
  takeaway_en: "CoRL 2026 Oral. Adapts a VLA to expose a compact RL token, an interface for sample-efficient online RL, so a pretrained policy gains precision and speed from a few hours of real-world practice."
  takeaway_zh: "CoRL 2026 Oral。让 VLA 输出紧凑的 RL token 作为在线强化学习接口，预训练策略只需几小时真实练习即可提升精度与速度。"

- title: "FlowDAgger: Human-in-the-Loop Adaptation of Generative Robot Policies in Latent Space"
  type: paper
  arxiv: "2607.08877"
  code: https://github.com/microsoft/FlowDAgger
  year: 2026
  venue: CoRL 2026
  org: Microsoft
  project: https://microsoft.github.io/FlowDAgger
  added: 2026-11-02
  tags: [human-in-the-loop, flow-matching, adaptation]
  takeaway_en: "CoRL 2026 Spotlight. Adapts frozen generative policies from human interventions in latent space, as a cheaper alternative to mass data collection or online RL on hardware."
  takeaway_zh: "CoRL 2026 Spotlight。在隐空间中根据人类干预适配冻结的生成式策略，替代大规模采集或实机在线强化学习。"

- title: "Diffusion ReRoll: Revisable Denoising for Robotic Sequential Prediction"
  type: paper
  arxiv: "2607.19919"
  year: 2026
  venue: CoRL 2026
  project: https://seonsoo-p1.github.io/DiffusionReRoll/
  added: 2026-11-02
  rating: 1
  tags: [diffusion, sequence-prediction]
  takeaway_en: "CoRL 2026 Spotlight. Diffusion sequence prediction with selective re-noising, so segments of the horizon can be refined again using context from the rest."
  takeaway_zh: "CoRL 2026 Spotlight。在扩散序列预测中选择性重新加噪，让时间跨度内的片段可以借助其余片段的上下文再次修正。"
- title: "D&A: Decoupling Description and Assessment Enables VLMs as Zero-Shot Robotic Reward Models"
  type: paper
  arxiv: "2611.03622"
  year: 2026
  org: University of Washington
  code: https://github.com/memmelma/dna
  project: https://weirdlabuw.github.io/dna
  added: 2026-11-03
  tags: [reward, vlm, zero-shot, prompting]
  takeaway_en: "Prompt-only task-progress scoring: the VLM first describes what happens and defines absolute success, then scores with an explicit rubric. This curbs hallucinated progress on failed runs, and the rewards can drive RL."
  takeaway_zh: "只靠提示词的任务进度评估：先让 VLM 客观描述画面并定义绝对成功标准，再按明确评分表打分，减少对失败执行“幻觉式”的进度判断，其奖励可用于下游强化学习。"
- title: "When Robots Outweigh Objects: How Inertia Mismatch Shapes Robot Policy Learning"
  type: paper
  arxiv: "2611.03501"
  year: 2026
  project: https://younghyopark.me/inertia-mismatch/
  added: 2026-11-03
  topics: [manipulation]
  tags: [imitation-learning, reinforcement-learning, contact, hardware-design, sim]
  takeaway_en: "Simulation study varying robot and object mass: RL copes, but behavior cloning does better when the robot is lighter than the object, and more data narrows the gap without closing it. Lower-inertia demos help."
  takeaway_zh: "在仿真中改变机器人与物体质量：强化学习影响不大，行为克隆则在机器人比物体轻时更可靠，增加数据只能缩小而无法消除差距。采集低惯量示教可部分缓解。"
- title: "Beyond Validation Loss: Coverage and Reliability Dynamics in Robot Policy Pretraining"
  type: paper
  arxiv: "2611.01565"
  year: 2026
  project: https://zhanyisun.github.io/robot-policy-learning-dynamics/
  added: 2026-11-03
  tags: [evaluation, generative-policy, post-training, checkpoint-selection]
  takeaway_en: "Tracks closed-loop pass@k, the chance that one of k rollouts succeeds. Checkpoints with equal pass@1 can post-train differently, so it proposes offline checkpoint selection that balances coverage and reliability."
  takeaway_zh: "提出跟踪闭环 pass@k（k 次尝试至少成功一次的概率）。pass@1 相同的检查点在后训练中可能表现不同，因此给出兼顾覆盖度与可靠性的离线检查点选择方法。"
- title: "Behavior Graphs: Unsupervised Graph Structures for Interpreting Robot Deployment Data"
  type: paper
  arxiv: "2611.00405"
  year: 2026
  project: https://try.behavior-graphs.com/
  added: 2026-11-03
  topics: [datasets]
  tags: [deployment-data, interpretability, data-flywheel, user-study, real]
  takeaway_en: "Compresses policy rollouts into one directed graph of behavior modes linked to outcomes, to guide what data to collect next. In a user study on three real tasks, 16 of 18 participants preferred it to rollout videos."
  takeaway_zh: "把策略回放压缩成一张有向图，将行为模式与结果相连，帮助决定下一步采集什么数据。在三个真实任务的用户研究中，18 名参与者有 16 名更喜欢它而非回放视频。"
- title: "GSBR: Geometric Support Behavior Regularization for Online RL"
  type: paper
  arxiv: "2611.05295"
  year: 2026
  code: https://github.com/charlesxu0124/gsbr
  project: https://charlesxu0124.github.io/gsbr/
  tags: [sim, online-rl, residual-rl]
  added: 2026-11-04
  takeaway_en: "Online RL on top of a pretrained policy, penalised by distance from that policy's support: free inside it, smoothly costly outside; reports average success rising from 33% to 95% across 19 benchmark tasks."
  takeaway_zh: "在预训练策略之上做在线强化学习，按动作到其支撑集的距离施加惩罚：集内不罚，集外平滑增长；报告 19 个基准任务的平均成功率从 33% 升至 95%。"
- title: "SCoCaT: Success Conditioned Constrained Reinforcement Learning for Spacecraft Docking"
  type: paper
  arxiv: "2609.06061"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-04
  topics: [learning, control]
  tags: [safe-rl, constrained-rl, space]
  takeaway_en: "Shows termination-based constrained RL can learn to avoid the goal when constraints tighten near it, and fixes this with a dense success critic; validated on spacecraft docking tasks."
  takeaway_zh: "发现基于终止的约束强化学习在目标附近约束收紧时会学会回避目标，并用稠密成功信号的辅助价值网络解决；在航天器对接任务上验证。"
- title: "Control-Ready Uncertainty for Trajectory Diffusion"
  type: paper
  arxiv: "2610.12431"
  year: 2026
  venue: CoRL 2026
  project: https://zackaxue.github.io/SCOPE-project-page/
  added: 2026-11-04
  rating: 1
  topics: [learning, control]
  tags: [diffusion, uncertainty]
  takeaway_en: "SCOPE gives diffusion trajectory models calibrated uncertainty tubes without Monte Carlo sampling, by distilling score curvature; tested in crowd navigation and Franka manipulation."
  takeaway_zh: "SCOPE 通过蒸馏得分函数曲率，让扩散轨迹模型无需蒙特卡洛采样即可给出校准的不确定性管道；在人群导航和 Franka 操作上测试。"
- title: "TARC: Time-Adaptive Robotic Control"
  type: paper
  arxiv: "2510.23176"
  year: 2026
  venue: CoRL 2026
  project: https://arnavsukhija.github.io/projects/tarc
  added: 2026-11-04
  topics: [learning, locomotion]
  tags: [rl, control-frequency]
  takeaway_en: "A policy predicts each action and how long to hold it. Reports matching high-frequency control at under half the rate on an RC car and Unitree Go1, plus simulated VLA inference."
  takeaway_zh: "策略同时预测动作及其保持时长。报告在遥控车、Unitree Go1 和仿真 VLA 上以不到一半的控制频率达到高频控制的性能。"
- title: "FedGuide: Diffusion Prior Alignment and Value Baseline Guidance for Heterogeneous Federated Reinforcement Learning"
  type: paper
  arxiv: "2609.18964"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-04
  rating: 1
  topics: [learning]
  tags: [federated-rl, diffusion]
  takeaway_en: "Federated RL for heterogeneous clients that aggregates diffusion behavior priors with optimal transport rather than averaging policies, plus a low-variance DICE value baseline."
  takeaway_zh: "面向异构客户端的联邦强化学习：不再平均策略，而是用最优传输聚合扩散行为先验，并加入低方差的 DICE 价值基线。"
- title: "Towards Embodiment Scaling Laws in Robot Locomotion"
  type: paper
  arxiv: "2505.05753"
  year: 2025
  code: https://github.com/BoAi01/embodiment-scaling-laws
  venue: CoRL 2025
  project: https://embodiment-scaling-laws.github.io/
  added: 2026-11-04
  topics: [learning, locomotion]
  tags: [cross-embodiment, scaling]
  takeaway_en: "Tests 'embodiment scaling laws' on about 1,000 generated robots: does training on more bodies improve generalization to unseen ones?"
  takeaway_zh: "在约 1000 个生成的机器人形态上检验“形态缩放定律”：用更多形态训练能否提升对未见形态的泛化？"
- title: "LLMs as MDP Designers: A Dependency-Aware Agentic Framework for Automated Robot Policy Generation"
  type: paper
  arxiv: "2611.04974"
  year: 2026
  venue: NeurIPS 2026
  added: 2026-11-05
  topics: [learning]
  tags: [llm, rl, agent, isaac-sim]
  takeaway_en: "ARPG has an LLM design the RL pipeline before deployment: MDP first, then simulator code, with checks that state, action and reward agree; reports more successful policies than monolithic LLM baselines in Isaac Sim."
  takeaway_zh: "ARPG 让大模型在部署前设计强化学习流程：先定 MDP，再写仿真代码，并校验状态、动作与奖励是否一致；报告在 Isaac Sim 中成功率高于单体式大模型基线。"
- title: "RACE: Calibrated Cumulative Scoring for Rollout-Free Robot Policy Checkpoint Selection"
  type: paper
  arxiv: "2611.05838"
  year: 2026
  project: https://changyeon.site/race
  added: 2026-11-05
  topics: [learning]
  tags: [evaluation, checkpoint-selection, imitation-learning, real]
  takeaway_en: "Ranks checkpoints without rollouts: action deviations are calibrated against state-dependent thresholds from held-out demos, then combined in a running product. Reports rankings that align with real deployment."
  takeaway_zh: 无需实机回放即可排序检查点：用保留示教得到的状态相关阈值校准动作偏差，再按累乘聚合。论文报告其排序与真实机器人部署成功率一致。
- title: "ELA: End-to-End Latent Action Policy Learning from Video Demonstrations"
  type: paper
  arxiv: "2611.05571"
  year: 2026
  project: https://end2end-latent-action.github.io/
  added: 2026-11-05
  topics: [learning, manipulation]
  tags: [imitation-learning, latent-action, video-demonstrations, real]
  takeaway_en: "Jointly trains a latent action model, latent policy and action decoder, so plentiful action-free video plus a few labelled robot demos can train a policy. Reports beating prior latent-action baselines."
  takeaway_zh: 联合训练潜在动作模型、潜在策略和动作解码器，用大量无动作标注的视频加少量带标注示教即可训练策略。报告在仿真和真实任务上优于已有潜在动作方法。
- title: "Towards Generalist Robot Learning from Internet Video: A Survey"
  type: paper
  arxiv: "2404.19664"
  year: 2024
  tags: [survey, video, internet-data]
  takeaway_en: "Survey of learning from videos as a way around robot learning's data bottleneck, drawing on internet-scale video."
  takeaway_zh: "综述从视频学习的方法，以互联网规模视频缓解机器人学习的数据瓶颈。"
- title: "Sim-and-Real Co-Training: A Simple Recipe for Vision-Based Robotic Manipulation"
  type: paper
  arxiv: "2503.24361"
  year: 2025
  project: https://co-training.github.io/
  tags: [sim2real, co-training, imitation-learning]
  takeaway_en: "A simple recipe that trains on both real and simulated data to supplement expensive real-world collection for vision-based manipulation."
  takeaway_zh: "简单的联合训练做法：同时使用真实和仿真数据，弥补视觉操作中真实数据采集昂贵的问题。"
- title: "LLM+P: Empowering Large Language Models with Optimal Planning Proficiency"
  type: paper
  arxiv: "2304.11477"
  year: 2023
  code: https://github.com/Cranial-XIX/llm-pddl
  tags: [llm, planning, pddl]
  takeaway_en: "LLM+P has an LLM translate problems into a formal form for classical planners, which handle the long-horizon planning LLMs struggle with."
  takeaway_zh: "LLM+P 让大模型把问题转成规范形式交给经典规划器，解决大模型不擅长的长程规划。"
- title: "LLM-Planner: Few-Shot Grounded Planning for Embodied Agents with Large Language Models"
  type: paper
  arxiv: "2212.04088"
  year: 2022
  code: https://github.com/OSU-NLP-Group/LLM-Planner
  project: https://dki-lab.github.io/LLM-Planner
  tags: [llm, planning, few-shot]
  takeaway_en: "Early use of LLMs as few-shot planners for embodied agents following natural-language instructions in visual environments."
  takeaway_zh: "较早把大模型用作具身智能体的少样本规划器，在视觉环境中执行自然语言指令。"
- title: "TOPReward: Token Probabilities as Hidden Zero-Shot Rewards for Robotics"
  type: paper
  arxiv: "2602.19313"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/TOPReward/TOPReward
  added: 2026-11-06
  topics: [datasets]
  tags: [reward-model, vlm, zero-shot, progress-estimation, benchmark]
  takeaway_en: "Training-free progress reward: reads a video-language model's token probability that the instructed task is done, rather than asking it for a number. Introduces ManiRewardBench (130 tasks, four robots)."
  takeaway_zh: "免训练的进度奖励：不让视频语言模型输出数值，而是读取其判断“任务已完成”的 token 概率作为稠密奖励。并提出 ManiRewardBench（130 个任务、4 种机器人）。"
- title: "Online World Modeling Enables Real-World Inverse Reinforcement Learning from Observation"
  type: paper
  arxiv: "2602.24121"
  year: 2026
  org: University of Washington
  venue: CoRL 2026
  code: https://github.com/UWRobotLearning/mpail2
  project: https://uwrobotlearning.github.io/mpail2/
  added: 2026-11-06
  topics: [manipulation]
  tags: [inverse-rl, learning-from-observation, world-model, real]
  takeaway_en: "Inverse RL from observation only (videos, no actions or rewards) made practical on a real robot via online world modeling. Reports pick-and-place learned from scratch to 82% in under 40 minutes."
  takeaway_zh: "仅从观测（视频，无动作和奖励）做逆强化学习，借助在线世界模型在真机上实现。报告不到 40 分钟从零学会抓放，成功率 82%。"
- title: "Learning to Be Different: Component Specialization for Compositional Diffusion Policies"
  type: paper
  arxiv: "2610.27194"
  year: 2026
  venue: CoRL 2026
  project: https://al3cl1.github.io/robotics-score-decorrelation
  added: 2026-11-06
  topics: [manipulation]
  tags: [diffusion-policy, compositional, multitask, auxiliary-loss]
  takeaway_en: "Composed diffusion policies often learn identical components. A drop-in score-decorrelation loss makes each factor specialize, with no loss in multitask performance."
  takeaway_zh: "组合式扩散策略的各个分量常常学成相同的副本。即插即用的得分去相关损失让各分量各自专门化，且不损失多任务性能。"
- title: "Where Small Mistakes Matter: Quantifying State Criticality for Imitation Learning"
  type: paper
  arxiv: "2610.17709"
  year: 2026
  venue: CoRL 2026
  project: https://sia-lab-git.github.io/SCRIM/
  added: 2026-11-06
  topics: [manipulation, datasets]
  tags: [imitation-learning, state-criticality, data-curation, adversarial]
  takeaway_en: "Scores how much a small action error at each demo state would hurt the outcome, using an adversarial disturbance policy. The scores reweight behavior cloning and select smaller, higher-value demo subsets."
  takeaway_zh: "用对抗扰动策略衡量每个示教状态上的小动作误差会对结果造成多大损害。该分数可用于给行为克隆加权，并挑选更小但价值更高的示教子集。"
- title: "MIRROR: Reflecting Hidden Symmetries from Offline Robot Interaction Data"
  type: paper
  arxiv: "2610.17422"
  year: 2026
  venue: CoRL 2026
  project: https://pomdp-mirror.github.io
  added: 2026-11-06
  topics: [manipulation]
  tags: [symmetry, equivariance, offline-data, behavior-cloning, real]
  takeaway_en: "Learns how a known symmetry acts on pixel observations and actions from offline data, then uses it for frame-averaged behavior cloning. Reports average success 80.5% to 85.1% on four Robosuite tasks."
  takeaway_zh: "从离线交互数据中学习已知对称群如何同时作用于像素观测和动作，再用于帧平均行为克隆。报告在四个 Robosuite 任务上平均成功率从 80.5% 升到 85.1%。"
- title: "A Balanced Data Diet: Addressing the Exploration Bottleneck in Mega-Scale RL for Robot Control"
  type: paper
  arxiv: "2610.12465"
  year: 2026
  venue: CoRL 2026
  project: https://sgs-rl.github.io/
  added: 2026-11-06
  topics: [locomotion, sim]
  tags: [massively-parallel-rl, curriculum, assembly, quadruped, sim2real]
  takeaway_en: "Success Guided Sampling focuses massively parallel RL on task configurations at the edge of the policy's ability. With up to a million envs it solves quadruped terrain and assembly tasks; assembly transfers zero-shot."
  takeaway_zh: "成功引导采样把大规模并行强化学习集中在策略能力边界附近的任务配置上。用最多约一百万个并行环境解决四足多地形与装配任务，装配策略零样本迁移到真机。"
- title: "RoboFFT: Finetuning generative robot policy via online reinforcement learning with forward process"
  type: paper
  arxiv: "2609.32236"
  year: 2026
  venue: CoRL 2026
  project: https://student-of-holmes.github.io/RoboFFT/
  added: 2026-11-06
  tags: [rl-finetuning, diffusion-policy, flow-matching, ppo, real]
  takeaway_en: "PPO-style fine-tuning for diffusion and flow policies that builds a surrogate policy ratio from forward noising and the score/flow loss, avoiding likelihoods. Tested in sim and real."
  takeaway_zh: "为扩散与流匹配策略做 PPO 式微调：用前向加噪与得分/流匹配损失构造替代的策略比率，绕开似然计算；在仿真与真机上验证。"
- title: "HiRE: Hindsight Reward Editing for Policy Finetuning"
  type: paper
  arxiv: "2609.27068"
  year: 2026
  venue: CoRL 2026
  project: https://hire-project.github.io
  added: 2026-11-06
  tags: [reward-shaping, rl-finetuning, foundation-models, hindsight]
  takeaway_en: "Training-free reward editing: compares successful and failed rollouts in hindsight to penalize trap states that foundation-model rewards rate highly. Reports at least 3x the base policy's performance."
  takeaway_zh: "免训练的奖励修正：事后对比成功与失败轨迹，惩罚被基础模型奖励高估、最终却导致失败的“陷阱状态”。报告性能至少是基础策略的 3 倍。"
- title: "$R^3$: Training Robots to Reason in Natural Language via Reinforcement Learning"
  type: paper
  arxiv: "2608.26053"
  year: 2026
  venue: CoRL 2026
  project: https://robotic-reasoner.github.io/
  added: 2026-11-06
  tags: [reasoning, vlm, rl-finetuning, language-table, sim]
  takeaway_en: "Post-training recipe that turns an off-the-shelf VLM into a free-form language reasoner guiding a low-level policy: mid-train on expert reasoning traces, then rubric-based RL from offline action data."
  takeaway_zh: "把现成 VLM 训练成用自由语言推理来指导底层策略的“机器人推理器”：先用专家推理轨迹做中训练，再用离线动作数据做基于评分规则的单步强化学习。"
- title: "TRACE: Trajectory-Routed Causal Memory for Delayed-Evidence Visuomotor Imitation"
  type: paper
  arxiv: "2606.14551"
  year: 2026
  venue: CoRL 2026
  project: https://jeong-zju.github.io/trace
  added: 2026-11-06
  tags: [memory, imitation-learning, path-signatures, long-horizon, real]
  takeaway_en: "Bounded latent memory for imitation policies on tasks where a cue disappears before the decision; it is keyed by path signatures of the robot's own trajectory and attaches via adapters. Real-robot branching tasks."
  takeaway_zh: "为“线索在决策前已消失”的任务设计的模仿策略记忆：固定大小的潜在记忆以机器人自身轨迹的路径签名为键读写，通过适配器接入现有策略。在真机分支任务上验证。"
- title: "Unified Motion-Action Modeling for Heterogeneous Robot Learning"
  type: paper
  arxiv: "2606.16917"
  year: 2026
  venue: CoRL 2026
  project: https://uma-manipulation.github.io/
  added: 2026-11-06
  tags: [object-motion, masked-generative, human-video, cross-embodiment, real]
  takeaway_en: "Uses 3D object motion as a shared interface: object motion and robot actions are modelled jointly with masking, so one pretrained model serves as policy, dynamics model and few-shot adapter. Robot, human and sim data."
  takeaway_zh: "以 3D 物体运动轨迹作为统一接口，用掩码生成目标联合建模物体运动与机器人动作，同一套预训练参数可作为策略、动力学模型或少样本适配器。混合机器人、人类视频与仿真数据预训练。"
- title: "Learning While Deploying: Fleet-Scale Reinforcement Learning for Generalist Robot Policies"
  type: paper
  arxiv: "2605.00416"
  year: 2026
  venue: CoRL 2026
  project: https://learning-while-deploying.github.io/
  added: 2026-11-06
  tags: [fleet-learning, offline-to-online, vla, bimanual, real]
  takeaway_en: "Fleet-scale offline-to-online RL that keeps post-training a generalist VLA from autonomous rollouts and human interventions. On 16 dual-arm robots and eight tasks it reports 95% average success."
  takeaway_zh: "车队规模的离线到在线强化学习：利用自主执行与人工干预数据持续后训练通用 VLA。在 16 台双臂机器人、八个任务上报告平均成功率 95%。"
- title: "Memory Anchors for Continual Robot Learning"
  type: paper
  arxiv: "2608.26545"
  year: 2026
  venue: CoRL 2026
  project: https://robot-adaptation.github.io/MemoryAnchors
  added: 2026-11-06
  tags: [continual-learning, replay, forgetting, libero, real]
  takeaway_en: "Finds that a few replay samples, where new and old observations look alike but need different actions, prevent most forgetting. Dropping just 10% of them raises forgetting more than 4.5x on LIBERO."
  takeaway_zh: "发现回放缓冲中少数“观测相似但所需动作冲突”的样本（记忆锚点）承担了防遗忘的主要作用：仅剔除其中 10% 就会让 LIBERO 上的遗忘增加 4.5 倍以上。"
- title: "UniIntervene: Agentic Intervention for Efficient Real-World Reinforcement Learning"
  type: paper
  arxiv: "2606.12372"
  year: 2026
  venue: CoRL 2026
  project: https://denghaoyuan123.github.io/UniIntervene-project/
  added: 2026-11-06
  tags: [human-in-the-loop, real-world-rl, value-estimation, recovery, real]
  takeaway_en: "Agentic intervention model for human-in-the-loop RL: detects stalled exploration from value trends and steers the policy back to high-value states. Reports 57% fewer human interventions."
  takeaway_zh: "用于人在回路强化学习的智能干预模型：根据价值变化趋势发现无效探索，并自动把策略拉回高价值状态。报告人工干预减少 57%，成功率提升 8.6%。"
- title: "Robo-ValueRL: Reliable Value Estimation for Offline-to-Online Reinforcement Learning"
  type: paper
  arxiv: "2607.09866"
  year: 2026
  venue: CoRL 2026
  project: https://gewu-lab.github.io/Robo-ValueRL/
  added: 2026-11-06
  tags: [offline-to-online, value-function, precision, insertion, real]
  takeaway_en: "Studies how value-function reliability drives offline-to-online RL for manipulation, with a history-conditioned value estimator. Reports 86% on millimeter-level chip insertion."
  takeaway_zh: "系统研究价值函数可靠性如何影响操作任务的离线到在线强化学习，提出历史条件价值估计器。报告毫米级芯片插装成功率 86%。"
- title: "Generative Flow on Symbolic Abstractions for Embodiment Capability Discovery"
  type: paper
  arxiv: "2610.17174"
  year: 2026
  venue: CoRL 2026
  project: https://www.youwei-yu.com/fosa
  added: 2026-11-06
  tags: [task-generation, gflownet, curriculum, cross-embodiment, sim]
  takeaway_en: "Discovers what a given robot can actually learn: a GFlowNet builds symbolic task skeletons, rewarded by how well low-level policies learn them in sim, then the tasks are distilled into one language-conditioned policy."
  takeaway_zh: "自动发现某台机器人“学得会”的任务：用 GFlowNet 生成符号化任务骨架，以仿真中底层策略的学习效果作为奖励，再把发现的任务蒸馏进一个语言条件策略。"
- title: "ENPIRE: Agentic Robot Policy Self-Improvement in the Real World"
  type: paper
  arxiv: "2606.19980"
  year: 2026
  venue: CoRL 2026
  project: https://research.nvidia.com/labs/gear/enpire/
  added: 2026-11-06
  tags: [coding-agents, autonomous-research, real-world, dexterous, nvidia]
  takeaway_en: "Harness that lets coding agents improve real robot policies on their own: automatic reset and verification, parallel rollouts and agent-driven code changes. Reports 99% success on tasks like fastening a zip tie."
  takeaway_zh: "让编程智能体自主改进真实机器人策略的框架：自动复位与结果验证、多机并行评测，并由智能体分析日志、修改训练代码。报告在扎扎带等灵巧任务上成功率 99%。"
- title: "DiscreteRTC: Discrete Diffusion Policies are Natural Asynchronous Executors"
  type: paper
  arxiv: "2604.25050"
  year: 2026
  venue: CoRL 2026
  project: https://outsider86.github.io/DiscreteRTCSite/
  added: 2026-11-06
  tags: [discrete-diffusion, real-time-chunking, asynchronous, dynamic-tasks, real]
  takeaway_en: "Shows discrete diffusion policies do real-time chunking natively, since inpainting is just unmasking: no fine-tuning, ~0.7x compute. Reports 65% higher success than flow-matching RTC on a real hockey task."
  takeaway_zh: "指出离散扩散策略天然支持实时分块异步执行（补全即解掩码），无需微调、计算量约为 0.7 倍。报告在真机冰球防守任务上成功率比流匹配 RTC 高 65%。"
- title: "FAR: Failure-Aware Retry for Test-Time Recovery and Continual Policy Improvement"
  type: paper
  arxiv: "2607.01111"
  year: 2026
  venue: CoRL 2026
  project: https://hoar012.github.io/FAR-Project
  added: 2026-11-06
  tags: [failure-recovery, preference-learning, diffusion-policy, continual-learning, real]
  takeaway_en: "Retries that learn from failure: preference pairs from failed attempts steer the policy away from them, plus small action perturbations, and feeds recoveries back into training. Reports +17.6% sim, +11.7% real."
  takeaway_zh: "会从失败中学习的重试机制：用失败尝试构造偏好数据，引导策略避开失败行为，并加入小幅动作扰动做局部探索，成功恢复的轨迹再回流训练。报告仿真提升 17.6%，真机提升 11.7%。"
- title: "EgoEngine: From Egocentric Human Videos to High-Fidelity Dexterous Robot Demonstrations"
  type: paper
  arxiv: "2606.12604"
  year: 2026
  venue: CoRL 2026
  project: https://egoengine.github.io
  added: 2026-11-06
  tags: [human-video, egocentric, data-generation, dexterous, real]
  takeaway_en: "Converts egocentric human videos into robot data: a video with the human replaced by a robot plus a feasible robot action trajectory. Claims the first zero-shot dexterous visuomotor policy with no real-robot demos."
  takeaway_zh: "把第一人称人类视频转为机器人数据：生成把人替换成机器人的视频，以及满足可行性约束的机器人动作轨迹。声称首次在无真机演示下零样本训练出灵巧视觉运动策略。"
- title: "Robot-WATCHDOG : failure detection through object-centric graph representation"
  type: paper
  arxiv: "2610.13403"
  year: 2026
  venue: CoRL 2026
  project: https://cea-list.github.io/Robot-WATCHDOG/
  added: 2026-11-06
  tags: [failure-detection, scene-graphs, self-supervised, monitoring, real]
  takeaway_en: "Self-supervised failure detection from nominal demos only, using object-centric spatio-temporal scene graphs; both of its scores beat image-based detectors, especially on semantic and interaction failures."
  takeaway_zh: "仅用正常演示做自监督失败检测：把操作场景建模为以物体为中心的时空图，所提两种失败评分都优于基于图像的检测器，尤其擅长语义和交互层面的失败。"
- title: "Unified Condition-Action Modeling for Accurate One-Step Action Generation"
  type: paper
  arxiv: "2608.16153"
  year: 2026
  venue: CoRL 2026
  project: https://uca-policy.github.io/UCA.github.io/
  added: 2026-11-06
  tags: [one-step, flow-policy, 3d, fast-inference, sim]
  takeaway_en: "One-step flow policy that puts observation, timestep and action tokens in one sequence for a single transformer. Reports 86.4% average success (+7.5 points) at 3.0 ms latency, 43.9x faster than DP3."
  takeaway_zh: "一步生成的流策略：把观测、时间步与动作 token 拼成一个序列，由同一 Transformer 联合建模。报告平均成功率 86.4%（提升 7.5 个百分点），推理延迟 3.0 ms，比 DP3 快 43.9 倍。"
- title: "Recover, Discover, Plan: Learning Skills and Concepts from Robot Failures"
  type: paper
  arxiv: "2606.18328"
  year: 2026
  venue: CoRL 2026
  project: https://jaraxxus-me.github.io/ReSYNC/
  added: 2026-11-06
  tags: [failure-recovery, abstraction, task-planning, predicates, real]
  takeaway_en: "Learns recovery skills with RL and, from them, discovers new relational predicates for an abstract planner, turning local recoveries into failure avoidance. Reports >50% gains over baselines in four sim domains."
  takeaway_zh: "用强化学习学习失败恢复技能，并据此发现新的关系谓词、完善抽象规划模型，把局部恢复转化为全局避免失败。报告在四个仿真领域比基线高 50% 以上，并迁移到真机。"
- title: "Ambient Diffusion Policy: Imitation Learning from Suboptimal Data in Robotics"
  type: paper
  arxiv: "2606.12365"
  year: 2026
  venue: CoRL 2026
  project: https://ambient-diffusion-policy.github.io/
  added: 2026-11-06
  tags: [diffusion-policy, suboptimal-data, co-training, open-x-embodiment, real]
  takeaway_en: "Uses suboptimal demos only at high and low diffusion noise levels, where their coarse or local structure still helps. Covers noisy, sim, mismatched and mixed data; reports up to 33% over co-training on Open X-Embodiment."
  takeaway_zh: "只在扩散过程的高噪声与低噪声阶段使用次优演示，此时其粗粒度或局部结构仍然有用。覆盖带噪、仿真、任务不匹配和混合数据；报告在 Open X-Embodiment 上比协同训练基线高最多 33%。"
- title: "WARP-RM: A Warp-Augmented Relative Progress Reward Model for Data Curation"
  type: paper
  arxiv: "2606.28320"
  year: 2026
  venue: CoRL 2026
  project: https://uynitsuj.github.io/warp-rm/
  added: 2026-11-06
  tags: [data-curation, progress-reward, self-supervised, cloth-folding, real]
  takeaway_en: "Self-supervised progress reward learned from time-warped demos (speed changes, reversals), used to filter and reweight behaviour-cloning data. Reports up to ~18x T-shirt folding throughput over vanilla BC."
  takeaway_zh: "用时间扭曲（变速、倒放）增强的演示自监督学习帧级进度奖励，再用它过滤和加权行为克隆数据。报告 T 恤折叠吞吐量最高为普通 BC 的约 18 倍。"
- title: "Learning Robust Visuomotor Policies via Dynamics Alignment"
  type: paper
  arxiv: "2510.27114"
  year: 2025
  venue: CoRL 2026
  project: https://dynamics-aligned-policy.github.io
  added: 2026-11-06
  tags: [flow-matching, dynamics-model, imitation-learning, robustness, real]
  takeaway_en: "A flow-matching policy and an action-conditioned dynamics model co-sample an action and its predicted future until they agree. Reports 56.5% (sim) and 33.3% (real) relative gains over the strongest baselines."
  takeaway_zh: "流匹配策略与动作条件动力学模型联合采样动作及其未来观测，相互修正直到二者自洽。报告相对最强基线在仿真提升 56.5%、真机提升 33.3%。"
- title: "WARP: Whole-Body Retargeting for Learning from Offline Human Demonstrations"
  type: paper
  arxiv: "2606.29940"
  year: 2026
  venue: CoRL 2026
  project: https://warp-retargeting.github.io/
  added: 2026-11-06
  tags: [retargeting, human-demos, mobile-manipulation, whole-body, real]
  takeaway_en: "Retargets human whole-body demos to a mobile manipulator offline with a closed-form shoulder-elbow-wrist solver and lazy base control; claims the first zero-shot whole-body mobile manipulation from them."
  takeaway_zh: "离线把人类全身演示重定向到移动操作机器人：闭式肩-肘-腕几何求解器加“惰性”底盘控制，得到一致的动作；声称首次仅凭离线人类演示实现零样本全身移动操作。"
- title: "Imitation from Heterogeneous Demonstrations using Grounded Latent-Action World Models"
  type: paper
  arxiv: "2606.21672"
  year: 2026
  venue: CoRL 2026
  project: https://viccccciv.github.io/glam/
  added: 2026-11-06
  tags: [latent-actions, world-model, heterogeneous-data, behavior-cloning, real]
  takeaway_en: "Shared latent action space grounded by predicting the same future across data sources, so action-free and differently-labelled data can train one BC policy. Reports +48% average success on five tasks."
  takeaway_zh: "通过让不同数据源对未来观测的预测保持一致来“落地”一个共享潜在动作空间，使无动作标签和动作空间不同的数据都能训练同一个行为克隆策略。报告五个任务平均成功率提升 48%。"
- title: "LUCID: Learning Embodiment-Agnostic Intent Models from Unstructured Human Videos for Scalable Dexterous Robot Skill Acquisition"
  type: paper
  arxiv: "2606.11628"
  year: 2026
  venue: CoRL 2026
  project: https://lucid-robot.github.io/
  added: 2026-11-06
  tags: [human-video, intent-model, sim-training, cross-embodiment, real]
  takeaway_en: "Learns a short-horizon 'what should happen next' intent model from internet human videos and pairs it with embodiment-specific policies trained in parallel sim; the same intent model drives a hand and a gripper."
  takeaway_zh: "从互联网人类视频学习预测“场景接下来该发生什么”的短时意图模型，再与在大规模并行仿真中训练的本体专用策略结合；同一意图模型可驱动灵巧手和平行夹爪。"
- title: "ActiveMimic: Egocentric Video Pretraining with Active Perception"
  type: paper
  arxiv: "2606.06194"
  year: 2026
  venue: CoRL 2026
  project: https://activemimic.github.io/
  added: 2026-11-06
  tags: [egocentric-video, active-perception, pretraining, camera-motion, real]
  takeaway_en: "Treats head-camera motion in egocentric human video as a viewpoint action and pretrains active perception plus manipulation from it. Reports matching state-of-the-art models pretrained on robot data."
  takeaway_zh: "把第一人称人类视频中的头部相机运动视为“视角动作”，同时预训练主动感知与操作能力。报告效果与使用机器人数据预训练的最先进模型相当。"
- title: "SynthICL: Scalable In-context Imitation Learning with Synthetic Data"
  type: paper
  arxiv: "2606.08154"
  year: 2026
  venue: CoRL 2026
  project: https://synth-icl.github.io
  added: 2026-11-06
  tags: [in-context-learning, synthetic-data, flow-matching, one-shot, real]
  takeaway_en: "In-context imitation policy trained only on RGB synthetic data, with next-subgoal image prediction. Reports 79% average success on 16 unseen real tasks from a single test-time demo."
  takeaway_zh: "完全用 RGB 合成数据训练的上下文模仿学习策略，并预测下一个子目标图像。报告仅给一条演示时，在 16 个未见真机任务上平均成功率 79%。"
- title: "Freeform Preference Learning for Robotic Manipulation"
  type: paper
  arxiv: "2606.32027"
  year: 2026
  venue: CoRL 2026
  project: https://freeform-pl.github.io/fpl.website/
  added: 2026-11-06
  tags: [preference-learning, reward-model, language, long-horizon, real]
  takeaway_en: "Annotators define their own preference axes in language (speed, safety, care) and compare trajectories per axis; a language-conditioned reward trains a steerable policy. Reports +38 points over sparse and binary rewards."
  takeaway_zh: "让标注者用自然语言自定义偏好维度（速度、安全、细致等）并逐维比较轨迹，训练语言条件奖励模型和可引导的策略。报告比稀疏奖励与二元偏好方法高 38 个百分点。"
- title: "FlowDPG: Deterministic Policy Gradient on Flow Matching Policies for Real-World Manipulation"
  type: paper
  arxiv: "2606.22303"
  year: 2026
  venue: CoRL 2026
  project: https://flowdpg.github.io
  added: 2026-11-06
  tags: [real-world-rl, flow-matching, ddpg, assembly, real]
  takeaway_en: "DDPG-style RL for flow-matching policies without backprop through the ODE: the critic gradient at a one-step action estimate is distilled into the velocity field. Reports 92% on dual-arm AirPods assembly."
  takeaway_zh: "无需沿 ODE 反向传播的流匹配策略 DDPG 式强化学习：在一步估计的动作上计算 critic 梯度，并蒸馏进速度场。报告双臂 AirPods 装配成功率 92%，炒蛋任务评分 86%。"
- title: "How to Learn from What a Human Would Avoid? Intervention-Aware World Models with Real-World RL for Dexterous Manipulation"
  type: paper
  arxiv: "2609.06009"
