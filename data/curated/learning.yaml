  takeaway_en: "Annotators define their own preference axes in language (speed, safety, care) and compare trajectories per axis; a language-conditioned reward trains a steerable policy. Reports +38 points over sparse and binary rewards."
  takeaway_zh: "让标注者用自然语言自定义偏好维度（速度、安全、细致等）并逐维比较轨迹，训练语言条件奖励模型和可引导的策略。报告比稀疏奖励与二元偏好方法高 38 个百分点。"
- title: "FlowDPG: Deterministic Policy Gradient on Flow Matching Policies for Real-World Manipulation"
  type: paper
  arxiv: "2606.22303"
  year: 2026
  venue: CoRL 2026
  project: https://flowdpg.github.io
  added: 2026-11-06
  tags: [real-world-rl, flow-matching, ddpg, assembly, real]
  takeaway_en: "DDPG-style RL for flow-matching policies without backprop through the ODE: the critic gradient at a one-step action estimate is distilled into the velocity field. Reports 92% on dual-arm AirPods assembly."
  takeaway_zh: "无需沿 ODE 反向传播的流匹配策略 DDPG 式强化学习：在一步估计的动作上计算 critic 梯度，并蒸馏进速度场。报告双臂 AirPods 装配成功率 92%，炒蛋任务评分 86%。"
- title: "How to Learn from What a Human Would Avoid? Intervention-Aware World Models with Real-World RL for Dexterous Manipulation"
  type: paper
  arxiv: "2609.06009"
  year: 2026
  venue: CoRL 2026
  project: https://whirl-dexterous.github.io/
  added: 2026-11-06
  tags: [real-world-rl, human-in-the-loop, world-model, dexterous, leap-hand]
  takeaway_en: "Human-in-the-loop RL whose latent world model also predicts when the operator would take over, steering the policy away from risky states. On a 16-DoF LEAP Hand: 96.7% grasp success, up to 84% less intervention."
  takeaway_zh: "人在回路强化学习：潜在世界模型额外预测操作者何时会接管，并据此让策略远离高风险状态。在 16 自由度 LEAP 手上抓取成功率 96.7%，人工干预最多减少 84%。"
- title: "AI Coaching for Accelerating Human Skill Development with Reinforcement Learning"
  type: paper
  arxiv: "2606.25337"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [human-skill, coaching, shared-control, user-study, drone]
  takeaway_en: "RL-trained AI coach that steps back as the learner improves, modelled as a game between learner and coach. A 33-person FPV drone-racing study shows faster human skill gains than prior AI coaching."
  takeaway_zh: "用强化学习训练的 AI 教练：随学习者进步逐步减少辅助，把教练与学习者建模为非合作动态博弈。33 人第一视角无人机竞速研究显示，人类技能提升快于已有 AI 教练方法。"
- title: "HARBOR: A Harness Framework for Agentic Robot Reinforcement Learning"
  type: paper
  arxiv: "2606.08610"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [agents, rl-automation, reward-design, sim-to-real, benchmark]
  takeaway_en: "Agent harness that automates sim RL from environment setup to trained policy: staged specialist agents, executable gates, parallel trials and reusable knowledge. 16 tasks across 6 benchmarks, some moved to real robots."
  takeaway_zh: "自动化仿真强化学习全流程的智能体框架：从环境搭建、奖励设计到调参训练，由分阶段的专职智能体、可执行检查点、并行试验与经验复用完成。覆盖 6 个基准 16 个任务，部分迁移到真机。"
- title: "Localized Visual Feature Aggregation via Focus Pooling for Visuomotor Policies"
  type: paper
  arxiv: "2609.08408"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [visual-representation, attention-pooling, data-efficiency, cnn, real]
  takeaway_en: "Attention pooling over intermediate CNN features, weighted by the robot's current proprioception, to keep control-relevant local detail. Reports +36.2% and +41.2% over pooling and explicit-crop methods."
  takeaway_zh: "以机器人当前本体状态为查询，对 CNN 中间特征做注意力池化，保留与控制相关的局部信息。报告比常规池化与显式裁剪方法分别高 36.2% 和 41.2%，仅需训练 5.8% 的编码器参数。"
- title: "Chameleon: Control-Indexed Prospective Memory for Visuomotor Manipulation"
  type: paper
  arxiv: "2603.24576"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [memory, visuomotor-policy, benchmark, libero, real]
  takeaway_en: "~60M-parameter policy with event memory for tasks where the deciding cue comes long before the action, plus the real-robot Camo-Dataset. Reports decision success up from 22.5% to 80.8% and 87.1% on LIBERO-10."
  takeaway_zh: "约 6000 万参数的视觉运动策略，带事件记忆，面向“决定性线索早于动作很久出现”的任务，并发布真机基准 Camo-Dataset。报告决策成功率从 22.5% 提升到 80.8%，LIBERO-10 达 87.1%。"
- title: "Object-Centric Conditioning for Visuomotor Flow Matching"
  type: paper
  arxiv: "2609.24155"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [flow-matching, object-centric, robustness, distractors, real]
  takeaway_en: "Action-to-action flow-matching policy conditioned on object-centric 'what' features and image-plane 'where' cues, improving robustness to distractors and object shifts while keeping few-step inference."
  takeaway_zh: "以物体为中心的动作到动作流匹配策略：把观测拆成语义“是什么”特征与图像平面“在哪里”线索作为条件，在保持少步推理的同时提升对干扰物和位置偏移的鲁棒性。"
- title: "Preference-Calibrated Human-in-the-Loop Reinforcement Learning for Robotic Manipulation"
  type: paper
  arxiv: "2606.03949"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [human-in-the-loop, credit-assignment, preferences, actor-critic, real]
  takeaway_en: "Human-in-the-loop RL that treats each intervention as a preference (human action over policy action) and corrects credit on suboptimal segments. Reports +24.5% average success and 1.3x faster convergence."
  takeaway_zh: "人在回路强化学习：把每次人工干预视为偏好（人类动作优于策略动作），对次优片段做信用重新分配。报告五个真机任务平均成功率提升 24.5%，收敛快 1.3 倍。"
- title: "Learning Additively Compositional Latent Actions for Embodied AI"
  type: paper
  arxiv: "2604.03340"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [latent-actions, video, compositionality, pretraining, real]
  takeaway_en: "Latent action model constrained to compose additively over short horizons (identity, inverse, cycle), so latents capture motion rather than scene detail and give better supervision for policies."
  takeaway_zh: "对潜在动作空间施加短时可加组合约束（恒等、逆、循环一致），使潜在动作只编码运动而非场景细节，并为下游策略学习提供更好的监督。"
- title: "Learning Coordinated Visuomotor Box-Pushing from Solo Demonstrations"
  type: paper
  arxiv: "2610.05677"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [multi-robot, imitation-learning, decentralized, box-pushing, real]
  takeaway_en: "Studies whether single-robot teleop data can train decentralised coordinated box-pushing; tests with up to 40 robots show coordination is hard to learn just by watching other robots."
  takeaway_zh: "研究能否只用单机遥操作数据训练去中心化的多机协同推箱；多达 40 台机器人的实验表明，仅靠被动观察其他机器人很难学会协调。"
- title: "Workspace Models: Lightweight Robotic Memory via Saliency-Driven Supervision"
  type: paper
  arxiv: "2609.20820"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [memory, distillation, vlm, long-horizon, real]
  takeaway_en: "Uses a VLM only at training time to pick task-relevant current and past information, distilled into a 'workspace token' the policy reads at deployment. Beats conditioning on curated past frames."
  takeaway_zh: "仅在训练时用 VLM 挑出完成任务所需的当前与历史信息，蒸馏成策略部署时读取的“工作区 token”。效果优于直接输入精选历史帧。"
- title: "RARM: Confidence-Gated Progress Reward Modeling for RL in Manipulation"
  type: paper
  arxiv: "2606.22027"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [reward-model, progress, one-demo, cloth-folding, real]
  takeaway_en: "Video comparator trained once on general videos that turns one successful demo into a dense progress reward, paying only for confident forward progress. Best RL success on 9 sim and 4 real tasks."
  takeaway_zh: "只在通用视频上训练一次的视觉比较器，可把一条成功演示变成稠密的进度奖励，并只奖励置信度高的前进。在 9 个仿真和 4 个真机任务的强化学习中成功率最高。"
- title: "Asking Smarter Questions: Targeted Active Preference Learning for Underspecified Rewards"
  type: paper
  arxiv: "2610.22285"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [reward-learning, active-learning, preferences, explanations, user-study]
  takeaway_en: "When teaching data under-specifies some reward features, the robot targets preference queries at those features and explains what to look at. Up to 30.8% better than standard active preference learning with few queries."
  takeaway_zh: "当示教数据对某些奖励特征监督不足时，机器人把偏好询问集中在这些特征上，并附带解释提示人该关注什么。少量询问下比标准主动偏好学习高最多 30.8%。"
- title: "Rethinking the Implications of Human Feedback for Preference Learning in Human-Robot Collaboration"
  type: paper
  arxiv: "2609.13982"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [preference-learning, human-feedback, hri, reward-learning, user-study]
  takeaway_en: "Shows fixed rules for deriving labels from human feedback often disagree with what people mean, and learns these implications instead. Better preference estimates, incl. a real pizza-making study."
  takeaway_zh: "发现从人类反馈推导未选动作标签的固定规则常与人的真实意图不符，改为学习这种“隐含含义”。偏好估计更准，并在真实做披萨协作实验中验证。"
- title: "Task-Space Imitation Guidance for Efficient Reinforcement Learning"
  type: paper
  arxiv: "2610.07527"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [rl, imitation-guidance, dense-rewards, safety, real]
  takeaway_en: "Uses an imitation policy's predicted action chunks as short task-space references for dense progress rewards in sparse-reward RL, plus guided pretraining. Better early sample efficiency and fewer safety violations."
  takeaway_zh: "把模仿策略预测的动作块转成短时末端参考轨迹，为稀疏奖励强化学习提供稠密进度奖励，并用于引导预训练。提升早期样本效率、减少安全违规。"
- title: "Efficient Diffusion Policy Fine Tuning with Latent Noise Representation Bridging"
  type: paper
  arxiv: "2611.07275"
  year: 2026
  venue: NeurIPS 2026
  added: 2026-11-06
  tags: [diffusion-policy, rl-finetuning, noise-space, theory, sim]
  takeaway_en: "LARBRID fine-tunes a pre-trained diffusion/flow policy via its initial noise, with a noise/action shared representation that fixes 'noise aliasing'. Reports up to 2-3x gains on locomotion and manipulation tasks."
  takeaway_zh: "LARBRID 通过调整初始噪声来强化学习微调预训练的扩散/流策略，并学习噪声空间与动作空间共享的表示来消除“噪声混叠”问题。在运动与操作任务上报告最高 2–3 倍的提升。"
- title: "Learning Object Manipulation from Scratch via Contrastive Interaction"
  type: paper
  arxiv: "2606.11525"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [contrastive-rl, goal-conditioned, sim2real]
  takeaway_en: "Contrastive RL struggles when contact changes the dynamics mode. Interaction-weighted Resampling samples around before/during/after contact, reporting a 19.8% average gain in sim, including robot air hockey."
  takeaway_zh: "接触会改变动力学模式，使对比式强化学习难以处理操作任务。交互加权重采样在接触前、中、后阶段重点采样，仿真中平均提升 19.8%，任务包括机器人空气曲棍球。"
- title: "Improving Robotic Generalist Policies via Flow Reversal Steering"
  type: paper
  arxiv: "2606.13675"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [flow-matching, steering, generalist-policy, rl, real]
  takeaway_en: "Runs rough actions (from a human or a VLM) backwards through a flow policy to their noise, then forward again to land on a nearby good action mode. Distilling this reports up to 95-point success gains in under a minute."
  takeaway_zh: "把粗糙动作（来自人或 VLM 的指引）反向送入流策略得到其噪声，再正向生成，落到附近的优质动作模态。将其蒸馏后，不到一分钟训练即可报告最高 95 个百分点的成功率提升。"
- title: "Leave It Better Than Found: Value-Guided Cooperation in Sequential Tasks"
  type: paper
  arxiv: "2611.08075"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [multi-robot, value-functions, ad-hoc-cooperation, real]
  takeaway_en: "Robots that never trained together share value functions, so a robot finishing a task leaves the workspace in a state the next robot prefers; a KNN uncertainty filter blocks overconfident values. Up to +48.5 pts."
  takeaway_zh: "从未共同训练的机器人通过共享价值函数来协作，前一个机器人会把工作空间留在后一个机器人偏好的状态；KNN 不确定性过滤避免分布外的过度自信。成功率最高提升 48.5 个百分点。"
- title: "Proxy Policy Steering"
  type: paper
  arxiv: "2609.09148"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [steering, diffusion-policy, adaptation, generalist-policy]
  takeaway_en: "Adapts a frozen generalist policy at inference: two small proxies (one copies base behaviour, one is fine-tuned on the task) and their velocity difference steers each denoising step. Base weights are not needed."
  takeaway_zh: "推理时适配冻结的通用策略：训练两个小代理策略（一个模仿基座行为，一个在目标任务上微调），以二者的速度场差值引导每一步去噪。无需访问基座参数。"
- title: "What Do You Need for Compositional Generalization in Diffusion Planning?"
  type: paper
  arxiv: "2505.18083"
  year: 2025
  venue: CoRL 2026
  added: 2026-11-06
  tags: [diffusion-planner, stitching, compositional-generalization]
  takeaway_en: "Finds that shift equivariance, local receptive fields and inference choices let diffusion planners stitch sub-trajectories without TD learning; locality matters most. Proposes the Eq-Net architecture."
  takeaway_zh: "发现平移等变性、局部感受野和推理设置使扩散规划器无需 TD 学习就能拼接子轨迹，其中局部性最关键；据此提出 Eq-Net 架构。"
- title: "Simultaneous Forward and Inverse Human-in-the-Loop Optimization"
  type: paper
  arxiv: "2609.22630"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [human-in-the-loop, preference-learning, assistive, reward-learning]
  takeaway_en: "For assistive devices with costly user trials: a forward model predicts user outcomes from control policies and drives active queries to learn each user's reward, then picks the final policy without more trials."
  takeaway_zh: "面向用户试验代价高的辅助设备：先训练前向模型从控制策略预测用户结果，用它主动选择查询来学习个体奖励，再在不增加试验的情况下选出最终策略。"
- title: "Beyond Monotonic Progress: Retry-Supervised Value Learning for Robot Imitation"
  type: paper
  arxiv: "2606.24633"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [value-learning, imitation-learning, mixed-quality-data, retries]
  takeaway_en: "ReTVL learns a mistake-sensitive value function from imperfect demos, using sparse retry keypoints as pairwise preferences on top of global progress, then reweights demo chunks for behavior cloning."
  takeaway_zh: "ReTVL 从不完美示教中学习对失误敏感的价值函数：在全局进度校准之上，以稀疏标注的“重试”关键点构造局部成对偏好，再用该价值为行为克隆的示教片段加权。"
- title: "SCAPE: Scenario-Conditioned Simulation-Augmented Policy Evaluation"
  type: paper
  arxiv: "2608.19425"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [policy-evaluation, sim2real, conformal-prediction, quadruped]
  takeaway_en: "SCAPE predicts per-scenario real-world policy performance from a few paired sim/real runs plus many sim runs, correcting sim bias and calibrating with conformal prediction. Tested on driving and quadrupeds."
  takeaway_zh: "SCAPE 利用少量成对的仿真/真机数据和大量仿真推演，按场景预测策略在真实世界的表现：先校正仿真标签偏差，再用共形预测校准不确定性。在自动驾驶与四足速度跟踪上验证。"
- title: "Implicit Neural Representations of Individual Behavior"
  type: paper
  arxiv: "2606.12200"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [policy-representation, implicit-neural-representation, self-supervised]
  takeaway_en: "Behavioral INR represents a policy as a state-to-action function modulated by an episode latent (FiLM), so policy identity in unlabeled multi-policy data can be inferred without labels."
  takeaway_zh: "Behavioral INR 把策略表示为由回合级潜变量（FiLM）调制的“状态→动作”函数，从而在无标签的多策略行为数据中无监督地推断策略身份。"
- title: "Why Does Action Chunking Improve Behavioral Cloning Performance in Robotic Control?"
  type: paper
  arxiv: "2608.02547"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [action-chunking, behavior-cloning, analysis]
  takeaway_en: "Tests why action chunking helps BC: not temporal consistency or horizon reduction, but non-Markovian expressivity and less compounding error (also matched by delayed policies), plus an 'implicit ensembling' effect."
  takeaway_zh: "检验动作分块为何有助于行为克隆：并非时间一致性或缩短时域，而是非马尔可夫表达力与更少的误差累积（延迟策略也能做到），另外还有一种“隐式集成”效应。"
- title: "Coverage Aware Active Evaluation for Failure Discovery with Paired Systems"
  type: paper
  arxiv: "2608.13719"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [failure-discovery, active-testing, proxy, sim2real]
  takeaway_en: "Finds real-system failures on a small budget by correcting cheap proxy (e.g. simulator) failure signals with residual modeling and choosing diverse, well-supported scenarios. Up to 2x the failures of random sampling."
  takeaway_zh: "在有限测试预算下寻找真实系统的失败：用残差建模校正廉价代理（如仿真器）的失败信号，并挑选多样且有数据支撑的场景。发现的失败数最多为随机采样的 2 倍。"
- title: "RoboFQE: Rollout-Free Evaluation of Visual Robot Policies from Offline Trajectories"
  type: paper
  arxiv: "2610.18699"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [policy-evaluation, off-policy-evaluation, fqe, offline]
  takeaway_en: "RoboFQE scores visual manipulation policies from offline trajectories, no rollouts: fitted Q-evaluation on a pretrained vision encoder plus learned success labels. Keeps rankings where video world models drift."
  takeaway_zh: "RoboFQE 无需推演、直接用离线轨迹评估视觉操作策略：在预训练视觉编码器上做拟合 Q 评估并学习终止成功标注。在视频世界模型会累积误差的长时任务上仍能保持策略排序。"
- title: "AnyRank: Reliable Anytime Policy Ranking via Sequential Testing"
  type: paper
  arxiv: "2610.14603"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [policy-evaluation, sequential-testing, statistics, hardware-trials]
  takeaway_en: "AnyRank ranks robot policies with sequential tests: trials go to hard-to-separate pairs, a (partial) ranking holds at any stopping time, and imperfect priors (sim, world model) save trials safely."
  takeaway_zh: "AnyRank 用序贯检验为多个机器人策略排序：把试验分给难以区分的策略，任何时刻停止都能给出有误差保证的（部分）排序，可借助不完美的先验（仿真、世界模型）节省试验而不破坏保证。"
- title: "When Robots Sleep: Offline Skill Consolidation for Shared-Policy Robot Learning"
  type: paper
  arxiv: "2606.17493"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [continual-learning, skill-consolidation, multi-task, meta-world]
  takeaway_en: "Sleeping Robots: learn a new skill while 'awake', then consolidate one shared policy offline during 'sleep' from frozen critics or actor snapshots, combining gradients by Nash bargaining. +64% success on Meta-World MT5."
  takeaway_zh: "Sleeping Robots：“清醒”时学习新技能，“睡眠”时利用冻结的评估器或策略快照离线巩固单一共享策略，并以纳什议价合并梯度。在 Meta-World MT5 上平均成功率提升 64%。"
- title: "Where Should Action Generation Begin? A Learnable Source Prior for Generative Robot Policies"
  type: paper
  arxiv: "2606.17408"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [generative-policy, source-distribution, flow-matching, robotwin]
  takeaway_en: "LeaP replaces the standard Gaussian source of a flow/diffusion-bridge policy with a proprioception-conditioned Gaussian over action chunks from a small MLP. 81.6% average on 15 RoboTwin tasks."
  takeaway_zh: "LeaP 用一个小型 MLP 预测、以本体感觉为条件的动作块高斯分布，替换流匹配/扩散桥策略的标准高斯起点。在 15 个 RoboTwin 任务上平均成功率 81.6%。"
- title: "Guided Discovery of New Behaviors using Diffusion Policies"
  type: paper
  arxiv: "2606.08743"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [diffusion-policy, exploration, trajectory-optimization, rare-modes]
  takeaway_en: "Feynman-Kac correctors with a new guiding potential push diffusion-policy samples toward rare but promising modes; trajectory optimization repairs them and they are added back to training."
  takeaway_zh: "用 Feynman-Kac 校正器配合新的引导势能，把扩散策略的采样推向少见但有前景的模态；再以基于采样的轨迹优化修复这些轨迹，并加回训练集重训策略。"
- title: "MAGMA-GEN: Validated Recovery Supervision from Ambiguous Failures via Counterfactual Re-Execution"
  type: paper
  arxiv: "2609.20056"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [failure-recovery, data-generation, long-horizon, hierarchical]
  takeaway_en: "Turns ambiguous failed rollouts into recovery training data: a privileged coach proposes a corrected high-level decision, kept only if re-executing from the same state improves progress."
  takeaway_zh: "把含义不明的失败推演转化为恢复训练数据：由特权教练推测早期的高层决策错误并提出修正，只有从同一状态重新执行确实提升进度时才保留。"
- title: "Behavior Uncloning: Distilling Mode Redirection into Policy Weights without Inference-Time Steering"
  type: paper
  arxiv: "2606.29201"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [behavior-cloning, mode-suppression, safety, real]
  takeaway_en: "MoRE 'unclones' unwanted behavior modes (e.g. handing a knife blade-first) by distilling a temporary mode classifier into the policy weights, with a retain loss. +44 pts success across eight tasks, no inference cost."
  takeaway_zh: "MoRE 通过把临时模式分类器的重定向信号蒸馏进策略权重，并配合保持损失，“去克隆”不想要的行为模式（如刀刃朝前递刀）。八个任务平均成功率提升 44 个百分点，推理零开销。"
- title: "Optimal Transport Q-Learning for Flow Policy Steering and Acceleration"
  type: paper
  arxiv: "2607.06262"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [flow-policy, rl-finetuning, optimal-transport, real]
  takeaway_en: "OTQL post-trains and speeds up a suboptimal flow policy from the robot's own experience with advantage-weighted conditional optimal-transport flow matching, in 50-60 episodes and without distillation."
  takeaway_zh: "OTQL 用优势加权的条件最优传输流匹配，从机器人自身经验对次优流策略做强化学习后训练并加速推理，只需 50–60 个交互回合，无需蒸馏。"
- title: "ExpertGen: Scalable Sim-to-Real Expert Policy Learning from Imperfect Behavior Priors"
  type: paper
  arxiv: "2603.15956"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [sim2real, diffusion-policy, noise-space-rl, data-generation]
  takeaway_en: "ExpertGen trains a diffusion prior on imperfect demos (even LLM-synthesized), then RL steers its initial noise with the policy frozen, keeping behaviour human-like under sparse rewards; experts feed sim-to-real BC."
  takeaway_zh: "ExpertGen 先在不完美示教（甚至由大模型合成）上训练扩散先验，再冻结策略、用强化学习只优化初始噪声，在稀疏奖励下保持类人行为；得到的专家策略用于仿真到真实的行为克隆。"
- title: "SkillWeaver: Agentic Exploration over Neural Interaction Skills for Scalable Robot Data Generation"
  type: paper
  arxiv: "2609.36171"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [data-generation, vlm-agent, skills, sim]
  takeaway_en: "A VLM agent explores simulated tasks by calling reusable RL-trained interaction skills, verifying outcomes and keeping memory in a verifier-guided tree search, to generate robot data without scripts."
  takeaway_zh: "VLM 智能体在仿真中调用可复用的强化学习交互技能来探索任务，借助验证、反思与记忆进行验证器引导的树搜索，无需脚本即可生成机器人数据。"
- title: "GUILD: Guided Iterative Data Collection for Imitation Learning"
  type: paper
  arxiv: "2611.05368"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [data-collection, imitation-learning, active-learning, vlm]
  takeaway_en: "GUILD decides what to collect next: a VLM proposes environments, object setups and goals, collected data is evaluated for its value to the policy, and the loop repeats, instead of filtering after the fact."
  takeaway_zh: "GUILD 主动决定下一步采集什么数据：由 VLM 提出环境、物体布置与目标，采集后评估数据对策略的价值，再进入下一轮，而非事后筛选数据集。"
- title: "Efficient On-policy Visual-RL via Stochastic Decoupled Policy Gradient"
  type: paper
  arxiv: "2605.26478"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [visual-rl, policy-gradient, efficiency, sim2real]
  takeaway_en: "SDPG estimates policy gradients from random perturbations of rollouts, so visual RL needs far fewer batch-rendered envs and trains in hours on one RTX 4080; adds visual benchmarks and sim-to-real demos."
  takeaway_zh: "SDPG 通过对推演轨迹随机扰动来估计策略梯度，视觉强化学习所需的批量渲染环境大幅减少，单张 RTX 4080 几小时即可训练；并提供视觉机器人基准与仿真到真实演示。"
- title: "Mind the Gap: Rethinking I/O Design for Contact-Rich Visuomotor Policy Learning"
  type: paper
  arxiv: "2602.08776"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [imitation-learning, action-space, teleoperation, contact-rich]
  takeaway_en: "Argues policies should condition on both the executed robot state and the leader command while predicting future commands, since their mismatch signals contact; beats either alone with no force sensing."
  takeaway_zh: "认为策略应同时以机器人实际执行状态和主端指令为输入并预测未来指令，因为两者的偏差蕴含接触信息；在没有力觉输入的低成本平台上优于单独使用任一信号。"
- title: "Q-OIL: Optimistic Exploration in Learning from Human Interventions"
  type: paper
  arxiv: "2611.08576"
  year: 2026
  venue: CoRL 2026
  org: University of Washington
  project: https://weirdlabuw.github.io/qoil
  added: 2026-11-09
  tags: [human-in-the-loop, interventions, rl, real, sim]
  takeaway_en: "Real users intervene when progress stalls, often with imperfect fixes; a progress-based human model makes sim benchmarking match them. Q-OIL adds optimistic bonuses on intervention steps; reports 10-50% higher success."
  takeaway_zh: "真实用户往往在进展停滞时介入，且纠正动作并不完美；据此建立的基于进展的人类模型让仿真评测更贴近真人。Q-OIL 对介入转移加乐观奖励并用解耦评论家稳定训练，报告成功率提升 10-50%。"
- title: "Off-Policy RL with Online Inference Tuning: My Solution to the CoRL 2026 RoboEval Challenge"
  type: paper
  arxiv: "2611.11464"
  year: 2026
  code: https://github.com/IliaLarchenko/RoboEvalSolution
  project: https://ilialarchenko.com/projects/roboeval2026/
  added: 2026-11-10
  topics: [vla]
  tags: [challenge, offline-rl, awr, pi0.5, bimanual, thompson-sampling]
  takeaway_en: "Challenge report: a π0.5 policy that is its own critic, trained off-policy on the exact score; Thompson sampling tunes ~20 inference settings; adds generated and recovery demos. Reports 0.987 RDS."
  takeaway_zh: "比赛技术报告：基于 π0.5 的策略同时充当价值函数，直接以官方评分做离策略 RL，每次 rollout 用 Thompson 采样调约 20 个推理参数，并加入生成示范与失败恢复数据。官方种子上报告 0.987 RDS。"
- title: "Explicitly capturing demonstrator multi-modality for distillation into diffusion policies"
  type: paper
  arxiv: "2611.10949"
  year: 2026
  org: MIT
  project: https://shaoyuan.cc/research/vine/
  added: 2026-11-10
  tags: [diffusion-policy, behavior-cloning, multimodality, data-collection]
  takeaway_en: "Diffusion policies trained on sliding-window demos often memorise one action per state; querying the demonstrator k times at one state (vine sampling) keeps the multimodality and aids best-of-N and expert iteration."
  takeaway_zh: "用滑窗示范训练的扩散策略往往每个状态只记住一个动作。在同一状态下向示范者查询 k 次（vine 采样）可保留其多模态分布，并提升 best-of-N 与专家迭代效果。"
- title: "SPARK: Simple Post-training for Adapting pRetrained Knowledge to Robot Control"
  type: paper
  arxiv: "2611.12102"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-10
  tags: [visual-representation, post-training, foundation-models]
  takeaway_en: "Post-trains a vision foundation model for robot control: a temporal-abstraction loss keeps action-relevant change, patch alignment to the original keeps semantics. Gains on several benchmarks and a real arm."
  takeaway_zh: "不从头预训练，而是对现成视觉基础模型做面向机器人控制的后训练：时间抽象目标保留与动作相关的变化，与原模型的 patch 级对齐保留其语义。在多个基准和真实机械臂上提升成功率与泛化。"
- title: "UniLatent: Cross-Embodiment Transfer via Latent Observation Alignment"
  type: paper
  arxiv: "2611.10061"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-10
  tags: [cross-embodiment, representation-alignment, sim-paired-data]
  takeaway_en: "Reuses demos across arms by aligning a source encoder to a frozen target encoder on sim-rendered paired views, no pixel translation. Up to 93% zero-shot in sim; real xArm→Franka 27/30 with 10 demos per task."
  takeaway_zh: "用仿真渲染的成对视角，把源机器人的视觉编码器对齐到冻结的目标编码器，无需像素级图像翻译即可跨机械臂复用示范。仿真零样本成功率最高 93%；真实 xArm→Franka 每任务仅用 10 条目标示范微调即 27/30 成功。"
- title: "Ego Guidance: Enhancing Robot Policy Learning with Action-Free Human Egocentric Videos"
  type: paper
  arxiv: "2611.13685"
  year: 2026
  project: https://llong-cs.github.io/EgoGuidance
  added: 2026-11-11
  topics: [vla]
  tags: [egocentric-video, action-free, mixture-of-transformers, future-prediction]
  takeaway_en: "SPAR adds future-visual-state prediction beside action prediction on a VLM, so action-free egocentric human video can train the policy. Reports better out-of-distribution robot performance as video data scales."
  takeaway_zh: "SPAR 在 VLM 上让未来视觉状态预测与动作预测并行（MoT 结构），使不含动作标注的第一人称人类视频也能训练策略。报告分布外机器人任务表现提升，且随视频数据量增加继续提升。"
- title: "HeMeR: Heterogeneous Memory Reconciliation for Embodied Agents via Structured KV Reuse"
  type: paper
  arxiv: "2611.16487"
  year: 2026
  venue: NeurIPS 2026
  added: 2026-11-13
  topics: [learning]
  tags: [memory, kv-cache, efficient-inference, embodied-agent, real]
  takeaway_en: "Keeps KV-cache states for memory contents (declarative, procedural, working) that did not change between decisions and recomputes only the rest. Real robot: 83.2% success, per-step time 2.94 → 1.87 s vs MemRL."
  takeaway_zh: "具身智能体的推理框架：在相邻决策之间保留未变化的记忆内容（陈述性、程序性、工作记忆）对应的 KV 缓存，只重算受更新影响的部分。真机任务成功率 83.2%，单步推理时间相比 MemRL 从 2.94 秒降至 1.87 秒。"
