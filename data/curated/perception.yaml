- title: "ORB-SLAM3: An Accurate Open-Source Library for Visual, Visual-Inertial and Multi-Map SLAM"
  type: paper
  arxiv: "2007.11898"
  year: 2020
  org: Universidad de Zaragoza
  highlight: true
  code: https://github.com/UZ-SLAMLab/ORB_SLAM3
  tags: [slam, visual-inertial, open-source]
  takeaway_en: The go-to feature-based SLAM library — monocular, stereo and RGB-D, with IMU fusion and multi-map relocalization.
  takeaway_zh: 最常用的特征点 SLAM 库：支持单目、双目与 RGB-D，可融合 IMU，并支持多地图重定位。
- title: "LIO-SAM: Tightly-coupled Lidar Inertial Odometry via Smoothing and Mapping"
  type: paper
  arxiv: "2007.00258"
  year: 2020
  org: MIT
  code: https://github.com/TixiaoShan/LIO-SAM
  tags: [lidar, odometry, factor-graph]
  takeaway_en: LiDAR-inertial odometry built on a factor graph, so GPS and loop closures slot in as extra factors.
  takeaway_zh: 基于因子图的激光-惯性里程计，GPS 与回环可以作为额外因子直接加入。
- title: "FAST-LIO2: Fast Direct LiDAR-inertial Odometry"
  type: paper
  arxiv: "2107.06829"
  year: 2021
  org: HKU MaRS Lab
  code: https://github.com/hku-mars/FAST_LIO
  tags: [lidar, odometry, real-time]
  takeaway_en: Registers raw LiDAR points directly to the map with an incremental k-d tree; fast enough for onboard drone and robot computers.
  takeaway_zh: 用增量 k-d 树把原始激光点直接配准到地图，速度足以在无人机和机器人机载计算机上运行。
- title: "DROID-SLAM: Deep Visual SLAM for Monocular, Stereo, and RGB-D Cameras"
  type: paper
  arxiv: "2108.10869"
  year: 2021
  org: Princeton
  code: https://github.com/princeton-vl/DROID-SLAM
  tags: [slam, learned, visual]
  takeaway_en: End-to-end learned visual SLAM — recurrent optical-flow updates plus a differentiable bundle-adjustment layer.
  takeaway_zh: 端到端学习的视觉 SLAM：循环光流更新加上可微分的光束法平差层。
- title: "Gaussian Splatting SLAM"
  type: paper
  arxiv: "2312.06741"
  year: 2023
  org: Imperial College London
  code: https://github.com/muskie82/MonoGS
  tags: [slam, gaussian-splatting, dense]
  takeaway_en: MonoGS — runs SLAM directly on a 3D Gaussian map, giving camera tracking and a photorealistic dense map from one camera.
  takeaway_zh: MonoGS：直接在三维高斯地图上做 SLAM，仅用单个相机即可同时完成相机跟踪与照片级稠密建图。
- title: "DUSt3R: Geometric 3D Vision Made Easy"
  type: paper
  arxiv: "2312.14132"
  year: 2023
  org: NAVER LABS Europe
  code: https://github.com/naver/dust3r
  tags: [3d-reconstruction, foundation-model]
  takeaway_en: Regresses 3D point maps straight from image pairs without known camera intrinsics or poses; started the "3D foundation model" wave.
  takeaway_zh: 不需要已知相机内参或位姿，直接从图像对回归三维点图，开启了“三维基础模型”这一方向。
- title: "VGGT: Visual Geometry Grounded Transformer"
  type: paper
  arxiv: "2503.11651"
  year: 2025
  org: Oxford VGG · Meta AI
  code: https://github.com/facebookresearch/vggt
  tags: [3d-reconstruction, foundation-model, feed-forward]
  takeaway_en: One feed-forward transformer predicts cameras, depth, point maps and tracks for many views at once, in about a second.
  takeaway_zh: 单个前馈 Transformer 一次性为多视角图像预测相机参数、深度、点图与跟踪，约一秒完成。
- title: "FoundationPose: Unified 6D Pose Estimation and Tracking of Novel Objects"
  type: paper
  arxiv: "2312.08344"
  year: 2023
  org: NVIDIA
  code: https://github.com/NVlabs/FoundationPose
  topics: [manipulation]
  tags: [6d-pose, tracking, zero-shot]
  takeaway_en: 6D pose estimation and tracking of unseen objects from a CAD model or a few reference images, with no per-object training.
  takeaway_zh: 只需 CAD 模型或少量参考图像即可对未见过的物体做 6D 位姿估计与跟踪，无需逐物体训练。
- title: "Depth Anything: Unleashing the Power of Large-Scale Unlabeled Data"
  type: paper
  arxiv: "2401.10891"
  year: 2024
  org: HKU · TikTok
  code: https://github.com/LiheYoung/Depth-Anything
  tags: [depth, monocular, foundation-model]
  takeaway_en: Monocular depth model trained on tens of millions of pseudo-labelled images; a common off-the-shelf depth prior for robots.
  takeaway_zh: 在数千万张伪标注图像上训练的单目深度模型，常被机器人系统直接拿来作为深度先验。
- title: "ConceptGraphs: Open-Vocabulary 3D Scene Graphs for Perception and Planning"
  type: paper
  arxiv: "2309.16650"
  year: 2023
  org: University of Toronto · MIT · Mila
  project: https://concept-graphs.github.io/
  topics: [navigation]
  tags: [scene-graph, open-vocabulary, llm]
  takeaway_en: Builds an object-level 3D scene graph labelled by vision-language models, which an LLM planner can query in natural language.
  takeaway_zh: 用视觉语言模型构建带语义标注的物体级三维场景图，大模型规划器可以用自然语言查询。
- title: "Segment Anything"
  type: paper
  arxiv: "2304.02643"
  year: 2023
  org: Meta AI
  venue: ICCV 2023
  highlight: true
  code: https://github.com/facebookresearch/segment-anything
  tags: [segmentation, foundation-model, promptable]
  takeaway_en: SAM — a promptable segmentation model (points, boxes, masks) trained on 1B+ masks; a standard building block for object masks in robot perception pipelines.
  takeaway_zh: SAM：可用点、框、掩码提示的分割模型，在 10 亿级掩码上训练；已成为机器人感知流程中获取物体掩码的常用基础组件。
- title: "SAM 2: Segment Anything in Images and Videos"
  type: paper
  arxiv: "2408.00714"
  year: 2024
  org: Meta AI
  venue: ICLR 2025
  code: https://github.com/facebookresearch/sam2
  tags: [segmentation, video, tracking]
  takeaway_en: Extends SAM to video with a streaming memory, so a mask prompted once is tracked across frames — handy for following objects during manipulation.
  takeaway_zh: 用流式记忆把 SAM 扩展到视频：一次提示得到的掩码可在后续帧中持续跟踪，适合在操作过程中跟随目标物体。
- title: "Grounding DINO: Marrying DINO with Grounded Pre-Training for Open-Set Object Detection"
  type: paper
  arxiv: "2303.05499"
  year: 2023
  org: IDEA Research · Tsinghua
  venue: ECCV 2024
  code: https://github.com/IDEA-Research/GroundingDINO
  tags: [open-vocabulary, detection, language-grounding]
  takeaway_en: Open-set detector that finds objects from a free-text prompt; often paired with SAM ("Grounded-SAM") to turn a language instruction into object masks.
  takeaway_zh: 开放集目标检测器，可根据任意文本提示找到物体；常与 SAM 组合（Grounded-SAM），把语言指令变成物体掩码。
- title: "FoundationStereo: Zero-Shot Stereo Matching"
  type: paper
  arxiv: "2501.09898"
  year: 2025
  org: NVIDIA
  venue: CVPR 2025
  code: https://github.com/NVlabs/FoundationStereo
  tags: [stereo, depth, zero-shot]
  takeaway_en: Stereo depth model trained on large synthetic data that reports strong zero-shot accuracy on real scenes — a drop-in depth source for stereo-camera robots.
  takeaway_zh: 在大规模合成数据上训练的双目深度模型，报告称在真实场景上零样本精度很强；可直接作为双目相机机器人的深度来源。
- title: "SpaRV: Sparse Radiance Voxels for Scalable Geometrically Consistent LiDAR-Visual Mapping and Rendering"
  type: paper
  arxiv: "2610.25665"
  year: 2026
  org: HKU MaRS Lab
  code: https://github.com/hku-mars/SpaRV
  added: 2026-10-20
  tags: [mapping, lidar, radiance-field]
  takeaway_en: A sparse-voxel radiance map built from LiDAR and camera data, aimed at robot logs — few viewpoints, imperfect poses and large scenes — while keeping geometry accurate and GPU memory in check.
  takeaway_zh: 用激光雷达与相机数据构建稀疏体素辐射场地图，针对机器人数据视角少、位姿有误差、场景大的问题，在保证几何精度的同时控制显存占用。
- title: "Vision as Proprioception: Estimating Humanoid Robot Pose from Video"
  type: paper
  arxiv: "2610.25288"
  year: 2026
  org: ETH Zurich
  code: https://github.com/eth-siplab/HumanoidPose
  added: 2026-10-20
  topics: [locomotion]
  tags: [humanoid, pose-estimation, video]
  takeaway_en: HumanoidPose recovers a humanoid's full-body joint configuration from video alone — useful when onboard state is unavailable, and for turning online robot videos into training data.
  takeaway_zh: HumanoidPose 仅凭视频恢复人形机器人的全身关节构型：适用于拿不到机载状态的场景，也能把网上的机器人视频变成训练数据。
- title: "Which Depth Estimator for Jetson AGX Orin? A 2026 Benchmark of Monocular and Stereo Methods"
  type: benchmark
  arxiv: "2610.27199"
  year: 2026
  code: https://github.com/nodarhub/orin-depth-benchmark
  added: 2026-10-21
  tags: [depth, stereo, edge, jetson, benchmark]
  takeaway_en: "Measured numbers for robot builders: nine monocular and stereo depth families (Depth Anything V2/3, Depth Pro, MoGe-2, Fast-FoundationStereo, ...) run on a Jetson AGX Orin, scored for metric accuracy and speed."
  takeaway_zh: 给机器人开发者的实测数据：在 Jetson AGX Orin 上用 TensorRT 运行九类单目与双目深度估计模型（Depth Anything V2/3、Depth Pro、MoGe-2、Fast-FoundationStereo 等），并评测度量精度与速度。
- title: "DINOv2: Learning Robust Visual Features without Supervision"
  type: paper
  arxiv: "2304.07193"
  year: 2023
  org: Meta AI
  venue: TMLR 2024
  code: https://github.com/facebookresearch/dinov2
  topics: [vla]
  tags: [self-supervised, vision-backbone, foundation-model]
  takeaway_en: Self-supervised image features that work frozen for depth, segmentation and retrieval; a common visual backbone in VLAs (e.g. OpenVLA) and latent world models.
  takeaway_zh: 自监督学习的图像特征，冻结即可用于深度估计、分割和检索；是 VLA（如 OpenVLA）和潜空间世界模型常用的视觉骨干。
- title: "CoTracker: It is Better to Track Together"
  type: paper
  arxiv: "2307.07635"
  year: 2023
  org: Meta AI · University of Oxford (VGG)
  venue: ECCV 2024
  code: https://github.com/facebookresearch/co-tracker
  tags: [point-tracking, video, transformer]
  takeaway_en: Transformer that tracks many video points jointly rather than one at a time, staying robust through occlusions; widely used to extract motion tracks from human or robot videos for policy learning.
  takeaway_zh: 联合跟踪视频中大量点（而非逐点独立跟踪）的 Transformer，遮挡下依然稳健；常用于从人类或机器人视频中提取运动轨迹来学习策略。
- title: "Grounding Image Matching in 3D with MASt3R"
  type: paper
  arxiv: "2406.09756"
  year: 2024
  org: NAVER LABS Europe
  venue: ECCV 2024
  code: https://github.com/naver/mast3r
  tags: [3d-reconstruction, image-matching, pointmap]
  takeaway_en: Extends DUSt3R with a dense local-feature head, so one network gives both 3D pointmaps and accurate pixel matches between views — useful for calibration-free reconstruction and localization.
  takeaway_zh: 在 DUSt3R 基础上加入稠密局部特征头，同一网络既输出三维点图又给出视角间精确的像素匹配，适用于免标定的三维重建与定位。
- title: "FAST-LIVO2: Fast, Direct LiDAR-Inertial-Visual Odometry"
  type: paper
  arxiv: "2408.14035"
  year: 2024
  org: HKU MaRS Lab
  code: https://github.com/hku-mars/FAST-LIVO2
  tags: [lidar, visual, odometry, sensor-fusion, real-time]
  takeaway_en: FAST-LIVO2 — fuses LiDAR, camera and IMU in one filter with direct (feature-free) updates for both sensors, sharing a single voxel map where image patches are attached to LiDAR points.
  takeaway_zh: FAST-LIVO2：在同一滤波器中融合激光雷达、相机与 IMU，两种传感器都采用直接法（无需提取特征）更新，并共用一张体素地图，图像块挂载在激光点上。
- title: "Depth Anything V2"
  type: paper
  arxiv: "2406.09414"
  year: 2024
  org: HKU, TikTok
  venue: NeurIPS 2024
  code: https://github.com/DepthAnything/Depth-Anything-V2
  tags: [monocular-depth, foundation-model, synthetic-data]
  takeaway_en: Trains a large teacher only on synthetic images with precise depth, then pseudo-labels many real images to train smaller students; gives sharper, more robust monocular depth than V1.
  takeaway_zh: 先只用深度精确的合成图像训练大教师模型，再给大量真实图像打伪标签来训练小模型；单目深度比 V1 更锐利、更鲁棒。
- title: "BundleSDF: Neural 6-DoF Tracking and 3D Reconstruction of Unknown Objects"
  type: paper
  arxiv: "2303.14158"
  year: 2023
  org: NVIDIA
  venue: CVPR 2023
  code: https://github.com/NVlabs/BundleSDF
  topics: [manipulation]
  tags: [real, 6d-pose, tracking, reconstruction, rgbd, model-free]
  takeaway_en: Tracks the 6-DoF pose of a never-seen object in RGB-D video while building its neural 3D model online, with no CAD model needed; useful for manipulating novel objects.
  takeaway_zh: 在 RGB-D 视频中跟踪从未见过物体的六自由度位姿，同时在线构建其神经三维模型，无需 CAD 模型；适用于操作新物体。
- title: "ACE-Brain-0.6: Scaling Spatial Grounding for Physical Foundation Models"
  type: paper
  arxiv: "2610.27040"
  year: 2026
  org: ACE Robotics
  code: https://github.com/DAXIAORobotics/ACE-Brain-0.6
  project: https://daxiaorobotics.github.io/ACE-Brain-0.6/
  added: 2026-10-24
  topics: [vla, manipulation]
  tags: [visual-grounding, vlm, embodied-brain, data-pipeline]
  takeaway_en: Fine-tunes Qwen3.5-9B on ~1.5M grounding samples auto-built from robot recordings plus other visual data; reports a 75.41 average over seven grounding benchmarks vs 73.68 for GPT-6 Astra.
  takeaway_zh: 用自动标注的机器人操作录像加多来源视觉数据构建约 150 万条可验证的定位监督，微调 Qwen3.5-9B；报告在七个公开视觉定位基准上平均 75.41 分，GPT-6 Astra 为 73.68。
