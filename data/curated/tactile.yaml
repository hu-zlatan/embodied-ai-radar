- title: "DIGIT: A Novel Design for a Low-Cost Compact High-Resolution Tactile Sensor with Application to In-Hand Manipulation"
  type: paper
  arxiv: "2005.14679"
  year: 2020
  org: Meta AI
  code: https://github.com/facebookresearch/digit-interface
  highlight: true
  topics: [hardware]
  tags: [real, sensor, vision-based-tactile, low-cost]
  takeaway_en: An inexpensive, compact GelSight-style fingertip sensor that made vision-based touch widely accessible.
  takeaway_zh: 低成本、紧凑的 GelSight 式指尖传感器，让视触觉传感器得以普及。
- title: "TACTO: A Fast, Flexible, and Open-source Simulator for High-Resolution Vision-based Tactile Sensors"
  type: paper
  arxiv: "2012.08456"
  year: 2020
  org: Meta AI
  code: https://github.com/facebookresearch/tacto
  topics: [sim]
  tags: [sim, vision-based-tactile]
  takeaway_en: Renders DIGIT/GelSight-style tactile images in simulation so touch-based policies can be trained at scale.
  takeaway_zh: 在仿真中渲染 DIGIT/GelSight 式触觉图像，便于大规模训练基于触觉的策略。
- title: "Sparsh: Self-supervised touch representations for vision-based tactile sensing"
  type: paper
  arxiv: "2410.24090"
  year: 2024
  org: Meta AI
  code: https://github.com/facebookresearch/sparsh
  tags: [representation, vision-based-tactile, open-weights]
  takeaway_en: Self-supervised encoders pretrained on many tactile images that work across different vision-based touch sensors.
  takeaway_zh: 在大量触觉图像上自监督预训练的编码器，可跨不同视触觉传感器使用。
- title: "Binding Touch to Everything: Learning Unified Multimodal Tactile Representations"
  type: paper
  arxiv: "2401.18084"
  year: 2024
  org: Yale, UMich
  tags: [representation, multimodal]
  takeaway_en: UniTouch aligns tactile signals with vision, language and audio embeddings, enabling zero-shot touch understanding.
  takeaway_zh: UniTouch 将触觉信号与视觉、语言、音频嵌入对齐，实现零样本触觉理解。
- title: "3D-ViTac: Learning Fine-Grained Manipulation with Visuo-Tactile Sensing"
  type: paper
  arxiv: "2410.24091"
  year: 2024
  org: Columbia, UIUC
  topics: [manipulation]
  tags: [real, bimanual, visuotactile, diffusion]
  takeaway_en: Fuses dense tactile arrays with 3D vision in a diffusion policy for fragile, contact-rich bimanual tasks.
  takeaway_zh: 在扩散策略中融合密集触觉阵列与 3D 视觉，完成易碎、接触丰富的双臂任务。
- title: "AnySkin: Plug-and-play Skin Sensing for Robotic Touch"
  type: paper
  arxiv: "2409.08276"
  year: 2024
  org: NYU, Meta AI
  topics: [hardware]
  tags: [real, sensor, magnetic-skin]
  takeaway_en: A replaceable magnetic tactile skin whose learned policies keep working after the skin is swapped.
  takeaway_zh: 可更换的磁性触觉皮肤，更换皮肤后训练好的策略仍能继续使用。
- title: "ReSkin: versatile, replaceable, lasting tactile skins"
  type: paper
  arxiv: "2111.00071"
  year: 2021
  org: CMU, Meta AI
  code: https://github.com/raunaqbhirangi/reskin_sensor
  topics: [hardware]
  tags: [sensor, magnetic-skin, low-cost]
  takeaway_en: A thin magnetic-elastomer skin read by magnetometers; cheap to make and swap, with learned calibration that carries over to new skins.
  takeaway_zh: 由磁力计读取的薄磁性弹性体皮肤，制作和更换成本低，学习得到的标定可迁移到新皮肤上。
- title: "Touch and Go: Learning from Human-Collected Vision and Touch"
  type: dataset
  arxiv: "2211.12498"
  year: 2022
  org: University of Michigan
  tags: [dataset, visuotactile, gelsight]
  takeaway_en: A dataset of paired video and GelSight touch collected by people probing objects in the wild, for cross-modal tactile learning.
  takeaway_zh: 由人手持 GelSight 在真实场景中触碰物体采集的视觉-触觉配对数据集，用于跨模态触觉学习。
- title: "Digitizing Touch with an Artificial Multimodal Fingertip"
  type: paper
  arxiv: "2411.02479"
  year: 2024
  org: Meta FAIR, TU Dresden, UC Berkeley
  code: https://github.com/facebookresearch/digit360
  topics: [hardware]
  tags: [real, sensor, vision-based-tactile, multimodal, open-source]
  takeaway_en: "Digit 360: an open-design, finger-shaped sensor that senses force, fine texture, vibration and heat, with an on-board neural accelerator for reflex-like local processing."
  takeaway_zh: Digit 360：开放设计的指尖形触觉传感器，可感知力、细微纹理、振动和温度，并用板载神经网络加速器做类似反射弧的本地处理。
- title: "Taxim: An Example-based Simulation Model for GelSight Tactile Sensors"
  type: simulator
  arxiv: "2109.04027"
  year: 2021
  org: CMU
  code: https://github.com/Robo-Touch/Taxim
  topics: [sim]
  tags: [simulator, gelsight, vision-based-tactile]
  takeaway_en: Simulates GelSight images from calibration examples (optical lookup + linear elastic deformation) instead of physics-based rendering, so tactile data can be generated quickly.
  takeaway_zh: 用标定样本（光学查找表 + 线弹性形变）而不是基于物理的渲染来模拟 GelSight 图像，可快速生成触觉数据。
- title: "Tactile Gym 2.0: Sim-to-real Deep Reinforcement Learning for Comparing Low-cost High-Resolution Robot Touch"
  type: simulator
  arxiv: "2207.10763"
  year: 2022
  org: University of Bristol
  code: https://github.com/dexterousrobot/tactile_gym
  topics: [sim, learning]
  tags: [simulator, sim-to-real, rl, tactip, digit]
  takeaway_en: Open-source tactile RL environments with sim-to-real transfer across three low-cost optical sensors (TacTip, DIGIT, DigiTac), for comparing them on the same tasks.
  takeaway_zh: 开源触觉强化学习环境，支持三种低成本光学触觉传感器（TacTip、DIGIT、DigiTac）的仿真到真机迁移，便于在相同任务上比较。
- title: "GelSlim 3.0: High-Resolution Measurement of Shape, Force and Slip in a Compact Tactile-Sensing Finger"
  type: paper
  arxiv: "2103.12269"
  year: 2021
  org: MIT
  topics: [hardware]
  tags: [gelsight, sensor-design, finger, force, slip]
  takeaway_en: A slim GelSight-style finger that measures contact shape, force and slip at high resolution, designed to fit robot grippers.
  takeaway_zh: 纤薄的 GelSight 类触觉手指，可高分辨率测量接触形状、力与滑移，便于装在机器人夹爪上。
- title: "DTact: A Vision-Based Tactile Sensor that Measures High-Resolution 3D Geometry Directly from Darkness"
  type: paper
  arxiv: "2209.13916"
  year: 2022
  topics: [hardware]
  tags: [sensor-design, low-cost, 3d-geometry, open-source]
  takeaway_en: A low-cost visuotactile sensor that reads contact depth from how dark each pixel gets as the gel is pressed, giving high-resolution 3D geometry without photometric stereo.
  takeaway_zh: 低成本视觉触觉传感器：根据凝胶受压时每个像素变暗的程度直接读出接触深度，无需光度立体即可获得高分辨率三维形状。
- title: "9DTact: A Compact Vision-Based Tactile Sensor for Accurate 3D Shape Reconstruction and Generalizable 6D Force Estimation"
  type: paper
  arxiv: "2308.14277"
  year: 2023
  code: https://github.com/linchangyi1/9DTact
  topics: [hardware]
  tags: [sensor-design, open-source, force, 3d-geometry]
  takeaway_en: Successor to DTact - a compact open-source visuotactile sensor that reconstructs 3D contact shape and estimates 6D force/torque with a model that generalizes to unseen objects.
  takeaway_zh: DTact 的后续：紧凑的开源视觉触觉传感器，可重建三维接触形状，并用可泛化到新物体的模型估计六维力/力矩。
- title: "Making Sense of Vision and Touch: Self-Supervised Learning of Multimodal Representations for Contact-Rich Tasks"
  type: paper
  arxiv: "1810.10191"
  year: 2018
  venue: ICRA 2019
  org: Stanford
  code: https://github.com/stanford-iprl-lab/multimodal_representation
  topics: [manipulation, learning]
  tags: [real, visuotactile, force-torque, representation, rl]
  takeaway_en: Learns a compact vision + force/torque representation with self-supervised objectives, then trains a peg-insertion policy with RL on top of it on a real robot.
  takeaway_zh: 用自监督目标学习视觉 + 力/力矩的紧凑联合表征，再在其上用强化学习在真实机器人上训练插孔策略。
- title: "See, Hear, and Feel: Smart Sensory Fusion for Robotic Manipulation"
  type: paper
  arxiv: "2212.03858"
  year: 2022
  venue: CoRL 2022
  org: Stanford
  code: https://github.com/JunzheJosephZhu/see_hear_feel
  topics: [manipulation]
  tags: [real, visuotactile, audio, multimodal, imitation-learning]
  takeaway_en: Fuses camera, contact microphone and GelSight touch with self-attention in an imitation-learned policy, studied on dense packing and pouring tasks.
  takeaway_zh: 在模仿学习策略中用自注意力融合相机、接触麦克风和 GelSight 触觉，在密集装箱与倾倒任务上做了研究。
- title: "A Touch, Vision, and Language Dataset for Multimodal Alignment"
  type: paper
  arxiv: "2402.13232"
  year: 2024
  venue: ICML 2024
  org: UC Berkeley
  code: https://github.com/Max-Fu/tvl
  topics: [datasets]
  tags: [dataset, vision-based-tactile, language, representation]
  takeaway_en: TVL pairs tactile and visual observations with language descriptions and trains a touch-vision-language encoder plus a model that describes how things feel.
  takeaway_zh: TVL 数据集将触觉与视觉观测配上语言描述，并训练触觉-视觉-语言编码器以及能描述物体触感的模型。
- title: "General In-Hand Object Rotation with Vision and Touch"
  type: paper
  arxiv: "2309.09979"
  year: 2023
  venue: CoRL 2023
  org: UC Berkeley, Meta AI
  topics: [manipulation]
  tags: [dexterous-hand, visuotactile, sim2real, rl]
  takeaway_en: RotateIt trains in simulation with privileged object information, then distills to a policy that rotates diverse objects in hand using vision, touch and proprioception on a real hand.
  takeaway_zh: RotateIt 先在仿真中利用特权物体信息训练，再蒸馏为仅用视觉、触觉和本体感觉的策略，在真实灵巧手上旋转多种物体。
- title: "TacSL: A Library for Visuotactile Sensor Simulation and Learning"
  type: paper
  arxiv: "2408.06506"
  year: 2024
  org: NVIDIA
  topics: [sim]
  tags: [sim, gpu, vision-based-tactile, sim2real]
  takeaway_en: GPU-based simulation of GelSight-style tactile images and contact forces in Isaac Gym, plus learning tools for sim-to-real transfer of visuotactile policies.
  takeaway_zh: 在 Isaac Gym 中用 GPU 模拟 GelSight 式触觉图像与接触力，并提供用于视触觉策略仿真到真实迁移的学习工具。
- title: "Rotating without Seeing: Towards In-hand Dexterity through Touch"
  type: paper
  arxiv: "2303.10880"
  year: 2023
  venue: RSS 2023
  org: UC San Diego
  project: https://touchdexterity.github.io
  topics: [manipulation]
  tags: [dexterous-hand, binary-touch, low-cost, sim2real, rl]
  takeaway_en: Covers a robot hand with cheap binary (contact / no contact) touch sensors and trains an RL policy in simulation that rotates unseen objects in hand on a real robot without any vision.
  takeaway_zh: 在灵巧手上铺设廉价的二值（有/无接触）触觉传感器，在仿真中用强化学习训练策略，迁移到真机后无需视觉即可在手中旋转未见过的物体。
- title: "Robot Synesthesia: In-Hand Manipulation with Visuotactile Sensing"
  type: paper
  arxiv: "2312.01853"
  year: 2023
  org: UC San Diego
  project: https://yingyuan0414.github.io/visuotactile/
  topics: [manipulation]
  tags: [dexterous-hand, visuotactile, point-cloud, sim2real, rl]
  takeaway_en: Turns tactile readings into points in the same 3D frame as the camera point cloud and the hand model, so one visuotactile point-cloud input drives in-hand object rotation.
  takeaway_zh: 将触觉读数转换为与相机点云、手部模型处于同一三维坐标系的点，用统一的视触觉点云输入驱动手内物体旋转。
- title: "Neural feels with neural fields: Visuo-tactile perception for in-hand manipulation"
  type: paper
  arxiv: "2312.13469"
  year: 2023
  venue: Science Robotics 2024
  org: Meta AI, CMU
  code: https://github.com/facebookresearch/neuralfeels
  topics: [perception, manipulation]
  tags: [visuotactile, neural-fields, pose-tracking, dexterous-hand]
  takeaway_en: NeuralFeels fuses vision and touch from a multi-fingered hand into an online neural field, reconstructing an object's shape and tracking its pose while the hand manipulates it.
  takeaway_zh: NeuralFeels 将多指手的视觉与触觉在线融合为神经场，在操作过程中同时重建物体形状并跟踪其位姿。
- title: "Reactive Diffusion Policy: Slow-Fast Visual-Tactile Policy Learning for Contact-Rich Manipulation"
  type: paper
  arxiv: "2503.02881"
  year: 2025
  venue: RSS 2025
  org: SJTU, Tsinghua
  code: https://github.com/xiaoxiaoxh/reactive_diffusion_policy
  project: https://reactive-diffusion-policy.github.io/
  topics: [manipulation, learning]
  tags: [visuotactile, force, diffusion-policy, teleoperation, real]
  takeaway_en: A slow latent diffusion policy plans action chunks while a fast policy reacts to tactile/force feedback; reports >35% higher scores than visual imitation baselines on three contact-rich tasks.
  takeaway_zh: 慢速扩散策略在隐空间规划动作块，快速策略根据触觉/力反馈高频调整；论文报告在三个接触丰富任务上比纯视觉模仿学习基线总分高 35% 以上。
