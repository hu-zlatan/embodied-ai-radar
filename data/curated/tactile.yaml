- title: "DIGIT: A Novel Design for a Low-Cost Compact High-Resolution Tactile Sensor with Application to In-Hand Manipulation"
  type: paper
  arxiv: "2005.14679"
  year: 2020
  org: Meta AI
  code: https://github.com/facebookresearch/digit-interface
  highlight: true
  topics: [hardware]
  tags: [real, sensor, vision-based-tactile, low-cost]
  takeaway_en: An inexpensive, compact GelSight-style fingertip sensor that made vision-based touch widely accessible.
  takeaway_zh: 低成本、紧凑的 GelSight 式指尖传感器，让视触觉传感器得以普及。
- title: "TACTO: A Fast, Flexible, and Open-source Simulator for High-Resolution Vision-based Tactile Sensors"
  type: paper
  arxiv: "2012.08456"
  year: 2020
  org: Meta AI
  code: https://github.com/facebookresearch/tacto
  topics: [sim]
  tags: [sim, vision-based-tactile]
  takeaway_en: Renders DIGIT/GelSight-style tactile images in simulation so touch-based policies can be trained at scale.
  takeaway_zh: 在仿真中渲染 DIGIT/GelSight 式触觉图像，便于大规模训练基于触觉的策略。
- title: "Sparsh: Self-supervised touch representations for vision-based tactile sensing"
  type: paper
  arxiv: "2410.24090"
  year: 2024
  org: Meta AI
  code: https://github.com/facebookresearch/sparsh
  tags: [representation, vision-based-tactile, open-weights]
  takeaway_en: Self-supervised encoders pretrained on many tactile images that work across different vision-based touch sensors.
  takeaway_zh: 在大量触觉图像上自监督预训练的编码器，可跨不同视触觉传感器使用。
- title: "Binding Touch to Everything: Learning Unified Multimodal Tactile Representations"
  type: paper
  arxiv: "2401.18084"
  year: 2024
  org: Yale, UMich
  tags: [representation, multimodal]
  takeaway_en: UniTouch aligns tactile signals with vision, language and audio embeddings, enabling zero-shot touch understanding.
  takeaway_zh: UniTouch 将触觉信号与视觉、语言、音频嵌入对齐，实现零样本触觉理解。
- title: "3D-ViTac: Learning Fine-Grained Manipulation with Visuo-Tactile Sensing"
  type: paper
  arxiv: "2410.24091"
  year: 2024
  org: Columbia, UIUC
  topics: [manipulation]
  tags: [real, bimanual, visuotactile, diffusion]
  takeaway_en: Fuses dense tactile arrays with 3D vision in a diffusion policy for fragile, contact-rich bimanual tasks.
  takeaway_zh: 在扩散策略中融合密集触觉阵列与 3D 视觉，完成易碎、接触丰富的双臂任务。
- title: "AnySkin: Plug-and-play Skin Sensing for Robotic Touch"
  type: paper
  arxiv: "2409.08276"
  year: 2024
  org: NYU, Meta AI
  topics: [hardware]
  tags: [real, sensor, magnetic-skin]
  takeaway_en: A replaceable magnetic tactile skin whose learned policies keep working after the skin is swapped.
  takeaway_zh: 可更换的磁性触觉皮肤，更换皮肤后训练好的策略仍能继续使用。
- title: "ReSkin: versatile, replaceable, lasting tactile skins"
  type: paper
  arxiv: "2111.00071"
  year: 2021
  org: CMU, Meta AI
  code: https://github.com/raunaqbhirangi/reskin_sensor
  topics: [hardware]
  tags: [sensor, magnetic-skin, low-cost]
  takeaway_en: A thin magnetic-elastomer skin read by magnetometers; cheap to make and swap, with learned calibration that carries over to new skins.
  takeaway_zh: 由磁力计读取的薄磁性弹性体皮肤，制作和更换成本低，学习得到的标定可迁移到新皮肤上。
- title: "Touch and Go: Learning from Human-Collected Vision and Touch"
  type: dataset
  arxiv: "2211.12498"
  year: 2022
  org: University of Michigan
  tags: [dataset, visuotactile, gelsight]
  takeaway_en: A dataset of paired video and GelSight touch collected by people probing objects in the wild, for cross-modal tactile learning.
  takeaway_zh: 由人手持 GelSight 在真实场景中触碰物体采集的视觉-触觉配对数据集，用于跨模态触觉学习。
- title: "Digitizing Touch with an Artificial Multimodal Fingertip"
  type: paper
  arxiv: "2411.02479"
  year: 2024
  org: Meta FAIR, TU Dresden, UC Berkeley
  code: https://github.com/facebookresearch/digit360
  topics: [hardware]
  tags: [real, sensor, vision-based-tactile, multimodal, open-source]
  takeaway_en: "Digit 360: an open-design, finger-shaped sensor that senses force, fine texture, vibration and heat, with an on-board neural accelerator for reflex-like local processing."
  takeaway_zh: Digit 360：开放设计的指尖形触觉传感器，可感知力、细微纹理、振动和温度，并用板载神经网络加速器做类似反射弧的本地处理。
- title: "Taxim: An Example-based Simulation Model for GelSight Tactile Sensors"
  type: simulator
  arxiv: "2109.04027"
  year: 2021
  org: CMU
  code: https://github.com/Robo-Touch/Taxim
  topics: [sim]
  tags: [simulator, gelsight, vision-based-tactile]
  takeaway_en: Simulates GelSight images from calibration examples (optical lookup + linear elastic deformation) instead of physics-based rendering, so tactile data can be generated quickly.
  takeaway_zh: 用标定样本（光学查找表 + 线弹性形变）而不是基于物理的渲染来模拟 GelSight 图像，可快速生成触觉数据。
- title: "Tactile Gym 2.0: Sim-to-real Deep Reinforcement Learning for Comparing Low-cost High-Resolution Robot Touch"
  type: simulator
  arxiv: "2207.10763"
  year: 2022
  org: University of Bristol
  code: https://github.com/dexterousrobot/tactile_gym
  topics: [sim, learning]
  tags: [simulator, sim-to-real, rl, tactip, digit]
  takeaway_en: Open-source tactile RL environments with sim-to-real transfer across three low-cost optical sensors (TacTip, DIGIT, DigiTac), for comparing them on the same tasks.
  takeaway_zh: 开源触觉强化学习环境，支持三种低成本光学触觉传感器（TacTip、DIGIT、DigiTac）的仿真到真机迁移，便于在相同任务上比较。
- title: "GelSlim 3.0: High-Resolution Measurement of Shape, Force and Slip in a Compact Tactile-Sensing Finger"
  type: paper
  arxiv: "2103.12269"
  year: 2021
  org: MIT
  topics: [hardware]
  tags: [gelsight, sensor-design, finger, force, slip]
  takeaway_en: A slim GelSight-style finger that measures contact shape, force and slip at high resolution, designed to fit robot grippers.
  takeaway_zh: 纤薄的 GelSight 类触觉手指，可高分辨率测量接触形状、力与滑移，便于装在机器人夹爪上。
- title: "DTact: A Vision-Based Tactile Sensor that Measures High-Resolution 3D Geometry Directly from Darkness"
  type: paper
  arxiv: "2209.13916"
  year: 2022
  topics: [hardware]
  tags: [sensor-design, low-cost, 3d-geometry, open-source]
  takeaway_en: A low-cost visuotactile sensor that reads contact depth from how dark each pixel gets as the gel is pressed, giving high-resolution 3D geometry without photometric stereo.
  takeaway_zh: 低成本视觉触觉传感器：根据凝胶受压时每个像素变暗的程度直接读出接触深度，无需光度立体即可获得高分辨率三维形状。
- title: "9DTact: A Compact Vision-Based Tactile Sensor for Accurate 3D Shape Reconstruction and Generalizable 6D Force Estimation"
  type: paper
  arxiv: "2308.14277"
  year: 2023
  code: https://github.com/linchangyi1/9DTact
  topics: [hardware]
  tags: [sensor-design, open-source, force, 3d-geometry]
  takeaway_en: Successor to DTact - a compact open-source visuotactile sensor that reconstructs 3D contact shape and estimates 6D force/torque with a model that generalizes to unseen objects.
  takeaway_zh: DTact 的后续：紧凑的开源视觉触觉传感器，可重建三维接触形状，并用可泛化到新物体的模型估计六维力/力矩。
