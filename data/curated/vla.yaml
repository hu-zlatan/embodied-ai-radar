  takeaway_zh: "CoRL 2026 Oral。可引导的通用基础模型：在未见环境中执行多样指令，跨形态零样本完成叠衣等任务，无需任务专用微调。"

- title: "TEMPO: Learning Temporal Context for Dynamic Robot Manipulation"
  type: paper
  arxiv: "2609.16864"
  code: https://github.com/tempo-robot/TEMPO
  year: 2026
  venue: CoRL 2026
  project: https://tempo-robot.github.io/
