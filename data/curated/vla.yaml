  topics: [manipulation]
  tags: [vla, inference-speed, action-chunking, real, sim]
  takeaway_en: "Lets a VLA pick, at each step, between fine and temporally coarser action decoders: redundant motion runs faster while precision phases stay fine-grained. Tested on 3 sim benchmarks and 6 real tasks."
  takeaway_zh: "让 VLA 在每一步自行选择细粒度或时间上更粗的动作解码器：冗余动作阶段加速执行，精细接触阶段保持细粒度控制；在 3 个仿真基准和 6 个真实任务上验证效率提升且成功率不降。"
- title: "OmniBrain-0: A Unified Agentic Model for Embodied Intelligence"
