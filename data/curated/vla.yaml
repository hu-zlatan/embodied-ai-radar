  added: 2026-10-27
  topics: [manipulation]
  tags: [deployment, inference, flow-matching, training-free, sim, real, arm]
  takeaway_en: "Deployment knob for flow-matching VLAs: fewer solver steps hurt under fast replanning but help with long open-loop chunks. Tuning both together, training-free, reports higher success and lower latency for π0/π0.5/GR00T."
  takeaway_zh: 流匹配 VLA 的部署调参发现：求解步数少在频繁重规划时会降低精度，但在长时开环执行动作块时反而有利。报告在 π0、π0.5、GR00T 上联合调整两者，无需训练即可提高成功率并降低推理延迟。
- title: "Profiling a Frontier Agent with EBench: From Direct Control to Harness with Policy"
  type: paper
  arxiv: "2610.35832"
