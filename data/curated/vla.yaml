  takeaway_zh: "CoRL 2026 Oral。指出 VLA 难以应对动态任务，是因为单帧观测带来运动歧义与状态混淆，并通过学习时序上下文同时解决这两个问题。"

- title: "MEM: Multi-Scale Embodied Memory for Vision Language Action Models"
  type: paper
  arxiv: "2603.03596"
  year: 2026
  venue: CoRL 2026
  org: Physical Intelligence
  project: https://pi.website/research/memory
  added: 2026-11-02
