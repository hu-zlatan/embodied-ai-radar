  code: https://github.com/MINT-SJTU/MorphAct
  project: https://mint-sjtu.github.io/MorphAct.io/
  added: 2026-10-24
  topics: [vla, learning]
  tags: [lora, contextual-parameters, multi-task, sim, real]
  takeaway_en: Instead of one fixed set of VLA weights, generates context-dependent low-rank updates for both the vision-language and action modules; reports gains up to 16.3% on LIBERO/Meta-World and up to 14% over π0.5 on real tasks.
  takeaway_zh: 不再让 VLA 在所有交互情境下共用固定参数，而是按当前情境为视觉语言模块和动作模块生成耦合的低秩参数更新；报告在 LIBERO/Meta-World 上最高提升 16.3%，真机上相对 π0.5 最高提升 14%。
- title: "CarryOn: A Dual-Loop Harness for Personalized and Reliable Robot Assistance"
  type: paper
  arxiv: "2610.21453"
  year: 2026
  code: https://github.com/JIA-Lab-research/CarryOn
  project: https://vincent2311.github.io/Projects/CarryOn/
  added: 2026-10-24
  topics: [vla, manipulation]
  tags: [agentic, harness, personalization, safety, failure-recovery, sim, real]
  takeaway_en: Wraps a frozen VLA in two loops — one keeps user preferences and scene memory for planning, one blocks hazardous actions and calls recovery skills; reports violations down from 52.6% to 6.1%, recovery up from 13% to 80%.
  takeaway_zh: 给冻结的 VLA 套上双环框架：规划环保存用户偏好与场景记忆以做个性化任务分解，执行环拦截危险接触并调用可复用的恢复技能；报告安全违规率从 52.6% 降到 6.1%，失败恢复成功率从 13% 提升到 80%。
- title: "Towards Agentic Robots: Model, Data, Environment, and Harness"
  type: paper
  arxiv: "2610.20442"
  year: 2026
  project: https://github.com/chonghanqin/Awesome-Agentic-Robots
  added: 2026-10-24
  tags: [survey, agentic, awesome-list, world-action-model]
  takeaway_en: Survey of 'agentic robots' — foundation-model agents that plan, collect data, build environments and recover from errors — organised into 17 categories under model, data, environment and harness; companion paper list.
  takeaway_zh: 关于"智能体化机器人"的综述：基础模型智能体负责规划、采集与筛选数据、构建环境与测试并自主纠错；把相关研究归为模型、数据、环境、执行框架四大领域下的 17 个类别，附配套论文列表。
- title: "Multimodal Embodied Agents: A Unified Capability-centric Perspective from Computer-Use to Robot-Use"
  type: paper
  arxiv: "2610.30108"
  year: 2026
  org: Show Lab, National University of Singapore
  project: https://github.com/showlab/Awesome-Multimodal-Embodied-Agent
  added: 2026-10-25
  tags: [survey, agentic, awesome-list, benchmark]
  takeaway_en: Survey framing computer-use and robot agents with five functions — perceive, anticipate, plan, act, verify; across 64 benchmarks it finds only 5 test anticipation and 3 test verification. Companion paper list.
  takeaway_zh: 用"感知、预判、规划、执行、验证"五种能力统一看待电脑操作智能体和机器人智能体的综述；统计 64 个基准后发现只有 5 个评测预判、3 个评测验证。附配套论文列表。
- title: "MolmoAct: Action Reasoning Models that can Reason in Space"
  type: paper
  arxiv: "2508.07917"
  year: 2025
  org: Ai2, University of Washington
  code: https://github.com/allenai/molmoact
  project: https://allenai.org/blog/molmoact
  tags: [real, arm, vlm, open-weights, reasoning, spatial]
  takeaway_en: An open 7B VLA that first outputs depth-aware perception tokens, then an editable 2D trajectory, then actions; reports 70.5% zero-shot on SimplerEnv and 86.6% on LIBERO, with weights, code and data released.
  takeaway_zh: 开源 7B VLA，先输出深度感知 token，再生成可编辑的二维轨迹，最后输出动作；论文报告 SimplerEnv 零样本 70.5%、LIBERO 86.6%，并开放权重、代码和数据。
- title: "GraspVLA: a Grasping Foundation Model Pre-trained on Billion-scale Synthetic Action Data"
  type: paper
  arxiv: "2505.03233"
  year: 2025
  org: Peking University (PKU-EPIC)
  venue: CoRL 2025
  code: https://github.com/PKU-EPIC/GraspVLA
  topics: [manipulation, sim]
  tags: [sim2real, arm, grasping, synthetic-data, flow-matching]
  takeaway_en: Pretrains a grasping VLA almost only on SynGrasp-1B, a billion-frame photorealistic sim dataset, co-trained with web data; reports zero-shot sim-to-real open-vocabulary grasping and few-shot adaptation.
  takeaway_zh: 几乎只用十亿帧级的照片级仿真抓取数据集 SynGrasp-1B（并联合网络语义数据）预训练抓取 VLA；论文报告可零样本从仿真迁移到真实开放词汇抓取，并支持少样本适配。
- title: "π*0.6: a VLA That Learns From Experience"
  type: paper
  arxiv: "2511.14759"
  year: 2025
  org: Physical Intelligence
  venue: RSS 2026
  project: https://pi.website/blog/pistar06
  highlight: true
  topics: [learning]
  tags: [real, arm, mobile-manipulation, rl, offline-rl, interventions]
  takeaway_en: "RECAP trains a VLA with RL via advantage conditioning on demos, on-robot rollouts and teleop corrections; reports it more than doubles throughput on hard tasks like laundry folding and espresso making."
  takeaway_zh: RECAP 通过优势条件化，用演示、机器人自主运行数据和遥操作纠正对 VLA 做强化学习；论文报告在叠衣服、做意式咖啡等难任务上吞吐量提升一倍以上、失败率约减半。
- title: "X-VLA: Soft-Prompted Transformer as Scalable Cross-Embodiment Vision-Language-Action Model"
  type: paper
  arxiv: "2510.10274"
  year: 2025
  org: Tsinghua AIR, Shanghai AI Lab
  venue: ICLR 2026
  code: https://github.com/2toinf/X-VLA
  project: https://thu-air-dream.github.io/X-VLA/
  tags: [real, sim, cross-embodiment, flow-matching, open-weights]
  takeaway_en: Gives each data source its own small set of learnable soft-prompt embeddings, so one plain-Transformer flow-matching policy (0.9B) trains across embodiments; evaluated on 6 sim benchmarks and 3 real robots.
  takeaway_zh: 为每个数据来源配一组可学习的软提示嵌入，使一个基于标准 Transformer 的流匹配策略（0.9B）能跨本体联合训练；在 6 个仿真基准和 3 台真实机器人上评测。
- title: "InternVLA-M1: A Spatially Guided Vision-Language-Action Framework for Generalist Robot Policy"
  type: paper
  arxiv: "2510.13778"
  year: 2025
  org: Shanghai AI Lab (Intern Robotics)
  code: https://github.com/InternRobotics/InternVLA-M1
  tags: [real, sim, arm, spatial, grounding, synthetic-data]
  takeaway_en: Pretrains spatial grounding on 2.3M samples ('where to act'), then post-trains actions with spatial prompts ('how to act'); reports +14.6% on SimplerEnv Google Robot over the same model without spatial guidance.
  takeaway_zh: 先在 230 万条空间推理样本上做空间定位预训练（"在哪里做"），再用空间提示做动作后训练（"怎么做"）；论文报告在 SimplerEnv Google Robot 上比无空间引导的同一模型高 14.6%。
- title: "Magma: A Foundation Model for Multimodal AI Agents"
  type: paper
  arxiv: "2502.13130"
  year: 2025
  org: Microsoft Research
  venue: CVPR 2025
  code: https://github.com/microsoft/Magma
  project: https://microsoft.github.io/Magma
  tags: [real, sim, arm, vlm, agents, open-weights]
  takeaway_en: One model for UI navigation and robot manipulation, pretrained on images, videos and robot data labelled with Set-of-Mark (what to act on) and Trace-of-Mark (how things move); model and code are public.
  takeaway_zh: 同一个模型同时做界面操作与机器人操作：在图像、视频和机器人数据上预训练，用 Set-of-Mark 标注可操作对象、用 Trace-of-Mark 标注运动轨迹；模型与代码公开。
- title: "Being-H0: Vision-Language-Action Pretraining from Large-Scale Human Videos"
  type: paper
  arxiv: "2507.15597"
  year: 2025
  org: BeingBeyond
  venue: ICML 2026
  code: https://github.com/BeingBeyond/Being-H0
  project: https://beingbeyond.github.io/Being-H0
  topics: [manipulation]
  tags: [real, dexterous-hand, human-video, motion-tokenization]
  takeaway_en: A dexterous VLA pretrained on human hand motion from mocap, VR and RGB video ('physical instruction tuning'), with part-level motion tokens, then aligned to 3D space and post-trained for real robot hands.
  takeaway_zh: 灵巧手 VLA：先在动捕、VR 与普通视频中的人手动作上预训练（"物理指令微调"），使用部件级动作 token，再做三维空间对齐，并针对真实机器人灵巧手后训练。
- title: "Igniting VLMs toward the Embodied Space"
  type: paper
  arxiv: "2509.11766"
  year: 2025
  org: X Square Robot
  code: https://github.com/X-Square-Robot/wall-x
  tags: [real, arm, vlm, reasoning, open-weights]
  takeaway_en: "WALL-OSS: an open embodied foundation model that links instruction reasoning, subgoal decomposition and action generation in one differentiable model ('unified cross-level CoT'); training code and checkpoints are public."
  takeaway_zh: WALL-OSS：开源具身基础模型，在同一可微模型中串联指令推理、子目标分解与细粒度动作生成（"统一跨层级思维链"）；训练代码与模型权重已开源。
- title: "Scaling Proprioceptive-Visual Learning with Heterogeneous Pre-trained Transformers"
  type: paper
  arxiv: "2409.20537"
  year: 2024
  org: MIT
  venue: NeurIPS 2024
  code: https://github.com/liruiw/HPT
  project: https://liruiw.github.io/hpt/
  topics: [learning]
  tags: [real, sim, cross-embodiment, pretraining, open-weights]
  takeaway_en: "HPT: per-robot stems turn proprioception and vision into a few tokens for one shared transformer trunk, pretrained on 52 datasets (robot, sim, human video); reports 20%+ gains on unseen tasks."
  takeaway_zh: HPT：为每种机器人设计“输入头”，把本体感知与视觉映射成短 token 序列，送入共享的 Transformer 主干；在 52 个数据集（真机、仿真、人类视频）上预训练，报告在未见任务上微调提升 20% 以上。
- title: "Latent Action Pretraining from Videos"
  type: paper
  arxiv: "2410.11758"
  year: 2024
  org: KAIST / UW / Microsoft Research / NVIDIA
  venue: ICLR 2025
  code: https://github.com/LatentActionPretraining/LAPA
  project: https://latentactionpretraining.github.io/
  topics: [learning]
  tags: [real, sim, arm, latent-actions, human-video, pretraining]
  takeaway_en: "LAPA pretrains a VLA without action labels: it learns discrete latent actions between video frames, predicts them from image + text, then maps them to robot actions; reports beating OpenVLA on real tasks."
  takeaway_zh: LAPA 无需动作标注即可预训练 VLA：先从视频相邻帧间学习离散隐动作，再训练模型由图像和指令预测隐动作，最后用少量机器人数据映射到真实动作；报告在真机任务上优于 OpenVLA。
- title: "HAMSTER: Hierarchical Action Models for Open-World Robot Manipulation"
  type: paper
  arxiv: "2502.05485"
  year: 2025
  org: NVIDIA / UW / USC
  venue: ICLR 2025
  project: https://hamster-robo.github.io/
  topics: [manipulation]
  tags: [real, arm, hierarchical, vlm-planner, 2d-paths]
  takeaway_en: A hierarchical VLA in which a fine-tuned VLM draws a coarse 2D path for the end effector on the image and a low-level 3D policy follows it, so the VLM can be trained on cheap off-domain data such as sim or videos.
  takeaway_zh: 分层 VLA：微调后的 VLM 在图像上画出末端执行器的粗略二维路径，再由底层三维策略跟随执行；因此 VLM 可以用仿真、视频等低成本的非本域数据训练。
- title: "3D-VLA: A 3D Vision-Language-Action Generative World Model"
  type: paper
  arxiv: "2403.09631"
  year: 2024
  org: UMass Amherst / MIT
  venue: ICML 2024
  code: https://github.com/UMass-Embodied-AGI/3D-VLA
  project: https://vis-www.cs.umass.edu/3dvla
  topics: [world-models]
  tags: [3d, point-cloud, goal-generation, dataset]
  takeaway_en: A 3D-aware LLM with scene, object and action tokens, aligned with diffusion models so it can imagine goal images and point clouds before planning actions; trained on ~2M 3D-language-action pairs the authors assembled.
  takeaway_zh: 具备三维感知的大语言模型，引入场景、物体与动作交互 token，并与扩散模型对齐，可在规划动作前“想象”目标图像和点云；训练数据为作者整理的约 200 万条三维-语言-动作样本。
- title: "RynnBrain: Open Embodied Foundation Models"
  type: paper
  arxiv: "2602.14979"
  year: 2026
  org: Alibaba DAMO Academy
  code: https://github.com/alibaba-damo-academy/RynnBrain
  project: https://alibaba-damo-academy.github.io/RynnBrain.github.io
  topics: [perception, navigation]
  tags: [vlm, embodied-brain, spatiotemporal, planning, open-weights]
  takeaway_en: Open spatiotemporal embodied foundation models (2B, 8B, 30B-A3B MoE) for egocentric understanding, localization, grounded reasoning and planning, plus post-trained Nav, Plan, VLA and CoP variants.
  takeaway_zh: 开源时空具身基础模型（2B、8B 与 30B-A3B MoE），覆盖第一视角理解、时空定位、物理落地推理与规划，并提供导航、规划、VLA、CoP 等后训练版本。
- title: "Full-Weight VLA Fine-Tuning Without an fp32 Master Copy Silently Erases Most Updates"
  type: paper
  arxiv: "2610.31859"
  year: 2026
  added: 2026-10-26
  topics: [learning]
  tags: [fine-tuning, training-recipe, mixed-precision, sim]
  takeaway_en: "Practical warning: fine-tuning VLA weights in bf16 without an fp32 master copy rounds away AdamW updates below 1/512 of a weight; finds this recipe in 9 of 12 open VLA codebases and 79%+ of updates lost on LIBERO."
  takeaway_zh: 实用警示：VLA 权重以 bf16 微调且不保留 fp32 主副本时，小于权重 1/512 的 AdamW 更新会被舍入抹掉；报告 12 个开源 VLA 代码库中 9 个的默认或文档配方如此训练，LIBERO 实验中至少 79% 的更新被抹除。
- title: "GR-2: A Generative Video-Language-Action Model with Web-Scale Knowledge for Robot Manipulation"
  type: paper
  arxiv: "2410.06158"
  year: 2024
  org: ByteDance Research
  project: https://gr2-manipulation.github.io
  topics: [world-models]
  tags: [real, arm, video-pretraining, generalist]
  takeaway_en: Pretrained to generate future video on 38M clips, then fine-tuned to predict frames and actions together; reports 97.7% average success over 100+ real tabletop tasks and roughly double GR-1's success in unseen scenes.
  takeaway_zh: 先在 3800 万段视频上预训练未来帧生成，再在机器人数据上微调，同时预测视频帧与动作轨迹；报告在 100 多个真机桌面任务上平均成功率 97.7%，在未见场景中成功率约为 GR-1 的两倍。
- title: "TraceVLA: Visual Trace Prompting Enhances Spatial-Temporal Awareness for Generalist Robotic Policies"
  type: paper
  arxiv: "2412.10345"
  year: 2024
  org: UMD / Microsoft Research
  venue: ICLR 2025
  code: https://github.com/umd-huang-lab/tracevla
  project: https://tracevla.github.io/
  tags: [real, sim, arm, visual-prompting, open-weights]
  takeaway_en: Draws the robot's recent motion traces on the input image ('visual trace prompting') and fine-tunes OpenVLA on 150K trajectories; reports ~10% gains on SimplerEnv and 3.5x on real WidowX tasks; 4B variant too.
  takeaway_zh: 把机器人近期的运动轨迹画在输入图像上（“视觉轨迹提示”），并在 15 万条轨迹上微调 OpenVLA；报告在 SimplerEnv 上提升约 10%、真实 WidowX 任务上提升 3.5 倍，另有基于 Phi-3-Vision 的 4B 精简版。
- title: "OneTwoVLA: A Unified Vision-Language-Action Model with Adaptive Reasoning"
  type: paper
  arxiv: "2505.11917"
  year: 2025
  org: Tsinghua / Shanghai Qi Zhi / Shanghai AI Lab / Fudan / Spirit AI
  venue: ICLR 2026
  code: https://github.com/Fanqi-Lin/OneTwoVLA
  project: https://one-two-vla.github.io
  tags: [real, arm, reasoning, long-horizon, hri]
  takeaway_en: "One model that decides when to think and when to act: it reasons at key moments (subtask done, error, human input) and otherwise acts on its latest reasoning; co-trained with synthetic reasoning-rich VL data."
  takeaway_zh: 单一模型自主决定何时“想”、何时“做”：在子任务完成、出错或人类插话等关键时刻进行推理，其余时间依据最新推理结果生成动作；并与合成的推理型视觉-语言数据共同训练。
- title: "DexVLA: Vision-Language Model with Plug-In Diffusion Expert for General Robot Control"
  type: paper
  arxiv: "2502.05855"
  year: 2025
  org: Midea Group / East China Normal University
  venue: CoRL 2025
  project: https://dex-vla.github.io/
  tags: [real, sim, cross-embodiment, diffusion-policy, bimanual, dexterous-hand]
  takeaway_en: Pairs a 2B Qwen2-VL with a ~1B plug-in diffusion action expert with one head per robot, trained in three stages (cross-embodiment, alignment, task); reports shirt folding without task-specific tuning and 97.3 on LIBERO.
  takeaway_zh: 将 2B 的 Qwen2-VL 与约 1B 参数、按机器人分头输出的可插拔扩散动作专家结合，分三阶段训练（跨本体预训练、本体对齐、任务适配）；报告无需任务专门微调即可叠衬衫，LIBERO 平均 97.3。
- title: "TinyVLA: Towards Fast, Data-Efficient Vision-Language-Action Models for Robotic Manipulation"
  type: paper
  arxiv: "2409.12514"
  year: 2024
  org: East China Normal University / Midea Group
  project: https://tiny-vla.github.io/
  tags: [real, sim, arm, bimanual, efficient, diffusion-policy]
  takeaway_en: A compact VLA built from a small multimodal model (up to 1.4B) with LoRA and a diffusion policy head, without large-scale robot pretraining; reports higher real-robot success than OpenVLA and ~20x faster inference.
  takeaway_zh: 由小型多模态模型（至多 1.4B）加 LoRA 微调与扩散策略头构成的紧凑 VLA，无需大规模机器人预训练；报告真机成功率高于 OpenVLA，推理速度约快 20 倍。
- title: "ChatVLA: Unified Multimodal Understanding and Robot Control with Vision-Language-Action Model"
  type: paper
  arxiv: "2502.14420"
  year: 2025
  org: Midea Group / East China Normal University / Shanghai University / Beijing Innovation Center of Humanoid Robotics / Tsinghua
  venue: EMNLP 2025
  code: https://github.com/tutujingyugang1/ChatVLA_public
  project: https://chatvla.github.io
  tags: [real, arm, vlm, mixture-of-experts]
  takeaway_en: "Keeps a VLA able to chat: phased alignment training plus a mixture-of-experts split to fight forgetting and task interference; reports strong VQA/MMMU scores and beats OpenVLA on 25 real tasks."
  takeaway_zh: 让 VLA 保留“对话”能力：通过分阶段对齐训练和混合专家结构缓解遗忘与任务干扰；论文报告在保持 VQA/MMMU 等多模态理解成绩的同时，在 25 个真实操作任务上优于 OpenVLA。
- title: "Hume: Introducing System-2 Thinking in Visual-Language-Action Model"
  type: paper
  arxiv: "2505.21432"
  year: 2025
  org: Shanghai AI Lab / SJTU / Fudan / AgiBot
  project: https://hume-vla.github.io
  tags: [real, sim, dual-system, flow-matching]
  takeaway_en: "Dual-system VLA: a value-query head scores sampled action-chunk candidates (System 2, ~4 Hz) and a light cascaded denoiser refines it (System 1, ~90 Hz); reports gains over π0 on LIBERO, SIMPLER and real robots."
  takeaway_zh: 双系统 VLA：价值查询头对多组候选动作块打分并择优（System 2，约 4 Hz），轻量级级联去噪策略再将其细化为流畅动作（System 1，约 90 Hz）；论文报告在 LIBERO、SIMPLER 和真机上均优于 π0。
- title: "TwinVLA: Data-Efficient Bimanual Manipulation with Twin Single-Arm Vision-Language-Action Models"
  type: paper
  arxiv: "2511.05275"
  year: 2025
  org: Yonsei University / Microsoft Research
  venue: ICLR 2026
  code: https://github.com/jellyho/TwinVLA
  project: https://jellyho.github.io/TwinVLA/
  tags: [real, sim, bimanual]
  takeaway_en: "Builds a bimanual VLA by composing two copies of a pretrained single-arm VLA instead of pretraining on bimanual data; reports beating a similar-size RDT-1B and narrowing the gap to π0 on real and sim tasks."
  takeaway_zh: 不做双臂预训练，而是把两份预训练单臂 VLA 组合成协同的双臂 VLA；论文报告在真实与仿真双臂任务上优于同规模 RDT-1B，并缩小了与依赖大量双臂数据的 π0 的差距。
- title: "VQ-VLA: Improving Vision-Language-Action Models via Scaling Vector-Quantized Action Tokenizers"
  type: paper
  arxiv: "2507.01016"
  year: 2025
  org: Shanghai AI Lab / SJTU
  venue: ICCV 2025
  code: https://github.com/xiaoxiao0406/VQ-VLA
  tags: [real, sim, arm, action-tokenizer]
  takeaway_en: "Replaces OpenVLA's per-dimension action bins with a convolutional residual VQ-VAE tokenizer trained on 100x more (real + synthetic) data; reports higher LIBERO-90 and real Franka success and ~2.8x faster inference."
  takeaway_zh: 用卷积残差 VQ-VAE 动作分词器（以百倍规模的真实+合成数据训练）替换 OpenVLA 的逐维离散分箱；论文报告 LIBERO-90 和真实 Franka 任务成功率提升，推理速度约快 2.8 倍。
- title: "GigaBrain-0: A World Model-Powered Vision-Language-Action Model"
  type: paper
  arxiv: "2510.19430"
  year: 2025
  org: GigaAI
  code: https://github.com/open-gigaai/giga-brain-0
  project: https://gigabrain0.github.io
  tags: [real, bimanual, mobile-manipulation, world-model-data, flow-matching, edge-deployment]
  takeaway_en: "Trains a VLA largely on world-model-generated data (re-rendered real videos, new viewpoints, sim2real, human-to-robot video); reports gains over π0 on dexterous and mobile tasks, plus a 402M variant for Jetson Orin."
  takeaway_zh: VLA 训练大量依赖世界模型生成的数据（真实视频重渲染、新视角、仿真转真实、人类视频转机器人）；论文报告在灵巧与移动操作任务上优于 π0，并提供可在 Jetson Orin 上运行的 4.02 亿参数小模型。
- title: "Galaxea Open-World Dataset and G0 Dual-System VLA Model"
