  year: 2025
  org: Hugging Face
  code: https://github.com/huggingface/lerobot
  tags: [real, arm, open-weights, low-cost]
  takeaway_en: A ~450M-parameter VLA trained on community LeRobot data that runs on consumer GPUs.
  takeaway_zh: 约 4.5 亿参数的 VLA，用社区 LeRobot 数据训练，可在消费级 GPU 上运行。
- title: "Gemini Robotics: Bringing AI into the Physical World"
  type: paper
  arxiv: "2503.20020"
  year: 2025
  org: Google DeepMind
  tags: [real, bimanual, vlm]
  takeaway_en: Gemini 2.0-based VLA and embodied-reasoning models for dexterous, general robot control.
  takeaway_zh: 基于 Gemini 2.0 的 VLA 与具身推理模型，面向灵巧、通用的机器人控制。
- title: "PaLM-E: An Embodied Multimodal Language Model"
  type: paper
  arxiv: "2303.03378"
  year: 2023
  org: Google
  tags: [real, vlm, planning]
  takeaway_en: Injects continuous sensor embeddings into a 562B language model for embodied reasoning and planning.
  takeaway_zh: 将连续传感器嵌入注入 5620 亿参数语言模型，用于具身推理与规划。
- title: "A Generalist Agent"
  type: paper
  arxiv: "2205.06175"
  year: 2022
  org: DeepMind
  tags: [sim, real, transformer]
  takeaway_en: Gato — one Transformer with one set of weights plays games, captions images and stacks blocks with a real arm.
  takeaway_zh: Gato：同一套权重的 Transformer 既能玩游戏、写图像描述，也能用真实机械臂堆积木。
- title: "REKI: Registering Knowledge in VLAs"
  type: paper
  arxiv: "2610.22178"
  year: 2026
  org: Kyutai
  code: https://github.com/kyutai-labs/reki
  added: 2026-10-19
  tags: [sim, flow-matching, memory, open-weights, public-data]
  takeaway_en: A 2.4B VLM + flow-matching VLA pretrained only on public data; reports beating all but ~2× larger models, plus cheap register-token memory.
  takeaway_zh: 仅用公开数据预训练的 2.4B VLM + 流匹配 VLA；报告称只输给约两倍大的模型，并用少量寄存器 token 实现低成本记忆。
- title: "LTM: Latent Transition Based In-Context Memory for Vision-Language-Action Models"
  type: paper
  arxiv: "2610.21362"
  year: 2026
  code: https://github.com/buaa-colalab/LTM-pi
  added: 2026-10-19
  tags: [sim, memory, pi0.5]
  takeaway_en: Gives π0.5 memory by caching compact latent transitions between observations, aimed at tasks where key objects go out of view.
  takeaway_zh: 通过缓存相邻观测之间的紧凑潜在转移，为 π0.5 加入记忆，面向关键物体移出视野的任务。
- title: "FastVLA: Task-Conditioned and Temporally Adaptive Visual Token Compression for Efficient Vision-Language-Action Models"
  type: paper
  arxiv: "2610.22146"
  year: 2026
  code: https://github.com/jiuyixu25/FastVLA
  added: 2026-10-19
  tags: [efficiency, token-compression, inference]
  takeaway_en: Speeds up VLA inference by keeping only the visual tokens the current task needs, with a token budget that changes from step to step.
  takeaway_zh: 只保留当前任务所需的视觉 token、并让 token 预算随时间步变化，以加快 VLA 推理。
- title: "NestedVLA: Learning to Consolidate and Generate Skills for Vision-Language-Action Models"
  type: paper
  arxiv: "2610.23271"
  year: 2026
  venue: NeurIPS 2026
  code: https://github.com/WanyuGroup/NeurIPS2026-NestedVLA
  added: 2026-10-19
  tags: [multitask, skill-consolidation, hypernetwork]
  takeaway_en: Learns skills separately, then consolidates them after the fact with a nested hypernetwork that generates VLA parameters instead of merging weights.
  takeaway_zh: 先独立学习各项技能，再用嵌套超网络“生成”VLA 参数来事后整合技能，而不是直接合并权重。
- title: "CogACT: A Foundational Vision-Language-Action Model for Synergizing Cognition and Action in Robotic Manipulation"
  type: paper
  arxiv: "2411.19650"
  year: 2024
  org: Microsoft Research Asia, Tsinghua
  code: https://github.com/microsoft/CogACT
  tags: [real, sim, diffusion, open-weights]
  takeaway_en: Instead of emitting action tokens from the VLM, a separate diffusion action transformer is conditioned on the VLM's "cognition" feature; reports clear gains over OpenVLA in sim and on real robots.
  takeaway_zh: 不再让 VLM 直接输出动作 token，而是用独立的扩散动作 Transformer 以 VLM 的“认知”特征为条件生成动作；报告在仿真和真机上明显优于 OpenVLA。
- title: "RoboBrain 2.0 Technical Report"
  type: paper
  arxiv: "2507.02029"
  year: 2025
  org: BAAI
  code: https://github.com/FlagOpen/RoboBrain2.0
  tags: [vlm, planning, spatial-reasoning, open-weights]
  takeaway_en: Open embodied VLMs (7B and 32B) trained for spatial grounding, affordances, trajectories and multi-step task planning — a "brain" that sits above low-level policies.
  takeaway_zh: 开源具身视觉语言模型（7B 与 32B），面向空间定位、可供性、轨迹预测与多步任务规划，作为底层策略之上的“大脑”。
- title: "VLA-$Δ$: Learning Physical State Transition for Vision-Language-Action Models"
  type: paper
  arxiv: "2610.21306"
  year: 2026
  code: https://github.com/ZJU-OmniAI/VLA-Delta
  added: 2026-10-19
  tags: [state-transition, auxiliary-supervision]
  takeaway_en: Argues VLAs overfit observation→action pairs and adds explicit supervision of the physical state change an action should cause, rather than predicting future states in language or pixels.
  takeaway_zh: 认为 VLA 容易过拟合“观测→动作”的对应关系，因此显式监督动作应引起的物理状态变化，而不是在语言或像素空间里预测未来状态。
- title: "MambaAct: Efficient Mamba Action Experts for Flow-Matching Vision-Language-Action Models"
  type: paper
  arxiv: "2610.22951"
  year: 2026
  code: https://github.com/giakhuyendihoc/MambaAct
  added: 2026-10-19
  tags: [efficiency, mamba, flow-matching, pi0.5]
  takeaway_en: Keeps π0.5's pretrained vision-language encoder but swaps its Transformer action expert — run many times per denoising loop — for a compact Mamba expert to cut inference cost.
  takeaway_zh: 保留 π0.5 预训练的视觉语言编码器，把在去噪循环中被反复调用的 Transformer 动作专家换成紧凑的 Mamba 专家，以降低推理开销。
- title: "Hi Robot: Open-Ended Instruction Following with Hierarchical Vision-Language-Action Models"
  type: paper
  arxiv: "2502.19417"
  year: 2025
  org: Physical Intelligence
  tags: [real, hierarchical, language-feedback]
  takeaway_en: A high-level VLM reads open-ended prompts and mid-task corrections and turns them into short language commands for a low-level π0 policy.
  takeaway_zh: 高层 VLM 理解开放式指令与执行中的纠正，并将其转化为简短语言指令交给底层 π0 策略执行。
- title: "VIMA: General Robot Manipulation with Multimodal Prompts"
  type: paper
  arxiv: "2210.03094"
  year: 2022
  org: Stanford, NVIDIA, Caltech
  venue: ICML 2023
  code: https://github.com/vimalabs/VIMA
  tags: [multimodal-prompt, transformer, benchmark]
  takeaway_en: Casts many tabletop tasks as interleaved text-and-image prompts to one Transformer policy, with the VIMA-Bench suite for systematic generalization tests.
  takeaway_zh: 把多种桌面任务统一成图文交错的提示，交给一个 Transformer 策略执行，并配套 VIMA-Bench 用于系统性泛化评测。
- title: "CondenseVLA: Learnable History Condensation for Efficient Multi-Frame VLA"
  type: paper
  arxiv: "2610.25927"
  year: 2026
  venue: NeurIPS 2026
  code: https://github.com/FeiyangHong/CondenseVLA
  added: 2026-10-20
  tags: [history, memory, efficiency]
  takeaway_en: Instead of feeding a VLA a longer frame history, learns to condense past frames into a few tokens that keep short-lived cues such as brief contacts and occlusions.
  takeaway_zh: 不靠简单加长历史帧窗口，而是学习把过去的帧压缩成少量 token，保留短暂接触、遮挡等转瞬即逝的线索。
- title: "GR-3 Technical Report"
  type: paper
  arxiv: "2507.15493"
  year: 2025
  org: ByteDance Seed
  tags: [real, bimanual, mobile-manipulation, long-horizon]
  takeaway_en: "ByteDance Seed's generalist VLA: robot imitation data co-trained with web vision-language data, adapted quickly with VR-collected human trajectories; shown on long-horizon bimanual mobile tasks."
  takeaway_zh: 字节跳动 Seed 的通用 VLA——机器人数据模仿学习并与网络视觉-语言数据联合训练，再用 VR 采集的人类轨迹快速适配；在 ByteMini 双臂移动机器人上展示长时程与衣物操作任务。
- title: "UniVLA: Learning to Act Anywhere with Task-centric Latent Actions"
  type: paper
  arxiv: "2505.06111"
  year: 2025
  org: HKU, OpenDriveLab, AgiBot
  code: https://github.com/OpenDriveLab/UniVLA
  venue: RSS 2025
  topics: [learning]
  tags: [latent-actions, cross-embodiment, video-pretraining]
  takeaway_en: Learns task-centric latent actions from videos (in DINO feature space, filtered by language) so one policy can be pretrained across robots and human video; reports beating OpenVLA with far less pretraining compute.
  takeaway_zh: 在 DINO 特征空间中、借助语言指令过滤，从视频里学习“任务相关”的隐动作，使策略可跨机器人与人类视频预训练；报告以少得多的预训练算力超过 OpenVLA。
- title: "SpatialVLA: Exploring Spatial Representations for Visual-Language-Action Model"
  type: paper
  arxiv: "2501.15830"
  year: 2025
  org: Shanghai AI Lab, ShanghaiTech, TeleAI
  code: https://github.com/SpatialVLA/SpatialVLA
  venue: RSS 2025
  tags: [3d, spatial, action-tokenization]
  takeaway_en: Adds 3D-aware position encoding to visual tokens and adaptive action grids, pretrained on 1.1M real robot episodes; new robot setups are handled by re-discretizing the grids.
  takeaway_zh: 为视觉 token 加入 3D 位置编码，并用自适应动作网格表示动作，在 110 万条真机轨迹上预训练；迁移到新机器人时只需重新划分动作网格。
- title: "Post-hoc Epistemic Uncertainty for Vision-Language-Action Policies"
  type: paper
  arxiv: "2610.29730"
  year: 2026
  code: https://github.com/post-hoc-vla-uncertainty/post-hoc-vla-uncertainty
  added: 2026-10-22
  tags: [uncertainty, safety, gaussian-process, failure-detection]
  takeaway_en: Post-hoc kernel-variance heads (Gaussian-process variance over training-demo embeddings) estimate one VLA policy's epistemic uncertainty without an ensemble, so the robot knows when to ask for help.
  takeaway_zh: 在训练完成后为单个 VLA 策略加上轻量的核方差头（基于训练示教嵌入的高斯过程方差）来估计认知不确定性，无需训练和运行策略集成，让机器人知道何时该求助或补充示教。
- title: "When One Step Is Enough: An Empirical Study of Euler Integration in Flow-Matching Policies"
  type: paper
  arxiv: "2610.30735"
  year: 2026
  venue: CoRL 2026
  added: 2026-10-23
  topics: [learning]
  tags: [flow-matching, inference-speed, empirical-study]
  takeaway_en: Tests six flow-matching VLAs and reports that one-step Euler action generation largely matches multi-step sampling at scale — a useful check before adding special one-shot objectives to speed up control (CoRL 2026).
  takeaway_zh: 在六个基于流匹配的 VLA 上实验，报告单步 Euler 生成动作在规模足够时与多步采样效果基本相当——在为提速引入专门的单步生成目标之前值得先看（CoRL 2026）。
