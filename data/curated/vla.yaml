  takeaway_zh: "CoRL 2026 Spotlight。为 VLA 提供多时间尺度记忆：长期记住抽象状态（如菜谱进行到哪一步），短期记住近期事件与被遮挡物体。"

- title: "Learning What to Say to Your VLA: Mostly Harmless Vision Language Action Model Steering"
  type: paper
  arxiv: "2606.12299"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-02
  tags: [language-steering, evaluation]
  takeaway_en: "CoRL 2026 Spotlight. Similar prompts can make VLAs behave very differently, so this framework interactively searches for language sequences that raise closed-loop task performance."
  takeaway_zh: "CoRL 2026 Spotlight。语义相近的指令可能让 VLA 行为迥异，该框架通过交互搜索语言序列来提升闭环任务表现。"

- title: "EmbodiSteer: Steering Embodiment-Agnostic Visuomotor Policies with Joint-Space Guidance for Zero-Shot Cross-Embodiment Deployment"
  type: paper
  arxiv: "2606.12965"
  code: https://github.com/frankWang67/EmbodiSteer
  year: 2026
  venue: CoRL 2026
  project: https://frankwang67.github.io/EmbodiSteer-Page
