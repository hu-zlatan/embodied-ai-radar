  takeaway_zh: 开源的“大脑–小脑”分层系统：RoboBrain 多模态大模型负责跨异构机器人的任务规划与分配，各机器人上的技能库负责执行，共享的空间/时间/本体记忆保持多机协同。
- title: "From Reasoning to Action: Benchmarking Frontier AI Models on LIBERO-10 Robot Manipulation Tasks"
  type: paper
  arxiv: "2610.30051"
  year: 2026
  code: https://github.com/IRVLUTD/LLM_LIBERO
  project: https://irvlutd.github.io/LLM-LIBERO/
  added: 2026-10-26
  topics: [manipulation]
  tags: [benchmark, sim, llm, tool-use, zero-shot, reasoning]
  takeaway_en: "Six frontier general-purpose models drive a LIBERO-10 arm through tool calls (end-effector poses, gripper), no robot training; best reported success is 44%. More reasoning effort usually helps but costs more."
  takeaway_zh: 让六个前沿通用大模型通过工具调用（指定末端位姿与夹爪开合）直接控制 LIBERO-10 机械臂，无任何机器人专门训练；报告的最高成功率为 44%。提高推理强度通常有帮助，但推理成本更高。
- title: "FastHarness: Experience-Driven Review Scheduling for Vision-Language-Action Policies"
