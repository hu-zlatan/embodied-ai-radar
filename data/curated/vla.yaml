  takeaway_zh: "CoRL 2026 Spotlight。VLA 可能忽略语言、沿用数据偏差形成的视觉捷径。论文提出反事实基准 LIBERO-CF，用于评测语言遵循能力。"

- title: "ZETA: A Controlled Study of Zero-Shot Cross-Embodiment VLA Transfer for Tabletop Manipulation"
  type: paper
  arxiv: "2609.02546"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-02
  tags: [cross-embodiment, evaluation]
  takeaway_en: "CoRL 2026 Spotlight. A controlled study of zero-shot VLA transfer that isolates embodiment change from tasks, scenes and protocols, and separates strict zero-shot from looser definitions."
  takeaway_zh: "CoRL 2026 Spotlight。对 VLA 零样本跨形态迁移的对照研究：将本体变化与任务、场景、流程隔离，并把严格零样本与宽松定义区分开。"

- title: "BitVLA: 1-bit Vision-Language-Action Models for Robotics Manipulation"
  type: paper
  arxiv: "2506.07530"
  year: 2025
  venue: CoRL 2026
  code: https://github.com/ustcwhy/BitVLA
  added: 2026-11-02
  tags: [1-bit, edge-deployment]
  takeaway_en: "CoRL 2026 Spotlight. A fully native 1-bit VLA with ternary weights, built on BitNet b1.58 2B4T, designed for edge devices instead of relying on post-hoc compression."
  takeaway_zh: "CoRL 2026 Spotlight。原生 1-bit VLA，权重三值化，基于 BitNet b1.58 2B4T，面向边缘设备设计，而非依赖事后压缩。"

- title: "Diagnosing Compositional Generalization in Sequential Robot Tasks"
  type: paper
  arxiv: "2607.29687"
  code: https://github.com/YixiaoWang7/Diagnosing_Compositional_Generalization_Robot
  year: 2026
  venue: CoRL 2026
  project: https://yixiaowang7.github.io/Diagnosing_Compositional_Generalization_Robot_Page/
  added: 2026-11-02
  tags: [compositional-generalization, evaluation]
  takeaway_en: "CoRL 2026 Spotlight. Splits the generalization gap of sequential instruction-following policies into marginal, compositional and context-action shift, viewed through instruction-space coverage."
  takeaway_zh: "CoRL 2026 Spotlight。从指令空间覆盖出发，把序列任务策略的泛化差距分解为边际偏移、组合偏移与上下文-动作偏移。"

- title: "GaP: A Graph-as-Policy Multi-Agent Self-Learning Harness For Variational Automation Tasks"
  type: paper
  arxiv: "2607.05369"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/graph-robots/graph-as-policy
  project: https://graph-robots.github.io/gap
  added: 2026-11-02
  tags: [agentic, harness, variational-automation]
  takeaway_en: "CoRL 2026 Spotlight. A multi-agent self-learning harness aimed at Variational Automation, industrial tasks with more object variation than fixed automation, which need sustained reliability."
  takeaway_zh: "CoRL 2026 Spotlight。面向“可变自动化”的多智能体自学习框架：这类工业任务的物体变化大于固定自动化，且要求持续可靠。"

- title: "Playful Agentic Robot Learning"
  type: paper
  arxiv: "2606.19419"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/Playful-RATs/rats
  project: https://playful-rats.github.io/
  added: 2026-11-02
  tags: [agentic, code-as-policy, play]
  takeaway_en: "CoRL 2026 Spotlight. RATs, teams of embodied coding agents, propose exploratory tasks and learn skills through self-directed play before any downstream task arrives."
  takeaway_zh: "CoRL 2026 Spotlight。具身编程智能体团队 RATs 在下游任务到来之前，自行提出探索任务，并通过自主玩耍学习技能。"

- title: "ResMerge: Residual Policy Learning and Merging for Continual Adaptation of Pre-trained Robot Policies"
  type: paper
  arxiv: "2610.41663"
  year: 2026
  code: https://github.com/ResMerge/resmerge-official
  project: https://resmerge.github.io/
  added: 2026-11-03
  tags: [vla, continual-learning, residual-rl]
  takeaway_en: "Adapts a frozen pre-trained policy with residual RL instead of new demos, then merges compatible residuals to cut stored parameters; tested on LIBERO and a real Franka."
  takeaway_zh: "在冻结的预训练策略上用残差强化学习适配新任务（无需新演示），再合并相容的残差以减少参数；在 LIBERO 与真实 Franka 上验证。"

- title: "STAR: Steering Action Representations during Inference"
  type: paper
  arxiv: "2610.41009"
  year: 2026
  code: https://github.com/PKU-VaLuE-Lab/STAR
  added: 2026-11-03
  tags: [vla, inference-time]
  takeaway_en: "A training-free tweak for pre-trained VLAs: an EMA over late-layer updates keeps object-aware directions near the action output; reports about 4 points higher average task success."
  takeaway_zh: "面向预训练 VLA 的免训练方法：对后层残差更新做 EMA，让靠近动作输出的表征保留物体感知方向；报告平均任务成功率提升约 4 个百分点。"

- title: "HiFOR: Hierarchical Foresight with Action-Guided World Grounding for Vision-Language-Action Model"
  type: paper
  arxiv: "2610.40373"
  year: 2026
  added: 2026-11-03
  tags: [vla, foresight, world-model]
  takeaway_en: "Jointly predicts short-term states, semantic milestones and goal states across horizons, then lets the action query retrieve only the relevant parts of that imagined future."
  takeaway_zh: "跨时间尺度联合预测短期状态、语义里程碑与目标状态，再由动作查询从中检索相关的未来表征。"

- title: "RoboDoctor: Training-Free Recursive Self-Improvement for Robot Policies"
  type: paper
  arxiv: "2610.35604"
  year: 2026
  code: https://github.com/THUSI-Lab/RoboDoctor
  project: https://robodoctor-rsi.github.io/
  added: 2026-11-03
  tags: [agents, policy-execution, self-improvement]
  takeaway_en: "Keeps model weights fixed and adapts during execution: an agent diagnoses, intervenes and stores linked experience records, revising how the policy is used rather than the policy."
  takeaway_zh: "不改模型权重，在执行中适配：智能体负责诊断、干预并保存关联的经验记录，修订的是策略的使用方式而非策略本身。"
- title: "RoboColosseum: Evaluating Physical Intelligence at Scale In-The-Wild"
  type: paper
  arxiv: "2611.02497"
  year: 2026
  code: https://github.com/RoboColosseum/robocolosseum-client
  added: 2026-11-03
  highlight: true
  tags: [benchmark, evaluation, real, fine-tuning]
  takeaway_en: "Blinded pairwise trials at 124 sites compare VLAs and frontier agents. Rankings barely agree across robots (W = 0.24), and open rankings poorly predict results after fine-tuning; no policy finishes a G1 task."
  takeaway_zh: "在 124 个站点做盲测两两对比，横跨四种机器人评测 VLA 与前沿智能体。不同机器人的排名几乎不一致（Kendall W = 0.24），开箱排名也难以预测微调后的表现；G1 人形上没有策略完成任何任务。"
- title: "Democratizing Robot-Use Agents: A Unified Harness with Open Models"
  type: paper
  arxiv: "2611.01560"
  year: 2026
  project: https://openrua.ai/uni-robot-agent
  code: https://github.com/Open-RUA/uni-robot-agent
  added: 2026-11-03
  tags: [agent, harness, open-weights, benchmark]
  takeaway_en: "uni-robot-agent: an open harness for robot-use agents on open-weight models. It reports a RoboDojo score of 31.39 with an off-the-shelf Qwen3.8 model, above the published GPT-6 Astra-RoboProbe result of 28.97."
  takeaway_zh: "uni-robot-agent：面向开放权重模型的机器人操作智能体（Robot-use Agent）框架，便于继续训练。作者报告现成的 Qwen3.8 模型在 RoboDojo 上得 31.39 分，高于已发表的 GPT-6 Astra-RoboProbe 的 28.97 分。"
- title: "Auriga Technical Report: A Task-Agnostic Agent Harness for Zero-Shot Embodied Manipulation"
  type: paper
  arxiv: "2611.01112"
  year: 2026
  code: https://github.com/lose4578/Auriga
  project: https://auriga.stelledge.com/
  added: 2026-11-03
  tags: [agent, harness, benchmark, sim]
  takeaway_en: "The LLM decides; the harness adds calibrated 3D measurements, trajectory previews and stop-on-divergence checks. Reports first place on RoboDojo with 57.7% success, over double the reference harness."
  takeaway_zh: "任务决策交给大模型，框架提供标定后的三维测量、轨迹预览和偏差即停的执行检查。作者报告在 RoboDojo 榜单排名第一，成功率 57.7%，是同模型参考框架的两倍多。"
- title: "VLALagBench: Understanding When and Why VLA Inference Latency Matters"
  type: paper
  arxiv: "2611.03103"
  year: 2026
  added: 2026-11-03
  tags: [benchmark, latency, evaluation, sim]
  takeaway_en: "Benchmark of VLA latency sensitivity across tasks, object speeds and execution modes: 100 ms can nearly halve success on moving targets. An empirical model then predicts success from limited calibration data."
  takeaway_zh: "评测 VLA 对推理延迟的敏感度，覆盖不同任务、物体速度与同步/异步执行：100 ms 延迟就可能让移动目标任务的成功率几乎减半。作者还给出经验模型，用少量标定数据预测成功率。代码尚待发布。"
- title: "HeLM: Hierarchical Explicit Language Memory for Non-Markovian Manipulation"
  type: paper
  arxiv: "2611.02660"
  year: 2026
  code: https://github.com/kimspacehuni/HeLM
  project: https://kimspacehuni.github.io/HeLM/
  added: 2026-11-03
  tags: [memory, real, hierarchical]
  takeaway_en: "Gives a VLA working memory by keeping task history as explicit text, updated only when events are detected. Tested on 10 real non-Markovian tasks, including ones that need context across episodes."
  takeaway_zh: "用显式文本保存任务历史、只在检测到事件时更新，为 VLA 增加工作记忆。在 10 个真实的非马尔可夫任务上测试，其中包括需要跨回合保持上下文的任务。"
- title: "A Pragmatic VLA Foundation Model"
  type: paper
  arxiv: "2601.18692"
  year: 2026
  org: Robbyant
  code: https://github.com/Robbyant/lingbot-vla
  project: https://technology.robbyant.com/lingbot-vla
  highlight: true
  tags: [real, bimanual, open-weights, open-data, cross-embodiment]
  takeaway_en: "LingBot-VLA: an Apache-2.0 foundation model trained on about 20,000 hours of real data from nine dual-arm setups, tested on four platforms with 100 tasks each; code, base model and benchmark data are released."
  takeaway_zh: "LingBot-VLA：Apache-2.0 开源的基础模型，用九种双臂构型约 2 万小时真实数据训练，并在四个平台各 100 项任务上评测；代码、基座模型和评测数据一并开放。"
- title: "Isaac GR00T N1.7"
  type: code
  year: 2026
  org: NVIDIA
  code: https://github.com/NVIDIA/Isaac-GR00T
  project: https://huggingface.co/blog/nvidia/gr00t-n1-7
  topics: [locomotion]
  tags: [real, humanoid, dexterous, open-weights, vlm, diffusion-policy, human-demonstrations]
  takeaway_en: "Commercially licensed 3B-parameter humanoid VLA: a Cosmos-Reason2 backbone plans and a diffusion transformer outputs motor commands. NVIDIA reports training on about 20,854 hours of human egocentric video."
  takeaway_zh: "可商用的 30 亿参数人形 VLA：Cosmos-Reason2 主干负责推理规划，扩散 Transformer 输出电机指令。NVIDIA 称用约 20,854 小时人类第一视角视频训练。"
- title: "Gemini Robotics 1.5: Pushing the Frontier of Generalist Robots with Advanced Embodied Reasoning, Thinking, and Motion Transfer"
  type: paper
  arxiv: "2510.03342"
  year: 2025
  org: Google DeepMind
  tags: [real, vlm, cross-embodiment, reasoning]
  takeaway_en: "Tech report on a multi-embodiment VLA plus the ER 1.5 reasoning model: Motion Transfer learns across varied robot data, and actions interleave with natural-language reasoning so the robot can think before acting."
  takeaway_zh: "技术报告：跨本体 VLA 与具身推理模型 ER 1.5。Motion Transfer 让模型从不同机器人的数据中学习，动作与自然语言推理交替进行，使机器人先想后做。"
- title: "VLA-JEPA: Enhancing Vision-Language-Action Model with Latent World Model"
  type: paper
  arxiv: "2602.10098"
  year: 2026
  venue: ECCV 2026
  code: https://github.com/ginwind/VLA-JEPA
  project: https://ginwind.github.io/VLA-JEPA/
  topics: [world-models]
  tags: [jepa, latent-world-model, pretraining, libero, open-weights]
  takeaway_en: "JEPA-style VLA pretraining: future frames are only a latent target and the student sees the current observation alone, so it avoids leakage and learns dynamics rather than pixel changes; then fine-tune an action head."
  takeaway_zh: "JEPA 式 VLA 预训练：未来帧只作为潜空间监督目标，学生网络只看当前观测，避免信息泄漏，学动力学而非像素变化；之后再微调动作头。"
- title: "FASTER: Rethinking Real-Time Flow VLAs"
  type: paper
  arxiv: "2603.19199"
  year: 2026
  venue: NeurIPS 2026
  code: https://github.com/hku-sail/FASTER
  org: HKU
  tags: [real-time, flow-matching, latency, real]
  takeaway_en: "Shows reaction time hinges on time to first action, then uses a schedule that spends denoising on near-term actions: one step for the immediate reaction, about 10× faster for π0.5 and X-VLA; demoed on table tennis."
  takeaway_zh: "指出反应速度取决于首动作耗时，并让去噪优先照顾近期动作：即时反应只需一步，π0.5 和 X-VLA 上约快 10 倍；真机演示包括乒乓球。"
- title: "DeeR-VLA: Dynamic Inference of Multimodal Large Language Models for Efficient Robot Execution"
  type: paper
  arxiv: "2411.02359"
  year: 2024
  code: https://github.com/yueyang130/DeeR-VLA
  tags: [efficiency, early-exit, calvin]
  takeaway_en: "Multi-exit VLA that stops at the smallest model fit for the moment, with budgets for power, latency and GPU memory; on CALVIN it reports 5.2–6.5× lower LLM compute and 2–6× less memory without hurting performance."
  takeaway_zh: "多出口 VLA：按当前情境停在够用的最小模型，并按功耗、时延和显存预算设定退出条件；在 CALVIN 上报告 LLM 计算量降低 5.2–6.5 倍、显存降低 2–6 倍，性能不降。"
- title: "Robotic Control via Embodied Chain-of-Thought Reasoning"
  type: paper
  arxiv: "2407.08693"
  year: 2024
  code: https://github.com/MichalZawalski/embodied-CoT
  venue: CoRL 2024
  project: https://embodied-cot.github.io
  tags: [reasoning, chain-of-thought, openvla]
  takeaway_en: "Trains VLAs to reason through plans, subtasks, motions and visual features before acting; synthetic reasoning data gives OpenVLA a reported 28% success gain on hard generalization tasks with no extra robot data."
  takeaway_zh: "训练 VLA 在动作前依次推理计划、子任务、动作和视觉特征；用合成的推理数据，OpenVLA 在困难泛化任务上成功率提升 28%，无需额外机器人数据。"
- title: "A Survey on Vision-Language-Action Models: An Action Tokenization Perspective"
  type: paper
  arxiv: "2507.01925"
  year: 2025
  project: https://github.com/Psi-Robot/Awesome-VLA-Papers
  tags: [survey]
  takeaway_en: "Survey that reads every VLA as one pipeline producing ever more actionable tokens, and reviews eight token types from language and code to trajectories, latents, raw actions and reasoning."
  takeaway_zh: "综述：把所有 VLA 看作生成越来越可执行 token 的同一流程，并梳理语言、代码、可供性、轨迹、目标状态、潜表示、原始动作和推理八类 token。"
- title: "Pure Vision Language Action (VLA) Models: A Comprehensive Survey"
  type: paper
  arxiv: "2509.19012"
  year: 2025
  org: Lanzhou University, NUS
  tags: [survey]
  takeaway_en: "Survey of over three hundred studies with a taxonomy of autoregression, diffusion, reinforcement, hybrid and specialized VLAs, plus the datasets, benchmarks and simulators used to test them."
  takeaway_zh: "综述三百多项研究，把 VLA 分为自回归、扩散、强化学习、混合和专用几类，并介绍常用数据集、评测基准和仿真平台。"
- title: "Asynchronous Robot Policies"
  type: paper
  arxiv: "2611.05155"
  year: 2026
  org: INSAIT
  project: https://arp.insait.ai
  tags: [real, arm, latency]
  added: 2026-11-04
  takeaway_en: "Splits a large VLM that slowly updates a semantic memory from a light expert that acts at high rate, trained on staleness and delay; reports running the VLM at a tenth of its nominal rate with no significant loss."
  takeaway_zh: "把低频更新语义记忆的大型 VLM 与高频出动作的轻量专家解耦，并针对陈旧和延迟训练；报告 VLM 降到标称频率十分之一时性能无明显损失。"
- title: "Say the Same, Act Differently: Diagnosing and Steering Text-Action Divergence in Reasoning VLAs"
  type: paper
  arxiv: "2611.04166"
  year: 2026
  project: https://say-the-same.github.io/
  tags: [safety, adversarial, neurips]
  added: 2026-11-04
  takeaway_en: "Shows visual perturbations can change a reasoning VLA's action while its rationale stays word-for-word identical, tested on Alpamayo and InstructVLA, so monitors must check the action channel, not the text."
  takeaway_zh: "展示视觉扰动可以改变推理型 VLA 的动作，而解释文本一字不变（在 Alpamayo 和 InstructVLA 上测试），因此监控必须直接检查动作通道，不能只看文本。"
- title: "EdgeVLA: Efficient Vision-Language-Action Models"
  type: paper
  arxiv: "2507.14049"
  year: 2025
  org: K-Scale Labs
  code: https://github.com/kscalelabs/evla
  tags: [edge, efficiency]
  added: 2026-11-04
  takeaway_en: "Speeds up VLA inference on edge devices by dropping the autoregressive end-effector prediction, reported as a 7x speedup, and by using small language models."
  takeaway_zh: "通过去掉末端位姿的自回归预测（报告提速 7 倍）并使用小型语言模型，加快 VLA 在边缘设备上的推理。"
- title: "RoboMamba: Efficient Vision-Language-Action Model for Robotic Reasoning and Manipulation"
  type: paper
  arxiv: "2406.04339"
  year: 2024
  venue: NeurIPS 2024
  project: https://sites.google.com/view/robomamba-web
  tags: [mamba, efficiency]
  added: 2026-11-04
  takeaway_en: "An end-to-end VLA built on Mamba state space models, aiming for both robotic reasoning and cheap fine-tuning and inference."
  takeaway_zh: "基于 Mamba 状态空间模型的端到端 VLA，兼顾机器人推理能力和较低的微调与推理成本。"
- title: "PointVLA: Injecting the 3D World into Vision-Language-Action Models"
  type: paper
  arxiv: "2503.07511"
  year: 2025
  tags: [point-cloud, 3d]
  added: 2026-11-04
  takeaway_en: "Adds point cloud input to pretrained VLAs without retraining: freezes the action expert and injects 3D features only into blocks that a skip-block analysis finds less useful."
  takeaway_zh: "无需重训即可为预训练 VLA 加入点云输入：冻结动作专家，只向跳块分析认定作用较小的模块注入 3D 特征。"
- title: "Emma-X: An Embodied Multimodal Action Model with Grounded Chain of Thought and Look-ahead Spatial Reasoning"
  type: paper
  arxiv: "2412.11974"
  year: 2024
  code: https://github.com/declare-lab/Emma-X
  tags: [reasoning, chain-of-thought]
  added: 2026-11-04
  takeaway_en: "A VLA with grounded chain of thought and look-ahead spatial reasoning, trained on a dataset built from BridgeV2 with 60,000 auto-annotated trajectories."
  takeaway_zh: "具备落地链式思考和前瞻空间推理的 VLA，基于 BridgeV2 构建并自动标注的 6 万条轨迹数据集训练。"
- title: "A Survey on Efficient Vision-Language-Action Models"
  type: paper
  arxiv: "2510.24795"
  year: 2025
  venue: TPAMI 2026
  project: https://evla-survey.github.io/
  tags: [survey, efficiency]
  added: 2026-11-04
  takeaway_en: "A survey of efficient VLAs across the model, training and data pipeline, with a unified taxonomy of work on real-time inference, training cost and scalable data collection."
  takeaway_zh: "综述高效 VLA，贯穿模型、训练和数据全流程，用统一分类梳理实时推理、训练成本和可扩展数据采集方面的工作。"
- title: "RoboBrain: A Unified Brain Model for Robotic Manipulation from Abstract to Concrete"
  type: paper
  arxiv: "2502.21257"
  year: 2025
  tags: [mllm, affordance, dataset]
  added: 2026-11-04
  takeaway_en: "Trains a multimodal language model for task planning, object affordance and trajectory prediction, using ShareRobot, a dataset labelled for all three."
  takeaway_zh: "训练多模态语言模型完成任务规划、物体可供性和轨迹预测，并配套标注了这三类信息的 ShareRobot 数据集。"
- title: "Efficient Long-Horizon Vision-Language-Action Models via Static-Dynamic Disentanglement"
  type: paper
  arxiv: "2602.03983"
  year: 2026
  tags: [efficiency, kv-cache]
  added: 2026-11-04
  takeaway_en: "DySta splits visual input into static and dynamic tokens, keeping one copy of the static tokens and reusing their KV cache, to extend VLA context and speed up inference."
  takeaway_zh: "DySta 把视觉输入分成静态和动态 token，静态部分只保留一份并复用 KV 缓存，从而延长 VLA 上下文并加快推理。"
- title: "Human-to-Robot Transfer via Bridging Representation and Action Space in VLAs"
  type: paper
  arxiv: "2611.04391"
  year: 2026
  code: https://github.com/jun-brro/h2rb-code
  project: https://junhyeong-park.me/h2rb/
  tags: [real, human-video, fine-tuning]
  added: 2026-11-04
  takeaway_en: "H2RB adapts a pretrained VLA from unpaired human and robot demonstrations by aligning observations on geometry and sharing action latents; reports object transfer score rising from 8.0 to 51.8 on real tasks."
  takeaway_zh: "H2RB 用非配对的人类与机器人示教微调预训练 VLA：按几何对齐观测，并共享动作潜变量；报告真机任务的物体迁移得分从 8.0 升至 51.8。"
- title: "Do Agentic Policies Need to Look at Every Step? Geometric Abstraction for Reasoning and Action"
  type: paper
  arxiv: "2611.05058"
  year: 2026
  code: https://github.com/Spectraorder/geometric-abstraction
  project: https://geometric-abstraction.github.io
  tags: [real, agentic, llm, 3d]
  added: 2026-11-04
  takeaway_en: "Moves routine spatial reasoning from images to text: a locally refreshed 3D symbolic scene the language model reads directly, with vision only on demand; reports better multi-step completion and far fewer image queries."
