  takeaway_en: "PAL has a high-level VLM write future-relevant subtasks into an executable memory while watching, then hand the current one to a low-level VLA. Reports 56.05% vs 44.51% on RoboMME and 60.83% on 4 real tasks."
  takeaway_zh: "PAL 让高层 VLM 在观察过程中把未来需要的子任务提前写入可执行记忆（subtask_list），执行时再挑出当前子任务交给底层 VLA；报告在 RoboMME 上成功率 56.05%（最强基线 44.51%），4 个真实任务总体 60.83%。"

- title: "Quantize by Doing: Task-Guided Mixed-Precision Quantization of Vision-Language-Action Models"
  type: paper
  arxiv: "2610.38661"
  year: 2026
  code: https://github.com/jiuyixu25/QbD-VLA
  added: 2026-11-01
  topics: [learning]
  tags: [quantization, efficiency, deployment, libero, mixed-precision, real]
  takeaway_en: "Assigns VLA bit widths from short closed-loop task-success tests, not calibration sensitivity: ~4-bit weights on LIBERO across four models. Honest caveat: allocations transfer to a real arm for X-VLA but fail for π0.5."
  takeaway_zh: 用短时闭环任务成功率（而非校准数据敏感度）为 VLA 各组件分配权重/激活位宽，并考虑组件间相互影响；在四个 VLA 与 LIBERO 全部套件上约 4 比特权重仍保持较强表现。作者如实指出：仿真选出的方案在真机上对 X-VLA 无损，对 π0.5 却失败。

- title: "HuGe: Scaling Humanoid Generalist Vision-Language-Action Models with Egocentric Experience"
  type: paper
  arxiv: "2610.34186"
  year: 2026
  code: https://github.com/yliu-cs/HuGe
  project: https://yliu-cs.github.io/HuGe
  added: 2026-11-01
  topics: [locomotion]
  tags: [humanoid, egocentric-video, human-data, whole-body-control, unitree-g1, cross-embodiment, real]
  takeaway_en: "Humanoid VLA family pre-trained on 2,000+ h of egocentric human and robot data, predicting latent motion tokens for a whole-body controller; uses pseudo-proprioception and arm re-rendering to bridge the embodiment gap."
  takeaway_zh: 人形机器人通用 VLA 系列：在 2,000 多小时第一视角人类与机器人数据上预训练，输出潜在动作 token 驱动预训练的全身控制器并附手部信号；通过仿真回放构造伪本体感知、重渲染手臂外观缩小人-机差异，报告 HumanoidArena 最优，并在 Unitree G1 上验证人类数据增益。

- title: "What Actually Matters? A Paired Evaluation of Inference Settings for π0.5 on BEHAVIOR-1K"
  type: paper
  arxiv: "2610.37917"
  year: 2026
  project: https://rubenhammele.github.io/behavior2026
  added: 2026-11-01
  topics: [datasets]
  tags: [evaluation, pi0.5, behavior-1k, inference-strategies, household, sim]
  takeaway_en: "Paired test of previously proposed inference and data-collection tricks on all 100 BEHAVIOR-1K tasks with a π0.5 based on the 2025 challenge winner (Q-score 0.39): the tricks do not transfer uniformly."
  takeaway_zh: 在 BEHAVIOR-1K 全部 100 个任务上，以基于 2025 BEHAVIOR 挑战赛冠军方案微调的 π0.5（公开测试集 Q 分 0.39）为对象，对已有推理与数据采集技巧做配对评测；结论是这些技巧在新环境与任务上的效果并不一致，提醒小规模结论不宜直接外推。

- title: "RoboSeed: Multidimensional Evaluation of Vision-Language-Action and World-Action Models: Capability, Resource Affordability, and Research Evidence"
  type: paper
  arxiv: "2610.40026"
  year: 2026
  code: https://github.com/PrimitiveX/RoboSeed
  added: 2026-11-01
  topics: [vla, world-models, datasets]
  tags: [evaluation, benchmark, vla, wam, reproducibility, compute-cost]
  takeaway_en: "Rates VLA and world-action models on five axes (capability, training and deployment cost, verified research value, reproducibility), not success rate alone; withholds overall scores when evidence is missing."
  takeaway_zh: 多维度评测 VLA 与世界-动作模型（WAM）：除任务能力外，还衡量下游训练成本、部署成本、经本地验证的研究价值和复现证据，按不同算力预算给出 0–100 画像；证据缺失时明确标注、不给总分，并开源评分代码与机器可读证据。

- title: "Wall-OSS-0.5 Technical Report"
  type: paper
  arxiv: "2605.30877"
  year: 2026
  org: X Square Robot
  code: https://github.com/X-Square-Robot/wall-x
  project: https://x2robot.com/en/oss
  added: 2026-11-02
  topics: [vla]
  tags: [real, open-weights, cross-embodiment, pretraining]
  takeaway_en: "Wall-OSS-0.5: open 4B VLA on a Qwen2.5-VL-3B backbone, pretrained across 20+ embodiments; reports 60.5% task progress after fine-tuning on 15 real tasks, against 43.0% for π0.5."
  takeaway_zh: Wall-OSS-0.5：自变量机器人（X Square Robot）开源的 40 亿参数 VLA 模型，基于 Qwen2.5-VL-3B 视觉语言主干，在 20 余种机器人形态上预训练；报告在 15 个真机任务上微调后平均任务进度 60.5%，π0.5 为 43.0%。

- title: "EagleVLA: Towards Onboard Real-Time Robot Control via Foresight-Aligned Asynchronous Inference"
  type: paper
  arxiv: "2607.12659"
  year: 2026
  org: PKU SEC Lab
  venue: CoRL 2026
  code: https://github.com/PKU-SEC-Lab/EagleVLA
  added: 2026-11-02
  topics: [vla]
  tags: [real, onboard, jetson, async-inference, spotlight]
  takeaway_en: "EagleVLA: asynchronous VLA inference for low-power onboard chips such as Jetson Orin, tackling perception-execution misalignment and slow reaction; a CoRL 2026 Spotlight, formerly titled Jetson-PI."
  takeaway_zh: EagleVLA：面向 Jetson Orin 等低功耗机载设备的 VLA 异步推理方法，针对异步执行带来的感知-执行错位与反应慢两个问题；CoRL 2026 Spotlight，曾用名 Jetson-PI。


- title: "Never Too Late for Force: Accelerating VLA Post-Training with Reactive Force Injection"
  type: paper
  arxiv: "2607.14236"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/y-wng/lift
  project: https://lift-policy.github.io/
  added: 2026-11-02
  topics: [vla, tactile]
  tags: [real, force, post-training, contact, spotlight]
  takeaway_en: "LIFT: grafts a reactive force-driven action expert onto a pretrained, vision-driven VLA, keeping its output unchanged at initialization, so post-training gains contact reactivity; CoRL 2026 Spotlight."
  takeaway_zh: LIFT：在以视觉为主的预训练 VLA 旁接入由力觉驱动的反应式动作专家，初始化时保持原策略输出不变，使后训练获得接触反应能力，应对遮挡、深度歧义等接触阶段难题；CoRL 2026 Spotlight。


- title: "Automating the Design of Embodied Agent Architectures"
  type: paper
  arxiv: "2606.30111"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/jianzhou0420/AgentCanvas
  project: https://jianzhou0420.github.io/agentcanvas
  added: 2026-11-02
  topics: [navigation, vla]
  tags: [agents, architecture-search, memory, planning]
  takeaway_en: "Tests whether agent architecture search, so far used on text agents, transfers to perceptual embodied agents; AgentCanvas makes perception, memory, planning and action wiring searchable."
  takeaway_zh: 研究原用于文本智能体的智能体架构搜索（AAS）能否迁移到有感知的具身智能体；提出 AgentCanvas，把感知、记忆、规划与动作模块的组合方式变成可搜索的设计空间。


- title: "FiberTune: Preserving Action-Fiber Visual Residuals in Vision-Language-Action Fine-Tuning"
  type: paper
  arxiv: "2606.08653"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/fibertune/FiberTune
  project: https://fibertune.github.io/
  added: 2026-11-02
  topics: [vla]
  tags: [fine-tuning, representation, no-inference-overhead]
  takeaway_en: "FiberTune: action-supervised VLA fine-tuning can collapse visual structure the action loss barely constrains; a training-time objective keeps those residuals, with no added inference cost."
  takeaway_zh: FiberTune：动作监督微调会压缩动作损失约束较弱的视觉结构（沿局部动作纤维的残差坍塌）；提出训练期目标函数，对齐冻结的视觉教师以保留这些残差，不增加推理开销。

- title: "VLA Policies Do Not Know When Not to Act: Unintended Task Execution and Start Suppression"
  type: paper
  arxiv: "2610.41609"
  year: 2026
  added: 2026-11-02
  tags: [safety, evaluation, libero, gr00t, sim]
  takeaway_en: "Given an empty instruction, all six tested VLA checkpoints still moved in every LIBERO-Goal episode; five often finished an unrequested task. A 'do not move' prefix stopped none; an action-similarity gate held five."
  takeaway_zh: "指令为空时，六个 VLA 检查点在 LIBERO-Goal 的每个回合都仍会启动，其中五个常常完成了未被要求的任务。给指令加“无任务就别动”前缀对六个都无效；比较首个动作块与空指令动作块的门控在五个上能让机器人保持不动。"

- title: "TinyAstral: Transferring Self-Evolving Harnesses to Tiny Generalist Manipulation Agents"
  type: paper
  arxiv: "2610.41216"
  code: https://github.com/Garfield-kh/TinyAstral
  year: 2026
  project: https://garfield-kh.github.io/TinyAstral/
  added: 2026-11-02
  tags: [harness, recursive-self-improvement, distillation, robotwin]
  takeaway_en: "Evolves a frozen teacher's harness by recursive self-improvement with paired statistical tests, then distills a 4B student into it. Reports RoboTwin 33.4% → 63.6% for the teacher, 62.8% for the student."
  takeaway_zh: "先冻结开放权重教师模型，用递归自我改进演化其 harness（每次修改须通过配对统计检验），再把 4B 学生模型蒸馏进同一 harness。报告 RoboTwin 上教师成功率由 33.4% 升到 63.6%，学生达 62.8%，加速器时间约为教师的五分之一。"

- title: "REA: A Routed Embodied Agent Runtime for Asynchronous Brain-Cerebellum Control"
  type: paper
  arxiv: "2610.42053"
  year: 2026
  project: https://mikeeeeeeeeeeeeee.github.io/REA/
  added: 2026-11-02
  tags: [agent-runtime, routing, libero-pro, humanoid, real]
  takeaway_en: "Runtime pairing a slow brain with fast policies under one rule: no running policy waits on the brain. Reports 95.9% over 3,000 LIBERO-Pro episodes vs 94.7% for the best single baseline, with 17% less control time."
  takeaway_zh: "让慢速“大脑”（基础模型）与快速“小脑”（VLA、全身控制）协同的统一运行时，核心规则是运行中的策略绝不等待大脑。用路由记忆与边界触发的判定门替代逐次求助；报告 LIBERO-Pro 3000 回合成功率 95.9%（最佳单体基线 94.7%），控制时间减少 17%。"

- title: "REACT: Rolling Denoising and Dual Decoupling for Reactive Robot Control with VLA Models"
  type: paper
  arxiv: "2610.12007"
  code: https://github.com/houlong-xiong/REACT
  year: 2026
  venue: CoRL 2026
  project: https://react-vla.github.io
  added: 2026-11-02
  tags: [flow-matching, action-chunking, reactive-control]
  takeaway_en: "CoRL 2026 Spotlight. Instead of regenerating action chunks from scratch, keeps a persistent action buffer with staggered flow timesteps, so flow-based VLAs get more reactive while preserving long-horizon context."
  takeaway_zh: "CoRL 2026 Spotlight。不再每次从头生成动作块，而是维护一个流时间步错开的持久动作缓冲区，让基于流的 VLA 更具反应性，同时保留长时域上下文。"

- title: "Demystifying When and Why VLAs Fail in Contact-Rich Tasks and How to Fix Them"
  type: paper
  arxiv: "2608.01402"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-02
  tags: [contact-rich, failure-analysis, force]
  takeaway_en: "CoRL 2026 Spotlight. Studies why VLA models struggle in contact-rich manipulation and separates two failure modes: precision failures, where policies struggle to produce small corrective actions, and force failures."
  takeaway_zh: "CoRL 2026 Spotlight。分析 VLA 模型为何难以完成接触丰富的操作任务，并区分两类失败模式：难以输出接触时所需微小修正动作的精度失败，以及力失败。"

- title: "CaPtain: A Pipeline for Post-Training Code-as-Policy Robot Agents"
  type: paper
  arxiv: "2610.40799"
  year: 2026
  code: https://github.com/waltstephen/CaPtain
  project: https://waltstephen.github.io/captain/
  added: 2026-11-02
  topics: [learning]
  tags: [code-as-policy, post-training, rl, libero, real]
  takeaway_en: "Turns a small open VLM into a code-as-policy agent: SFT, then multi-turn RL with a physical critic. Reports Qwen3.5-4B going from 0% to 73.8% on held-out LIBERO; code, data and weights released."
  takeaway_zh: "把小型开放 VLM 训练成“代码即策略”机器人智能体的开源流水线：先 SFT，再做多轮 RL，并用读取仿真特权状态的物理评论家为每次请求分配贡献。报告 Qwen3.5-4B 在留出的 LIBERO 上由 0% 升到 73.8%，并公开代码、数据和权重。"

- title: "RoboArchitect: Automating the Design of Robotic Agents with Persistent Memory"
  type: paper
  arxiv: "2610.42141"
  code: https://github.com/roboarchitect-ai/RoboArchitect
  year: 2026
  project: https://roboarchitect-ai.github.io/
  added: 2026-11-02
  tags: [agent-harness, frozen-policy, coding-agent]
  takeaway_en: "A coding model reads rollouts of a frozen policy and rewrites its harness, with no weight updates. Reports average success rising from 9.7% to 43.3% on unseen scenes and 12.7% to 40.2% on unseen tasks."
  takeaway_zh: "让编码模型观察冻结策略的执行轨迹、诊断失败并反复改写外围 harness，不更新任何权重。报告在未见场景上平均成功率从 9.7% 升到 43.3%，未见任务上从 12.7% 升到 40.2%。"

- title: "Cross-Controller Transfer via In-Context Behavior Adaptation"
  type: paper
  arxiv: "2610.39280"
  year: 2026
  project: https://controller-transfer.github.io
  added: 2026-11-02
  tags: [cross-embodiment, controllers, context-encoder, real]
  takeaway_en: "Pools robot data across six controller types by showing the policy examples of commanded actions and the motions they caused. Reports 33 points better average success than naive pooling in real experiments."
  takeaway_zh: "跨六类控制器共享机器人数据：把“指令动作与实际运动”的交互样例编码为上下文，让同一策略在线适应。真实实验报告平均成功率比直接混合数据高 33 个百分点。"

- title: "From Reasoning to Action: Consequence-Grounded Alignment for Vision-Language-Action Models"
  type: paper
  arxiv: "2610.39543"
  year: 2026
  project: https://onlyxingxingzyx.github.io/CoRAct/
  added: 2026-11-02
  tags: [chain-of-thought, noise-optimization, real]
  takeaway_en: "CoRAct turns a VLA's stated movement and waypoints into checkable signals, then steers action noise toward agreeing with them, so actions align with the reasoning. Tested on RoboCasa, VLABench and real tasks."
  takeaway_zh: "CoRAct 把 VLA 思维链中的运动意图与路点变成可验证信号，再用一致性奖励优化初始动作噪声，让动作真正对齐推理，而不只是以推理为条件。在 RoboCasa、VLABench 与真实任务上测试。"

- title: "Embodied at Sea: Imitation Learning for Multi-Task Underwater Manipulation"
  type: paper
  arxiv: "2610.38199"
  year: 2026
  project: https://lair-research-nyu.github.io/Embodied-at-Sea/
  added: 2026-11-02
  tags: [underwater, field-robotics, act, real]
  takeaway_en: "Trains VLA models on 1,616 underwater episodes and grades 1,260 pool rollouts, best model 93.3% including partial successes. In a field case study at a WWII wreck, single-task ACT beat generalist SmolVLA 47.9% to 7.9%."
  takeaway_zh: "用 1616 条水下数据训练 VLA，并在水池评估 1260 次，最佳模型成功率 93.3%（含部分成功）。在二战沉船实地案例中，单任务 ACT 以 47.9% 对 7.9% 明显胜过通用的 SmolVLA。"

- title: "Being-H0.5: Scaling Human-Centric Robot Learning for Cross-Embodiment Generalization"
  type: paper
  arxiv: "2601.12993"
  year: 2026
  org: BeingBeyond
  venue: CoRL 2026
  code: https://github.com/BeingBeyond/Being-H
  project: https://research.beingbeyond.com/being-h05
  added: 2026-11-02
