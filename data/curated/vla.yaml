  takeaway_zh: 在训练完成后为单个 VLA 策略加上轻量的核方差头（基于训练示教嵌入的高斯过程方差）来估计认知不确定性，无需训练和运行策略集成，让机器人知道何时该求助或补充示教。
- title: "When One Step Is Enough: An Empirical Study of Euler Integration in Flow-Matching Policies"
  type: paper
  arxiv: "2610.30735"
  year: 2026
  venue: CoRL 2026
  added: 2026-10-23
  topics: [learning]
  tags: [flow-matching, inference-speed, empirical-study]
  takeaway_en: Tests six flow-matching VLAs and reports that one-step Euler action generation largely matches multi-step sampling at scale — a useful check before adding special one-shot objectives to speed up control (CoRL 2026).
  takeaway_zh: 在六个基于流匹配的 VLA 上实验，报告单步 Euler 生成动作在规模足够时与多步采样效果基本相当——在为提速引入专门的单步生成目标之前值得先看（CoRL 2026）。
- title: "VLA-Rolling: Fewer Denoising Steps, Better Control via Adaptive Action Reuse"
  type: paper
  arxiv: "2610.25043"
  year: 2026
  code: https://github.com/ZJU-OmniAI/VLA-Rolling
  project: https://chenbao123ww.github.io/VLA-Rolling/
  added: 2026-10-23
  topics: [vla]
  tags: [flow-matching, inference-speed, action-chunking, training-free-backbone]
  takeaway_en: Reuses the unexecuted tail of a flow-matching VLA's action chunk to start the next one, with a small confidence model setting how much to re-denoise; reports lower inference cost on π0.5, SmolVLA and others.
  takeaway_zh: 流匹配 VLA 每次只执行动作块的前几步，剩余部分通常丢弃；本文把这段"动作尾巴"作为下一块的起点，并用小型置信度模型决定还需去噪多少步；论文报告在 π0.5、SmolVLA 等模型上降低推理开销。
- title: "Has GPT-6-Astra Achieved Embodied Intelligence?"
  type: paper
  arxiv: "2610.22471"
  year: 2026
  org: SenseNova, ACE Robotics, Ropedia, NTU, UTokyo
  project: https://github.com/OpenSenseNova/SenseNova-RoboRSI
