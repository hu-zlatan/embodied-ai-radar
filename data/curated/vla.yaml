  added: 2026-10-26
  topics: [manipulation]
  tags: [sim, agentic, harness, llm, failure-recovery, frozen-policy]
  takeaway_en: "Harness where a frontier LLM reviews a frozen π0.5 policy less often as experience builds up and focuses on recovery after errors; reports ~57% fewer reviewer tokens and higher success on four sim tasks."
  takeaway_zh: 让前沿大模型监督冻结的 π0.5 策略的执行框架：随着经验积累逐步减少审查频率，并把监督集中在出错后的恢复上；报告在四个仿真任务上审查 token 平均减少约 57%，成功率也更高。
- title: "Vision-Language-Delta-Action: Learning Compact Deltas as Actionable Transition Interfaces for Robotic Manipulation"
