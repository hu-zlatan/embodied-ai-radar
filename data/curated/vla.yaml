  takeaway_en: "CoRL 2026 Oral. Cross-embodiment VLA that treats human interaction traces as a shared language, pre-trained on UniHand-2.0: over 35,000 hours of multimodal data across 30 robot embodiments."
  takeaway_zh: "CoRL 2026 Oral。跨形态 VLA，把人类交互轨迹当作通用“母语”，在 UniHand-2.0 上预训练：超过 3.5 万小时多模态数据，覆盖 30 种机器人形态。"

- title: "RoboTTT: Context Scaling for Robot Policies"
  type: paper
  arxiv: "2607.15275"
  year: 2026
  org: NVIDIA
  venue: CoRL 2026
  project: https://research.nvidia.com/labs/gear/robottt/
  added: 2026-11-02
  tags: [long-context, test-time-training, one-shot-imitation]
  takeaway_en: "CoRL 2026 Oral. Test-Time-Training policies scale visuomotor context to 8K timesteps, three orders of magnitude longer, without added inference latency, enabling one-shot imitation from human video."
  takeaway_zh: "CoRL 2026 Oral。Test-Time-Training 策略把视觉运动上下文扩展到 8K 时间步，长出三个数量级且不增加推理延迟，由此支持从人类视频单次模仿等新能力。"

- title: "$π_{0.7}$: a Steerable Generalist Robotic Foundation Model with Emergent Capabilities"
  type: paper
  arxiv: "2604.15483"
  year: 2026
  org: Physical Intelligence
  venue: CoRL 2026
