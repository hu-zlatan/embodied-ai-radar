  year: 2026
  code: https://github.com/lyfeng001/Echo-Sim
  project: https://lyfeng001.github.io/Echo/
  added: 2026-10-27
  topics: [manipulation]
  tags: [vla, failure-detection, recovery, diffusion, real]
  takeaway_en: "Teaches a VLA to know when it is done or failing: stop and failure signals are two extra action dimensions, denoised faster than the actions so they can guide them; no frame-level progress labels. Real-robot tests."
  takeaway_zh: "让 VLA 自己判断任务完成或失败：把停止与失败信号作为动作块的两个额外维度，与动作一起去噪且去噪更快，从而引导后续动作生成；无需逐帧进度标注，在真机操作实验中验证。"
- title: "Multi-View Latent Action Pretraining for Cross-Embodiment Robot Learning from Videos"
