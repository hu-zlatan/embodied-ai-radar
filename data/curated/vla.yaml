  takeaway_en: A 1.2B diffusion Transformer with a unified action space across robots, targeted at bimanual manipulation.
  takeaway_zh: 12 亿参数扩散 Transformer，采用跨机器人统一动作空间，面向双臂操作。
- title: "GR00T N1: An Open Foundation Model for Generalist Humanoid Robots"
  type: paper
  arxiv: "2503.14734"
  year: 2025
  org: NVIDIA
  code: https://github.com/NVIDIA/Isaac-GR00T
  tags: [real, sim, humanoid, open-weights]
  takeaway_en: A dual-system (VLM "slow" + diffusion "fast") humanoid policy trained on real, human-video and synthetic data.
  takeaway_zh: 双系统（VLM 慢思考 + 扩散快执行）人形机器人策略，用真实、人类视频与合成数据训练。
- title: "SmolVLA: A Vision-Language-Action Model for Affordable and Efficient Robotics"
  type: paper
