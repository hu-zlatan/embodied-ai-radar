- title: "VLA-Rolling: Fewer Denoising Steps, Better Control via Adaptive Action Reuse"
  type: paper
  arxiv: "2610.25043"
  year: 2026
  code: https://github.com/ZJU-OmniAI/VLA-Rolling
  project: https://chenbao123ww.github.io/VLA-Rolling/
  added: 2026-10-23
  topics: [vla]
  tags: [flow-matching, inference-speed, action-chunking, training-free-backbone]
  takeaway_en: Reuses the unexecuted tail of a flow-matching VLA's action chunk to start the next one, with a small confidence model setting how much to re-denoise; reports lower inference cost on π0.5, SmolVLA and others.
