  project: https://zju-omniai.github.io/VLA-Delta/
  added: 2026-10-19
  tags: [state-transition, auxiliary-supervision]
  takeaway_en: Argues VLAs overfit observation→action pairs and adds explicit supervision of the physical state change an action should cause, rather than predicting future states in language or pixels.
  takeaway_zh: 认为 VLA 容易过拟合“观测→动作”的对应关系，因此显式监督动作应引起的物理状态变化，而不是在语言或像素空间里预测未来状态。
