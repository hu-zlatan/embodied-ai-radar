  takeaway_zh: "融合多路同步相机视角的潜在动作模型（LAM），用交叉注意力解决深度与遮挡问题；报告 6D 动作可解码性比单视角高 17%，下游策略成功率提升 13.5%（单视角为 6.2%），真机上用人手演示也比纯动作策略高 20%。"
- title: "Vision-Language-Action or World-Action? Just Action Models"
