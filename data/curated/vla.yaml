  takeaway_zh: 从 3 万小时人类、机器人与仿真视频中学习带 3D 约束的连续潜在动作（RynnLAM），用于预训练 4B 参数 VLA，再适配到具体机器人动作空间。报告 LIBERO 98.8%、RoboTwin 2.0 平均 88.6%。
- title: "VISTA: Active Exploration for Self-Improvement in Embodied Agents"
