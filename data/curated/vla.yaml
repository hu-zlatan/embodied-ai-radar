  takeaway_zh: 在单一移动双臂机器人（R1 Lite）上采集约 500 小时、10 万条轨迹、覆盖 50 个真实场景，并提出 G0：VLM 规划器 + 流匹配 VLA 执行器的双系统模型；论文报告单本体预训练对少样本迁移最关键。
- title: "RoboOS: A Hierarchical Embodied Framework for Cross-Embodiment and Multi-Agent Collaboration"
