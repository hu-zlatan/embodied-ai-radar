  arxiv: "2610.25874"
  year: 2026
  code: https://github.com/baidu-baige/LoongForge/tree/master/cookbook/loongforge-vlda
  added: 2026-10-26
  topics: [world-models, manipulation]
  tags: [latent-dynamics, action-refinement, open-framework]
  takeaway_en: "Between direct action prediction and full video prediction: VLDA learns a compact latent 'Delta' of task-relevant state change and uses it to seed action denoising. Built on Baidu's open LoongForge."
  takeaway_zh: 介于直接预测动作与完整预测未来画面之间：VLDA 学习一个紧凑的隐变量 Delta 表示与任务相关的状态变化，并用它引导动作去噪；实现于百度开源训练框架 LoongForge。
- title: "Coupling Execution Horizon and Sampling Depth in Flow-Matching VLA Policies"
  type: paper
  arxiv: "2610.32102"
  year: 2026
