  takeaway_en: "Report: GPT-6-Astra drives a robot on EBench via waypoints or by calling a VLA/WAM policy. Direct control leads on short tasks, trails on long-horizon and contact-rich ones; calling a policy cuts token cost."
  takeaway_zh: 评测报告：在 EBench 上让 GPT-6-Astra 直接输出路径点控制机器人，或通过执行框架调用 VLA/WAM 策略。直接控制在短时任务上领先，但在长时程与接触密集任务上落后；调用策略可显著减少 token 开销。
- title: "Robot-Aligned 3D Gaussian Splatting for Precise Reaching with Wrist-Camera VLA Policies"
