  takeaway_zh: "小米具身智能团队的轻量统一具身智能体：在操作与导航中负责任务理解、规划、进度跟踪和失败恢复，由更强的教师模型多教师在线蒸馏而来，并配有基于评分细则的自我改进数据飞轮。"
- title: "ThinkWorld: World Imagination Reinforces Chain-of-Dynamics Reasoning"
  type: paper
  arxiv: "2610.37666"
  year: 2026
  org: NVIDIA
  project: https://thinkworld-project.github.io/
  added: 2026-10-28
  topics: [world-models, learning]
  tags: [vla, human-video, motion-tokens, reinforcement-learning, cross-embodiment, real]
  takeaway_en: "VLA that reasons in discrete motion tokens (a chain of dynamics) shared across embodiments; predicted futures are scored against what actually happened, so action-free human videos give RL signal. Sim and real tests."
  takeaway_zh: "VLA 用跨本体共享的离散运动 token 链（Chain-of-Dynamics）表达动作思考；预测每条链导致的未来并与真实结果比对来强化，使没有动作标注的人类视频也能提供监督。在仿真与真机上验证人到机器人的迁移。"
