- title: "LEAP Hand: Low-Cost, Efficient, and Anthropomorphic Hand for Robot Learning"
  type: hardware
  arxiv: "2309.06440"
  year: 2023
  org: CMU
  project: https://leaphand.com/
  highlight: true
  topics: [manipulation]
  tags: [hand, low-cost, open-source]
  takeaway_en: A 16-DoF dexterous hand buildable for about $2,000 from off-the-shelf parts.
  takeaway_zh: 16 自由度灵巧手，用现成零件约 2000 美元即可搭建。
- title: "GELLO: A General, Low-Cost, and Intuitive Teleoperation Framework for Robot Manipulators"
  type: hardware
  arxiv: "2309.13037"
  year: 2023
  org: UC Berkeley
  code: https://github.com/wuphilipp/gello_software
  tags: [teleoperation, low-cost, 3d-printed]
  takeaway_en: 3D-printed kinematic replicas of robot arms for cheap, intuitive joint-space teleoperation.
  takeaway_zh: 3D 打印的机械臂运动学复刻件，实现低成本、直观的关节空间遥操作。
- title: "Open-TeleVision: Teleoperation with Immersive Active Visual Feedback"
  type: hardware
  arxiv: "2407.01512"
  year: 2024
  org: UC San Diego, MIT
  code: https://github.com/OpenTeleVision/TeleVision
  topics: [locomotion]
  tags: [teleoperation, vr, humanoid]
  takeaway_en: VR teleoperation with an actively steered stereo camera, used to collect humanoid manipulation data.
  takeaway_zh: 带主动转向立体相机的 VR 遥操作系统，用于采集人形机器人操作数据。
- title: "Berkeley Humanoid: A Research Platform for Learning-based Control"
  type: hardware
  arxiv: "2407.21781"
  year: 2024
  org: UC Berkeley
  topics: [locomotion]
  tags: [humanoid, low-cost]
  takeaway_en: A mid-size, low-cost humanoid designed for easy sim-to-real transfer of RL locomotion.
  takeaway_zh: 中等尺寸、低成本的人形机器人，专为强化学习运动策略的 sim-to-real 迁移设计。
- title: "SO-ARM100 / SO-101"
  type: hardware
  year: 2024
  org: The Robot Studio, Hugging Face
  code: https://github.com/TheRobotStudio/SO-ARM100
  tags: [arm, low-cost, 3d-printed, open-source]
  takeaway_en: An open 3D-printed 6-DoF arm (leader + follower) costing roughly $100–200 per arm; the default LeRobot starter kit.
  takeaway_zh: 开源 3D 打印 6 自由度机械臂（主从臂），每只约 100–200 美元，是 LeRobot 的默认入门套件。
- title: "ToddlerBot: Open-Source ML-Compatible Humanoid Platform for Loco-Manipulation"
  type: hardware
  arxiv: "2502.00893"
  year: 2025
  org: Stanford
  project: https://toddlerbot.github.io/
  topics: [locomotion]
  tags: [humanoid, low-cost, open-source, 3d-printed]
  takeaway_en: A small, 3D-printed open-source humanoid with a matching simulation model, built so that ML policies and teleoperated data transfer to the real robot.
  takeaway_zh: 3D 打印的小型开源人形机器人，配套仿真模型，便于机器学习策略与遥操作数据迁移到真机。
- title: "BEHAVIOR Robot Suite: Streamlining Real-World Whole-Body Manipulation for Everyday Household Activities"
  type: hardware
  arxiv: "2503.05652"
  year: 2025
  org: Stanford
  project: https://behavior-robot-suite.github.io/
  topics: [manipulation]
  tags: [mobile-manipulation, whole-body, teleoperation, bimanual]
  takeaway_en: A whole-body teleoperation interface plus a learning method for a wheeled bimanual robot doing long household tasks that need reach, balance and navigation.
  takeaway_zh: 面向轮式双臂机器人的全身遥操作接口与学习方法，用于需要伸展、平衡与导航的长程家务任务。
- title: "ALOHA 2: An Enhanced Low-Cost Hardware for Bimanual Teleoperation"
  type: hardware
  arxiv: "2405.02292"
  year: 2024
  org: Google DeepMind
  project: https://aloha-2.github.io/
  topics: [manipulation]
  tags: [bimanual, teleoperation, low-cost, open-source]
  takeaway_en: Upgraded ALOHA bimanual rig (stronger grippers, gravity compensation, sturdier frame) with open hardware designs and a MuJoCo model for simulation.
  takeaway_zh: ALOHA 双臂平台的升级版（更强夹爪、重力补偿、更稳固的框架），开源硬件设计并提供 MuJoCo 仿真模型。
- title: "The Design of Stretch: A Compact, Lightweight Mobile Manipulator for Indoor Human Environments"
  type: hardware
  arxiv: "2109.10892"
  year: 2021
  org: Hello Robot
  topics: [navigation]
  tags: [mobile-manipulator, home, assistive]
  takeaway_en: The design of Hello Robot's Stretch — a slim, lightweight mobile manipulator with a telescoping arm on a lift, built for homes and used widely in home-robot research.
  takeaway_zh: Hello Robot 的 Stretch 设计：在升降柱上装伸缩臂的轻巧移动操作机器人，面向家庭环境，被大量家庭机器人研究采用。
