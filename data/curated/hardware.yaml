- title: "LEAP Hand: Low-Cost, Efficient, and Anthropomorphic Hand for Robot Learning"
  type: hardware
  arxiv: "2309.06440"
  year: 2023
  org: CMU
  project: https://leaphand.com/
  highlight: true
  topics: [manipulation]
  tags: [hand, low-cost, open-source]
  takeaway_en: A 16-DoF dexterous hand buildable for about $2,000 from off-the-shelf parts.
  takeaway_zh: 16 自由度灵巧手，用现成零件约 2000 美元即可搭建。
- title: "GELLO: A General, Low-Cost, and Intuitive Teleoperation Framework for Robot Manipulators"
  type: hardware
  arxiv: "2309.13037"
  year: 2023
  org: UC Berkeley
  code: https://github.com/wuphilipp/gello_software
  tags: [teleoperation, low-cost, 3d-printed]
  takeaway_en: 3D-printed kinematic replicas of robot arms for cheap, intuitive joint-space teleoperation.
  takeaway_zh: 3D 打印的机械臂运动学复刻件，实现低成本、直观的关节空间遥操作。
- title: "Open-TeleVision: Teleoperation with Immersive Active Visual Feedback"
  type: hardware
  arxiv: "2407.01512"
  year: 2024
  org: UC San Diego, MIT
  code: https://github.com/OpenTeleVision/TeleVision
  topics: [locomotion]
  tags: [teleoperation, vr, humanoid]
  takeaway_en: VR teleoperation with an actively steered stereo camera, used to collect humanoid manipulation data.
  takeaway_zh: 带主动转向立体相机的 VR 遥操作系统，用于采集人形机器人操作数据。
- title: "Berkeley Humanoid: A Research Platform for Learning-based Control"
  type: hardware
  arxiv: "2407.21781"
  year: 2024
  org: UC Berkeley
  topics: [locomotion]
  tags: [humanoid, low-cost]
  takeaway_en: A mid-size, low-cost humanoid designed for easy sim-to-real transfer of RL locomotion.
  takeaway_zh: 中等尺寸、低成本的人形机器人，专为强化学习运动策略的 sim-to-real 迁移设计。
- title: "Demonstrating Berkeley Humanoid Lite: An Open-source, Accessible, and Customizable 3D-printed Humanoid Robot"
  type: hardware
  arxiv: "2504.17249"
  year: 2025
  org: UC Berkeley
  venue: RSS 2025
  project: https://lite.berkeley-humanoid.org
  code: https://github.com/HybridRobotics/Berkeley-Humanoid-Lite
  topics: [locomotion]
  tags: [humanoid, open-source, 3d-printed, low-cost]
  takeaway_en: Open-source humanoid with 3D-printed modular gearboxes, buildable for under US$5,000; hardware designs, embedded code and training code are released.
  takeaway_zh: 开源人形机器人，采用 3D 打印的模块化减速器，在美国可用不到 5000 美元搭建；硬件设计、嵌入式代码与训练框架均已开源。
- title: "SO-ARM100 / SO-101"
  type: hardware
  year: 2024
  org: The Robot Studio, Hugging Face
  code: https://github.com/TheRobotStudio/SO-ARM100
  tags: [arm, low-cost, 3d-printed, open-source]
  takeaway_en: An open 3D-printed 6-DoF arm (leader + follower) costing roughly $100–200 per arm; the default LeRobot starter kit.
  takeaway_zh: 开源 3D 打印 6 自由度机械臂（主从臂），每只约 100–200 美元，是 LeRobot 的默认入门套件。
- title: "ToddlerBot: Open-Source ML-Compatible Humanoid Platform for Loco-Manipulation"
  type: hardware
  arxiv: "2502.00893"
  year: 2025
  org: Stanford
  project: https://toddlerbot.github.io/
  topics: [locomotion]
  tags: [humanoid, low-cost, open-source, 3d-printed]
  takeaway_en: A small, 3D-printed open-source humanoid with a matching simulation model, built so that ML policies and teleoperated data transfer to the real robot.
  takeaway_zh: 3D 打印的小型开源人形机器人，配套仿真模型，便于机器学习策略与遥操作数据迁移到真机。
- title: "BEHAVIOR Robot Suite: Streamlining Real-World Whole-Body Manipulation for Everyday Household Activities"
  type: hardware
  arxiv: "2503.05652"
  year: 2025
  org: Stanford
  project: https://behavior-robot-suite.github.io/
  topics: [manipulation]
  tags: [mobile-manipulation, whole-body, teleoperation, bimanual]
  takeaway_en: A whole-body teleoperation interface plus a learning method for a wheeled bimanual robot doing long household tasks that need reach, balance and navigation.
  takeaway_zh: 面向轮式双臂机器人的全身遥操作接口与学习方法，用于需要伸展、平衡与导航的长程家务任务。
- title: "ALOHA 2: An Enhanced Low-Cost Hardware for Bimanual Teleoperation"
  type: hardware
  arxiv: "2405.02292"
  year: 2024
  org: Google DeepMind
  project: https://aloha-2.github.io/
  topics: [manipulation]
  tags: [bimanual, teleoperation, low-cost, open-source]
  takeaway_en: Upgraded ALOHA bimanual rig (stronger grippers, gravity compensation, sturdier frame) with open hardware designs and a MuJoCo model for simulation.
  takeaway_zh: ALOHA 双臂平台的升级版（更强夹爪、重力补偿、更稳固的框架），开源硬件设计并提供 MuJoCo 仿真模型。
- title: "The Design of Stretch: A Compact, Lightweight Mobile Manipulator for Indoor Human Environments"
  type: hardware
  arxiv: "2109.10892"
  year: 2021
  org: Hello Robot
  topics: [navigation]
  tags: [mobile-manipulator, home, assistive]
  takeaway_en: The design of Hello Robot's Stretch — a slim, lightweight mobile manipulator with a telescoping arm on a lift, built for homes and used widely in home-robot research.
  takeaway_zh: Hello Robot 的 Stretch 设计：在升降柱上装伸缩臂的轻巧移动操作机器人，面向家庭环境，被大量家庭机器人研究采用。
- title: "ORCA: An Open-Source, Reliable, Cost-Effective, Anthropomorphic Robotic Hand for Uninterrupted Dexterous Task Learning"
  type: hardware
  arxiv: "2504.04259"
  year: 2025
  org: ETH Zurich
  project: https://www.orcahand.com
  topics: [manipulation, tactile]
  tags: [hand, open-source, tendon-driven, low-cost]
  takeaway_en: A 3D-printable, 17-DoF tendon-driven hand with fingertip tactile sensing, under CHF 2,000 in materials; design files and code are open, and the paper reports long continuous runs for teleoperation and learning.
  takeaway_zh: 可 3D 打印的 17 自由度腱驱动灵巧手，指尖带触觉传感，材料成本低于 2000 瑞士法郎；设计文件与代码开源，论文报告了可长时间连续运行用于遥操作与学习。
- title: "HOMIE: Humanoid Loco-Manipulation with Isomorphic Exoskeleton Cockpit"
  type: hardware
  arxiv: "2502.13013"
  year: 2025
  org: Shanghai AI Lab · CUHK
  venue: RSS 2025
  project: https://homietele.github.io/
  topics: [locomotion]
  tags: [teleoperation, humanoid, exoskeleton, low-cost]
  takeaway_en: Open-source whole-body humanoid teleoperation — an arm exoskeleton plus motion-sensing gloves, with a foot pedal steering an RL walking controller; the cockpit hardware costs about US$500.
  takeaway_zh: 开源的人形机器人全身遥操作系统：手臂外骨骼加动作捕捉手套，脚踏板驱动强化学习行走控制器；整套座舱硬件约 500 美元。
- title: "AnyTeleop: A General Vision-Based Dexterous Robot Arm-Hand Teleoperation System"
  type: hardware
  arxiv: "2307.04577"
  year: 2023
  org: UC San Diego, NVIDIA
  venue: RSS 2023
  topics: [manipulation]
  tags: [teleoperation, hand, vision-based, retargeting]
  takeaway_en: Camera-only teleoperation for arm + dexterous hand pairs - tracks the operator's hand and retargets it to many different robot hands, in sim or on real hardware.
  takeaway_zh: 仅用相机即可遥操作"机械臂 + 灵巧手"：跟踪操作者手部并重定向到多种不同的机器人手，可用于仿真或真机。
- title: "AirExo: Low-Cost Exoskeletons for Learning Whole-Arm Manipulation in the Wild"
  type: hardware
  arxiv: "2309.14975"
  year: 2023
  org: Shanghai Jiao Tong University
  code: https://github.com/AirExo/collector
  venue: ICRA 2024
  topics: [manipulation]
  tags: [exoskeleton, teleoperation, low-cost, data-collection]
  takeaway_en: A portable dual-arm exoskeleton (about $600 in parts, per the paper) for joint-level teleop and cheap in-the-wild demos; reports few-minute teleop plus wild data rivals much longer teleop-only training.
  takeaway_zh: 便携式双臂外骨骼（论文称零件成本约 600 美元），可做关节级遥操作并低成本采集野外示教；报告称少量遥操作数据加野外数据即可达到甚至超过长时间纯遥操作训练的效果。
- title: "AirExo-2: Scaling up Generalizable Robotic Imitation Learning with Low-Cost Exoskeletons"
  type: hardware
  arxiv: "2503.03081"
  year: 2025
  org: Shanghai Jiao Tong University
  code: https://github.com/AirExo/AirExo-2
  venue: CoRL 2025
  topics: [manipulation, learning]
  tags: [exoskeleton, in-the-wild, imitation-learning]
  takeaway_en: Exoskeleton demos are converted into pseudo-robot demonstrations; the paper reports its RISE-2 policy trained on them alone, with no robot data, performs comparably to one trained on teleoperated robot data.
  takeaway_zh: 将外骨骼示教转换为“伪机器人”示教；论文报告仅用这些数据（无任何机器人数据）训练的 RISE-2 策略，效果与用遥操作机器人数据训练的策略相当。
- title: "Bunny-VisionPro: Real-Time Bimanual Dexterous Teleoperation for Imitation Learning"
  type: hardware
  arxiv: "2407.03162"
  year: 2024
  org: UC San Diego, HKU
  code: https://github.com/Dingry/BunnyVisionPro
  topics: [manipulation]
  tags: [teleoperation, vr, hand, bimanual, haptics]
  takeaway_en: Apple Vision Pro teleoperation of two dexterous robot hands with real-time retargeting, collision and singularity avoidance, and low-cost vibration haptics for the operator.
  takeaway_zh: 用 Apple Vision Pro 实时遥操作双灵巧手，带实时重定向、碰撞与奇异点规避，并为操作者提供低成本振动触觉反馈。
- title: "TeleMoMa: A Modular and Versatile Teleoperation System for Mobile Manipulation"
  type: hardware
  arxiv: "2403.07869"
  year: 2024
  org: UT Austin, Stanford, Sony AI
  code: https://github.com/UT-Austin-RobIn/telemoma
  project: https://robin-lab.cs.utexas.edu/telemoma-web/
  topics: [manipulation]
  tags: [teleoperation, mobile-manipulation, whole-body]
  takeaway_en: One modular teleop interface that mixes RGB-D body tracking, VR controllers, keyboard and joystick for whole-body mobile manipulators (Tiago++, HSR, Fetch), in sim and real.
  takeaway_zh: 模块化遥操作接口，可组合 RGB-D 人体追踪、VR 手柄、键盘与摇杆，控制 Tiago++、HSR、Fetch 等移动操作机器人做全身动作，仿真和真机都支持。
- title: "An Open Torque-Controlled Modular Robot Architecture for Legged Locomotion Research"
  type: hardware
  arxiv: "1910.00093"
  year: 2019
  org: MPI-IS, NYU (Open Dynamic Robot Initiative)
  code: https://github.com/open-dynamic-robot-initiative/open_robot_actuator_hardware
  topics: [locomotion]
  tags: [quadruped, open-source, torque-control, low-cost]
  takeaway_en: The open-source Solo quadruped and its modular torque-controlled actuators, built from off-the-shelf and 3D-printed parts so labs can reproduce a dynamic legged robot.
  takeaway_zh: 开源四足机器人 Solo 及其模块化力矩控制关节，采用现成件和 3D 打印件，便于各实验室复现动态腿式机器人。
- title: "DexUMI: Using Human Hand as the Universal Manipulation Interface for Dexterous Manipulation"
  type: paper
  arxiv: "2505.21864"
  year: 2025
  org: Stanford, Columbia, CMU, NVIDIA
  venue: CoRL 2025
  code: https://github.com/real-stanford/DexUMI
  project: https://dex-umi.github.io/
  topics: [manipulation]
  tags: [real, exoskeleton, data-collection, dexterous-hand, inpainting]
  takeaway_en: DexUMI — an exoskeleton matched to the robot hand's fingertip workspace, plus inpainting that swaps the human hand for the robot's; reports 86% average success (Inspire, XHand) and ~3.2× faster collection than teleop.
  takeaway_zh: DexUMI：按目标机器人手的指尖工作空间设计的可穿戴手部外骨骼，再用视频修补把画面中的人手换成机器人手；论文报告在 Inspire 与 XHand 上平均成功率 86%，采集效率约为遥操作的 3.2 倍。
- title: "ACE: A Cross-Platform Visual-Exoskeletons System for Low-Cost Dexterous Teleoperation"
  type: paper
  arxiv: "2408.11805"
  year: 2024
  venue: CoRL 2024
  project: https://ace-teleop.github.io/
  tags: [real, teleoperation, exoskeleton, low-cost, humanoid]
  takeaway_en: ACE — a 3D-printed bimanual exoskeleton for wrist pose plus hand-facing webcams for finger pose (about $600); one setup teleoperates arm-hand systems, humanoids and quadruped-mounted arms.
  takeaway_zh: ACE：3D 打印的双臂外骨骼获取手腕位姿、朝向手部的摄像头估计手指姿态（约 600 美元）；同一套设备可遥操作机械臂+灵巧手、人形机器人以及四足搭载的机械臂。
- title: "Learning Visuotactile Skills with Two Multifingered Hands"
  type: hardware
  arxiv: "2404.16823"
  year: 2024
  org: UC Berkeley
  venue: ICRA 2025
  code: https://github.com/ToruOwO/hato
  project: https://toruowo.github.io/hato/
  topics: [tactile, manipulation]
  tags: [bimanual, dexterous-hand, teleoperation, touch, low-cost]
  takeaway_en: HATO — bimanual setup from two UR5e arms and repurposed prosthetic hands with fingertip touch sensors, VR teleop for data collection, and visuotactile policies for tasks like pouring and handovers.
  takeaway_zh: HATO：用两台 UR5e 机械臂和改装的假肢手（指尖带触觉传感器）搭建双臂系统，用 VR 遥操作采集数据，并训练视觉-触觉策略完成倒酒、交接等任务。
