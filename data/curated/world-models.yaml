  takeaway_zh: "CoRL 2026 Spotlight。将分块世界模型用作训练期可微评估器的模型式强化学习，针对累积误差、推理延迟与 BPTT 不稳定问题。"

- title: "Targeting World Models to Compromise Robot Learning Pipelines"
