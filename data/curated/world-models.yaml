  takeaway_zh: "参数不到 1 亿的紧凑世界动作模型：在冻结 DINOv3 特征空间中预测两个未来时刻的 token 并直接回归动作块，无需机器人或视频预训练；报告在 RoboTwin 2.0 上超过十亿参数级 WAM。"
- title: "TAPESTRY: A Single Backbone for Video Generation and Robot Control"
  type: paper
  arxiv: "2610.36823"
  year: 2026
  venue: CoRL 2026
  project: https://tapestry-wam.github.io
  added: 2026-10-28
  topics: [manipulation]
  tags: [wam, video-diffusion, action-tokens, real, sim]
