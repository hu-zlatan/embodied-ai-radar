  takeaway_zh: "CoRL 2026 Oral。DreamZero：基于预训练视频扩散骨干的世界动作模型，联合预测视频与动作，可从异构机器人数据学习技能，无需重复示范。"

- title: "Chunk-wise Model-based Policy Optimization"
