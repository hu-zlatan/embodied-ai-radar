- title: "World Models"
  type: paper
  arxiv: "1803.10122"
  year: 2018
  org: Google Brain, IDSIA
  project: https://worldmodels.github.io/
  tags: [sim, model-based-rl, vae, rnn]
  takeaway_en: The classic VAE + RNN agent that learns a compressed model of its environment and trains a controller inside the "dream".
  takeaway_zh: 经典的 VAE + RNN 智能体，学习环境的压缩模型并在"梦境"中训练控制器。
- title: "Mastering Diverse Domains through World Models"
  type: paper
  arxiv: "2301.04104"
  year: 2023
  org: Google DeepMind
  code: https://github.com/danijar/dreamerv3
  highlight: true
  tags: [sim, model-based-rl]
  takeaway_en: DreamerV3 — one set of hyperparameters works across 150+ tasks, including collecting diamonds in Minecraft from scratch.
  takeaway_zh: DreamerV3：一套超参数适用于 150 多个任务，包括从零开始在《我的世界》中挖到钻石。
- title: "DayDreamer: World Models for Physical Robot Learning"
  type: paper
  arxiv: "2206.14176"
  year: 2022
  org: UC Berkeley
  tags: [real, quadruped, arm, model-based-rl]
  takeaway_en: Dreamer trained directly on real robots — a quadruped learns to walk in about an hour with no simulator.
  takeaway_zh: 直接在真实机器人上训练 Dreamer——四足机器人无需仿真器，约一小时学会行走。
- title: "Learning Interactive Real-World Simulators"
  type: paper
  arxiv: "2310.06114"
  year: 2023
  org: UC Berkeley, Google DeepMind
  tags: [video-generation, simulator]
  takeaway_en: UniSim — an action-conditioned video model used as a simulator to train policies that transfer to the real world.
  takeaway_zh: UniSim：以动作为条件的视频生成模型充当仿真器，训练出的策略可迁移到真实世界。
- title: "Genie: Generative Interactive Environments"
  type: paper
  arxiv: "2402.15391"
  year: 2024
  org: Google DeepMind
  tags: [video-generation, latent-actions]
  takeaway_en: Learns playable environments and latent actions from unlabeled internet videos alone.
  takeaway_zh: 仅从无标注的网络视频中学习可交互环境与潜在动作。
- title: "Cosmos World Foundation Model Platform for Physical AI"
  type: paper
  arxiv: "2501.03575"
  year: 2025
  org: NVIDIA
  tags: [video-generation, open-weights, synthetic-data]
  takeaway_en: Open video world foundation models plus tokenizers and data pipelines for generating physical-AI training data.
  takeaway_zh: 开放的视频世界基础模型及分词器与数据管线，用于生成物理 AI 训练数据。
- title: "V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning"
  type: paper
  arxiv: "2506.09985"
  year: 2025
  org: Meta AI
  tags: [representation, planning, real, arm]
  takeaway_en: A self-supervised video encoder, post-trained with a little robot data, plans zero-shot pick-and-place by latent prediction.
  takeaway_zh: 自监督视频编码器经少量机器人数据后训练，通过潜空间预测实现零样本抓放规划。
- title: "Dream to Control: Learning Behaviors by Latent Imagination"
  type: paper
  arxiv: "1912.01603"
  year: 2019
  org: University of Toronto, Google
  tags: [model-based-rl, latent-dynamics]
  takeaway_en: The first Dreamer — learns a latent world model from pixels and trains the policy entirely on imagined rollouts.
  takeaway_zh: 第一代 Dreamer：从像素学习潜空间世界模型，并完全在想象的轨迹上训练策略。
- title: "TD-MPC2: Scalable, Robust World Models for Continuous Control"
  type: paper
  arxiv: "2310.16828"
  year: 2023
  org: UC San Diego
  code: https://github.com/nicklashansen/tdmpc2
  topics: [control]
  tags: [model-based-rl, mpc, multitask]
  takeaway_en: An implicit (decoder-free) world model planned with MPC; one set of hyperparameters works across many continuous-control tasks and scales to a multitask agent.
  takeaway_zh: 无解码器的隐式世界模型配合 MPC 规划；同一组超参数适用于大量连续控制任务，并可扩展为多任务智能体。
- title: "DINO-WM: World Models on Pre-trained Visual Features enable Zero-shot Planning"
  type: paper
  arxiv: "2411.04983"
  year: 2024
  org: NYU
  code: https://github.com/gaoyuezhou/dino_wm
  tags: [planning, representation, offline]
  takeaway_en: Predicts future DINOv2 patch features instead of pixels, so a world model trained on offline data can plan to new visual goals at test time.
  takeaway_zh: 预测未来的 DINOv2 图像块特征而非像素，使基于离线数据训练的世界模型能在测试时规划到新的视觉目标。
- title: "Ropedia W0: Scaling Loco-Manipulation World Models across Embodiments with Human Experience"
  type: paper
  arxiv: "2610.26855"
  year: 2026
  code: https://github.com/Ropedia/ropedia-w0
  url: https://ropedia.github.io/ropedia-w0/
  project: https://ropedia.github.io/ropedia-w0/
  added: 2026-10-20
  tags: [egocentric, human-data, cross-embodiment, loco-manipulation]
  takeaway_en: An egocentric world model covering both walking and manipulating, trained on ~10k hours of human video plus ~3k hours of robot data under one shared kinematic action representation.
  takeaway_zh: 同时覆盖移动与操作的第一人称世界模型，在约 1 万小时人类视频和约 3 千小时机器人数据上训练，用统一的运动学表示描述不同本体的动作。
- title: "Robotic Video World Models: A Survey of Applications, Research Challenges, Future Directions"
  type: paper
  arxiv: "2601.07823"
  year: 2026
  code: https://github.com/irom-princeton/awesome-robotics-video-world-model-papers
  added: 2026-10-21
  tags: [survey, video-generation, awesome-list]
  takeaway_en: A survey of video world models in robotics - where they replace or complement physics simulators (e.g. deformable objects), their applications, and open challenges - with a maintained paper list.
  takeaway_zh: 机器人视频世界模型综述：它们在哪些场景可替代或补充物理仿真器（如可变形物体）、主要应用与开放挑战，并附持续更新的论文列表。
- title: "Learning Latent Dynamics for Planning from Pixels"
  type: paper
  arxiv: "1811.04551"
  year: 2019
  org: Google Brain, DeepMind
  venue: ICML 2019
  code: https://github.com/google-research/planet
  tags: [sim, model-based-rl, planning, latent-dynamics]
  takeaway_en: PlaNet — learns a latent dynamics model (the RSSM later reused by Dreamer) from images and plans actions directly in latent space with CEM.
  takeaway_zh: PlaNet：从图像中学习潜空间动力学模型（即后来 Dreamer 沿用的 RSSM），并用 CEM 直接在潜空间中规划动作。
- title: "Mastering Atari with Discrete World Models"
  type: paper
  arxiv: "2010.02193"
  year: 2021
  org: Google Research, DeepMind
  venue: ICLR 2021
  code: https://github.com/danijar/dreamerv2
  tags: [sim, model-based-rl, discrete-latents]
  takeaway_en: DreamerV2 — switches Dreamer to categorical latent variables and learns Atari behaviour purely inside the world model, reaching human-level scores.
  takeaway_zh: DreamerV2：把 Dreamer 的潜变量改为离散类别分布，仅在世界模型的想象中学习 Atari 策略，达到人类水平。
- title: "Transformers are Sample-Efficient World Models"
  type: paper
  arxiv: "2209.00588"
  year: 2023
  org: University of Geneva
  venue: ICLR 2023
  code: https://github.com/eloialonso/iris
  tags: [sim, model-based-rl, transformer, tokenizer]
  takeaway_en: IRIS — a discrete autoencoder turns frames into tokens and a Transformer predicts the next tokens; the agent learns in imagination with only ~2 hours of Atari gameplay.
  takeaway_zh: IRIS：离散自编码器把画面变成 token，Transformer 预测后续 token；智能体只用约 2 小时的 Atari 游戏经验便在想象中学会策略。
- title: "Learning Universal Policies via Text-Guided Video Generation"
  type: paper
  arxiv: "2302.00111"
  year: 2023
  org: MIT, Google
  venue: NeurIPS 2023
  tags: [video-generation, planning, language]
  takeaway_en: UniPi — casts decision making as text-conditioned video generation, then recovers actions from the generated frames with an inverse dynamics model.
  takeaway_zh: UniPi：把决策问题转化为文本条件的视频生成，再用逆动力学模型从生成的画面中恢复动作。
- title: "Temporal Difference Learning for Model Predictive Control"
  type: paper
  arxiv: "2203.04955"
  year: 2022
  org: UC San Diego
  venue: ICML 2022
  code: https://github.com/nicklashansen/tdmpc
  tags: [sim, model-based-rl, mpc, planning]
  takeaway_en: TD-MPC — a task-oriented latent model used for short-horizon planning, with a learned value function covering the long-term return; the predecessor of TD-MPC2.
  takeaway_zh: TD-MPC：用面向任务的潜空间模型做短视距规划，由学习到的价值函数估计长期回报；是 TD-MPC2 的前身。
- title: "CW-WAM: A Structured Contact-Wrench World Action Model for Force-Sensitive Manipulation"
  type: paper
  arxiv: "2610.30117"
  year: 2026
  project: https://cw-wam-project.github.io/
  added: 2026-10-22
  topics: [manipulation]
  tags: [world-action-model, force-control, contact-rich, video-prediction]
  takeaway_en: World action model that jointly predicts video, motion and contact wrench, outputting time-aligned motion–wrench chunks as control references (hybrid motion-force style) for force-sensitive manipulation.
  takeaway_zh: 一个同时预测未来视频、运动与接触力旋量的世界动作模型，借鉴力位混合控制思路，输出时间对齐的运动-力旋量片段作为控制参考，面向仅靠视觉无法感知接触与负载的力敏感操作任务。
- title: "Unleashing Large-Scale Video Generative Pre-training for Visual Robot Manipulation"
  type: paper
  arxiv: "2312.13139"
  year: 2024
  org: ByteDance Research
  venue: ICLR 2024
  code: https://github.com/bytedance/GR-1
  topics: [manipulation]
  tags: [world-action-model, video-prediction, pretraining, gpt]
  takeaway_en: GR-1 — a GPT-style model that predicts both actions and future frames; pre-training on Ego4D video prediction before robot fine-tuning lifts CALVIN unseen-scene success from 53.3% to 85.4% (as reported).
  takeaway_zh: GR-1：GPT 式模型同时预测动作与未来画面；先在 Ego4D 上做视频预测预训练、再用机器人数据微调，论文报告 CALVIN 未见场景成功率从 53.3% 提升到 85.4%。
- title: "Video Prediction Policy: A Generalist Robot Policy with Predictive Visual Representations"
  type: paper
  arxiv: "2412.14803"
  year: 2025
  org: Tsinghua University, Shanghai Qi Zhi Institute, RobotEra
  venue: ICML 2025
  code: https://github.com/roboterax/video-prediction-policy
  topics: [manipulation]
  tags: [world-action-model, video-diffusion, diffusion-policy, dexterous]
  takeaway_en: VPP — fine-tunes Stable Video Diffusion on robot and human videos and feeds its one-pass predictive features to a diffusion policy; reports 4.33 average length on CALVIN ABC→D and real Franka / dexterous-hand results.
  takeaway_zh: VPP：在机器人与人类操作视频上微调 Stable Video Diffusion，只做一次前向提取"预测性"视觉特征再交给扩散策略；论文报告 CALVIN ABC→D 平均完成长度 4.33，并有 Franka 与灵巧手真机实验。
- title: "Unified Video Action Model"
  type: paper
  arxiv: "2503.00200"
  year: 2025
  org: Stanford University
  venue: RSS 2025
  code: https://github.com/ShuangLI59/unified_video_action
  topics: [manipulation]
  tags: [world-action-model, video-generation, diffusion, umi]
  takeaway_en: UVA — one shared latent for video and actions with two light diffusion heads; masked training lets the same model act as policy, video generator and forward/inverse dynamics model, while keeping policy inference fast.
  takeaway_zh: UVA：视频与动作共享一个潜表示，配两个轻量扩散头解码；通过掩码训练，同一模型既能当策略，也能做视频生成和正/逆动力学，且策略推理仍然较快。
- title: "WorldVLA: Towards Autoregressive Action World Model"
  type: paper
  arxiv: "2506.21539"
  year: 2025
  org: Alibaba DAMO Academy, Zhejiang University
  code: https://github.com/alibaba-damo-academy/WorldVLA
  topics: [vla]
  tags: [world-action-model, autoregressive, libero]
  takeaway_en: One autoregressive model that is both a VLA policy and an image-predicting world model; the two help each other on LIBERO, and an attention mask hiding earlier actions curbs error build-up in action chunks.
  takeaway_zh: 单个自回归模型同时充当 VLA 策略与预测未来图像的世界模型，二者在 LIBERO 上相互促进；论文还发现自回归生成动作块会累积误差，用屏蔽先前动作的注意力掩码可以缓解。
- title: "Genie Envisioner: A Unified World Foundation Platform for Robotic Manipulation"
  type: paper
  arxiv: "2508.05635"
  year: 2025
  org: AgiBot, NUS, Beihang University
  venue: ICLR 2026
  code: https://github.com/AgibotTech/Genie-Envisioner-V1
  topics: [manipulation, sim]
  tags: [world-action-model, video-diffusion, neural-simulator, benchmark]
  takeaway_en: Genie Envisioner (AgiBot) — a video-diffusion world model (GE-Base) plus a flow-matching action decoder (GE-Act), an action-conditioned neural simulator (GE-Sim) and the EWMBench benchmark in one platform.
  takeaway_zh: 智元 Genie Envisioner：一个平台集成视频扩散世界模型 GE-Base、流匹配动作解码器 GE-Act、动作条件神经仿真器 GE-Sim，以及世界模型评测基准 EWMBench。
- title: "UniFlowWAM: A Unified World-Action Model with Visual Semantics and 4D Geometry"
  type: paper
  arxiv: "2610.30991"
  year: 2026
  added: 2026-10-23
  project: https://kksham111.github.io/UniFlowWAM_ProjectPage/
  topics: [vla]
  tags: [world-action-model, 3d-flow, 4d-geometry]
  takeaway_en: World action model that brings scene-level 3D flow (tracked 3D points) inside the policy rather than as a separate module or extra head, so 4D geometry and visual semantics are modelled together with actions.
  takeaway_zh: 世界动作模型：把场景级三维流（跟踪的三维点）纳入策略内部，而不是作为独立模块或额外输出头，让 4D 几何、视觉语义与动作一起建模。
- title: "GreenWAM: A World Foundation Model for Robotics"
  type: paper
  arxiv: "2610.18774"
  year: 2026
  org: Sber Robotics Center
  code: https://github.com/greenvla/GreenWAM
  project: https://greenvla.github.io/GreenWAM
  added: 2026-10-23
  topics: [vla]
  tags: [world-action-model, cross-embodiment, humanoid, technical-report]
  takeaway_en: One world model that is also the policy, across 20 robot families mapped to a shared joint-space action format; reports strong WorldArena, RoboTwin 2.0 and LIBERO-plus results and a one-step distilled humanoid policy.
  takeaway_zh: 同一个世界模型兼作策略，用共享的关节坐标动作空间覆盖 20 类机器人；论文报告其在 WorldArena、RoboTwin 2.0、LIBERO-plus 上表现突出，并蒸馏出可实时运行的单步人形机器人策略。
- title: "Self-Distilling Future Video Representations for World Action Models"
  type: paper
  arxiv: "2610.30320"
  year: 2026
  org: KAIST AI
  code: https://github.com/suhyeok-jang/FRED
  project: https://huiwon-jang.github.io/FRED/
  added: 2026-10-24
  topics: [world-models]
  tags: [world-action-model, video-diffusion, self-distillation, human-to-robot, real]
  takeaway_en: FRED trains a world action model to predict better one-step future video features via self-distillation plus history context; reports large gains on long-horizon, out-of-domain and human-video-only tasks.
  takeaway_zh: FRED 通过自蒸馏并引入历史观测，让世界动作模型在单步去噪中预测出更好的未来视频表征；报告在长时程、域外环境以及只有人类视频示范的任务上提升明显。
- title: "Agentic World Action Models"
  type: paper
  arxiv: "2610.30136"
  code: https://github.com/ZhuoyangLiu2005/agentic-wam
  year: 2026
  project: https://agentic-wam.github.io/
  added: 2026-10-25
  topics: [world-models, manipulation]
  tags: [world-action-model, agentic, code-as-policy, skill-library, bimanual, sim, real]
  takeaway_en: AW-0 jointly generates code, future video and actions in one mixture-of-transformers; code structures planning and becomes reusable skills. Reports gains over VLA and WAM baselines on RoboTwin 2.0 and real two-arm tasks.
  takeaway_zh: AW-0 在同一个混合 Transformer 中联合生成代码、未来视频和机器人动作三路输出：代码既组织多步预测与控制，又沉淀为可复用技能库；报告在 RoboTwin 2.0 和真机双臂任务上优于 VLA 与 WAM 基线。
- title: "Skeleton-Grounded Latent Action Model for Robot World Models"
  type: paper
  arxiv: "2610.31474"
  year: 2026
  project: https://aopolin-lv.github.io/SkeLAM/
  added: 2026-10-25
  topics: [world-models]
  tags: [latent-action, video-world-model, droid, policy-evaluation]
  takeaway_en: SkeLAM splits latent actions into a robot-skeleton-grounded kinematic part and a visual residual, so world-model rollouts follow robot controls; on DROID reports 19.5% lower end-effector error than DreamDojo.
  takeaway_zh: SkeLAM 把潜在动作拆成由机器人骨架监督的运动学部分和保留其余视觉动态的残差部分，使世界模型生成更贴合机器人控制指令；报告在 DROID 上末端轨迹误差比 DreamDojo 低 19.5%，预测成功率与真机评测一致。
- title: "RynnUnify: Towards Unified Embodied Brain"
  type: paper
  arxiv: "2610.32965"
  year: 2026
  org: Alibaba DAMO Academy
  code: https://github.com/alibaba-damo-academy/RynnUnify
  project: https://alibaba-damo-academy.github.io/RynnUnify.github.io/
  added: 2026-10-26
  topics: [vla, perception]
  tags: [unified-model, video-prediction, visual-planning, world-action-model, benchmark]
  takeaway_en: "A 16B model interleaving video prediction and language reasoning for embodied understanding and long-horizon visual planning, plus a world-action extension for control; reports 51.5% on 20 RoboCasa365 tasks."
  takeaway_zh: 16B 统一具身模型，交替进行视频预测与语言推理，兼顾具身理解与长程视觉规划，并扩展出用于机器人控制的世界-动作版本；另提出 Rynn-VP、Rynn-GEU 评测，报告在 20 个 RoboCasa365 组合任务上成功率 51.5%。
- title: "DreamGen: Unlocking Generalization in Robot Learning through Video World Models"
  type: paper
  arxiv: "2505.12705"
  year: 2025
  org: NVIDIA
  venue: CoRL 2025
  code: https://github.com/NVIDIA/GR00T-Dreams
  project: https://research.nvidia.com/labs/gear/dreamgen
  topics: [learning, locomotion]
  tags: [synthetic-data, video-world-model, inverse-dynamics, humanoid, real]
  takeaway_en: Fine-tunes video world models on a robot to dream new demos, labels them with latent actions or an inverse dynamics model, and trains policies on them; a humanoid learns 20+ new behaviors from one-scene teleop data.
  takeaway_zh: 把视频世界模型微调到目标机器人上“做梦”生成新示范，再用隐动作或逆动力学模型补上动作标签用于训练策略；人形机器人仅凭单一场景的遥操作数据学会 20 多种新行为。
- title: "Physical Canvas: A Vision Tactile World Model For Robot Policy Evaluation And Learning"
  type: paper
  arxiv: "2610.28613"
  year: 2026
  project: https://zebinx.github.io/PhysCanvas_HomePage/
  added: 2026-10-26
  topics: [tactile]
  tags: [visuotactile, video-generation, policy-evaluation, grpo, real, contact-rich]
  takeaway_en: "Action-conditioned world model that predicts multi-view RGB and tactile images together in one video space, post-trained for state consistency; used for closed-loop policy evaluation and GRPO updates."
  takeaway_zh: 动作条件的视触觉世界模型：在统一的视频空间中同时预测多视角 RGB 与触觉图像，并经一致性后训练保证与真实任务状态吻合；可用于闭环策略评估和 GRPO 策略更新。
- title: "PICA-WAM: Visual Perturbation Invariance via Cross-Appearance Self-Alignment in World Action Models"
  type: paper
  arxiv: "2610.26813"
  year: 2026
  code: https://github.com/YudeZou/PICA-WAM-release
  added: 2026-10-26
  topics: [vla]
  tags: [wam, robustness, self-supervised, ema-teacher, real]
  takeaway_en: "Auxiliary training task for world action models: an EMA teacher sees the clean frame, the online model sees a perturbed one and aligns its action features. Reports better robustness for four WAMs."
  takeaway_zh: 为世界-动作模型加一个自监督辅助任务：EMA 教师看原始画面，在线模型看外观扰动后的画面并对齐其动作表征；报告在 RoboTwin 2.0、LIBERO-Plus 等基准上提升四种 WAM 对视觉扰动的鲁棒性，且不损失原有性能。
- title: "OSWAM: An Effective World Action Model with One-Step Action Generation"
  type: paper
  arxiv: "2610.35850"
  code: https://github.com/PolyU-VCLab/OSWAM
  year: 2026
  project: https://gwenzhang.github.io/OSWAM/
  added: 2026-10-27
  topics: [vla]
  tags: [wam, one-step, real-time, distillation, driving, sim]
  takeaway_en: "World action model that acts in one diffusion step: 'imagination tokens' replace random-noise initialisation as an action prior. Reports ~3× speedup over direct-policy WAMs, 40 ms latency on an RTX 5090."
  takeaway_zh: 单步扩散即可生成动作的世界动作模型：用“想象 token”代替随机噪声初始化，为动作提供先验。报告比直接策略式 WAM 快约 3 倍，编译后在 RTX 5090 上延迟低至 40 毫秒，覆盖自动驾驶与具身控制。
- title: "Video World Models Need Predictable Latents"
  type: paper
  arxiv: "2610.34663"
  year: 2026
  code: https://github.com/mattia-scardecchia/predictable-latents
  added: 2026-10-27
  topics: [learning]
  tags: [video-world-model, latent-space, autoencoder, policy-evaluation]
  takeaway_en: "Train the video world model's autoencoder for temporal predictability, not just reconstruction, with a past-conditioned decoder. Reports up to 5× cheaper inference, 7× faster training and lower long-horizon / OOD error."
  takeaway_zh: 视频世界模型的潜空间不应只为重建而训练：加入时间可预测性目标并配合以历史为条件的解码器。报告推理成本最多降低 5 倍、训练快 7 倍以上，长时域与分布外误差降低 15–24%，与真实策略评测更一致。
- title: "DeXplicit: Making Physical State Explicit in Dexterous Manipulation World Models"
  type: paper
  arxiv: "2610.30781"
  code: https://github.com/Abecid/DeXplicit
  year: 2026
  project: https://dexplicit.github.io
  added: 2026-10-27
  topics: [manipulation]
  tags: [dexterous, 3d-dynamics, video-generation, hand-object]
  takeaway_en: "Dexterous-manipulation world model that first predicts object motion and deformation in metric 3D from a hand trajectory, then renders video. Reports 27–40% lower moved-point error than PointWorld."
  takeaway_zh: 灵巧操作世界模型：先根据手部轨迹在度量 3D 空间中显式预测物体运动与形变，再据此渲染视频。报告在 HOT3D、OakInk2、PhysTwin 上运动点误差比 PointWorld 低 27–40%，两步因果生成大幅提速。
- title: "Training Controllable World Models via Action Influence Maximization"
  type: paper
  arxiv: "2610.27387"
  year: 2026
  venue: CoRL 2026
  added: 2026-10-27
  topics: [learning]
  tags: [world-model, video-generation, data-collection, controllability, active-learning]
  takeaway_en: "Why action-conditioned video models ignore actions: expert demos carry too little action influence. AIM actively collects data to raise it; 500 such episodes + 3k demos match a 300k-demo model on controllability."
  takeaway_zh: "解释动作条件视频世界模型为何忽略动作：专家示教的“动作影响力”太低，模型容量再大也无法弥补。AIM 主动采集数据提高这一指标；报告 500 条主动采集数据加 3000 条示教即可在末端可控性上追平 30 万条专家数据。"
- title: "TrajWAM: An Efficient Trajectory-Guided World Action Model for Dynamic Robotic Manipulation"
  type: paper
  arxiv: "2610.25763"
  year: 2026
  project: https://kevingeng3.github.io/TrajWAM/
