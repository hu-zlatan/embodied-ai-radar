  takeaway_zh: "把预训练视频扩散 Transformer 改造成策略：每个时间步的动作编码为视频潜空间中的一个 patch，联合训练视频、视频+动作与纯动作三种扩散目标；测试时一步 DDIM 生成动作块（84 毫秒），无需生成视频。"
- title: "RynnWorld-Latent: A Cross-Embodiment World Model Conditioned on Universal Latent Actions"
