  takeaway_zh: "ID-WM 将状态可达性与局部控制解耦：高层模型在状态流形上采样可行转移，低层世界模型充当逆动力学求解器，把子目标落实为精确动作。报告比单层世界模型 MPC 提升 135%，比最优策略与扩散规划器提升 38.5%。"

- title: "WorldBridge: Bridging Video and Action for Task Generalization in World Action Models"
