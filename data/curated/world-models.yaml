  topics: [manipulation]
  tags: [wam, efficiency, action-chunking, sim]
  takeaway_en: "Lightweight world action model: compact video backbone with future supervision in a downsampled latent, and an action expert that pools several layers to predict chunks in one pass. Reports 0.44B trainable params, 72 ms."
  takeaway_zh: "轻量世界动作模型：紧凑视频主干在降采样潜空间中做未来监督，动作专家融合多层特征一次前向预测动作块；报告可训练参数仅 0.44B，推理延迟 72 毫秒。"
- title: "$μ_0$: A Scalable 3D Interaction-Trace World Model"
  type: paper
  arxiv: "2606.13769"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/Yoonkyo/mu0
  project: https://mu0-wm.github.io/
  added: 2026-11-06
  topics: [manipulation]
  tags: [3d-traces, cross-embodiment, action-free, pretraining, vlm]
  takeaway_en: "World model that predicts 3D traces of key points (objects, tools, hands) instead of pixels or actions, pretrained from video without action labels. Trace-conditioned policies are reported competitive with π0-style VLAs."
  takeaway_zh: "不预测像素也不预测动作，而是预测物体、工具、手等关键点的 3D 轨迹，可用无动作标签的视频预训练。报告以轨迹为条件的策略可与 π0 类 VLA 相当。"
- title: "StressDream: Steering Video World Models for Robust Policy Evaluation and Improvement"
  type: paper
  arxiv: "2606.00267"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/CMU-IntentLab/StressDream
  project: https://stressdream.github.io/
  added: 2026-11-06
  topics: [learning]
  tags: [policy-evaluation, stress-testing, video-generation, vlm, noise-optimization]
  takeaway_en: "Steers a video world model toward rare but plausible bad outcomes (e.g. task failures) by optimizing its initial noise with a VLM objective, to evaluate and improve policies. Driving and manipulation."
  takeaway_zh: "通过优化视频世界模型的初始噪声（以 VLM 为目标），把想象引向罕见但合理的不利结果（如任务失败），用于评估和改进策略；覆盖自动驾驶与操作。"
- title: "What Makes Video World Model Latents Action-Relevant: Prediction over Reconstruction"
  type: paper
  arxiv: "2606.07687"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/k1seul/corl2026-action-relevant-latents
  added: 2026-11-06
  topics: [learning]
  tags: [representation, probing, v-jepa, inverse-dynamics]
  takeaway_en: "Probe study of which video world model latents carry action information: temporal video pretraining matters, pixel reconstruction quality does not. V-JEPA-style encoders give the best trade-off."
  takeaway_zh: "探测哪些视频世界模型的潜变量含有动作信息：关键在于时序视频预训练，而非像素重建质量；V-JEPA 类编码器取得最佳权衡。"
- title: "La-JEPA: Compact Robot Policies with Latent World Modeling"
  type: paper
  arxiv: "2611.08156"
  year: 2026
  added: 2026-11-06
  topics: [vla]
  tags: [wam, jepa, v-jepa, compact-policy, real, sim]
  takeaway_en: "Small world action model trained from scratch on frozen V-JEPA 2.1 features, predicting future features only in training. Reports SOTA on RoboTwin 2.0 among policies without embodied pretraining."
  takeaway_zh: "在冻结的 V-JEPA 2.1 特征上从零训练的紧凑世界动作模型，仅在训练时预测未来特征。报告在无具身预训练的策略中 RoboTwin 2.0 最优，并修正了 LIBERO-Plus 的指令。"
- title: "GPWM: Modeling the World as 3D Particle Motion"
  type: paper
  arxiv: "2611.08338"
  year: 2026
  project: https://robertren1122.github.io/gpwm/
  added: 2026-11-06
  topics: [manipulation, datasets]
  tags: [particles, 3d-dynamics, deformable, planning, diffusion-forcing]
  takeaway_en: "Generative world model of 3D particle and rigid-body motion covering rigid, deformable, cloth and granular materials. Reports 31% lower error than prior learned dynamics; planning searches its latent noise."
  takeaway_zh: "生成式 3D 粒子与刚体运动世界模型，统一覆盖刚体、可变形体、布料与颗粒材料。报告预测误差比此前最好的学习动力学低 31%，并通过在潜噪声空间搜索来做规划。"
- title: "Box-WAM: Box Trajectories as Compact State Representations for World Action Models"
  type: paper
  arxiv: "2610.17526"
  year: 2026
  venue: CoRL 2026
  project: https://box-wam.github.io
  added: 2026-11-06
  topics: [manipulation]
  tags: [wam, object-centric, bounding-boxes, efficiency]
  takeaway_en: "World action model that predicts oriented bounding-box trajectories of task objects instead of future video frames: much cheaper, and reported to predict actions better."
  takeaway_zh: "世界动作模型不再预测未来视频帧，而是预测任务相关物体的有向包围盒轨迹：计算量大幅下降，并报告动作预测更好。"
- title: "DepthWorld: 3D World Model for Robot Manipulation"
  type: paper
  arxiv: "2610.08780"
  year: 2026
  venue: CoRL 2026
  project: https://www.jaibardhan.com/depthworld
  added: 2026-11-06
  topics: [datasets]
  tags: [3d, depth, video-diffusion, droid, calibration]
  takeaway_en: "Recalibrates DROID into DROID-3D with metric depth and multi-view extrinsics, then trains a video world model that predicts RGB and depth. Depth supervision reportedly also improves RGB by 1.48 dB PSNR."
  takeaway_zh: "把 DROID 重新标定为带度量深度与多视角外参的 DROID-3D，并训练同时预测 RGB 与深度的视频世界模型。报告深度监督还让 RGB 预测提升 1.48 dB PSNR。"
- title: "AnyWorld: Factorized Egocentric World Models for Cross-Embodiment Generalization"
  type: paper
  arxiv: "2608.29242"
  year: 2026
  venue: CoRL 2026
  project: https://xpeng-robotics.github.io/anyworld/
  added: 2026-11-06
  topics: [datasets]
  tags: [egocentric, human-video, cross-embodiment, data-generation, humanoid]
  takeaway_en: "Factorizes an interaction into action, camera and embodiment so one human video can be re-rendered as many robot rollouts. Generated data helps on RoboCasa GR1 and a real IRON humanoid."
  takeaway_zh: "把一次交互分解为动作、相机与本体三个因素，使一段人类视频可重新生成为多种机器人视角的数据。生成数据在 RoboCasa GR1 与真实 IRON 人形上带来提升。"
- title: "MemoryVAM: Integrating Memory into Video Action Model for Robot Manipulation"
  type: paper
  arxiv: "2606.20679"
  year: 2026
  venue: CoRL 2026
  project: https://MemoryVAM.github.io/
  added: 2026-11-06
  tags: [memory, video-action-model, long-horizon, libero, real]
  takeaway_en: "Adds episodic memory tokens to video-world-model policies so actions can depend on events no longer in view. Reports LIBERO-Mem success up from 5% to 42.5% and 75–80% on real memory tasks."
  takeaway_zh: "为视频世界模型策略加入情景记忆 token，使动作能依赖已不在视野中的事件。报告 LIBERO-Mem 成功率从 5% 提升到 42.5%，真机记忆类任务约 75–80%。"
- title: "NovaPlan: Zero-Shot Long-Horizon Manipulation via Closed-Loop Video Language Planning"
  type: paper
  arxiv: "2602.20119"
  year: 2026
  venue: CoRL 2026
  project: https://nova-plan.github.io/
  added: 2026-11-06
  tags: [video-generation, planning, zero-shot, long-horizon, real]
  takeaway_en: "Zero-shot long-horizon manipulation: a VLM proposes and checks several generated video plans, actions follow object or hand flow, and execution is monitored with local corrections such as poking."
  takeaway_zh: "零样本长程操作：VLM 提出并验证多条生成的视频计划，动作由物体流或手部流转换而来，执行中持续监控并做戳推等局部纠正。"
- title: "PhysCoRe: Physics-Corrected Residual World Models for Material-Aware Deformable Dynamics"
  type: paper
  arxiv: "2607.20653"
  year: 2026
  venue: CoRL 2026
  project: https://lunarlab-gatech.github.io/PhysCoRe-website/
  added: 2026-11-06
  tags: [deformable, mpm, residual-learning, material-identification, real]
  takeaway_en: "World model for deformable objects that couples a differentiable MPM simulator with networks that infer per-particle elasticity from video and correct the simulator's residual errors. Real manipulation sequences."
  takeaway_zh: "可变形物体世界模型：可微 MPM 仿真器配合两个网络，一个从视觉推断逐粒子弹性，一个学习修正仿真器的残差误差。在真实操作序列上验证。"
- title: "EgoWAM: World Action Models Beyond Pixels with In-the-Wild Egocentric Human Data"
  type: paper
  arxiv: "2607.08436"
  year: 2026
  venue: CoRL 2026
  project: https://gatech-rl2.github.io/egowam.github.io
  added: 2026-11-06
  tags: [human-video, egocentric, world-action-model, dino, real]
  takeaway_en: "Controlled study of which world-prediction target best transfers egocentric human data to robots: pixels transfer weakly, DINO features give up to 4x OOD generalization, 3D flow gives +20–30% in domain."
  takeaway_zh: "对照研究哪种世界预测目标最能把第一人称人类数据迁移到机器人：像素迁移较弱，DINO 特征带来最高 4 倍的分布外泛化，3D 运动流在域内提升 20–30%。"
- title: "PlayWorld: Learning Robot World Models from Autonomous Play"
  type: paper
  arxiv: "2603.09030"
  year: 2026
  venue: CoRL 2026
  project: https://robot-playworld.github.io/
  added: 2026-11-06
  tags: [video-world-model, self-play, policy-evaluation, rl, real]
  takeaway_en: "Trains an action-conditioned video world model purely from autonomous robot play instead of human demos, capturing failure-rich contact. Reports up to 40% better policy evaluation and +65% real success after RL in it."
  takeaway_zh: "完全用机器人自主“玩耍”数据（而非人类演示）训练动作条件视频世界模型，覆盖更多接触与失败情形。报告策略评估提升最高 40%，在其中做强化学习后真机成功率提升 65%。"
- title: "$τ_0$-WM: A Unified Video-Action World Model for Robotic Manipulation"
  type: paper
  arxiv: "2606.01027"
  year: 2026
  venue: CoRL 2026
  project: https://tau0-wm.github.io
  added: 2026-11-06
  tags: [video-action-model, simulator, test-time-compute, large-scale, real]
  takeaway_en: "One video-diffusion backbone serves as both a video-action policy and an action-conditioned simulator that scores progress, trained on ~27,300 hours of robot, UMI and human data; samples and ranks actions at test time."
  takeaway_zh: "同一个视频扩散主干既是视频-动作策略，也是可预测任务进度的动作条件模拟器；训练数据约 2.73 万小时（真机、UMI、人类视频等），推理时采样并排序候选动作。"
- title: "WoVR: World Models as Reliable Simulators for Post-Training VLA Policies with RL"
  type: paper
  arxiv: "2602.13977"
  year: 2026
  venue: CoRL 2026
  project: https://wovr-corl.github.io
  added: 2026-11-06
  tags: [rl, vla, video-world-model, hallucination, libero]
  takeaway_en: "RL post-training of VLAs inside a video world model, with keyframe-initialised rollouts and world-model–policy co-evolution to keep hallucination in check. Reports strong LIBERO results and real-robot gains."
  takeaway_zh: "在视频世界模型中对 VLA 做强化学习后训练，通过关键帧初始化的短推演和世界模型-策略协同演化来抑制幻觉。报告 LIBERO 表现优异并在多个真机平台上提升。"
- title: "Scaling World Model for Hierarchical Manipulation Policies"
  type: paper
  arxiv: "2602.10983"
  year: 2026
  venue: CoRL 2026
  project: https://vista-wm.github.io/
  added: 2026-11-06
  tags: [hierarchical, goal-images, subgoals, vla, real]
  takeaway_en: "A large pretrained world model plans subtasks and generates goal images; a VLA follows them. Reports the same VLA rising from 14% to 69% in novel scenes with these generated goals."
  takeaway_zh: "用大规模预训练世界模型做高层规划，把任务拆成子任务并生成目标图像，由底层 VLA 跟随执行。报告同结构 VLA 在新场景中的成功率借此从 14% 提升到 69%。"
- title: "FACT: Failure-Aware Causal Training for World-Action Models"
  type: paper
  arxiv: "2608.10232"
  year: 2026
  venue: CoRL 2026
  project: https://fact-wam.github.io/
  added: 2026-11-06
  tags: [world-action-model, failure-data, progress-estimation, bimanual, real]
  takeaway_en: "Action-conditioned world-action model that also learns from failed rollouts, predicting future video and task progress for the action actually taken; progress scores can rank sampled actions."
  takeaway_zh: "以实际执行动作为条件的世界动作模型，把失败轨迹也作为监督，预测未来视频与任务进度；进度分可在推理时为候选动作排序。"
- title: "Coupled Local and Global World Models for Efficient First Order RL"
  type: paper
  arxiv: "2602.06219"
  year: 2026
  venue: CoRL 2026
  project: https://coupled-global-local-wm-rl.pages.dev/
  added: 2026-11-06
  tags: [rl, diffusion-world-model, first-order-gradients, push-t, quadruped]
  takeaway_en: "RL inside a learned diffusion world model without a simulator: the big model rolls out trajectories while a light latent surrogate supplies gradients. Beats PPO on sample efficiency on Push-T; quadruped task too."
  takeaway_zh: "不用物理仿真器，直接在学习到的扩散世界模型中训练策略：大模型负责生成轨迹，轻量潜在代理模型提供一阶梯度。在 Push-T 上样本效率明显优于 PPO，并在四足任务上验证。"
- title: "Hierarchical Planning with Latent World Models"
  type: paper
  arxiv: "2604.03208"
  year: 2026
  venue: CoRL 2026
  project: https://kevinghst.github.io/HWM/
  added: 2026-11-06
  tags: [planning, latent-world-model, hierarchical-mpc, macro-actions, real]
  takeaway_en: "Hierarchical MPC on latent visual world models at two time scales, linked by latent subgoals and learned macro-actions. Reports 70% vs 0% on real Franka pick-and-place from one goal image, with up to 3x less compute."
  takeaway_zh: "在两个时间尺度的潜在视觉世界模型上做分层 MPC，以潜在子目标和学习到的宏动作衔接。报告真实 Franka 单目标图抓放成功率 70%（单层规划为 0%），计算量最多少 3 倍。"
- title: "Robot-Factored World Models via Robot Rendering"
  type: paper
  arxiv: "2607.22535"
  year: 2026
  venue: CoRL 2026
  project: https://bjkim95.github.io/rofacto/
  added: 2026-11-06
  tags: [video-world-model, robot-rendering, urdf, cross-embodiment, human-video]
  takeaway_en: "Video world model that renders the robot's own motion from its URDF and controller, so the network only predicts how the scene responds. Transfers to unseen robots and can animate retargeted human demos."
  takeaway_zh: "视频世界模型把机器人自身运动交给控制器和 URDF 渲染，网络只需预测场景的响应。可迁移到未见过的机器人本体，并能由重定向的人类演示生成机器人操作视频。"
- title: "STRIPS-WM: Learning Grounded Propositional STRIPS-style World Models from Images"
  type: paper
  arxiv: "2606.06832"
  year: 2026
  venue: CoRL 2026
  project: https://elpislab.org/projects/strips-wm/
  added: 2026-11-06
  tags: [symbolic-planning, strips, predicates, visual-planning, sim]
  takeaway_en: "Learns STRIPS-style operators (preconditions, add/delete effects) over latent predicates from image transitions, then plans classically from start and goal images. Beats visual-rollout and latent-search methods."
  takeaway_zh: "直接从图像转移数据学习 STRIPS 式符号算子（前提条件、增删效果）和潜在二值谓词，再从起始图与目标图用经典规划求解。优于视觉推演和潜在图搜索等基线。"
- title: "Learning Robotic World Models with Semantic and Visual Feedback"
  type: paper
  arxiv: "2611.07850"
  year: 2026
  code: https://github.com/Alexander-wu/RoboImagine
  project: https://huggingface.co/easylearning/RoboImagine
  added: 2026-11-06
  tags: [world-model, post-training, video-prediction, vlm-judge, grpo]
  takeaway_en: "RoboImagine post-trains autoregressive robot world models by comparing candidate futures, scored by a frozen multimodal judge plus pixel/perceptual terms. Reports +1.26 dB PSNR on RT-1 over continued SFT."
  takeaway_zh: "RoboImagine 通过比较多条候选未来来后训练自回归机器人世界模型：冻结的多模态评估器给出语义偏好，像素与感知层面的一致性项约束视觉误差。在 RT-1 上报告 PSNR 比继续监督微调高 1.26 dB。"
- title: "W2A: Distilling World Priors into Action Models for Real-Time Robotic Control"
  type: paper
  arxiv: "2611.02600"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [world-action-model, distillation, video-diffusion, libero]
  takeaway_en: "Distills intermediate denoising features of a video diffusion model into an action model during training and drops the video model at test time. Reports 95.9% on LIBERO and about 21x faster inference than a WAM baseline."
  takeaway_zh: "训练时把视频扩散模型的中间去噪表示蒸馏进动作模型，测试时完全丢弃视频模型。在 LIBERO 上报告 95.9% 平均成功率，推理比代表性世界动作模型快约 21 倍。"
- title: "FAWAM: Force-Aware World Action Models for Closed-Loop Contact-Rich Manipulation"
  type: paper
  arxiv: "2606.08555"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [world-action-model, force-torque, contact-rich, real]
  takeaway_en: "FAWAM uses 6-axis force/torque in perception, jointly predicts future actions and wrenches, and corrects actions online against the predicted wrench. Reports +36.25 pts over vision-only baselines on real tasks."
  takeaway_zh: "FAWAM 在感知、预测与闭环执行三层使用六维力/力矩：联合预测未来动作与末端力旋量，并以预测的力轨迹为参考在线修正动作。真机任务上比纯视觉基线成功率高 36.25 个百分点。"
- title: "MaskWAM: Unifying Mask Prompting and Prediction for World-Action Models"
  type: paper
  arxiv: "2606.13515"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [world-action-model, masks, object-centric, mixture-of-transformers]
  takeaway_en: "Object-centric world-action model that both takes object masks as prompts and predicts future masks, reducing language ambiguity in clutter and background bias in RGB prediction."
  takeaway_zh: "以物体为中心的世界动作模型：既把目标物体掩码作为提示输入，又预测未来掩码，从而减少杂乱场景中的语言歧义和 RGB 预测中的背景偏差。"
- title: "ORD-WM: Learning Object-Centric Rigid Dynamics for 3D World Modeling in Robotic Manipulation"
  type: paper
  arxiv: "2610.23156"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [3d-world-model, rigid-dynamics, point-cloud, se3]
  takeaway_en: "3D world model that encodes each object's point cloud with an SDF-supervised vector-neuron VAE and predicts per-object SE(3) increments applied analytically, so shapes do not drift over long rollouts."
  takeaway_zh: "3D 世界模型：用 SDF 监督的向量神经元 VAE 编码每个物体的点云，并预测逐物体的 SE(3) 运动增量后解析地施加，长时推演中物体形状不会漂移。"
- title: "Understanding and Mitigating the Video-Action Generalization Gap via Temporal Ratio"
  type: paper
  arxiv: "2607.08127"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [world-action-model, video-action-model, generalization, analysis]
  takeaway_en: "Defines Temporal Ratio, how much an action head attends to future latents vs the current frame; it predicts compositional generalization of video-action models and drives an inference-time adaptive guidance method."
  takeaway_zh: "提出 Temporal Ratio：动作头对未来潜变量相对当前帧的注意力依赖程度；它能预测视频动作模型的组合泛化能力，并据此设计推理时的自适应引导方法。"
- title: "WAM-TTT: Steering World-Action Models by Watching Human Play at Test Time"
  type: paper
  arxiv: "2607.06988"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [world-action-model, test-time-training, human-video, steering]
  takeaway_en: "Steers a frozen world-action model with unlabeled human videos at test time: a small memory inside the model adapts via self-supervised video prediction, after meta-training on paired human-robot data."
  takeaway_zh: "测试时用无标注的人类视频引导冻结的世界动作模型：模型内部的小型记忆通过自监督视频预测进行适配；此前用成对人-机数据做元训练使其对控制有用。"
- title: "SKIP: Sparse Keyframe Interpolation Paradigm for Efficient Embodied World Models"
  type: paper
  arxiv: "2606.00664"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [world-model, video-generation, keyframes, efficiency, libero]
  takeaway_en: "SKIP generates only task-relevant keyframes (approach, contact, grasp, release) with a sparse video diffusion model, then fills the gaps with an action-conditioned interpolator. 4.16x faster dense rollouts on LIBERO."
  takeaway_zh: "SKIP 只用稀疏视频扩散模型生成与任务相关的关键帧（接近、接触、抓取、释放），再用动作条件插值器补全中间帧。在 LIBERO 上生成稠密推演快 4.16 倍。"
- title: "Sensitivity Shaping for Latent Modeling"
  type: paper
  arxiv: "2606.14585"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [world-model, ood-detection, safety, regularization]
  takeaway_en: "Learned dynamics that ignore control changes can hide out-of-distribution actions. A support-conditioned control-sensitivity regularizer keeps predictions responsive, improving OOD detection and safer planning."
  takeaway_zh: "对控制变化不敏感的学习动力学会掩盖分布外动作。基于数据支撑的控制敏感性正则保持模型对控制的响应，从而提升分布外检测并使闭环规划更安全。"
