  takeaway_zh: "面向动态目标的世界动作模型：先预测目标物体的未来掩码轨迹，用 Trajectory ControlNet 引导视频模型生成与轨迹一致的未来，再通过解耦蒸馏实现一步视频-动作推理以降低延迟。"
- title: "GAWM: A Compact Latent World-Action Model for Multi-Task Robot Manipulation"
