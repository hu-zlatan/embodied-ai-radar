  takeaway_zh: 同时预测未来视频与查询点 3D 轨迹的生成式世界模型：3D 运动以与视频网格对齐的位移 token 表示，由统一的 Mixture-of-Transformers 在 rectified flow 目标下联合去噪；在 144 万样本上训练，新建 WorldFlowBench，报告 SpatialCog 上 ADE 比最强外部基线降低 54.2%。

- title: "Hierarchical World Models with Implicit Dynamics"
  type: paper
  arxiv: "2610.42146"
  year: 2026
  project: https://id-wm.github.io
  added: 2026-11-02
  tags: [hierarchical, planning, mpc, inverse-dynamics]
