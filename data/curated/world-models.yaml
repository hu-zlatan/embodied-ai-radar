  takeaway_en: "Cross-embodiment video world model conditioned on RynnLAM's 3D latent actions, pretrained on 23 datasets (~553M frames) of human, robot and sim video; its generated data improves LIBERO and real-robot policies."
  takeaway_zh: "以 RynnLAM 的三维潜在动作为统一条件接口的跨本体视频世界模型，在 23 个数据集（约 5.5 亿帧）的人类、机器人和仿真视频上预训练；生成的数据提升了 LIBERO 与真机策略成功率。"
- title: "Rollback: Experience Backtracking in World Models for Policy Improvement"
  type: paper
  arxiv: "2610.36068"
  year: 2026
  org: AgiBot
  project: https://rollback-wm.github.io/
  added: 2026-10-28
  topics: [learning]
  tags: [world-model, counterfactual, policy-improvement, real-world-rl, lora, real]
  takeaway_en: "Rewinds an action-conditioned world model to key decision points to try alternative actions, turning outcomes into action-level supervision; real data keeps correcting the model. Reports +10.7–11.9 pts on 3 real tasks."
  takeaway_zh: "把动作条件世界模型当作反事实引擎：回到关键决策点尝试其他动作并对比结果，得到动作级监督而无需单独的价值模型；真机经验再通过 LoRA 持续修正世界模型。报告在 3 个真实任务上比最强基线高 10.7–11.9 个百分点。"
- title: "Trace-WAM: Learning to Act via 3D Motion Prediction for World Action Models"
  type: paper
  arxiv: "2610.36840"
  year: 2026
  project: https://trace-wam.github.io/
  added: 2026-10-28
  topics: [manipulation]
  tags: [wam, 3d-motion, point-tracking, mixture-of-transformers, sim]
  takeaway_en: "Adds future 3D point-motion prediction as an auxiliary task to a world action model (video/motion/action MoT); inference stays one visual pass. Reports gains over Fast-WAM with few demos and under shift."
  takeaway_zh: "在世界动作模型中加入未来三维点运动预测作为辅助目标（视频/运动/动作三专家 MoT），推理仍只需一次视觉前向；报告在少量示范和分布偏移下明显优于 Fast-WAM（RoboCasa-GR1、LIBERO、LIBERO-Plus）。"
- title: "Adapting Video Models for Robot Control via Motion-guided Asymmetric Prediction"
  type: paper
  arxiv: "2610.36624"
  year: 2026
  project: https://ismty0805.github.io/mogap/
  added: 2026-10-28
  topics: [manipulation]
  tags: [wam, video-diffusion, auxiliary-loss, sim]
  takeaway_en: "MoGAP adds a training-only auxiliary path to world action models that corrupts moving regions more than static ones, focusing visual supervision on motion. Reports GR-1 tabletop gains (Fast-WAM 38.8% → 47.5%)."
  takeaway_zh: "MoGAP 为世界动作模型增加一条仅在训练时使用的辅助预测分支：对运动区域加更重的噪声、以静态区域为上下文重建，使视觉监督聚焦于动态部分；报告在 GR-1 桌面基准上 Fast-WAM 从 38.8% 提升到 47.5%，Cosmos3-Nano 从 52.3% 到 62.3%。"
- title: "Calibrated for Which Policy? Conformal Uncertainty for Fixed World Models Under Intervention"
  type: paper
  arxiv: "2610.35877"
  year: 2026
  code: https://github.com/noumenal-ai/conformal-realrobot-lab
  added: 2026-10-28
  topics: [learning]
  tags: [world-model, uncertainty, conformal-prediction, distribution-shift, theory, real]
  takeaway_en: "Shows a fixed world model's uncertainty can break when the deployment policy changes; reweights conformal calibration by a learned state-action ratio. Reports 90% sets covering 55.0% vs 90.9% on real Franka data."
  takeaway_zh: "指出部署策略一变，固定世界模型的不确定性校准就可能失效；用域分类器学到的状态-动作密度比做加权共形校准，并给出覆盖率保证（部分用 Lean 4 形式化验证）。报告在真实 Franka 轨迹上，普通 90% 共形集合仅覆盖 55.0%，加权后为 90.9%。"
- title: "PhysTrace: Interpretable Temporal Evaluation of Physical Consistency in Video Generative Models"
  type: paper
  arxiv: "2610.31429"
  year: 2026
  code: https://github.com/PhysTrace/PhysTrace
  added: 2026-10-29
  topics: [datasets]
  tags: [evaluation, video-models, intuitive-physics, mllm, training-free]
  takeaway_en: "Training-free physics check for video models: an MLLM states history-based expectations and PhysTrace marks when the video breaks them; adds IntPhys2-Timing (reports up to 70.7% hit rate)."
  takeaway_zh: 无需训练的视频模型物理一致性评测：由多模态大模型根据历史帧给出物理预期，再定位视频中违背预期的时间段并给出可解释描述；新增带违规区间标注的 IntPhys2-Timing（报告命中率最高 70.7%），面向依赖视频模型的世界动作模型。

- title: "LaWAM: Latent World Action Models for Efficient Dynamics-Aware Robot Policies"
  type: paper
  arxiv: "2606.15768"
  code: https://github.com/RLinf/LaWAM
  year: 2026
  venue: CoRL 2026
  project: https://rlinf.github.io/LaWAM/
  added: 2026-11-01
  topics: [vla]
  tags: [wam, latent-world-model, latent-action, libero, robotwin, real]
