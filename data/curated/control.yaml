  year: 2026
  venue: CoRL 2026
  project: https://lemca-robotics.github.io/
  added: 2026-11-06
  tags: [llm, program-synthesis, mode-switching, efficiency, sim]
  takeaway_en: "LLM-driven evolutionary search over mode-switching controllers written as programs, so cheap modes run in easy task phases. Reports designs beyond the Pareto front of one-size-fits-all controllers."
  takeaway_zh: "用 LLM 驱动的进化搜索，把多模式切换控制器写成可解释程序并迭代优化，使简单阶段使用低开销模式。报告找到的设计超越单一结构控制器的帕累托前沿。"
- title: "PRISM: Polynomial Representations for Interaction-Structured Motor Control"
  type: paper
  arxiv: "2607.23473"
  year: 2026
  venue: CoRL 2026
  project: https://lsh3163.github.io/prism/
  added: 2026-11-06
  tags: [policy-architecture, polynomial-features, humanoid, contact-rich, real]
  takeaway_en: "Replaces a policy MLP's first layer with learned multiplicative (bilinear) features, plug-and-play for RL and imitation. Reports humanoid survival up from 51.0% to 92.5%, holding under friction and payload shifts."
  takeaway_zh: "把策略 MLP 的第一层替换为可学习的乘性（双线性）特征，即插即用于强化学习与模仿学习。报告人形机器人存活率从 51.0% 提升到 92.5%，在摩擦、负载变化下依然有效。"
- title: "TDC: Sim-to-Real Transferable Directional Compliance for Contact-Rich Manipulation"
  type: paper
  arxiv: "2602.14174"
  year: 2026
  venue: CoRL 2026
  project: https://yifei-y.github.io/project-pages/TDC/
  added: 2026-11-06
  tags: [compliance, admittance-control, sim-to-real, vla, real]
  takeaway_en: "Splits force regulation into a direction part learned in sim (task frame and control-mode outputs of a VLA-based policy) and a magnitude part set by hand in an admittance controller. Sim data only; four real tasks."
  takeaway_zh: "把力调节拆成两部分：方向分量（任务坐标系与控制模式，由基于 VLA 的策略在仿真数据上学习）和幅值分量（在导纳控制器中人工设定）。只用仿真数据，在四个真机任务上验证。"
- title: "M$^3$P-R1: Reinforcement Learning for Large Language Model Guided Multi-Modal Motion Planning via MIP Code Generation"
  type: paper
  arxiv: "2609.18669"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [motion-planning, mixed-integer-programming, llm, code-generation, rl]
  takeaway_en: "Fine-tunes an LLM with solver-based RL rewards to write executable mixed-integer programs for multi-modal motion planning (e.g. walk, then grasp), instead of answering directly."
  takeaway_zh: "用求解器结果作为奖励对 LLM 做强化学习微调，让它为多模态运动规划（如先走再抓）编写可执行的混合整数规划代码，而不是直接给出答案。"
- title: "Gradient-Free Neural Hamilton-Jacobi Reachability for Scalable Safety-Critical Control"
  type: paper
  arxiv: "2609.14087"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [hj-reachability, safety, neural-solver]
  takeaway_en: "Discrete-time neural HJ reachability without PDE gradients: bang-bang structure and gradient-free value probes give teacher actions, turning adversarial actor learning supervised; a windowed curriculum adds stability."
  takeaway_zh: "无需 PDE 梯度的离散时间神经 HJ 可达性：利用最优安全干预的 bang-bang 结构和免梯度的价值探测构造教师动作，把对抗式策略学习变成监督学习；分窗口的时间课程稳定训练。"
- title: "VertexCBF: Improving Neural Control Barrier Functions via Vertex-Restricted Control Search"
  type: paper
  arxiv: "2609.12831"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [cbf, safety, hj-reachability, real]
  takeaway_en: "Learns neural CBFs from an HJ value approximation; with control-affine dynamics and polytope inputs the optimum is at a vertex, so GPU vertex tree search makes labels. 15 systems + a robot among pedestrians."
  takeaway_zh: "通过近似 HJ 价值函数学习神经控制障碍函数；在控制仿射动力学和多面体输入集下最优解位于顶点，于是用 GPU 并行顶点树搜索生成监督点。在 15 个系统和行人避让真机实验中验证。"
- title: "BarrierFormer: Transformer-Guided Predictive Barrier Enforcement for Safe Robot Control"
  type: paper
  arxiv: "2609.23896"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [cbf, safety, transformer, model-free]
  takeaway_en: "A causal transformer predicts a rollout (in place of a model) and a residual fix to a nominal controller; a barrier critic scores CBF violations along the rollout, so safety looks ahead like MPC."
  takeaway_zh: "因果 Transformer 预测未来推演（代替动力学模型）并给名义控制器输出残差修正；障碍评估器沿推演检查 CBF 约束违例，从而像 MPC 一样前瞻安全，却无需在线求解优化。"
- title: "Learning Unions of Convex Sets via Invertible Latent Decomposition for Path Planning"
  type: paper
  arxiv: "2606.12027"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [motion-planning, convex-sets, gcs, invertible-network]
  takeaway_en: "Learns an invertible map plus convex polytopes in its latent space, so convex-set planners work in high-DoF spaces and paths decode back feasible. Tested from 2D to 14-DoF; no false positives after refinement."
  takeaway_zh: "联合学习可逆映射及其潜空间中的凸多面体并集，使基于凸集的规划可用于高自由度空间，解码回原空间的路径仍可行。在 2D 至 14 自由度场景测试，细化后未观察到误报。"
- title: "When Should a Robot Replan? Regret-Guided Update Scheduling in Time-Varying MDPs"
  type: paper
  arxiv: "2606.16972"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [replanning, regret, time-varying-mdp, quadrotor]
  takeaway_en: "With a limited budget for re-estimation and replanning under drifting dynamics, a dynamic-regret bound gives an online rule for when to update. Tested on simulated rover slip and a Crazyflie quadrotor."
  takeaway_zh: "在动力学漂移、重估与重规划次数有限时，用动态遗憾界推导出何时更新的在线规则。在模拟的打滑漫游车和 Crazyflie 四旋翼上验证。"
- title: "On the Limits of Sampling-Based Reachability: Geometry, Dynamics, and Sample Complexity"
  type: paper
  arxiv: "2607.18606"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [reachability, theory, sample-complexity]
  takeaway_en: "Theory: gives conditions under which sampled reachable sets are accurate in Hausdorff distance, and shows the sample need grows exponentially in both state dimension and horizon, with a matching lower bound."
  takeaway_zh: "理论工作：给出采样可达集在 Hausdorff 距离意义下准确的条件，并证明所需样本数随状态维度和时间跨度都呈指数增长，且给出相应下界。"
- title: "Optimal Control with Learned Critics under Unmodeled State Dependencies"
  type: paper
  arxiv: "2610.05359"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [mpc, ilqr, model-based-rl, gpu]
  takeaway_en: "Adds a residual dynamics network and a learned Q critic to iLQR MPC, with a GPU batched iLQR that solves thousands of problems in parallel, for model-based RL when contacts are poorly modeled."
  takeaway_zh: "在 iLQR 模型预测控制中加入残差动力学网络和学习得到的动作价值评估器，并实现 GPU 批量 iLQR 并行求解数千个问题，用于接触难以建模时的基于模型强化学习。"
- title: "Koopman DCM: Unstable Eigenfunctions as Data-driven Representations for Legged Balancing"
  type: paper
  arxiv: "2607.18760"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [legged, balance, koopman, mpc]
  takeaway_en: "Recasts divergent components of motion as unstable Koopman eigenfunctions learned from about an hour of real biped data; they improve walking tracking and give viability constraints for MPC."
  takeaway_zh: "把发散运动分量（DCM）重新表述为不稳定的 Koopman 特征函数，仅用约一小时真实双足数据学习得到；可改善行走跟踪，并为 MPC 提供可行性约束。"
- title: "$λ$-Reachability: Geometric-Horizon Safety Bellman Equations for Humanoid Safety"
  type: paper
  arxiv: "2606.16022"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [safety, reachability, humanoid, rl]
  takeaway_en: "λ-Reachability learns Hamilton-Jacobi safety values with a TD(λ)-like multi-step estimator with a random horizon, proven to be a contraction; better safe-set estimates on simulated and real humanoids."
  takeaway_zh: "λ-Reachability 用类似 TD(λ)、随机视野的多步估计器学习 Hamilton-Jacobi 安全值函数，并证明其为压缩映射；在仿真与真实人形上安全集估计更准确。"
- title: "MPC-Injection: Biasing Off-Policy Locomotion RL Toward Controller-Induced Behavior Basins"
  type: paper
  arxiv: "2606.26392"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [rl, mpc, locomotion, off-policy]
  takeaway_en: "MPC-Injection steers off-policy RL toward a usable gait by inserting MPC-generated transitions into training, with no reward shaping or discriminator; Go2 sim-to-real, and a barrel roll pure RL misses."
  takeaway_zh: "MPC-Injection 把 MPC 生成的状态转移注入离策略强化学习训练，在不改奖励、不加判别器的情况下把策略引向可用步态；在 Go2 上实现仿真到真实，并完成纯 RL 学不会的侧滚翻。"
- title: "VIGOR-MPC: Vision-Guided Objective Regulation MPC"
  type: paper
  arxiv: "2610.20333"
  year: 2026
  venue: CoRL 2026
  added: 2026-11-06
  tags: [mpc, vision, distillation, racing]
  takeaway_en: "VIGOR-MPC distills a privileged long-horizon MPC into a short-horizon MPC whose cost weights are inferred online from noisy vision; in vision-based racing it nears the teacher's lap times with 90%+ less compute per step."
  takeaway_zh: "VIGOR-MPC 将具有特权信息的长视野 MPC 蒸馏为短视野 MPC，其代价参数由含噪视觉在线推断；在视觉自主竞速中接近教师圈速，每步计算量减少 90% 以上。"
