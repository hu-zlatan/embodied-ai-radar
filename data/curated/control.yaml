- title: "cuRobo: Parallelized Collision-Free Minimum-Jerk Robot Motion Generation"
  type: paper
  arxiv: "2310.17274"
  year: 2023
  org: NVIDIA
  highlight: true
  code: https://github.com/NVlabs/curobo
  topics: [manipulation]
  tags: [motion-planning, gpu, trajectory-optimization]
  takeaway_en: GPU-parallel motion generation for arms — many trajectory optimizations run at once, giving collision-free, smooth plans in milliseconds.
  takeaway_zh: 面向机械臂的 GPU 并行运动生成：同时运行大量轨迹优化，在毫秒级给出无碰撞且平滑的轨迹。
- title: "Motion Policy Networks"
  type: paper
  arxiv: "2210.12209"
  year: 2022
  org: NVIDIA · University of Washington
  code: https://github.com/NVlabs/motion-policy-networks
  topics: [manipulation]
  tags: [motion-planning, point-cloud, imitation]
  takeaway_en: A neural policy trained on millions of planner-generated trajectories that moves an arm to goals straight from point clouds.
  takeaway_zh: 在数百万条规划器生成的轨迹上训练的神经策略，可直接根据点云把机械臂移动到目标位置。
- title: "Planning with Diffusion for Flexible Behavior Synthesis"
  type: paper
  arxiv: "2205.09991"
  year: 2022
  org: UC Berkeley
  code: https://github.com/jannerm/diffuser
  topics: [world-models]
  tags: [diffusion, planning, offline-rl]
  takeaway_en: Diffuser — treats planning as denoising whole trajectories, so goals and rewards can steer sampling; an early link between diffusion and control.
  takeaway_zh: Diffuser：把规划视为对整条轨迹去噪，目标与奖励可以引导采样；扩散模型与控制结合的早期代表作。
- title: "Control Barrier Functions: Theory and Applications"
  type: paper
  arxiv: "1903.11199"
  year: 2019
  org: Caltech
  tags: [safety, control-barrier-function, tutorial]
  takeaway_en: Tutorial on control barrier functions — the standard way to wrap any controller in a minimal-change filter that keeps the system safe.
  takeaway_zh: 控制障碍函数教程：为任意控制器加一层“尽量少改动”的安全滤波器、保证系统安全的标准方法。
- title: "Safe Learning in Robotics: From Learning-Based Control to Safe Reinforcement Learning"
  type: paper
  arxiv: "2108.06266"
  year: 2021
  org: University of Toronto
  tags: [safety, survey, safe-rl]
  takeaway_en: Survey connecting control-theory and RL views of safety, from learned dynamics with guarantees to constrained RL and safety filters.
  takeaway_zh: 综述，连接控制理论与强化学习两种安全视角：从带保证的学习动力学到约束强化学习与安全滤波器。
- title: "safe-control-gym: a Unified Benchmark Suite for Safe Learning-based Control and Reinforcement Learning in Robotics"
  type: benchmark
  arxiv: "2109.06325"
  year: 2021
  org: University of Toronto
  code: https://github.com/utiasDSL/safe-control-gym
  topics: [datasets]
  tags: [safety, benchmark, safe-rl]
  takeaway_en: Gym-style benchmark with cart-pole and quadrotor tasks, constraints and disturbances for comparing safe control and safe RL methods.
  takeaway_zh: Gym 风格基准，含倒立摆与四旋翼任务、约束与扰动，用于比较安全控制与安全强化学习方法。
- title: "Crocoddyl: An Efficient and Versatile Framework for Multi-Contact Optimal Control"
  type: paper
  arxiv: "1909.04947"
  year: 2019
  org: LAAS-CNRS, University of Edinburgh
  code: https://github.com/loco-3d/crocoddyl
  topics: [locomotion]
  tags: [optimal-control, ddp, legged, open-source]
  takeaway_en: An open-source DDP-based solver for contact-rich trajectory optimization, widely used for legged and humanoid motion generation and MPC.
  takeaway_zh: 基于 DDP 的开源接触丰富轨迹优化求解器，广泛用于足式与人形机器人的运动生成和 MPC。
- title: "acados: a modular open-source framework for fast embedded optimal control"
  type: paper
  arxiv: "1910.13753"
  year: 2019
  org: University of Freiburg
  code: https://github.com/acados/acados
  tags: [mpc, optimal-control, embedded, open-source]
  takeaway_en: Fast nonlinear MPC and estimation solvers with Python/MATLAB interfaces that generate C code for embedded targets.
  takeaway_zh: 高速非线性 MPC 与状态估计求解器，提供 Python/MATLAB 接口并可为嵌入式平台生成 C 代码。
- title: "Sub-Millisecond Reflexes for Continuous Physical Human-Robot Interaction"
  type: paper
  arxiv: "2610.21913"
  year: 2026
  code: https://github.com/RoboRef/franka_reflex_engine
  added: 2026-10-19
  topics: [manipulation]
  tags: [real, arm, phri, ros2, safety]
  takeaway_en: An open-source ROS 2 multimode controller that switches control modes and triggers safety reflexes in under a millisecond, without stopping the task; shown on a Franka arm.
  takeaway_zh: 开源的 ROS 2 多模式控制器，可在亚毫秒内切换控制模式并触发安全反射而无需中断任务；在 Franka 机械臂上验证。
- title: "PrismPlan: A Shared GPU Substrate for Motion Planning Across Paradigms"
  type: paper
  arxiv: "2610.23884"
  year: 2026
  code: https://github.com/XiaoyubotMotionTeam/PrismPlan
  added: 2026-10-20
  tags: [motion-planning, gpu, benchmark]
  takeaway_en: Builds batched GPU collision checking and forward kinematics once and runs sampling, search and optimization planners on top, so the three paradigms can be compared fairly.
  takeaway_zh: 一次性实现批量 GPU 碰撞检测与正运动学，在其上运行采样、搜索和优化三类规划器，使三种范式可以公平比较。
- title: "Predictive Sampling: Real-time Behaviour Synthesis with MuJoCo"
  type: paper
  arxiv: "2212.00541"
  year: 2022
  org: Google DeepMind
  code: https://github.com/google-deepmind/mujoco_mpc
  tags: [sim, mpc, sampling-based, open-source]
  takeaway_en: Introduces MuJoCo MPC (MJPC), an interactive tool for real-time predictive control in MuJoCo, and shows that a simple sampling-based planner is a strong baseline for contact-rich behaviours.
  takeaway_zh: 推出 MuJoCo MPC（MJPC），可在 MuJoCo 中交互式地做实时预测控制，并表明简单的基于采样的规划器在接触丰富的行为上是很强的基线。
- title: "Pinocchio"
  type: code
  year: 2019
  org: LAAS-CNRS, INRIA
  code: https://github.com/stack-of-tasks/pinocchio
  tags: [library, dynamics, kinematics, open-source]
  takeaway_en: Fast C++/Python rigid-body dynamics library with analytical derivatives; a common backbone for kinematics, optimal control (e.g. Crocoddyl) and legged/humanoid control stacks.
  takeaway_zh: 高性能 C++/Python 刚体动力学库，提供解析导数；是运动学、最优控制（如 Crocoddyl）以及足式/人形机器人控制栈的常用底座。
- title: "CusADi2: Latency-Optimized Batch Computation of Robot Kinematics, Jacobians, and Hessians on the GPU"
  type: paper
  arxiv: "2610.25476"
  year: 2026
  code: https://github.com/johnviljoen/cusadi2
  added: 2026-10-20
  tags: [gpu, kinematics, trajectory-optimization]
  takeaway_en: Evaluates batches of kinematics, Jacobians and Hessians on the GPU with low wall-clock latency, targeting online sampling- and gradient-based trajectory optimization.
  takeaway_zh: 在 GPU 上以低延迟批量计算运动学、雅可比与海森矩阵，面向在线运行的采样式与梯度式轨迹优化。
- title: "OSQP: An Operator Splitting Solver for Quadratic Programs"
  type: paper
  arxiv: "1711.08013"
  year: 2020
  org: University of Oxford, ETH Zurich, IMT Lucca, Stanford
  code: https://github.com/osqp/osqp
  tags: [optimization, qp-solver, mpc, open-source]
  takeaway_en: A fast, robust ADMM-based QP solver with warm starting and embedded C code generation; widely used inside MPC and whole-body controllers.
  takeaway_zh: 基于 ADMM 的快速、鲁棒二次规划求解器，支持热启动与嵌入式 C 代码生成，广泛用于 MPC 与全身控制器。
- title: "OMPL: The Open Motion Planning Library"
  type: code
  year: 2012
  org: Rice University (Kavraki Lab)
  code: https://github.com/ompl/ompl
  url: https://ompl.kavrakilab.org/
  tags: [library, motion-planning, sampling-based, open-source]
  takeaway_en: The standard library of sampling-based motion planners (RRT, RRT-Connect, PRM, RRT* and many more); the default planning backend of MoveIt.
  takeaway_zh: 采样式运动规划器的标准库（RRT、RRT-Connect、PRM、RRT* 等众多算法），也是 MoveIt 默认的规划后端。
- title: "MoveIt 2"
  type: code
  year: 2019
  org: PickNik Robotics and community
  code: https://github.com/moveit/moveit2
  url: https://moveit.ai/
  topics: [manipulation]
  tags: [ros2, motion-planning, manipulation, open-source]
  takeaway_en: The ROS 2 manipulation framework - motion planning, inverse kinematics, collision checking and real-time servoing for robot arms.
  takeaway_zh: ROS 2 的机械臂操作框架：提供运动规划、逆运动学、碰撞检测与实时伺服控制。
- title: "Drake"
  type: code
  year: 2014
  org: MIT, Toyota Research Institute
  code: https://github.com/RobotLocomotion/drake
  url: https://drake.mit.edu/
  topics: [sim]
  tags: [library, optimization, simulation, trajectory-optimization, open-source]
  takeaway_en: Model-based toolbox for robotics - multibody dynamics with contact simulation, mathematical programming and trajectory optimization; used in the MIT manipulation and underactuated courses.
  takeaway_zh: 面向机器人的基于模型的工具箱：带接触的多体动力学仿真、数学规划与轨迹优化；MIT 操作与欠驱动课程即使用它。
- title: "Motions in Microseconds via Vectorized Sampling-Based Planning"
  type: paper
  arxiv: "2309.14545"
  year: 2023
  org: Rice University (Kavraki Lab)
  venue: ICRA 2024
  code: https://github.com/KavrakiLab/vamp
  topics: [manipulation]
  tags: [motion-planning, simd, sampling-based, cpu]
  takeaway_en: VAMP — vectorizes collision checking with CPU SIMD so sampling-based planners like RRT-Connect solve arm motion-planning queries in microseconds to milliseconds, no GPU needed.
  takeaway_zh: VAMP：用 CPU SIMD 指令把碰撞检测向量化，使 RRT-Connect 等基于采样的规划器在微秒到毫秒级求解机械臂运动规划，无需 GPU。
- title: "Riemannian Motion Policies"
  type: paper
  arxiv: "1801.02854"
  year: 2018
  org: NVIDIA
  tags: [reactive-control, motion-generation, geometric-control]
  takeaway_en: RMPs — describe each behaviour (reach, avoid obstacles, joint limits) as an acceleration policy plus a Riemannian metric, then combine them geometrically; the basis of later RMPflow and geometric fabrics controllers.
  takeaway_zh: RMP：把每种行为（到达、避障、关节限位）表示为加速度策略加黎曼度量，再按几何方式组合；是后来 RMPflow 与几何织物（geometric fabrics）控制器的基础。
- title: "Hamilton-Jacobi Reachability: A Brief Overview and Recent Advances"
  type: paper
  arxiv: "1709.07523"
  year: 2017
  org: UC Berkeley
  venue: CDC 2017
  tags: [safety, reachability, tutorial]
  takeaway_en: Short tutorial on Hamilton-Jacobi reachability — computing the set of states from which a system can be kept safe under worst-case disturbances, and the tricks used to scale it up.
  takeaway_zh: Hamilton-Jacobi 可达性分析简明教程：计算在最坏扰动下仍能保持系统安全的状态集合，以及将其扩展到更高维系统的方法。
- title: "Jerk-limited Real-time Trajectory Generation with Arbitrary Target States"
  type: paper
  arxiv: "2105.04830"
  year: 2021
  org: Karlsruhe Institute of Technology (KIT)
  venue: RSS 2021
  code: https://github.com/pantor/ruckig
  topics: [manipulation]
  tags: [trajectory-generation, real-time, jerk-limited, library]
  takeaway_en: Ruckig — open-source C++/Python library for time-optimal, jerk-limited online trajectories to any target position, velocity and acceleration; a common drop-in for smooth arm motion on real controllers.
  takeaway_zh: Ruckig：开源 C++/Python 库，可实时生成到任意目标位置、速度和加速度的时间最优、限加加速度（jerk）轨迹；常被直接用于真实控制器上的机械臂平滑运动。
- title: "OCS2: Optimal Control for Switched Systems"
  type: code
  year: 2021
  org: ETH Zurich (Robotic Systems Lab)
  code: https://github.com/leggedrobotics/ocs2
  topics: [locomotion]
  tags: [library, mpc, optimal-control, legged, mobile-manipulation]
  takeaway_en: C++ toolbox for nonlinear MPC on switched systems (SLQ, DDP, SQP) with robot examples for legged robots and mobile manipulators; the base of many open-source legged MPC + whole-body control stacks.
  takeaway_zh: 面向切换系统的非线性 MPC C++ 工具箱（SLQ、DDP、SQP），附足式机器人与移动操作臂示例；许多开源足式 MPC + 全身控制方案都基于它。
