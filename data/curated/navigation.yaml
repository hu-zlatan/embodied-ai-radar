- title: "Do As I Can, Not As I Say: Grounding Language in Robotic Affordances"
  type: paper
  arxiv: "2204.01691"
  year: 2022
  org: Google
  highlight: true
  tags: [real, mobile, llm, planning]
  takeaway_en: SayCan — an LLM proposes steps and learned value functions score what the robot can actually do right now.
  takeaway_zh: SayCan：大模型提出步骤，学习到的价值函数评估机器人当下实际能做什么。
- title: "Code as Policies: Language Model Programs for Embodied Control"
  type: paper
  arxiv: "2209.07753"
  year: 2022
  org: Google
  topics: [manipulation]
  tags: [real, llm, code-generation]
  takeaway_en: LLMs write Python that calls perception and control APIs, turning instructions into reactive robot programs.
  takeaway_zh: 大模型编写调用感知与控制 API 的 Python 代码，把指令变成可响应的机器人程序。
- title: "Inner Monologue: Embodied Reasoning through Planning with Language Models"
  type: paper
  arxiv: "2207.05608"
  year: 2022
  org: Google
  tags: [real, llm, planning, feedback]
  takeaway_en: Feeding success detection and scene descriptions back to the LLM planner lets it replan after failures.
  takeaway_zh: 将成功检测与场景描述反馈给大模型规划器，使其在失败后重新规划。
- title: "Vision-and-Language Navigation: Interpreting visually-grounded navigation instructions in real environments"
  type: paper
  arxiv: "1711.07280"
  year: 2017
  org: Australian National University
  topics: [datasets]
  tags: [sim, benchmark, vln]
  takeaway_en: Introduced the VLN task and the Room-to-Room (R2R) benchmark in Matterport3D homes.
  takeaway_zh: 提出视觉语言导航任务与基于 Matterport3D 的 Room-to-Room (R2R) 基准。
- title: "Visual Language Maps for Robot Navigation"
  type: paper
  arxiv: "2210.05714"
  year: 2022
  org: Freiburg, Google
  tags: [real, mapping, open-vocabulary]
  takeaway_en: VLMaps fuses visual-language features into a 3D map so robots can navigate to open-vocabulary spatial goals.
  takeaway_zh: VLMaps 将视觉语言特征融合进 3D 地图，使机器人可按开放词汇空间目标导航。
- title: "NoMaD: Goal Masked Diffusion Policies for Navigation and Exploration"
  type: paper
  arxiv: "2310.07896"
  year: 2023
  org: UC Berkeley
  tags: [real, diffusion, exploration]
  takeaway_en: One diffusion policy handles both goal-directed navigation and exploration by masking the goal.
  takeaway_zh: 通过对目标做掩码，单一扩散策略同时完成目标导航与探索。
- title: "OK-Robot: What Really Matters in Integrating Open-Knowledge Models for Robotics"
  type: paper
  arxiv: "2401.12202"
  year: 2024
  org: NYU, Meta AI
  topics: [manipulation]
  tags: [real, mobile, open-vocabulary, zero-shot]
  takeaway_en: Combines off-the-shelf open-vocabulary models into a pick-and-drop system that works in real homes without training.
  takeaway_zh: 组合现成的开放词汇模型，构建无需训练即可在真实家庭中抓取放置的系统。
- title: "Cracking Mobile Manipulation: From Failure Diagnosis to Agentic Robot System"
  type: paper
  arxiv: "2610.19600"
  year: 2026
  code: https://github.com/PKU-VaLuE-Lab/Cracking-Mobile-Manipulation
  added: 2026-10-19
  topics: [manipulation, vla]
  tags: [real, mobile, failure-analysis, agentic]
  takeaway_en: Finds a VLA at 80% on atomic skills drops to 19% when composed into mobile manipulation, diagnoses why, and builds an agentic system around it.
  takeaway_zh: 发现 VLA 在原子技能上 80% 成功率、组合成移动操作后仅 19%，分析失败原因并据此构建智能体式系统。
- title: "Hierarchical Residual Policy Learning for Real-World Mobile Manipulation with Sparse Human Guidance"
  type: paper
  arxiv: "2610.20607"
  year: 2026
  venue: CoRL 2026
  project: https://hire-moma.github.io/
  topics: [manipulation]
  added: 2026-10-19
  tags: [real, mobile-manipulation, residual-rl, fine-tuning]
  takeaway_en: HiRe-MoMa fine-tunes a frozen mobile-manipulation policy in the real world by learning residual corrections, with only occasional human guidance.
  takeaway_zh: HiRe-MoMa 在真实环境中通过学习残差修正来微调冻结的移动操作策略，只需偶尔的人类引导。
- title: "ViNT: A Foundation Model for Visual Navigation"
  type: paper
  arxiv: "2306.14846"
  year: 2023
  org: UC Berkeley
  venue: CoRL 2023
  code: https://github.com/robodhruv/visualnav-transformer
  tags: [foundation-model, image-goal, cross-embodiment, open-source]
  takeaway_en: A Transformer navigation policy trained on many robots' driving data that adapts to new goal types and robots with light fine-tuning.
  takeaway_zh: 在多种机器人的导航数据上训练的 Transformer 导航策略，经少量微调即可适配新的目标形式和新机器人。
- title: "GNM: A General Navigation Model to Drive Any Robot"
  type: paper
  arxiv: "2210.03370"
  year: 2022
  org: UC Berkeley
  venue: ICRA 2023
  code: https://github.com/robodhruv/visualnav-transformer
  tags: [foundation-model, image-goal, cross-embodiment, open-source]
  takeaway_en: The predecessor of ViNT — one goal-conditioned navigation policy trained on pooled data from several different robots, which transfers to new robots including ones not seen in training.
  takeaway_zh: ViNT 的前作：在多种不同机器人汇集的数据上训练一个目标条件导航策略，可迁移到包括训练中未见过的新机器人。
- title: "VLFM: Vision-Language Frontier Maps for Zero-Shot Semantic Navigation"
  type: paper
  arxiv: "2312.03275"
  year: 2023
  venue: ICRA 2024
  org: Boston Dynamics AI Institute, Georgia Tech
  code: https://github.com/rai-opensource/vlfm
  tags: [zero-shot, object-goal, vlm, frontier-exploration, real, sim]
  takeaway_en: Zero-shot object-goal navigation that scores exploration frontiers by vision-language similarity to the target, with no task-specific training; tested in Habitat and on a Spot robot.
  takeaway_zh: 零样本目标物体导航：用视觉-语言模型对探索前沿与目标的相关度打分来决定往哪走，无需针对任务训练；在 Habitat 和 Spot 机器人上验证。
- title: "NaVid: Video-based VLM Plans the Next Step for Vision-and-Language Navigation"
  type: paper
  arxiv: "2402.15852"
  year: 2024
  venue: RSS 2024
  org: Peking University
  code: https://github.com/jzhzhang/NaVid-VLN-CE
  tags: [vln, video-vlm, monocular, sim-to-real]
  takeaway_en: A video VLM that reads the monocular RGB history plus the instruction and outputs the next navigation action directly, without maps, odometry or depth.
  takeaway_zh: 基于视频的视觉语言模型：只看单目 RGB 历史帧和语言指令，直接输出下一步导航动作，不依赖地图、里程计或深度。
- title: "Uni-NaVid: A Video-based Vision-Language-Action Model for Unifying Embodied Navigation Tasks"
  type: paper
  arxiv: "2412.06224"
  year: 2024
  venue: RSS 2025
  org: Peking University
  code: https://github.com/jzhzhang/NaVid-VLN-CE
  topics: [vla]
  tags: [vln, object-goal, following, video-vlm]
  takeaway_en: Extends NaVid into one video VLA model for several navigation tasks (instruction following, object search, question answering, human following).
  takeaway_zh: 把 NaVid 扩展为单一视频 VLA 模型，统一处理多种导航任务（指令导航、目标搜索、具身问答、跟随人）。
- title: "The Marathon 2: A Navigation System"
  type: paper
  arxiv: "2003.00368"
  year: 2020
  venue: IROS 2020
  code: https://github.com/ros-navigation/navigation2
  tags: [ros2, nav2, behavior-trees, open-source, mobile]
  takeaway_en: The paper behind Nav2, the standard ROS 2 navigation stack - behavior-tree orchestration of planners, controllers and recovery behaviors, validated by long marathon runs on real robots.
  takeaway_zh: ROS 2 标准导航栈 Nav2 的论文：用行为树编排规划器、控制器和恢复行为，并在真实机器人上长距离“马拉松”测试验证。
- title: "NaVILA: Legged Robot Vision-Language-Action Model for Navigation"
  type: paper
  arxiv: "2412.04453"
  year: 2024
  org: UC San Diego, USC, NVIDIA
  code: https://github.com/AnjieCheng/NaVILA
  project: https://navila-bot.github.io/
  venue: RSS 2025
  topics: [vla, locomotion]
  tags: [vln, legged, hierarchical]
  takeaway_en: A VLA outputs mid-level navigation commands in language that an RL locomotion policy executes, so legged robots follow natural-language routes; adds Isaac Lab VLN benchmarks.
  takeaway_zh: VLA 先用语言输出中层导航指令，再由强化学习运动策略执行，让腿式机器人按自然语言指令导航；并提供 Isaac Lab 上的 VLN 基准。
- title: "Beyond the Nav-Graph: Vision-and-Language Navigation in Continuous Environments"
  type: benchmark
  arxiv: "2004.02857"
  year: 2020
  org: Oregon State, Georgia Tech, Meta AI
  code: https://github.com/jacobkrantz/VLN-CE
  venue: ECCV 2020
  topics: [datasets]
  tags: [vln, habitat, benchmark]
  takeaway_en: VLN-CE moves Room-to-Room instructions from a fixed navigation graph into continuous Habitat scenes with low-level actions; the standard setting for realistic VLN.
  takeaway_zh: VLN-CE 把 Room-to-Room 指令从固定导航图搬到 Habitat 连续环境中、使用底层动作执行，是更贴近真实的 VLN 标准设定。
- title: "LM-Nav: Robotic Navigation with Large Pre-Trained Models of Language, Vision, and Action"
  type: paper
  arxiv: "2207.04429"
  year: 2022
  venue: CoRL 2022
  org: UC Berkeley, Google
  code: https://github.com/blazejosinski/lm_nav
  topics: [vla]
  tags: [real, wheeled, language, foundation-models, zero-shot]
  takeaway_en: Chains an LLM (parses landmarks from the instruction), CLIP (finds them in images) and a visual navigation model to follow route instructions on a real robot without language-annotated robot data.
  takeaway_zh: 将大语言模型（从指令中解析地标）、CLIP（在图像中找到地标）与视觉导航模型串联，无需带语言标注的机器人数据即可在真实机器人上按路线指令导航。
- title: "Object Goal Navigation using Goal-Oriented Semantic Exploration"
  type: paper
  arxiv: "2007.00643"
  year: 2020
  venue: NeurIPS 2020
  org: CMU, Meta AI
  code: https://github.com/devendrachaplot/Object-Goal-Navigation
  topics: [perception]
  tags: [sim, objectnav, semantic-map, modular, rl]
  takeaway_en: SemExp builds an episodic semantic map and learns a policy that picks long-term goals on it, a modular recipe that became a standard ObjectNav baseline in Habitat.
  takeaway_zh: SemExp 构建情景语义地图，并学习在地图上选择长期目标的策略；这一模块化方案成为 Habitat 中 ObjectNav 的常用基线。
- title: "Learning to Explore using Active Neural SLAM"
  type: paper
  arxiv: "2004.05155"
  year: 2020
  venue: ICLR 2020
  org: CMU, Meta AI
  code: https://github.com/devendrachaplot/Neural-SLAM
  topics: [perception]
  tags: [sim, exploration, slam, modular, rl]
  takeaway_en: Splits exploration into a learned neural SLAM module, a global policy that chooses long-term goals and a local policy that reaches them, which is far more sample-efficient than end-to-end RL.
  takeaway_zh: 将探索拆为可学习的神经 SLAM 模块、选择长期目标的全局策略和到达目标的局部策略，比端到端强化学习样本效率高得多。
- title: "CoWs on Pasture: Baselines and Benchmarks for Language-Driven Zero-Shot Object Navigation"
  type: paper
  arxiv: "2203.10421"
  year: 2022
  org: Columbia University
  venue: CVPR 2023
  project: https://cow.cs.columbia.edu/
  tags: [zero-shot, object-goal, clip, benchmark, sim]
  takeaway_en: CLIP on Wheels pairs open-vocabulary localization (CLIP-style models, no fine-tuning) with classical exploration for zero-shot object navigation; the Pasture benchmark adds rare, attribute-described and hidden objects.
  takeaway_zh: CoWs on Pasture：CLIP on Wheels 把开放词汇定位（CLIP 等模型，无需微调）与经典探索结合，实现零样本目标物体导航；配套的 Pasture 基准加入了少见物体、按属性描述的物体和被遮挡物体。
- title: "PIRLNav: Pretraining with Imitation and RL Finetuning for ObjectNav"
  type: paper
  arxiv: "2301.07302"
  year: 2023
  org: Georgia Tech, Meta AI
  venue: CVPR 2023
  code: https://github.com/Ram81/pirlnav
  topics: [learning]
  tags: [object-goal, imitation, rl-finetuning, habitat, sim]
  takeaway_en: PIRLNav — behavior cloning on human ObjectNav demonstrations, then RL fine-tuning of the same policy; the paper reports 65.0% success on Habitat ObjectNav, 5 points above the previous best.
  takeaway_zh: PIRLNav：先在人类 ObjectNav 演示上做行为克隆，再用强化学习微调同一策略；论文报告在 Habitat ObjectNav 上成功率 65.0%，比此前最佳高 5 个百分点。
- title: "ScaleNav: Scalable Internet Video Pretraining for Language-Conditioned Local Navigation"
  type: paper
  arxiv: "2610.25690"
  year: 2026
  org: Zhejiang University
  project: https://zju3dv.github.io/ScaleNav/
  added: 2026-10-23
  tags: [internet-video, language-navigation, quadruped, pretraining]
  takeaway_en: Pretrains on internet egocentric video to learn how the view changes when approaching a described target, then aligns to actions in sim; reports 94.9% success on its HabitatGS-LN benchmark plus a real quadruped.
  takeaway_zh: 先在互联网第一视角视频上预训练，学习"朝描述的目标走近时画面如何变化"，再用仿真数据对齐到动作；论文报告在自建 HabitatGS-LN 基准上成功率 94.9%，并在真实四足机器人上部署。
- title: "NavGPT: Explicit Reasoning in Vision-and-Language Navigation with Large Language Models"
  type: paper
  arxiv: "2305.16986"
  year: 2023
  org: University of Adelaide
  venue: AAAI 2024
  code: https://github.com/GengzeZhou/NavGPT
  tags: [vln, llm, zero-shot, reasoning, r2r]
  takeaway_en: A purely LLM-based VLN agent — GPT models read text descriptions of what the robot sees, its history and possible directions, then reason step by step about where to go; zero-shot on R2R, still behind trained models.
  takeaway_zh: 纯大语言模型的视觉语言导航智能体：GPT 读取视觉观测的文字描述、历史轨迹和可走方向，逐步显式推理下一步去哪；在 R2R 上零样本运行，但仍落后于专门训练的模型。
- title: "ETPNav: Evolving Topological Planning for Vision-Language Navigation in Continuous Environments"
  type: paper
  arxiv: "2304.03047"
  year: 2023
  venue: TPAMI 2024
  code: https://github.com/MarSaKi/ETPNav
  tags: [vln-ce, topological-map, planning, r2r-ce, rxr-ce]
  takeaway_en: For VLN in continuous spaces, builds a topological map online from predicted waypoints, plans on it with a cross-modal transformer and moves with an obstacle-avoiding controller; reports >10%/>20% gains on R2R-CE/RxR-CE.
  takeaway_zh: 面向连续环境视觉语言导航：根据预测的路点在线构建拓扑地图，用跨模态 Transformer 在图上规划，再由避障控制器执行；报告在 R2R-CE、RxR-CE 上分别比此前最好方法提升 10% 和 20% 以上。
- title: "TARSphere: A Robot-Oriented Full-Stack Framework for Long-Horizon Embodied Agents in Evolving Physical and Social Environments"
  type: paper
  arxiv: "2610.30043"
  year: 2026
  code: https://github.com/xuyicheng-zju/TARSphere
  project: https://xuyicheng-zju.github.io/TARSphere/
  added: 2026-10-25
  topics: [navigation, datasets]
  tags: [benchmark, mllm-agent, long-horizon, hri, sim]
  takeaway_en: Simulator with embodied NPCs, dialogue and event-driven task states, plus a skill harness for frozen MLLMs; its 360-episode bench reports general MLLMs can beat embodied ones; task updates and HRI stay hard.
  takeaway_zh: 带具身 NPC、受限对话和事件驱动任务状态机的物理仿真框架，并提供让冻结多模态大模型调用多级技能的执行框架；基于 30 个室内场景构建 360 回合基准，评测 8 个模型，报告通用模型可胜过具身专用模型，任务变更和人机协作仍是难点。
- title: "EmbodiedWorld-200K: Toward Embodied World Agents via Embodied-Planning Dataset and Interactive World Models"
  type: paper
  arxiv: "2610.25959"
  year: 2026
  venue: NeurIPS 2026
  project: https://xiaokunfeng.github.io/EmbodiedWorld-200K/
  added: 2026-10-26
  topics: [datasets, world-models]
  tags: [dataset, navigation-planning, video-world-model, rl-finetuning, open-world]
  takeaway_en: "200K+ navigation-planning samples annotated from camera trajectories up to instructions; RL post-training inside a video world model, used as a cheap stand-in environment, reportedly helps on unseen scenes."
  takeaway_zh: 包含 20 万余条导航规划样本的数据集，场景多样，标注从相机运动轨迹到高层语义指令；并把视频世界模型当作低成本交互环境做强化学习后训练，报告称在未见场景上有明显提升。
- title: "InJePA: Intention-First Latent Planning with Coupled JEPA World Models for Visual Navigation"
  type: paper
  arxiv: "2610.23896"
  year: 2026
  code: https://github.com/zhuxun132/InJepa
  added: 2026-10-26
  topics: [world-models]
  tags: [jepa, latent-planning, image-goal, habitat, sim]
  takeaway_en: "Two coupled JEPAs share a latent space: one proposes goal-conditioned latent intentions, the other predicts consequences, closing an intention-action-consequence loop. Evaluated on image-goal navigation in Habitat MP3D."
  takeaway_zh: 两个耦合的 JEPA 共享隐空间：一个按目标提出隐式“意图”，另一个预测动作后果，形成意图-动作-后果闭环，让世界模型直接参与构造规划；在 Habitat MP3D 图像目标导航上评测。
