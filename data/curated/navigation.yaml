- title: "Do As I Can, Not As I Say: Grounding Language in Robotic Affordances"
  type: paper
  arxiv: "2204.01691"
  year: 2022
  org: Google
  highlight: true
  tags: [real, mobile, llm, planning]
  takeaway_en: SayCan — an LLM proposes steps and learned value functions score what the robot can actually do right now.
  takeaway_zh: SayCan：大模型提出步骤，学习到的价值函数评估机器人当下实际能做什么。
- title: "Code as Policies: Language Model Programs for Embodied Control"
  type: paper
  arxiv: "2209.07753"
  year: 2022
  org: Google
  topics: [manipulation]
  tags: [real, llm, code-generation]
  takeaway_en: LLMs write Python that calls perception and control APIs, turning instructions into reactive robot programs.
  takeaway_zh: 大模型编写调用感知与控制 API 的 Python 代码，把指令变成可响应的机器人程序。
- title: "Inner Monologue: Embodied Reasoning through Planning with Language Models"
  type: paper
  arxiv: "2207.05608"
  year: 2022
  org: Google
  tags: [real, llm, planning, feedback]
  takeaway_en: Feeding success detection and scene descriptions back to the LLM planner lets it replan after failures.
  takeaway_zh: 将成功检测与场景描述反馈给大模型规划器，使其在失败后重新规划。
- title: "Vision-and-Language Navigation: Interpreting visually-grounded navigation instructions in real environments"
  type: paper
  arxiv: "1711.07280"
  year: 2017
  org: Australian National University
  topics: [datasets]
  tags: [sim, benchmark, vln]
  takeaway_en: Introduced the VLN task and the Room-to-Room (R2R) benchmark in Matterport3D homes.
  takeaway_zh: 提出视觉语言导航任务与基于 Matterport3D 的 Room-to-Room (R2R) 基准。
- title: "Visual Language Maps for Robot Navigation"
  type: paper
  arxiv: "2210.05714"
  year: 2022
  org: Freiburg, Google
  tags: [real, mapping, open-vocabulary]
  takeaway_en: VLMaps fuses visual-language features into a 3D map so robots can navigate to open-vocabulary spatial goals.
  takeaway_zh: VLMaps 将视觉语言特征融合进 3D 地图，使机器人可按开放词汇空间目标导航。
- title: "NoMaD: Goal Masked Diffusion Policies for Navigation and Exploration"
  type: paper
  arxiv: "2310.07896"
  year: 2023
  org: UC Berkeley
  tags: [real, diffusion, exploration]
  takeaway_en: One diffusion policy handles both goal-directed navigation and exploration by masking the goal.
  takeaway_zh: 通过对目标做掩码，单一扩散策略同时完成目标导航与探索。
- title: "OK-Robot: What Really Matters in Integrating Open-Knowledge Models for Robotics"
  type: paper
  arxiv: "2401.12202"
  year: 2024
  org: NYU, Meta AI
  topics: [manipulation]
  tags: [real, mobile, open-vocabulary, zero-shot]
  takeaway_en: Combines off-the-shelf open-vocabulary models into a pick-and-drop system that works in real homes without training.
  takeaway_zh: 组合现成的开放词汇模型，构建无需训练即可在真实家庭中抓取放置的系统。
- title: "Cracking Mobile Manipulation: From Failure Diagnosis to Agentic Robot System"
  type: paper
  arxiv: "2610.19600"
  year: 2026
  code: https://github.com/PKU-VaLuE-Lab/Cracking-Mobile-Manipulation
  added: 2026-10-19
  topics: [manipulation, vla]
  tags: [real, mobile, failure-analysis, agentic]
  takeaway_en: Finds a VLA at 80% on atomic skills drops to 19% when composed into mobile manipulation, diagnoses why, and builds an agentic system around it.
  takeaway_zh: 发现 VLA 在原子技能上 80% 成功率、组合成移动操作后仅 19%，分析失败原因并据此构建智能体式系统。
