- title: "Open X-Embodiment: Robotic Learning Datasets and RT-X Models"
  type: dataset
  arxiv: "2310.08864"
  year: 2023
  org: Open X-Embodiment Collaboration
  code: https://github.com/google-deepmind/open_x_embodiment
  highlight: true
  topics: [vla]
  tags: [real, cross-embodiment, multi-robot]
  takeaway_en: 1M+ trajectories from 22 robot types pooled by 30+ labs; RT-X models trained on it beat single-robot baselines.
  takeaway_zh: 30 多个实验室汇集 22 种机器人的 100 多万条轨迹；在其上训练的 RT-X 优于单机器人基线。
- title: "DROID: A Large-Scale In-The-Wild Robot Manipulation Dataset"
  type: dataset
  arxiv: "2403.12945"
  year: 2024
  org: DROID Collaboration
  code: https://github.com/droid-dataset/droid
  tags: [real, arm, in-the-wild]
  takeaway_en: 76k teleoperated Franka trajectories collected in hundreds of real scenes across many institutions.
  takeaway_zh: 由多家机构在数百个真实场景中采集的 7.6 万条 Franka 遥操作轨迹。
- title: "BridgeData V2: A Dataset for Robot Learning at Scale"
  type: dataset
  arxiv: "2308.12952"
  year: 2023
  org: UC Berkeley
  tags: [real, arm, low-cost]
  takeaway_en: 60k trajectories on a low-cost WidowX arm across many kitchens and tasks; a common pretraining source.
  takeaway_zh: 在低成本 WidowX 机械臂上采集、涵盖众多厨房与任务的 6 万条轨迹，常用作预训练数据。
- title: "RH20T: A Comprehensive Robotic Dataset for Learning Diverse Skills in One-Shot"
  type: dataset
  arxiv: "2307.00595"
  year: 2023
  org: Shanghai Jiao Tong University
  tags: [real, arm, multimodal, force]
  takeaway_en: 110k+ contact-rich sequences with vision, force, audio and paired human demonstration videos.
  takeaway_zh: 11 万多条接触丰富的序列，包含视觉、力、音频及配对的人类演示视频。
- title: "AgiBot World Colosseo: A Large-scale Manipulation Platform for Scalable and Intelligent Embodied Systems"
  type: dataset
  arxiv: "2503.06669"
  year: 2025
  org: AgiBot, Shanghai AI Lab
  tags: [real, humanoid, dual-arm, large-scale]
  takeaway_en: A million-scale real-robot dataset collected in purpose-built scenes, with the GO-1 generalist policy trained on it.
  takeaway_zh: 在专门搭建的场景中采集的百万级真实机器人数据集，并基于其训练通用策略 GO-1。
- title: "Ego4D: Around the World in 3,000 Hours of Egocentric Video"
  type: dataset
  arxiv: "2110.07058"
  year: 2021
  org: Meta AI and university partners
  tags: [egocentric-video, human-data]
  takeaway_en: 3,670 hours of first-person daily-life video; widely used to pretrain visual representations for robots.
  takeaway_zh: 3670 小时第一视角日常生活视频，广泛用于为机器人预训练视觉表征。
- title: "LIBERO: Benchmarking Knowledge Transfer for Lifelong Robot Learning"
  type: benchmark
  arxiv: "2306.03310"
  year: 2023
  org: UT Austin
  code: https://github.com/Lifelong-Robot-Learning/LIBERO
  highlight: true
  tags: [sim, manipulation, lifelong-learning]
  takeaway_en: 130 language-conditioned tasks in four suites; now the most common simulation benchmark for VLA papers.
  takeaway_zh: 四个套件共 130 个语言条件任务，现已成为 VLA 论文最常用的仿真基准。
- title: "CALVIN: A Benchmark for Language-Conditioned Policy Learning for Long-Horizon Robot Manipulation Tasks"
  type: benchmark
  arxiv: "2112.03227"
  year: 2021
  org: University of Freiburg
  code: https://github.com/mees/calvin
  tags: [sim, manipulation, long-horizon]
  takeaway_en: Chains of five language instructions in a row test long-horizon, language-conditioned control.
  takeaway_zh: 连续执行五条语言指令，测试长时程、语言条件下的控制能力。
- title: "RLBench: The Robot Learning Benchmark & Learning Environment"
  type: benchmark
  arxiv: "1909.12271"
  year: 2019
  org: Imperial College London
  code: https://github.com/stepjam/RLBench
  tags: [sim, manipulation]
  takeaway_en: 100 hand-designed manipulation tasks with demos; a staple for 3D policy methods like PerAct.
  takeaway_zh: 100 个手工设计的操作任务并附演示，是 PerAct 等 3D 策略方法的常用基准。
- title: "Meta-World: A Benchmark and Evaluation for Multi-Task and Meta Reinforcement Learning"
  type: benchmark
  arxiv: "1910.10897"
  year: 2019
  org: Stanford, UC Berkeley
  code: https://github.com/Farama-Foundation/Metaworld
  tags: [sim, manipulation, rl, multi-task]
  takeaway_en: 50 Sawyer manipulation tasks for multi-task and meta-RL evaluation.
  takeaway_zh: 50 个 Sawyer 操作任务，用于多任务与元强化学习评测。
- title: "Evaluating Real-World Robot Manipulation Policies in Simulation"
  type: benchmark
  arxiv: "2405.05941"
  year: 2024
  org: UC San Diego, Stanford, UC Berkeley, Google DeepMind
  code: https://github.com/simpler-env/SimplerEnv
  topics: [vla]
  tags: [sim, real-to-sim, evaluation]
  takeaway_en: SimplerEnv — real-to-sim environments whose scores correlate with real-robot results for RT-1/Octo-style policies.
  takeaway_zh: SimplerEnv：真实到仿真的评测环境，其得分与 RT-1/Octo 类策略的真机表现相关。
- title: "Habitat: A Platform for Embodied AI Research"
  type: paper
  arxiv: "1904.01201"
  year: 2019
  org: Meta AI
  code: https://github.com/facebookresearch/habitat-sim
  topics: [sim, navigation]
  tags: [sim, navigation, photorealistic]
  takeaway_en: A very fast photorealistic 3D simulator and task suite that standardized embodied navigation research.
  takeaway_zh: 极速的逼真 3D 仿真器与任务集，统一了具身导航研究的标准。
- title: "LeRobot"
  type: code
  year: 2024
  org: Hugging Face
  code: https://github.com/huggingface/lerobot
  highlight: true
  topics: [hardware, manipulation]
  tags: [library, open-source, low-cost, datasets]
  takeaway_en: PyTorch library with datasets, pretrained policies (ACT, Diffusion, SmolVLA) and drivers for low-cost arms.
  takeaway_zh: PyTorch 机器人学习库，提供数据集、预训练策略（ACT、Diffusion、SmolVLA）与低成本机械臂驱动。
- title: "Embodied Skill Bench: Benchmarking How Well Agents with Embodied Skills Perform on Physical Tasks"
  type: benchmark
  arxiv: "2610.16238"
  year: 2026
  code: https://github.com/HanZhi306/EmbodiedSkill-Bench
  topics: [vla, navigation]
  added: 2026-10-19
  tags: [llm-agents, skills, closed-loop]
  takeaway_en: Packages VLA policies, perception models and know-how as 250 reusable "embodied skills" and measures how much they help LLM agents on physical tasks.
  takeaway_zh: 将 VLA 策略、感知模型与经验知识封装成 250 个可复用的“具身技能”，评测它们对大模型智能体完成物理任务的帮助。
- title: "RoboMIND: Benchmark on Multi-embodiment Intelligence Normative Data for Robot Manipulation"
  type: dataset
  arxiv: "2412.13877"
  year: 2024
  org: Beijing Humanoid Robot Innovation Center, PKU
  project: https://x-humanoid-robomind.github.io/
  tags: [real, multi-embodiment, humanoid, teleoperation]
  takeaway_en: Large real-robot teleoperation dataset across several embodiments (single-arm, dual-arm, humanoid) collected under one standardized protocol, and it keeps failed demos with annotated causes.
  takeaway_zh: 在统一规范下采集的大规模真机遥操作数据集，覆盖单臂、双臂与人形等多种本体，并保留了标注失败原因的失败演示。
- title: "RoboCasa-Shift: Stage-Aware Robustness Evaluation of Vision-Language-Action Policies in Long-Horizon Household Manipulation"
  type: benchmark
  arxiv: "2610.27861"
  year: 2026
  code: https://github.com/HaochengWang23/RoboCasa-Shift
  added: 2026-10-21
  topics: [vla, sim]
  tags: [benchmark, robustness, long-horizon, household, sim]
  takeaway_en: "VLA robustness benchmark on RoboCasa365: paired clean/perturbed rollouts differing in one shift, plus stage-level diagnostics of where long-horizon failures start; evaluated on GR00T N1.5."
  takeaway_zh: 基于 RoboCasa365 的 VLA 鲁棒性诊断基准：成对比较只差一个分布偏移因素的干净/扰动执行，并定位长时序任务中失败从哪个阶段开始，而不只看总成功率；在 GR00T N1.5 上评测。
- title: "Habitat-Matterport 3D Dataset (HM3D): 1000 Large-scale 3D Environments for Embodied AI"
  type: dataset
  arxiv: "2109.08238"
  year: 2021
  org: Meta AI, Matterport
  url: https://aihabitat.org/datasets/hm3d/
  code: https://github.com/facebookresearch/habitat-matterport3d-dataset
  venue: NeurIPS 2021
  topics: [navigation, sim]
  tags: [3d-scans, indoor, habitat]
  takeaway_en: 1,000 3D scans of real indoor spaces for Habitat; the main scene set behind ObjectNav and many embodied navigation benchmarks.
  takeaway_zh: 1000 个真实室内空间的 3D 扫描，供 Habitat 使用；ObjectNav 等众多具身导航基准的主要场景集。
- title: "RoboNet: Large-Scale Multi-Robot Learning"
  type: dataset
  arxiv: "1910.11215"
  year: 2019
  venue: CoRL 2019
  org: UC Berkeley, Stanford, UPenn
  code: https://github.com/SudeepDasari/RoboNet
  topics: [learning]
  tags: [dataset, real, arm, multi-embodiment, video-prediction]
  takeaway_en: An early shared dataset of robot interaction videos from seven robot platforms, used to pretrain visual dynamics models that transfer to new robots - a forerunner of Open X-Embodiment.
  takeaway_zh: 早期的共享机器人交互视频数据集，涵盖七种机器人平台，用于预训练可迁移到新机器人的视觉动力学模型，是 Open X-Embodiment 的先驱。
- title: "Ego-Exo4D: Understanding Skilled Human Activity from First- and Third-Person Perspectives"
  type: dataset
  arxiv: "2311.18259"
  year: 2023
  venue: CVPR 2024
  org: Meta AI and university partners
  tags: [dataset, egocentric, human-video, multimodal]
  takeaway_en: Time-synced first-person and third-person video of people performing skilled activities (cooking, sports, repair...), with rich annotations; a large source for learning manipulation skills from humans.
  takeaway_zh: 人们进行技能活动（烹饪、运动、维修等）时同步采集的第一人称与第三人称视频，附丰富标注，是从人类视频学习操作技能的重要数据来源。
- title: "Objaverse: A Universe of Annotated 3D Objects"
  type: dataset
  arxiv: "2212.08051"
  year: 2022
  venue: CVPR 2023
  org: Allen Institute for AI
  url: https://huggingface.co/datasets/allenai/objaverse
  topics: [sim]
  tags: [dataset, 3d-assets, objects]
  takeaway_en: 800K+ annotated 3D object models; widely used to populate simulators with diverse objects for grasping, rearrangement and procedural scene generation (Objaverse-XL extends it to 10M+).
  takeaway_zh: 80 万+ 带标注的 3D 物体模型，常用于为仿真器填充多样物体，用于抓取、重排和程序化场景生成（Objaverse-XL 扩展到 1000 万+）。
- title: "ScanNet: Richly-annotated 3D Reconstructions of Indoor Scenes"
  type: dataset
  arxiv: "1702.04405"
  year: 2017
  venue: CVPR 2017
  org: Stanford, Princeton, TUM
  code: https://github.com/ScanNet/ScanNet
  topics: [perception]
  tags: [dataset, rgbd, 3d-reconstruction, semantic-segmentation, indoor]
  takeaway_en: RGB-D scans of 1,500+ indoor scenes with 3D reconstructions, camera poses and semantic labels; the standard benchmark for 3D scene understanding that embodied perception builds on.
  takeaway_zh: 1500+ 个室内场景的 RGB-D 扫描，含三维重建、相机位姿与语义标注；具身感知所依赖的三维场景理解标准基准。
- title: "HumanoidBench: Simulated Humanoid Benchmark for Whole-Body Locomotion and Manipulation"
  type: benchmark
  arxiv: "2403.10506"
  year: 2024
  org: UC Berkeley · Yonsei University
  venue: RSS 2024
  code: https://github.com/carlosferrazza/humanoid-bench
  project: https://humanoid-bench.github.io
  topics: [locomotion, sim]
  tags: [sim, humanoid, whole-body, rl-benchmark, mujoco]
  takeaway_en: 27 simulated tasks (12 locomotion, 15 whole-body manipulation) on a Unitree H1 with two dexterous hands; reports that DreamerV3, TD-MPC2, SAC and PPO fail most of them, especially long-horizon whole-body ones.
  takeaway_zh: 27 个仿真任务（12 个运动、15 个全身操作），机器人为带两只灵巧手的 Unitree H1；报告 DreamerV3、TD-MPC2、SAC、PPO 在大多数任务上未达标，长时程全身协调任务尤甚。
- title: "THE COLOSSEUM: A Benchmark for Evaluating Generalization for Robotic Manipulation"
  type: benchmark
  arxiv: "2402.08191"
  year: 2024
  org: UW · AI2 · USC · NVIDIA · UCSP
  venue: RSS 2024
  code: https://github.com/robot-colosseum/robot-colosseum
  project: https://robot-colosseum.github.io
  topics: [manipulation]
  tags: [sim, generalization, perturbations, rlbench]
  takeaway_en: 20 RLBench tasks × 14 perturbation factors (color, texture, lighting, distractors, camera pose, friction, mass…); reports 30–50% success drops for leading policies, 75%+ when perturbations combine.
  takeaway_zh: 20 个 RLBench 任务 × 14 种扰动因素（颜色、纹理、光照、干扰物、相机位姿、摩擦、质量……）；报告主流策略成功率下降 30–50%，多种扰动叠加时下降 75% 以上。
- title: "DexYCB: A Benchmark for Capturing Hand Grasping of Objects"
  type: dataset
  arxiv: "2104.04631"
  year: 2021
  org: NVIDIA · University of Washington
  venue: CVPR 2021
  code: https://github.com/NVlabs/dex-ycb-toolkit
  topics: [manipulation, perception]
  tags: [real, human-hands, grasping, hand-pose, 6d-pose, handover]
  takeaway_en: ~582K RGB-D frames (1,000 sequences, 10 people, 20 YCB objects, 8 cameras) of human grasps with hand and object pose labels; benchmarks detection, 6D object pose, 3D hand pose and human-to-robot handover.
  takeaway_zh: 约 58.2 万帧 RGB-D（1000 段序列、10 人、20 个 YCB 物体、8 台相机）的人手抓取数据，带手部与物体位姿标注；评测检测、物体 6D 位姿、三维手部姿态及人到机器人的物体交接。
- title: "Benchmarking in Manipulation Research: The YCB Object and Model Set and Benchmarking Protocols"
  type: dataset
  arxiv: "1502.03143"
  year: 2015
  org: Yale · CMU · UC Berkeley
  topics: [manipulation]
  tags: [objects, 3d-models, benchmark-protocols, grasping]
  takeaway_en: The YCB object set — 73 everyday objects with scans, textured meshes and simulation models, plus benchmarking protocols; widely used in grasping and pose-estimation work.
  takeaway_zh: YCB 物体集：73 个日常物体，附扫描数据、带纹理网格与仿真模型，以及基准测试规程；被抓取与位姿估计研究广泛使用。
- title: "Rescaling Egocentric Vision"
  type: dataset
  arxiv: "2006.13256"
  year: 2020
  org: University of Bristol · University of Catania · University of Toronto
  venue: IJCV 2022
  code: https://github.com/epic-kitchens/epic-kitchens-100-annotations
  topics: [perception]
  tags: [egocentric-video, human-data, kitchens, action-recognition]
  takeaway_en: EPIC-KITCHENS-100 — 100 hours (20M frames, ~90K action segments) of unscripted first-person kitchen video from 45 environments, with dense action labels and challenges such as action anticipation.
  takeaway_zh: EPIC-KITCHENS-100：来自 45 个厨房环境、100 小时（2000 万帧、约 9 万个动作片段）的非脚本第一视角视频，动作标注密集，并设有动作预测等挑战任务。
- title: "HOI4D: A 4D Egocentric Dataset for Category-Level Human-Object Interaction"
  type: dataset
  arxiv: "2203.01577"
  year: 2022
  org: Tsinghua University · Shanghai Qi Zhi Institute
  venue: CVPR 2022
  code: https://github.com/leolyliu/HOI4D-Instructions
  topics: [manipulation, perception]
  tags: [egocentric-video, human-data, rgbd, articulated-objects, 4d]
  takeaway_en: 2.4M egocentric RGB-D frames (4,000+ sequences, 800 object instances in 16 categories, 610 rooms) of people handling rigid and articulated objects, with segmentation, hand and object pose labels.
  takeaway_zh: 240 万帧第一视角 RGB-D（4000 多段序列、16 类 800 个物体实例、610 个房间），记录人操作刚体与铰接物体，带分割、手部与物体位姿标注。
- title: "OakInk: A Large-scale Knowledge Repository for Understanding Hand-Object Interaction"
  type: dataset
  arxiv: "2203.15709"
  year: 2022
  org: Shanghai Jiao Tong University
  venue: CVPR 2022
  code: https://github.com/oakink/OakInk
  topics: [manipulation]
  tags: [human-hands, grasping, affordance, mano]
  takeaway_en: Affordance labels for ~1,800 household objects plus 50K intent-oriented hand-object interactions recorded on 100 of them; a common source for dexterous grasp synthesis. Follow-up OakInk2 covers bimanual tasks.
  takeaway_zh: 为约 1800 个日常物体标注可供性，并在其中 100 个物体上记录 5 万次带意图的手-物交互；常用于灵巧抓取生成。后续 OakInk2 扩展到双手任务。
- title: "ARCTIC: A Dataset for Dexterous Bimanual Hand-Object Manipulation"
  type: dataset
  arxiv: "2204.13662"
  year: 2022
  org: ETH Zürich · MPI for Intelligent Systems
  venue: CVPR 2023
  code: https://github.com/zc-alexfan/arctic
  topics: [manipulation, perception]
  tags: [human-hands, bimanual, articulated-objects, mocap, mano]
  takeaway_en: 2.1M video frames of two hands manipulating articulated objects (scissors, laptops…) with accurate 3D hand and object meshes from motion capture; a reference for bimanual hand-object reconstruction.
  takeaway_zh: 210 万帧双手操作铰接物体（剪刀、笔记本电脑等）的视频，借助动作捕捉提供精确的手与物体三维网格；双手-物体重建的常用基准。
- title: "VLABench: A Large-Scale Benchmark for Language-Conditioned Robotics Manipulation with Long-Horizon Reasoning Tasks"
  type: benchmark
  arxiv: "2412.18194"
  year: 2024
  org: Fudan University
  code: https://github.com/OpenMOSS/VLABench
  project: https://vlabench.github.io/
  topics: [vla, manipulation]
  tags: [sim, language, long-horizon, reasoning, vla-eval]
  takeaway_en: 100 task categories over 2,000+ objects that need common sense, world knowledge and multi-step reasoning, not just instruction following; evaluates VLAs, embodied agents and VLMs in one suite.
  takeaway_zh: 100 类任务、2000 多个物体，任务需要常识、世界知识与多步推理，而不只是照指令执行；在同一套件中评测 VLA、具身智能体与 VLM。
- title: "RoboVerse: Towards a Unified Platform, Dataset and Benchmark for Scalable and Generalizable Robot Learning"
  type: benchmark
  arxiv: "2504.18904"
  year: 2025
  org: UC Berkeley · PKU · BIGAI · Stanford · CMU and others
  venue: RSS 2025
  code: https://github.com/RoboVerseOrg/RoboVerse
  project: https://roboverseorg.github.io/
  topics: [sim]
  tags: [sim, multi-simulator, synthetic-data, imitation-learning, rl]
  takeaway_en: MetaSim puts many simulators (Isaac Sim/Gym, MuJoCo, Genesis, SAPIEN…) behind one interface; adds a large synthetic dataset migrated from public benchmarks and unified IL/RL benchmarks.
  takeaway_zh: MetaSim 用统一接口封装多种仿真器（Isaac Sim/Gym、MuJoCo、Genesis、SAPIEN、PyBullet 等）；提供由公开基准迁移而来的大规模合成数据集，以及按泛化层级划分的统一模仿学习/强化学习基准。
- title: "EgoExplorer: A Vision-Motion-Touch Observatory for Human Loco-Manipulation In Situ"
  type: dataset
  arxiv: "2610.18872"
  year: 2026
  org: InternRobotics
  code: https://github.com/InternRobotics/EgoExplorer
  project: https://internrobotics.github.io/egoexplorer.github.io/
  added: 2026-10-24
  topics: [locomotion, tactile, manipulation]
  tags: [real, human-data, egocentric, wearable, whole-body, tactile, humanoid]
  takeaway_en: 100 h of wearable-captured human loco-manipulation (mostly professional work) aligning egocentric video, whole-body and finger motion, touch and step-level text; reports 71.9% lower body error than baselines.
  takeaway_zh: 用可穿戴设备采集的 100 小时人类移动操作数据，侧重职业场景，对齐第一视角视频、全身与手指动作、触觉和步骤级文字描述；其补全全身动作的方法报告身体关键点误差比最强基线低 71.9%。
- title: "HandsOn: A Large-Scale Simulation Benchmark for Generalizable Dexterous Manipulation"
  type: benchmark
  arxiv: "2610.26765"
  year: 2026
  org: Tsinghua University, BUPT, NatureWill, Peking University
  code: https://github.com/TsinghuaC3I/HandsOn
  added: 2026-10-24
  topics: [manipulation, sim]
  tags: [sim, dexterous, cross-embodiment, benchmark, human-demos]
  takeaway_en: "Isaac Sim benchmark with 5 arms, 6 dexterous hands, ~200 assets and 18k human demos over 66 tasks; reports the best trained policy (a WAM) at only 29.1% on Core-50, near 0% on precision-fit and deformable tasks."
  takeaway_zh: 基于 Isaac Sim 的灵巧操作基准：5 种机械臂、6 种灵巧手、约 200 个资产、1.8 万条人类演示、66 个任务；报告最好的训练策略（一种世界动作模型）在 Core-50 上仅 29.1%，精密装配和柔性物体任务接近 0%。
- title: "RoboValue: A Fine-Grained Sim-and-Real Benchmark for Unified Evaluation of Robotic Value Models"
  type: benchmark
  arxiv: "2610.26663"
  year: 2026
  code: https://github.com/RoboValue-Benchmark/RoboValue
  project: https://robovalue-benchmark.github.io/
  added: 2026-10-24
  topics: [learning, manipulation]
  tags: [sim, real, benchmark, value-model, evaluation]
  takeaway_en: Tests robot value (progress) models on 15 sim and 20 real tasks across task state, progress, failure/recovery and consistency; reports that good forward-progress scores hide weak history and recovery reasoning.
  takeaway_zh: 在 15 个仿真和 20 个真实任务上评测机器人价值（进度）模型，覆盖任务状态、进度监测、失败与恢复、一致性四个维度；报告称前向进度得分高的模型在依赖历史和恢复判断上仍然薄弱。
- title: "LIBERO-Industry: Benchmarking Robotic Manipulation under Industrial Process Constraints"
  type: benchmark
  arxiv: "2610.16782"
  year: 2026
