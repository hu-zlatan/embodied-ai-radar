  project: https://aha-vlm.github.io/
  tags: [vlm, failure-detection]
  takeaway_en: "AHA is a vision-language model for detecting and reasoning about manipulation failures, a gap in earlier VLM work."
  takeaway_zh: "AHA 是用于检测和推理操作失败的视觉-语言模型，填补此前 VLM 研究的空白。"
- title: "Look Before You Leap: Unveiling the Power of GPT-4V in Robotic Vision-Language Planning"
  type: paper
  arxiv: "2311.17842"
  year: 2023
  tags: [vlm, planning, gpt-4v]
  takeaway_en: "Early study of GPT-4V for physically grounded vision-language task planning on robots."
  takeaway_zh: "较早研究 GPT-4V 用于机器人基于物理场景的视觉-语言任务规划。"
- title: "Physically Grounded Vision-Language Models for Robotic Manipulation"
  type: paper
  arxiv: "2309.02561"
  year: 2023
  venue: ICRA 2024
  tags: [vlm, physical-properties]
  takeaway_en: "Teaches vision-language models about physical object properties so they can reason better for manipulation."
  takeaway_zh: "让视觉-语言模型理解物体的物理属性，从而更好地为操作任务推理。"
- title: "A Survey of Embodied Learning for Object-Centric Robotic Manipulation"
  type: paper
  arxiv: "2408.11537"
  year: 2024
  code: https://github.com/RayYoh/OCRM_survey
  tags: [survey, object-centric]
  takeaway_en: "Survey of embodied learning for object-centric robotic manipulation."
  takeaway_zh: "综述面向物体的机器人操作中的具身学习方法。"
- title: "Correct Robots Before They Make Mistakes: Proactive Human-in-the-Loop Intervention via Preference Learning"
  type: paper
  arxiv: "2611.05667"
  year: 2026
  org: KIT
  project: https://intuitive-robots.github.io/PHIL-page/
  added: 2026-11-05
  tags: [real, human-in-the-loop, xr, diffusion-policy]
  takeaway_en: "PHIL shows an operator the policy's predicted motion in XR so they can step in before an error, then trains on rejected vs corrected chunks; reports 70.3% vs 44.0% for HG-DAgger with a diffusion policy."
  takeaway_zh: "PHIL 在 XR 中预览策略预测的动作，让操作者在出错前介入，再用被否决与修正后的动作片段做偏好训练；报告相比 HG-DAgger，扩散策略成功率从 44.0% 升至 70.3%。"
- title: "CSO: Refining Robotic Policies via Skill Distribution Alignment and Skill-Grained Optimization"
  type: paper
  arxiv: "2610.38357"
  year: 2026
  venue: NeurIPS 2026
  added: 2026-11-05
  tags: [real, sim, skills, post-training]
  takeaway_en: "Two-stage post-training for VQ-style skill policies: align the skill prior with successful online rollouts, then optimise per skill with the encoder frozen; reports LIBERO success rising from 80.1% to 97.5%."
  takeaway_zh: "面向 VQ 类技能策略的两阶段后训练：先让技能先验对齐线上成功轨迹，再冻结编码器按技能优化；报告 LIBERO 成功率从 80.1% 升至 97.5%。"
- title: "Learning Object-Centric Motion Priors from Human for Robotic Dexterous Manipulation"
  type: paper
  arxiv: "2611.05979"
  year: 2026
  venue: AAAI 2026
  added: 2026-11-05
  rating: 1
  tags: [real, sim, dexterous, human-data, rl]
  takeaway_en: "Learns to predict future hand-object states from human interaction datasets and uses the predicted object states as a general RL reward, reducing reward engineering; deployed on different hands (AAAI oral)."
  takeaway_zh: "从人手交互数据学习预测未来手物状态，并把预测的物体状态作为通用强化学习奖励，减少逐任务奖励设计；已部署到不同灵巧手（AAAI 口头报告）。"
- title: "Online Adaptation to Latent Physical Properties for Learning from Demonstration"
  type: paper
  arxiv: "2611.06118"
  year: 2026
  project: https://isri-aist.github.io/latent-dynamics-project-page/
  topics: [manipulation, learning]
  tags: [imitation-learning, online-adaptation, real, center-of-mass]
  added: 2026-11-05
  takeaway_en: "Updates a latent estimate of hidden object properties during execution to condition an imitation policy; helps with center-of-mass changes, though it reports only about 30% success on unseen locations in sim."
  takeaway_zh: "执行中在线更新物体隐藏物性的潜变量，并以此调节模仿策略；对质心变化有帮助，但报告仿真中未见过的质心位置成功率仅约 30%。"
- title: "VLS: Steering Pretrained Robot Policies via Vision-Language Models"
  type: paper
  arxiv: "2602.03973"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/Vision-Language-Steering/code
  project: https://vision-language-steering.github.io/webpage/
  added: 2026-11-06
  topics: [vla]
  tags: [steering, inference-time, diffusion-policy, vlm, reward, real]
  takeaway_en: "Adapts a frozen diffusion or flow policy at test time: a VLM writes differentiable rewards that steer denoising when obstacles or clutter shift the scene. Reports +31% on CALVIN and +13% on LIBERO-PRO; no retraining."
  takeaway_zh: "在测试时适配冻结的扩散或流匹配策略：当障碍或杂物改变场景时，由 VLM 生成可微奖励来引导去噪。报告 CALVIN 提升 31%、LIBERO-PRO 提升 13%，无需重新训练。"
- title: "DeCAL: Towards Physically-Grounded Dexterous Vision-Language-Action Models via Contact-Aware Latent Co-Imagination"
  type: paper
  arxiv: "2609.09119"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/AureleoPKU/DeCAL
  project: https://aureleopku.github.io/DeCAL
  added: 2026-11-06
  topics: [vla, tactile]
  tags: [dexterous, visuotactile, mixture-of-transformers, latent-imagination, real]
  takeaway_en: "Dexterous visuotactile VLA on a mixture-of-transformers: contact-aware gating decides when touch matters; the model jointly imagines future visual and tactile latents. Reports 71% average success on contact-rich tasks."
  takeaway_zh: "基于混合 Transformer 的灵巧视触觉 VLA：接触感知门控决定何时引入触觉，并联合想象未来的视觉与触觉潜变量。报告在富接触任务上平均成功率 71%。"
- title: "MobiAgent: Dual-Loop Recursive Policy Self-Improvement for Long-Horizon Mobile Manipulation"
  type: paper
  arxiv: "2610.03476"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/kaiknower/MobiAgent
  project: https://kaiknower.github.io/mobiagent
  added: 2026-11-06
  topics: [vla]
  tags: [mobile-manipulation, long-horizon, agent, skill-library, self-improvement, real]
  takeaway_en: "Mobile-manipulation agent with two loops: a VLM plans and composes flow-matching skills at run time, and an outer loop mines rollouts to find and fine-tune skills. Reports +22.5 pts over π0.5 on BEHAVIOR-1K."
  takeaway_zh: "双循环移动操作智能体：内循环由 VLM 规划并组合流匹配技能，外循环从部署数据中自动发现并微调技能。报告在 BEHAVIOR-1K 上比 π0.5 高 22.5 个百分点。"
- title: "Attention from Action, for Action: Emergent Visual Bottlenecks for Policy Learning"
  type: paper
  arxiv: "2608.13422"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/zheyu-zhuang/seeker
  added: 2026-11-06
  tags: [attention, region-of-interest, dinov3, data-efficiency, real]
  takeaway_en: "Seeker learns where to look from action supervision alone, giving progress-aware crops on frozen DINOv3 features. Reports real-robot success 48.3% to 76.7%, and 20% to 60% under lighting and background shifts."
  takeaway_zh: "Seeker 仅凭动作监督学习“看哪里”，在冻结的 DINOv3 特征上给出随任务进展变化的裁剪区域。报告真机成功率从 48.3% 升到 76.7%，光照与背景变化下从 20% 升到 60%。"
- title: "Spatial-UMI-Dream: Scaling World Action Models with Metric Geometry for UMI Manipulation"
  type: paper
  arxiv: "2611.07229"
  year: 2026
  project: https://weiduoyuan.com/spatial-umi-dream/
  added: 2026-11-06
  topics: [world-models, datasets]
  tags: [umi, wam, rgb-d, metric-depth, benchmark, real, sim]
  takeaway_en: "5B world action model pretrained on 605 h of RGB-D UMI data that predicts RGB, metric depth and actions. Adds RoboTwin-UMI; reports 85% average real success, +24.2 points over the best baseline."
  takeaway_zh: "在 605 小时 RGB-D UMI 数据上预训练的 5B 世界动作模型，同时预测 RGB、度量深度和动作。并提出 RoboTwin-UMI 基准；报告真机平均成功率 85%，比最强基线高 24.2 个百分点。"
- title: "MOMASPLAT: Dynamic Novel-View Demonstration Augmentation for Mobile Manipulation"
  type: paper
  arxiv: "2611.08372"
  year: 2026
  org: UT Austin
  project: https://robin-lab.cs.utexas.edu/momasplat
  added: 2026-11-06
  tags: [mobile-manipulation, data-augmentation, gaussian-splatting, novel-view, real]
  takeaway_en: "Augments mobile-manipulation demos with new base poses, re-rendering the moving object too, via Gaussian splatting and action retargeting. Reports more than doubling the best baseline's success on unseen base poses."
  takeaway_zh: "用高斯泼溅与动作重定向为移动操作示教合成新的底盘位姿视角，连被操作的运动物体也一起重渲染。报告在未见底盘位姿下成功率是最强基线的两倍以上。"
- title: "Latent RL Priors for Data-Efficient Dexterous Manipulation"
  type: paper
  arxiv: "2611.08458"
  year: 2026
  project: https://yixiaowang7.github.io/latent-rl-prior-page/
  added: 2026-11-06
  topics: [learning]
  tags: [dexterous, rl, sim2real, flow-matching, data-efficiency, bimanual]
  takeaway_en: "Distills sim RL rollouts into a frozen flow-matching action decoder, then learns only a visual interface to its latent from a few demos. Reports beating fine-tuned π0.5 and GR00T N1.7 with 5-10x fewer demos."
  takeaway_zh: "把仿真中强化学习的经验蒸馏进冻结的流匹配动作解码器，之后只需用少量示教学习从图像到其潜变量的视觉接口。报告用少 5–10 倍的示教超过微调后的 π0.5 与 GR00T N1.7。"
- title: "AWLS: Advantage-Weighted Latent Steering for One-Step Generative Robotic Manipulation Policies"
  type: paper
  arxiv: "2610.27736"
  year: 2026
  venue: CoRL 2026
  project: https://awls-corl2026.github.io/
  added: 2026-11-06
  topics: [learning]
  tags: [offline-rl, one-step-policy, noise-steering, mixed-quality-data, real]
  takeaway_en: "Improves a frozen one-step generative policy offline by learning a residual on its input noise, trained with advantage-weighted reconstruction instead of critic gradients, so the base behavior does not drift."
  takeaway_zh: "离线改进冻结的一步生成策略：学习对输入噪声的残差修正，用优势加权的动作重建来训练而不是用评论家梯度，从而避免偏离原有行为。"
- title: "HiFun: a Hierarchical Framework for Efficient Functional Dexterous Manipulation Learning"
  type: paper
  arxiv: "2610.19518"
  year: 2026
  venue: CoRL 2026
  project: https://hly-123.github.io/HiFun/
  added: 2026-11-06
  topics: [learning]
  tags: [dexterous, real-world-rl, hierarchical, human-intervention, real]
  takeaway_en: "Hierarchical real-world RL for functional dexterous tasks: a hand skill handles contact, an arm-hand policy coordinates and triggers it. Reports 98.3% average success on six tasks within one hour of online training."
  takeaway_zh: "面向功能性灵巧操作的分层真机强化学习：手部技能负责精确接触，臂-手协调策略负责手臂运动与技能触发。报告在六个任务上一小时在线训练即达 98.3% 平均成功率。"
- title: "Phase-Conditioned Affordance Fields for SE(3)-Equivariant Visuomotor Policies"
  type: paper
  arxiv: "2610.17281"
  year: 2026
  venue: CoRL 2026
  project: https://paf-policy.github.io/
  added: 2026-11-06
  tags: [equivariance, se3, affordance, point-cloud, real]
  takeaway_en: "Adds a learned, phase-conditioned affordance field to SE(3)-equivariant policies, anchoring observations and actions on the active region instead of the gripper frame. Improves MimicGen and multi-object real tasks."
  takeaway_zh: "为 SE(3) 等变策略加入随阶段变化的可学习可供性场，以当前作用区域而非夹爪坐标系作为观测与动作的锚点。在 MimicGen 与多物体真机任务上都有提升。"
- title: "Scouting the Dynamics Gap: Test-Time Policy Adaptation via Action-Outcome Feedback"
  type: paper
  arxiv: "2609.36107"
  year: 2026
  venue: CoRL 2026
  project: https://liy1shu.github.io/SCOUT/
  added: 2026-11-06
  topics: [learning]
  tags: [test-time-adaptation, meta-learning, dynamics, sim2real]
  takeaway_en: "Meta-learned policy and forward model share a belief latent; at deployment the latent is updated from action-outcome mismatches, so the policy adapts to unknown dynamics on the fly."
  takeaway_zh: "元学习的策略与前向动力学模型共享信念潜变量；部署时根据动作结果的偏差更新该潜变量，使策略能即时适应未知动力学。"
- title: "LiMA: Bridging Long-term Imagination to Real-time Dexterous Manipulation via Asynchronous Diffusion"
  type: paper
  arxiv: "2609.28431"
  year: 2026
  venue: CoRL 2026
  project: https://ccdcs.github.io/LiMA_repo/
  added: 2026-11-06
  topics: [world-models]
  tags: [dexterous, bimanual, dual-system, asynchronous, schrodinger-bridge]
  takeaway_en: "Slow system plans sparse long-horizon intent, fast system refines dense motion, linked by a latent Schrödinger bridge. Reports 45.8% lower latency than Cosmos-Policy and 70.8% success on six bimanual tasks."
  takeaway_zh: "慢系统生成稀疏的长时程意图，快系统细化高频动作，二者以潜空间薛定谔桥耦合。报告延迟比 Cosmos-Policy 低 45.8%，六个双臂灵巧任务成功率 70.8%。"
- title: "Learning Beyond What Humans Can Demonstrate"
  type: paper
  arxiv: "2609.24996"
  year: 2026
  venue: CoRL 2026
  project: https://guardrail-policy.github.io/
  added: 2026-11-06
  tags: [teleoperation, guardrails, llm-code, data-collection, real]
  takeaway_en: "For tasks people cannot teleoperate well, an LLM writes state-based guardrails that filter teleop and policy commands. Reports data-collection success rising from 0-10% to 70-90%."
  takeaway_zh: "针对人难以遥操作完成的任务，由 LLM 编写基于状态的护栏来过滤遥操作与策略指令。报告数据采集成功率从 0–10% 提升到 70–90%。"
- title: "ProxiDex: Learning Dynamics-Guided Proximity Policy for Dexterous Manipulation"
  type: paper
  arxiv: "2609.16586"
  year: 2026
  venue: CoRL 2026
  project: https://proxidex.github.io/
  added: 2026-11-06
  tags: [dexterous, proximity, point-cloud, teleoperation, dynamics]
  takeaway_en: "Uses hand-object proximity from reconstructed point clouds as a hardware-agnostic contact signal, for VR teleop feedback and a policy with learned proximity dynamics. More robust under occlusion."
  takeaway_zh: "以重建点云得到的手-物距离作为与硬件无关的接触信号，用于 VR 遥操作反馈，并训练带接近度动力学的策略；在遮挡下更稳健。"
- title: "Assembling Two Parts in One Hand"
  type: paper
  arxiv: "2609.10137"
  year: 2026
  venue: CoRL 2026
  project: https://ltbgbird.github.io/in-hand-assembly-page/
  added: 2026-11-06
  tags: [dexterous, in-hand, assembly, rl, sim2real]
  takeaway_en: "RL for mating two parts within one dexterous hand (capping a marker, a syringe, a bottle) with no second arm. Trained in sim, transfers zero-shot with a single camera."
  takeaway_zh: "用强化学习在单只灵巧手中完成两个零件的装配（如给马克笔盖帽、注射器、瓶子），不用第二只手臂；仿真训练，单相机零样本迁移到真机。"
- title: "FOCI Policy: Focus on Object-Centric Interactions for Relational Manipulation Policies"
  type: paper
  arxiv: "2609.08743"
  year: 2026
  venue: CoRL 2026
  project: https://fitz0401.github.io/foci-page/
  added: 2026-11-06
  tags: [object-centric, relational, se3, data-efficiency, rlbench]
  takeaway_en: "Represents skills as short interaction segments of relative SE(3) motion between task objects, independent of scene layout and robot. Needs much less data than prior policies on RLBench and COLOSSEUM."
  takeaway_zh: "把技能表示为任务物体之间相对 SE(3) 运动的短交互片段，与场景布局和机器人无关。在 RLBench 与 COLOSSEUM 上所需数据明显少于以往方法。"
- title: "GeoProp: Grounding Robot State in Vision for Generalist Manipulation"
  type: paper
  arxiv: "2607.07101"
  year: 2026
  venue: CoRL 2026
  project: https://alibaba-damo-academy.github.io/GeoProp/
  added: 2026-11-06
  tags: [proprioception, adapter, diffusion-policy, robotwin, real]
  takeaway_en: "Plug-in adapter that projects the robot state onto the image to build a grounded state token and FiLM-modulate nearby features. Reports +8.7% for Diffusion Policy in sim and 10.6% average real-world gain."
  takeaway_zh: "即插即用适配器：把机器人状态投影到图像平面，采样局部视觉特征构成“落地”的状态 token，并用 FiLM 调制对应特征。报告仿真中 Diffusion Policy 提升 8.7%，真机平均提升 10.6%。"
- title: "How to Peel with a Knife: Aligning Fine-Grained Manipulation with Human Preference"
  type: paper
  arxiv: "2603.03280"
  year: 2026
  venue: CoRL 2026
  project: https://toruowo.github.io/peel
  added: 2026-11-06
  tags: [tool-use, force, preference-learning, food, real]
  takeaway_en: "Knife peeling as a test case for tasks with subjective quality: force-aware imitation first, then preference-based fine-tuning with a learned reward. Reports 100% success on cucumbers, apples and potatoes."
  takeaway_zh: "以用刀削皮为例研究“质量难以量化”的精细操作：先做力感知模仿学习，再用学习到的奖励模型按人类偏好微调。报告在黄瓜、苹果、土豆上成功率 100%。"
- title: "Bimanual Robot Manipulation via Multi-Agent In-Context Learning"
  type: paper
  arxiv: "2604.20348"
  year: 2026
  venue: CoRL 2026
  project: https://alesspalma.github.io/bicicle
  added: 2026-11-06
  tags: [bimanual, in-context-learning, llm, training-free, real]
  takeaway_en: "Lets text-only LLMs do few-shot bimanual manipulation without fine-tuning by treating the arms as leader and follower agents. Reports 70.5% average success on 13 TWIN tasks."
  takeaway_zh: "把双臂视为“主-从”两个智能体，让纯文本 LLM 无需微调即可通过上下文学习完成少样本双臂操作。报告在 TWIN 的 13 个任务上平均成功率 70.5%。"
- title: "Sim-and-Human Co-training for Data-Efficient and Scene-Generalizable Bimanual Manipulation"
  type: paper
  arxiv: "2601.19406"
  year: 2026
  venue: CoRL 2026
  project: https://kaipengfang.github.io/sim-and-human/
  added: 2026-11-06
  tags: [co-training, sim-data, human-video, bimanual, real]
  takeaway_en: "Co-trains a bimanual policy on sim data (for robot-valid actions) and human videos (for real visuals), then fine-tunes on 80 real episodes per task. Reports 62.5% on held-out scenes, 53.7 points above real-only."
  takeaway_zh: "用仿真数据（提供机器人可执行动作）和人类视频（提供真实视觉）联合预训练双臂策略，再在每任务 80 条真机数据上微调。报告在未见场景上成功率 62.5%，比纯真机数据高 53.7 个百分点。"
- title: "Static In, Dynamic Out: Counterfactual Action Augmentation for Moving Object Manipulation"
  type: paper
  arxiv: "2607.27890"
  year: 2026
  venue: CoRL 2026
  project: https://sido-staticindynamicout.github.io/
  added: 2026-11-06
  tags: [dynamic-objects, data-augmentation, counterfactual, conveyor, real]
  takeaway_en: "Lets a policy trained only on static objects handle moving ones: demos are augmented by moving the object to a counterfactual future pose and warping the action chunk; a pose predictor supplies the target at test time."
  takeaway_zh: "让只用静止物体演示训练的策略也能抓取运动物体：把物体平移到反事实的未来位姿并相应变形动作块来扩增数据，部署时由位姿预测器给出目标位置。"
- title: "CoStream: Composing Simple Behaviors for Generalizable Complex Manipulation"
  type: paper
  arxiv: "2606.26423"
  year: 2026
  venue: CoRL 2026
  project: https://costream-simple.github.io
  added: 2026-11-06
  tags: [composition, assembly, foundation-models, force, real]
  takeaway_en: "Composes simple behaviours (semantic constraints from foundation models, keypoints from imagined video, tactile/force corrections) into one SE(3) pose command per step. 8 real tasks, incl. seating a GPU."
  takeaway_zh: "把语义约束（基础模型）、想象视频中的关键点预测、触觉/力实时修正等简单行为在 SE(3) 上组合成每一步的位姿指令。8 个真机任务，包括把显卡插入 PCIe 槽。"
- title: "S2A2: Audio-Visual Imitation Learning for Manipulation Tasks Using Acoustic Spatial Information"
  type: paper
  arxiv: "2607.26047"
  year: 2026
  venue: CoRL 2026
  project: https://azuma413.github.io/projects/s2a2
  added: 2026-11-06
  tags: [audio, multimodal, imitation-learning, sound-localization, real]
  takeaway_en: "New manipulation tasks where the target must be found by sound, plus an imitation framework that adds acoustic spatial and spectral features to ACT, Diffusion Policy, VQ-BeT and π0. Sim + real."
  takeaway_zh: "提出需要靠声音确定操作目标的新任务，以及把声源空间信息与频谱特征接入 ACT、Diffusion Policy、VQ-BeT 和 π0 的多模态模仿学习框架。仿真与真机验证。"
- title: "Multi-GraspLLM: A Multimodal LLM for Multi-Hand Semantic Guided Grasp Generation"
  type: paper
  arxiv: "2412.08468"
  year: 2024
  venue: CoRL 2026
  project: https://multi-graspllm.github.io
  added: 2026-11-06
  tags: [grasp-generation, dexterous-hands, llm, dataset, real]
  takeaway_en: "Multi-GraspSet, a large multi-hand grasp dataset with automatic contact annotations, and an LLM that generates language-guided grasps for different robot hands in one model."
  takeaway_zh: "发布带自动接触标注的大规模多手型抓取数据集 Multi-GraspSet，并用一个基于大模型的统一框架，根据语言指令为不同机器人手生成抓取。"
- title: "HUGS: Guiding Unified Dexterous Grasp Synthesis Across Modes and Scales via Learned Human Priors"
  type: paper
  arxiv: "2607.04554"
  year: 2026
  venue: CoRL 2026
  project: https://hugs-dex.github.io/
  added: 2026-11-06
  tags: [dexterous-grasping, human-prior, grasp-synthesis, bimanual, real]
  takeaway_en: "Learns an object-conditioned human grasp prior from 1.8K human grasps to pick contact modes and wrist starts for force-closure optimisation; synthesises 3.2M grasps from pinches to bimanual, 2–30 cm objects."
  takeaway_zh: "从 1800 次人类抓取中学习物体条件的人类先验，用来选择接触模式和手腕初值以指导力封闭优化；合成 320 万个抓取，覆盖两指捏取到双手抓取、2–30 cm 物体。"
- title: "FingerViP: Learning Real-World Dexterous Manipulation with Fingertip Visual Perception"
  type: paper
  arxiv: "2604.21331"
  year: 2026
  venue: CoRL 2026
  project: https://fingervip.github.io/
  added: 2026-11-06
  tags: [dexterous, fingertip-cameras, diffusion-policy, multi-view, real]
  takeaway_en: "Puts miniature cameras in each fingertip of a multi-fingered hand and trains a whole-body diffusion policy on third-view plus fingertip views. Reports 56.6% relative gain over external and wrist cameras."
  takeaway_zh: "在多指手的每个指尖装入微型摄像头，用第三视角加多指尖视角训练全身扩散策略。报告比外部+腕部相机方案平均成功率相对提升 56.6%。"
- title: "From Grasps to Dexterity: Large-Scale Grasp Pretraining for Dexterous Manipulation"
  type: paper
  arxiv: "2606.30749"
  year: 2026
  venue: CoRL 2026
  project: https://yingyuan0414.github.io/grasp2dexterity/
  added: 2026-11-06
  tags: [dexterous, grasp-pretraining, tool-use, hierarchical, real]
  takeaway_en: "Pretrains a low-level dexterous controller on 355K trajectories built from grasp datasets, then fine-tunes for articulated tool use. Introduces the DexCraft benchmark; reports +33.3 points over DP3 on a real robot."
  takeaway_zh: "用抓取数据集构造的 35.5 万条轨迹预训练灵巧手底层控制器，再微调到需要操作工具活动部件的任务；提出 DexCraft 基准。报告真机完整任务成功率比 DP3 高 33.3 个百分点。"
- title: "Instant-Fold: In-Context Imitation Learning for Deformable Object Manipulation"
  type: paper
  arxiv: "2606.04269"
  year: 2026
  venue: CoRL 2026
  project: https://instant-fold.github.io
  added: 2026-11-06
  tags: [deformable, cloth-folding, in-context-learning, sim-to-real, real]
  takeaway_en: "In-context imitation for folding: from a single human demo, a flow-matching transformer infers and executes the shown folding mode without gradient updates. Trained only in sim, transfers zero-shot to real."
  takeaway_zh: "面向折叠的上下文模仿学习：只看一条人类演示，流匹配 Transformer 即可推断并执行其中的折叠方式，无需梯度更新。完全在仿真训练，零样本迁移到真机。"
- title: "Continual Learning for 6-DoF Grasp Synthesis via Experience and Demonstrations"
  type: paper
  arxiv: "2610.01301"
  year: 2026
  venue: CoRL 2026
  project: https://giuschio.github.io/cl_grasping/
  added: 2026-11-06
  tags: [grasping, continual-learning, memory, 6-dof, real]
  takeaway_en: "6-DoF grasping that keeps learning on the job through memory in an embedding space: outcomes rescore future grasps and user demos are recalled in new scenes. Reports over 90% on hard categories after 50 tries."
  takeaway_zh: "通过嵌入空间中的记忆在部署中持续学习的 6-DoF 抓取：抓取结果更新后续评分，用户示范可在新场景中被召回。报告在困难类别上仅 50 次尝试后成功率超过 90%。"
- title: "DiffMorphGrasp: A Diffusion Framework Conditioned on Hand Morphology for Cross-Embodiment Grasp Generation"
  type: paper
  arxiv: "2602.00915"
  year: 2026
  venue: CoRL 2026
  project: https://georgewuzy.github.io/DiffMorphGrasp-website
  added: 2026-11-06
  tags: [dexterous-grasping, cross-embodiment, diffusion, hand-morphology, benchmark]
  takeaway_en: "Diffusion grasp generator conditioned on a graph of the hand's kinematics, so grasps transfer zero-shot to unseen hand designs; comes with a cross-morphology grasp benchmark."
  takeaway_zh: "以手部运动学结构图为条件的扩散抓取生成模型，可零样本迁移到未见过的机器人手型；同时提出跨手型抓取评测基准。"
- title: "Wiggle and Go! System Identification for Zero-Shot Dynamic Rope Manipulation"
  type: paper
  arxiv: "2604.22102"
  year: 2026
  venue: CoRL 2026
  project: https://wiggleandgo.github.io/
  added: 2026-11-06
  tags: [deformable, rope, system-identification, dynamic, real]
  takeaway_en: "A short safe wiggle reveals rope parameters that condition a trajectory optimiser for zero-shot dynamic throws. Reports 3.55 cm average error on real 3D target striking vs 15.29 cm for uninformed baselines."
  takeaway_zh: "先做一次短暂安全的“抖绳”动作来辨识绳子参数，再以此驱动轨迹优化，零样本完成动态甩绳。报告真机 3D 目标击打平均误差 3.55 cm，无辨识基线为 15.29 cm。"
- title: "Current as Touch: Proprioceptive Contact Feedback for Compliant Dexterous Manipulation"
  type: paper
  arxiv: "2607.03529"
  year: 2026
  venue: CoRL 2026
  project: https://cat.chenyangma.com
  added: 2026-11-06
  tags: [dexterous, motor-current, compliance, proprioception, real]
  takeaway_en: "Uses motor current as a touch signal on low-cost dexterous hands: a model predicts a compliant PD target position whose error yields the right grasp force, with no tactile or force sensors."
  takeaway_zh: "把电机电流当作触觉：在低成本灵巧手上预测一个“柔顺参考位置”，让 PD 控制器的位置误差产生合适的抓握力，无需触觉或力传感器。"
- title: "Going with the Flow: Koopman Behavioral Models as Pseudo Planners for Visuo-Motor Dexterity"
  type: paper
  arxiv: "2602.07413"
  year: 2026
  venue: CoRL 2026
  project: https://k-ubm.github.io/
  added: 2026-11-06
  tags: [dexterous, koopman, dynamical-systems, replanning, real]
  takeaway_en: "Models a dexterous skill as a latent linear (Koopman) system in which visual flow and robot motion co-evolve; it replans when observed and predicted flow diverge. Matches strong baselines with much faster inference."
  takeaway_zh: "把灵巧技能建模为潜在线性（Koopman）系统，视觉特征流与机器人动作流共同演化；当观测与预测的视觉流偏离时自动重规划。性能与强基线相当，推理快得多。"
- title: "RoboAug: One Annotation to Hundreds of Scenes via Region-Contrastive Data Augmentation for Robotic Manipulation"
  type: paper
  arxiv: "2602.14032"
  year: 2026
  venue: CoRL 2026
  project: https://x-roboaug.github.io/
  added: 2026-11-06
  tags: [data-augmentation, generative-models, generalization, attention, real]
  takeaway_en: "Generative augmentation from a single box-annotated image, plus a region-contrastive loss that steers attention to task regions. Beats augmentation baselines on UR5e, AgileX and Tian Gong 2.0 under scene shifts."
  takeaway_zh: "只需一张带框标注的图片即可做生成式语义增强，并用区域对比损失把注意力引向任务相关区域。在 UR5e、AgileX 与天工 2.0 上，面对背景、干扰物和光照变化时优于其他增强方法。"
- title: "A Minimalist Retargeting-Guided Reinforcement Learning Recipe for Dexterous Manipulation"
  type: paper
  arxiv: "2607.11874"
  year: 2026
  venue: CoRL 2026
  project: https://yunhaifeng.com/REGRIND
  added: 2026-11-06
  tags: [dexterous, retargeting, residual-rl, tool-use, real]
  takeaway_en: "From one human demo: retarget hand-object motion to a robot reference, train residual RL in sim to track object keypoints, transfer zero-shot with careful system ID. Scissors and screwdriver use on two hands."
  takeaway_zh: "从一条人类演示出发：把手-物运动重定向为机器人参考，在仿真中用残差强化学习跟踪物体关键点，并通过细致的系统辨识零样本迁移。在两种多指手上完成用剪刀、拧螺丝刀等任务。"
- title: "Towards Human-level Dexterous Teleoperation"
  type: paper
  arxiv: "2607.11481"
  year: 2026
  venue: CoRL 2026
  project: https://bigai-dex.github.io/blog/teledexter/
  added: 2026-11-06
  tags: [dexterous, teleoperation, in-hand, rl, real]
  takeaway_en: "Teleoperation controller that turns operator intent into learned hand-object contact execution, trained with single-stage RL on human motions. Reports 75% average success on seven in-hand and tool-use tasks."
  takeaway_zh: "遥操作控制器把操作者意图转化为学习到的手-物接触执行，基于人类动作用单阶段强化学习训练，零样本迁移真机。报告七个手内操作与工具使用任务平均成功率 75%。"
- title: "ADEPT: Accelerating Dexterity via Pre-Training and Post-Training using Reinforcement Learning"
  type: paper
  arxiv: "2608.19182"
  year: 2026
  venue: CoRL 2026
  project: https://adept-dexterity.github.io/
  added: 2026-11-06
  tags: [dexterous, rl-pretraining, sim-to-real, visuotactile, real]
  takeaway_en: "Pretrains a dexterous RL policy on generic object reposing, then post-trains downstream tasks with BC distillation, critic warm-up and conservative updates. Zero-shot sim-to-real on 23-DoF and 29-DoF hand-arm systems."
  takeaway_zh: "先在通用物体重定位任务上用强化学习预训练灵巧策略，再用行为克隆蒸馏、critic 预热和保守更新后训练下游任务。在 23 与 29 自由度手-臂系统上零样本仿真到真机。"
- title: "Human2Any: Human-to-Robot Transfer via Constraint-Aware Compositional Planning"
  type: paper
  arxiv: "2606.28813"
  year: 2026
  venue: CoRL 2026
  project: https://human2any.github.io/
  added: 2026-11-06
  tags: [human-video, object-centric, motion-planning, cross-embodiment, real]
  takeaway_en: "Learns object-object interaction priors from human videos and composes them with robot feasibility reasoning and motion planning, so one prior serves a Franka and an RBY-1 mobile humanoid without robot data."
  takeaway_zh: "从人类视频学习以物体间交互运动表示的先验，再与机器人可行性推理和运动规划组合，同一先验无需机器人数据即可用于 Franka 与 RBY-1 移动人形机器人。"
- title: "Dex4D: Task-Agnostic Point Track Policy for Zero-Shot Dexterous Manipulation"
  type: paper
  arxiv: "2602.15828"
  year: 2026
  venue: CoRL 2026
  project: https://dex4d.github.io/
  added: 2026-11-06
  tags: [dexterous, point-tracks, sim-to-real, zero-shot, real]
  takeaway_en: "Task-agnostic 'any pose to any pose' dexterous policy trained in sim on thousands of objects and conditioned on 3D point tracks; prompted with tracks from generated videos, it runs real tasks zero-shot."
  takeaway_zh: "在仿真中用数千种物体训练与任务无关的“任意位姿到任意位姿”灵巧策略，以 3D 点轨迹为条件；用生成视频提取的点轨迹作提示，即可零样本完成真实任务。"
