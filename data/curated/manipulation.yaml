- title: "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion"
  type: paper
  arxiv: "2303.04137"
  year: 2023
  org: Columbia, TRI, MIT
  code: https://github.com/real-stanford/diffusion_policy
  highlight: true
  tags: [real, sim, arm, diffusion, imitation]
  takeaway_en: Generating action sequences by denoising handles multimodal demos far better than regression; now a standard IL baseline.
  takeaway_zh: 以去噪方式生成动作序列，比回归更能处理多模态演示，已成为模仿学习标准基线。
- title: "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware"
  type: paper
  arxiv: "2304.13705"
  year: 2023
  org: Stanford
  code: https://github.com/tonyzhaozh/act
  highlight: true
  topics: [hardware]
  tags: [real, bimanual, imitation, low-cost]
  takeaway_en: ALOHA + ACT — a ~$20k bimanual teleop rig and an action-chunking Transformer that learns precise tasks from ~50 demos.
  takeaway_zh: ALOHA + ACT：约 2 万美元的双臂遥操作平台，加上动作分块 Transformer，约 50 条演示即可学会精细任务。
- title: "Mobile ALOHA: Learning Bimanual Mobile Manipulation with Low-Cost Whole-Body Teleoperation"
  type: paper
  arxiv: "2401.02117"
  year: 2024
  org: Stanford
  code: https://github.com/MarkFzp/mobile-aloha
  topics: [hardware]
  tags: [real, bimanual, mobile, imitation, low-cost]
  takeaway_en: Puts ALOHA on a mobile base; co-training with static ALOHA data boosts mobile tasks like cooking and opening cabinets.
  takeaway_zh: 将 ALOHA 装上移动底盘；与静态 ALOHA 数据联合训练显著提升做饭、开柜等移动任务表现。
- title: "3D Diffusion Policy: Generalizable Visuomotor Policy Learning via Simple 3D Representations"
  type: paper
  arxiv: "2403.03954"
  year: 2024
  org: Shanghai Qi Zhi, Tsinghua
  code: https://github.com/YanjieZe/3D-Diffusion-Policy
  tags: [real, sim, point-cloud, diffusion]
  takeaway_en: Conditions a diffusion policy on a compact point-cloud encoding; more data-efficient and robust to viewpoint than images.
  takeaway_zh: 用紧凑点云编码作为扩散策略条件，比图像输入更省数据、对视角更鲁棒。
- title: "Universal Manipulation Interface: In-The-Wild Robot Teaching Without In-The-Wild Robots"
  type: paper
  arxiv: "2402.10329"
  year: 2024
  org: Stanford, Columbia, TRI
  code: https://github.com/real-stanford/universal_manipulation_interface
  highlight: true
  topics: [hardware, datasets]
  tags: [real, arm, handheld, data-collection]
  takeaway_en: A handheld gripper with a GoPro collects demos anywhere; policies transfer directly to robot arms.
  takeaway_zh: 手持夹爪加 GoPro 可随处采集演示，训练出的策略可直接迁移到机械臂。
- title: "DexCap: Scalable and Portable Mocap Data Collection System for Dexterous Manipulation"
  type: paper
  arxiv: "2403.07788"
  year: 2024
  org: Stanford
  topics: [hardware]
  tags: [real, hand, data-collection]
  takeaway_en: A wearable mocap glove + camera rig records human hand motion that is retargeted to train dexterous robot hands.
  takeaway_zh: 可穿戴动捕手套与相机采集人手动作，重定向后用于训练灵巧机器人手。
- title: "Learning Dexterous In-Hand Manipulation"
  type: paper
  arxiv: "1808.00177"
  year: 2018
  org: OpenAI
  tags: [sim2real, hand, rl]
  takeaway_en: A Shadow Hand reorients a cube using RL trained purely in randomized simulation — a sim-to-real milestone.
  takeaway_zh: 完全在随机化仿真中用强化学习训练，Shadow 灵巧手在真实世界翻转方块，是 sim-to-real 里程碑。
- title: "Solving Rubik's Cube with a Robot Hand"
  type: paper
  arxiv: "1910.07113"
  year: 2019
  org: OpenAI
  tags: [sim2real, hand, rl]
  takeaway_en: Automatic domain randomization lets a sim-trained hand policy manipulate a Rubik's cube on real hardware.
  takeaway_zh: 自动域随机化让仿真训练的灵巧手策略在真实硬件上操作魔方。
- title: "Visual Dexterity: In-Hand Reorientation of Novel and Complex Object Shapes"
  type: paper
  arxiv: "2211.11744"
  year: 2022
  org: MIT
  tags: [sim2real, hand, rl, depth]
  takeaway_en: Reorients unseen objects in-hand using only a depth camera, with a policy trained in simulation.
  takeaway_zh: 仅凭深度相机即可在手中翻转未见过的物体，策略在仿真中训练。
- title: "VoxPoser: Composable 3D Value Maps for Robotic Manipulation with Language Models"
  type: paper
  arxiv: "2307.05973"
  year: 2023
  org: Stanford
  tags: [real, arm, llm, zero-shot]
  takeaway_en: LLMs write code that composes 3D affordance/constraint maps, which a planner turns into trajectories — no robot training.
  takeaway_zh: 大模型编写代码组合 3D 可供性/约束地图，再由规划器生成轨迹，无需机器人训练。
- title: "R3M: A Universal Visual Representation for Robot Manipulation"
  type: paper
  arxiv: "2203.12601"
  year: 2022
  org: Stanford, Meta AI
  tags: [representation, egocentric-video]
  takeaway_en: Pretrains a visual encoder on Ego4D human videos that makes downstream imitation far more data-efficient.
  takeaway_zh: 在 Ego4D 人类视频上预训练视觉编码器，显著提高下游模仿学习的数据效率。
- title: "Can a Frontier VLM Serve as a Robot Policy for Memory-Dependent Manipulation?"
  type: paper
  arxiv: "2610.17350"
  year: 2026
  project: https://embodied-astra.github.io
  code: https://github.com/jackbjed/embodied-astra-robomme
  added: 2026-10-19
  tags: [sim, vlm, memory, zero-shot, benchmark]
  takeaway_en: A frozen frontier VLM, prompted with the whole episode, outputs waypoints directly and reports 92.1% on RoboMME memory tasks with no task training.
  takeaway_zh: 冻结的前沿 VLM 以整段回合为上下文直接输出路径点，在 RoboMME 记忆类任务上报告 92.1% 成功率，且无需任务训练。
- title: "Blind Precise Assembly: Proprioceptive Sim-to-Real Peg-in-Hole for Diverse Parts"
  type: paper
  arxiv: "2610.23849"
  year: 2026
  org: MIT
  topics: [sim]
  added: 2026-10-19
  tags: [sim-to-real, assembly, proprioception, contact-rich]
  takeaway_en: Asks whether joint readings alone suffice for millimetre-precise insertion — trains sim-to-real policies with no camera, force or tactile input.
  takeaway_zh: 探究仅靠关节读数能否完成毫米级精密插装：训练不用相机、力或触觉输入的 sim-to-real 策略。
- title: "Beyond the End-Effector: Learning Whole-Arm Contact Manipulation from Human Demonstrations"
  type: paper
  arxiv: "2610.17802"
  year: 2026
  org: USC
  venue: CoRL 2026
  project: https://wacl-robot.github.io
  added: 2026-10-19
  tags: [whole-arm, non-prehensile, human-demos]
  takeaway_en: WACL learns from human demos to push and hold with the whole arm, choosing where on the arm to make contact while keeping the gripper's constraints.
  takeaway_zh: WACL 从人类示范中学习用整条手臂推、抵物体，自主选择手臂上的接触位置，同时满足末端执行器的约束。
- title: "HexaShell: A Thin Harness for Exploring the Limits of VLM Agents as Robot Coding Agents"
  type: paper
  arxiv: "2610.23479"
  year: 2026
  code: https://github.com/HexaFuture/HexaShell
  added: 2026-10-19
  topics: [vla]
  tags: [real, bimanual, vlm-agent, code-as-policy]
  takeaway_en: A coding agent drives a bimanual robot through one command line; after each failure it reads the logs and writes or fixes small reusable tool programs.
  takeaway_zh: 编程智能体通过一条命令行驱动双臂机器人；每次失败后读取日志，编写或修复可复用的小工具程序。
- title: "DexGraspNet: A Large-Scale Robotic Dexterous Grasp Dataset for General Objects Based on Simulation"
  type: dataset
  arxiv: "2210.02697"
  year: 2022
  org: PKU, BIGAI
  code: https://github.com/PKU-EPIC/DexGraspNet
  topics: [datasets]
  tags: [sim, dexterous-hand, grasping, large-scale]
  takeaway_en: Over a million physically validated ShadowHand grasps on thousands of objects, synthesized by optimizing a differentiable force-closure energy; a standard training set for dexterous grasp models.
  takeaway_zh: 通过优化可微的力封闭能量合成、并经物理仿真验证的百万级 ShadowHand 抓取，覆盖数千个物体，是灵巧抓取模型的常用训练集。
- title: "On Bringing Robots Home"
  type: paper
  arxiv: "2311.16098"
  year: 2023
  org: NYU, Meta
  code: https://github.com/notmahi/dobb-e
  tags: [home-robot, low-cost-data, imitation, open-source]
  takeaway_en: Dobb-E collects home demonstrations with a cheap reacher-grabber "stick", pretrains on them, then adapts to a new household task from a few minutes of data.
  takeaway_zh: Dobb-E 用低成本的手持夹取“棒”采集家庭示范数据并预训练，在新家庭任务上只需几分钟数据即可适配。
- title: "MoDex: Towards Universal Multi-Object Dexterous Grasping"
  type: paper
  arxiv: "2610.23888"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/Aurora-Xiong/MoDex
  added: 2026-10-20
  tags: [dexterous-hand, grasping, multi-object, residual-learning]
  takeaway_en: Grasps several objects at once with a dexterous hand by learning one-step residual corrections to a reference trajectory, with a strategy that adapts to how the objects are laid out.
  takeaway_zh: 让灵巧手一次抓取多个物体：学习对参考轨迹的单步残差修正，并根据物体的空间布局调整抓取策略。
- title: "Learn the Task, Not the Schedule: Reducing Spurious Cross-Arm Coupling in Bimanual Imitation Learning"
  type: paper
  arxiv: "2610.26507"
  year: 2026
  org: SJTU
  added: 2026-10-20
  topics: [learning]
  tags: [bimanual, imitation, data-augmentation]
  takeaway_en: CTR retimes the two arms in bimanual demos at training time while keeping task-required constraints, so the policy stops using the other arm's progress as a shortcut cue.
  takeaway_zh: CTR 在训练时对双臂示教中两只手臂的动作时序重新组合，同时保留任务必需的约束，避免策略把另一只手臂的进度当作捷径线索。
- title: "Transporter Networks: Rearranging the Visual World for Robotic Manipulation"
  type: paper
  arxiv: "2010.14406"
  year: 2020
  org: Google
  venue: CoRL 2020
  code: https://github.com/google-research/ravens
  tags: [sim, real, pick-and-place, rearrangement, equivariance]
  takeaway_en: Transporter Nets — pick-and-place as spatial matching of deep features cropped around the pick point; very sample-efficient on rearrangement tasks, released with the Ravens benchmark.
  takeaway_zh: Transporter 网络：把抓取-放置建模为以抓取点为中心的深度特征的空间匹配，在重排类任务上样本效率很高，并随论文发布 Ravens 基准。
- title: "CLIPort: What and Where Pathways for Robotic Manipulation"
  type: paper
  arxiv: "2109.12098"
  year: 2021
  org: University of Washington, NVIDIA
  venue: CoRL 2021
  code: https://github.com/cliport/cliport
  topics: [vla]
  tags: [sim, real, language, clip, pick-and-place]
  takeaway_en: CLIPort — combines CLIP's semantic "what" stream with Transporter's spatial "where" stream for language-conditioned tabletop manipulation; an early bridge from web vision-language models to robot actions.
  takeaway_zh: CLIPort：把 CLIP 提供的语义"是什么"通路与 Transporter 的空间"在哪里"通路结合，实现语言条件的桌面操作；是较早把网络视觉语言模型接入机器人动作的工作。
- title: "Perceiver-Actor: A Multi-Task Transformer for Robotic Manipulation"
  type: paper
  arxiv: "2209.05451"
  year: 2022
  org: University of Washington, NVIDIA
  venue: CoRL 2022
  code: https://github.com/peract/peract
  topics: [vla]
  tags: [sim, real, voxel, rlbench, language, keyframe]
  takeaway_en: PerAct — a Perceiver Transformer over voxelized RGB-D observations that predicts the next keyframe gripper pose as voxel classification; one language-conditioned policy for many RLBench and real tasks.
  takeaway_zh: PerAct：在体素化的 RGB-D 观测上运行 Perceiver Transformer，把下一关键帧夹爪位姿当作体素分类来预测；一个语言条件策略即可覆盖众多 RLBench 与真机任务。
- title: "RVT: Robotic View Transformer for 3D Object Manipulation"
  type: paper
  arxiv: "2306.14896"
  year: 2023
  org: NVIDIA
  venue: CoRL 2023
  code: https://github.com/NVlabs/RVT
  tags: [sim, real, multi-view, rlbench, keyframe]
  takeaway_en: RVT — re-renders the point cloud into a few virtual views and uses a multi-view Transformer to predict keyframe poses; reported to train and run much faster than voxel-based PerAct on RLBench. Repo also hosts RVT-2.
  takeaway_zh: RVT：把点云重新渲染为若干虚拟视角，再用多视角 Transformer 预测关键帧位姿；论文报告在 RLBench 上训练与推理都比基于体素的 PerAct 快得多。代码库同时包含 RVT-2。
- title: "ReKep: Spatio-Temporal Reasoning of Relational Keypoint Constraints for Robotic Manipulation"
  type: paper
  arxiv: "2409.01652"
  year: 2024
  org: Stanford, Columbia
  venue: CoRL 2024
  code: https://github.com/huangwl18/ReKep
  topics: [vla]
  tags: [real, zero-shot, keypoints, vlm, optimization]
  takeaway_en: ReKep — a VLM writes manipulation tasks as Python cost functions over 3D keypoints (relational keypoint constraints), solved by a hierarchical optimizer in real time; zero-shot, no task-specific training.
  takeaway_zh: ReKep：由视觉语言模型把操作任务写成定义在三维关键点上的 Python 代价函数（关系关键点约束），再由分层优化器实时求解；零样本，无需针对任务训练。
- title: "Contact-GraspNet: Efficient 6-DoF Grasp Generation in Cluttered Scenes"
  type: paper
  arxiv: "2103.14127"
  year: 2021
  org: NVIDIA
  venue: ICRA 2021
  code: https://github.com/NVlabs/contact_graspnet
  topics: [perception]
  tags: [grasping, point-cloud, 6-dof, clutter]
  takeaway_en: Contact-GraspNet — predicts 6-DoF parallel-jaw grasps for a whole cluttered scene from one depth view by treating observed points as grasp contacts, which shrinks the problem to 4 DoF per point.
  takeaway_zh: Contact-GraspNet：从单帧深度图为整个杂乱场景预测 6 自由度平行夹爪抓取；把观测到的点当作抓取接触点，使每个点只需学习 4 个自由度。
- title: "AnyGrasp: Robust and Efficient Grasp Perception in Spatial and Temporal Domains"
  type: paper
  arxiv: "2212.08333"
  year: 2022
  org: SJTU
  code: https://github.com/graspnet/anygrasp_sdk
  topics: [perception]
  tags: [grasping, real, dynamic, tracking]
  takeaway_en: AnyGrasp — dense 7-DoF parallel-gripper grasp detection trained on real sensor data with analytic labels and center-of-mass awareness, plus grasp tracking across frames for moving objects; released as an SDK.
  takeaway_zh: AnyGrasp：基于真实传感器数据与解析标注训练、考虑物体质心的稠密 7 自由度平行夹爪抓取检测，并能跨帧跟踪抓取以应对运动物体；以 SDK 形式发布。
- title: "DONIC: Generalist Dexterous Bimanual Tracking Control from Human Demonstrations"
  type: paper
  arxiv: "2610.29997"
  year: 2026
  code: https://github.com/Ropedia/DONIC
  project: https://ropedia.github.io/DONIC/
  added: 2026-10-23
  topics: [learning, datasets]
  tags: [sim, dexterous, bimanual, tracking, ppo, human-demos]
  takeaway_en: One two-hand policy (PPO + BC on its own verified successes) tracks retargeted human hand-object motions; ships BiHOI (1,575 sequences, 229 objects). Reports 86.8% on unseen trajectories, 57.3% on new objects.
  takeaway_zh: 用一个双手跟踪策略（PPO 结合对自身成功执行的行为克隆）复现重定向后的人手-物体交互动作，并发布 BiHOI 数据集（1575 段双手序列、229 个物体）。论文报告在未见轨迹上成功率 86.8%、新物体上 57.3%。
- title: "From VLM Planners to Robotic Agents: Self-Evolving Harnesses for History-Dependent Manipulation"
  type: paper
  arxiv: "2610.29560"
  year: 2026
  code: https://github.com/StevenKKXS/SERA
  project: https://stevenkkxs.github.io/sera-webpage/
  added: 2026-10-24
  topics: [vla]
  tags: [agentic, harness, memory, long-horizon, vlm-planner, sim]
  takeaway_en: SERA turns the high-level VLM into an agent with an editable harness that tracks task progress for a fixed VLA executor, and revises the harness from rollouts; reports 51.4% vs 44.4% overall success on RoboMME.
  takeaway_zh: SERA 把高层 VLM 规划器做成带可编辑执行框架的智能体，为固定的底层 VLA 记录任务进度与执行反馈，并利用环境回放自动改进框架；报告在 RoboMME 上总体成功率 51.4%，未自我演化时为 44.4%。
- title: "EgoMimic: Scaling Imitation Learning via Egocentric Video"
  type: paper
  arxiv: "2410.24221"
  year: 2024
  org: Georgia Tech
  code: https://github.com/SimarKareer/EgoMimic
  project: https://egomimic.github.io/
  topics: [learning]
  tags: [real, bimanual, human-video, egocentric, imitation]
  takeaway_en: Treats egocentric human video with 3D hand tracking (Project Aria glasses) as robot data and co-trains one policy on both; reports an extra hour of human hand data helps more than an extra hour of robot data.
  takeaway_zh: 把佩戴 Project Aria 眼镜采集、带三维手部跟踪的第一视角人类视频当作机器人数据，与机器人数据共同训练同一个策略；论文报告多 1 小时人手数据比多 1 小时机器人数据更有用。
- title: "Predictive Inverse Dynamics Models are Scalable Learners for Robotic Manipulation"
  type: paper
  arxiv: "2412.15109"
  year: 2024
  org: Shanghai AI Lab / PKU / CUHK
  venue: ICLR 2025
  code: https://github.com/OpenRobotLab/Seer
  project: https://nimolty.github.io/Seer/
  topics: [world-models]
  tags: [real, sim, arm, inverse-dynamics, foresight, pretraining]
  takeaway_en: "Seer forecasts the next visual state and feeds it to an inverse dynamics model that outputs actions, trained end to end and pretrained on DROID; reports 4.28 avg. length on CALVIN ABC-D plus LIBERO and real-robot gains."
  takeaway_zh: Seer 先预测未来视觉状态，再由逆动力学模型据此输出动作，端到端训练并在 DROID 上预训练；报告 CALVIN ABC-D 平均任务长度 4.28，在 LIBERO-LONG 和真机任务上也有提升。
- title: "DexGraspVLA: A Vision-Language-Action Framework Towards General Dexterous Grasping"
  type: paper
  arxiv: "2502.20900"
  year: 2025
  org: Peking University / PsiBot
  venue: AAAI 2026
  code: https://github.com/Psi-Robot/DexGraspVLA
  project: https://dexgraspvla.github.io
  topics: [vla]
  tags: [real, dexterous-hand, grasping, hierarchical, diffusion-policy]
  takeaway_en: A pretrained VLM plans and a diffusion controller grasps with a dexterous hand, working on domain-invariant features from foundation models; reports 90%+ grasp success across thousands of unseen cluttered scenes.
  takeaway_zh: 由预训练 VLM 做高层规划、扩散控制器驱动灵巧手抓取，底层输入为基础模型提取的域不变特征；报告在数千个未见过的杂乱场景中抓取成功率超过 90%。
- title: "FORCA: A Force-Aware Coding Agent for Contact-Rich Robot Manipulation"
  type: paper
  arxiv: "2610.31841"
  year: 2026
  project: https://tanoom.github.io/forca/
  added: 2026-10-26
  topics: [tactile]
  tags: [real, arm, force-torque, contact-rich, llm-agent, code-as-policy]
  takeaway_en: "A coding agent that reads wrist force/torque as well as images, writes probing and force-feedback programs, and revises them from force logs; no demos or training. Beats its vision-only variant on 5 real tasks."
  takeaway_zh: 同时读取腕部力/力矩与图像的编程智能体：编写接触探测与力反馈控制程序，并在每次执行后依据力记录诊断失败、修改代码；无需示教或训练。在 5 个真实任务上优于仅视觉版本。
- title: "ContactBench 1.0: A Benchmark for Everyday Contact-Rich Robotic Manipulation"
  type: paper
  arxiv: "2610.24512"
  year: 2026
  project: https://jingyi-xiang.github.io/contactbench
  added: 2026-10-26
  topics: [tactile, datasets]
  tags: [benchmark, contact-rich, real, sim, 3d-printable, visuotactile]
  takeaway_en: "36 contact-rich tasks built around eight everyday skills, with 3D-printable objects that each have a matching sim model. Reports that tested visuo-tactile policies did not clearly beat vision-only ones."
  takeaway_zh: 围绕八种日常接触技能设计的 36 个接触密集型任务，40 多个物体可用消费级 3D 打印机复现，且每个都有对应仿真模型。报告称所测的视触觉策略并未明显优于纯视觉策略。
- title: "COWBOY: A Scalable Sim-to-Real Framework for Learning Contextual Whole-Body Manipulation"
  type: paper
  arxiv: "2610.28948"
  year: 2026
  project: https://cowboy-manip.com
  added: 2026-10-26
  topics: [learning]
  tags: [mobile-manipulation, whole-body, dexterous-hand, sim2real, distillation, point-cloud, active-vision]
  takeaway_en: "Mobile dexterous grasping learned in sim: a whole-body controller does reaching and active vision, local RL experts the object, all distilled into one point-cloud policy; reports zero-shot real transfer."
  takeaway_zh: 在仿真中学习移动灵巧抓取：全身控制器负责底盘-手臂协同到达与主动视觉，局部强化学习专家负责物体交互，二者蒸馏成一个基于点云的视觉策略；报告可零样本迁移到真实世界的数百个物体与场景。
- title: "Scaling Dexterous Manipulation via Action Representation Pretraining"
  type: paper
  arxiv: "2610.34453"
  year: 2026
  project: https://arpg-project.github.io/
  added: 2026-10-27
  topics: [learning]
  tags: [dexterous, bimanual, human-data, pretraining, action-representation]
  takeaway_en: "ARPG pretrains an action encoder on human manipulation data, then trains a 130M generative policy in its space. Reports bimanual dexterous success up from 10.1% (π0.5) to 44.7% on DexJoCo."
  takeaway_zh: ARPG 把动作表征学习与动作生成解耦：先在大规模人类操作数据上预训练动作编码器，再在其表征空间训练 1.3 亿参数的生成策略。报告在 DexJoCo 双手灵巧任务上平均成功率从 π0.5 的 10.1% 提升到 44.7%。
- title: "AdaDexTrack: Dynamic Modulation for Adaptive and Generalizable Dexterous Manipulation Tracking"
  type: paper
  arxiv: "2610.33852"
  year: 2026
  venue: CVPR 2026
  project: https://janebek.github.io/AdaDexTrack/
  added: 2026-10-27
  topics: [learning]
  tags: [dexterous, motion-tracking, language-conditioned, rl, distillation, sim2real]
  takeaway_en: "Language-to-dexterous-manipulation as modulated tracking: a distilled generalist tracker plus an RL-trained modulator that keeps adjusting the reference, object latent and position target; zero-shot sim-to-real."
  takeaway_zh: "把语言条件灵巧操作变成“可调制的跟踪”：蒸馏得到的通用跟踪器加 RL 训练的调制器，在执行中持续修正参考轨迹、物体隐表征与位置目标，抑制误差累积；零样本迁移到真机。"
- title: "AdaPolicy: Action-Driven Anticipatory Robot Policies via Next-Chunk Prediction"
  type: paper
  arxiv: "2610.34280"
  year: 2026
  project: https://teee111.github.io/AdaPolicy/
  added: 2026-10-27
  topics: [learning]
  tags: [imitation-learning, action-chunking, auxiliary-loss, real]
  takeaway_en: "Foresight without predicting future frames: a training-only head forecasts the next action chunk and backpropagates through the policy's latent. No inference cost; reports up to +14 pts on mm-precision real tasks."
  takeaway_zh: "不预测未来图像也能获得“预见性”：仅在训练时用级联头预测下一个动作块，并把损失回传到在线策略的隐状态，推理零额外开销；报告在耳机装配、穿鞋带等毫米级真机任务上最高提升 14 个百分点。"
