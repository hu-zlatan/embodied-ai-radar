  project: https://aha-vlm.github.io/
  tags: [vlm, failure-detection]
  takeaway_en: "AHA is a vision-language model for detecting and reasoning about manipulation failures, a gap in earlier VLM work."
  takeaway_zh: "AHA 是用于检测和推理操作失败的视觉-语言模型，填补此前 VLM 研究的空白。"
- title: "Look Before You Leap: Unveiling the Power of GPT-4V in Robotic Vision-Language Planning"
  type: paper
  arxiv: "2311.17842"
  year: 2023
  tags: [vlm, planning, gpt-4v]
  takeaway_en: "Early study of GPT-4V for physically grounded vision-language task planning on robots."
  takeaway_zh: "较早研究 GPT-4V 用于机器人基于物理场景的视觉-语言任务规划。"
- title: "Physically Grounded Vision-Language Models for Robotic Manipulation"
  type: paper
  arxiv: "2309.02561"
  year: 2023
  venue: ICRA 2024
  tags: [vlm, physical-properties]
  takeaway_en: "Teaches vision-language models about physical object properties so they can reason better for manipulation."
  takeaway_zh: "让视觉-语言模型理解物体的物理属性，从而更好地为操作任务推理。"
- title: "A Survey of Embodied Learning for Object-Centric Robotic Manipulation"
  type: paper
  arxiv: "2408.11537"
  year: 2024
  code: https://github.com/RayYoh/OCRM_survey
  tags: [survey, object-centric]
  takeaway_en: "Survey of embodied learning for object-centric robotic manipulation."
  takeaway_zh: "综述面向物体的机器人操作中的具身学习方法。"
- title: "Correct Robots Before They Make Mistakes: Proactive Human-in-the-Loop Intervention via Preference Learning"
  type: paper
  arxiv: "2611.05667"
  year: 2026
  org: KIT
  project: https://intuitive-robots.github.io/PHIL-page/
  added: 2026-11-05
  tags: [real, human-in-the-loop, xr, diffusion-policy]
  takeaway_en: "PHIL shows an operator the policy's predicted motion in XR so they can step in before an error, then trains on rejected vs corrected chunks; reports 70.3% vs 44.0% for HG-DAgger with a diffusion policy."
  takeaway_zh: "PHIL 在 XR 中预览策略预测的动作，让操作者在出错前介入，再用被否决与修正后的动作片段做偏好训练；报告相比 HG-DAgger，扩散策略成功率从 44.0% 升至 70.3%。"
- title: "CSO: Refining Robotic Policies via Skill Distribution Alignment and Skill-Grained Optimization"
  type: paper
  arxiv: "2610.38357"
  year: 2026
  venue: NeurIPS 2026
  added: 2026-11-05
  tags: [real, sim, skills, post-training]
  takeaway_en: "Two-stage post-training for VQ-style skill policies: align the skill prior with successful online rollouts, then optimise per skill with the encoder frozen; reports LIBERO success rising from 80.1% to 97.5%."
  takeaway_zh: "面向 VQ 类技能策略的两阶段后训练：先让技能先验对齐线上成功轨迹，再冻结编码器按技能优化；报告 LIBERO 成功率从 80.1% 升至 97.5%。"
- title: "Learning Object-Centric Motion Priors from Human for Robotic Dexterous Manipulation"
  type: paper
  arxiv: "2611.05979"
  year: 2026
  venue: AAAI 2026
  added: 2026-11-05
  tags: [real, sim, dexterous, human-data, rl]
  takeaway_en: "Learns to predict future hand-object states from human interaction datasets and uses the predicted object states as a general RL reward, reducing reward engineering; deployed on different hands (AAAI oral)."
  takeaway_zh: "从人手交互数据学习预测未来手物状态，并把预测的物体状态作为通用强化学习奖励，减少逐任务奖励设计；已部署到不同灵巧手（AAAI 口头报告）。"
- title: "Online Adaptation to Latent Physical Properties for Learning from Demonstration"
  type: paper
  arxiv: "2611.06118"
  year: 2026
  project: https://isri-aist.github.io/latent-dynamics-project-page/
  topics: [manipulation, learning]
  tags: [imitation-learning, online-adaptation, real, center-of-mass]
  added: 2026-11-05
  takeaway_en: "Updates a latent estimate of hidden object properties during execution to condition an imitation policy; helps with center-of-mass changes, though it reports only about 30% success on unseen locations in sim."
  takeaway_zh: "执行中在线更新物体隐藏物性的潜变量，并以此调节模仿策略；对质心变化有帮助，但报告仿真中未见过的质心位置成功率仅约 30%。"
- title: "VLS: Steering Pretrained Robot Policies via Vision-Language Models"
  type: paper
  arxiv: "2602.03973"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/Vision-Language-Steering/code
  project: https://vision-language-steering.github.io/webpage/
  added: 2026-11-06
  topics: [vla]
  tags: [steering, inference-time, diffusion-policy, vlm, reward, real]
  takeaway_en: "Adapts a frozen diffusion or flow policy at test time: a VLM writes differentiable rewards that steer denoising when obstacles or clutter shift the scene. Reports +31% on CALVIN and +13% on LIBERO-PRO; no retraining."
  takeaway_zh: "在测试时适配冻结的扩散或流匹配策略：当障碍或杂物改变场景时，由 VLM 生成可微奖励来引导去噪。报告 CALVIN 提升 31%、LIBERO-PRO 提升 13%，无需重新训练。"
- title: "DeCAL: Towards Physically-Grounded Dexterous Vision-Language-Action Models via Contact-Aware Latent Co-Imagination"
  type: paper
  arxiv: "2609.09119"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/AureleoPKU/DeCAL
  project: https://aureleopku.github.io/DeCAL
  added: 2026-11-06
  topics: [vla, tactile]
  tags: [dexterous, visuotactile, mixture-of-transformers, latent-imagination, real]
  takeaway_en: "Dexterous visuotactile VLA on a mixture-of-transformers: contact-aware gating decides when touch matters; the model jointly imagines future visual and tactile latents. Reports 71% average success on contact-rich tasks."
  takeaway_zh: "基于混合 Transformer 的灵巧视触觉 VLA：接触感知门控决定何时引入触觉，并联合想象未来的视觉与触觉潜变量。报告在富接触任务上平均成功率 71%。"
- title: "MobiAgent: Dual-Loop Recursive Policy Self-Improvement for Long-Horizon Mobile Manipulation"
  type: paper
  arxiv: "2610.03476"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/kaiknower/MobiAgent
  project: https://kaiknower.github.io/mobiagent
  added: 2026-11-06
  topics: [vla]
  tags: [mobile-manipulation, long-horizon, agent, skill-library, self-improvement, real]
  takeaway_en: "Mobile-manipulation agent with two loops: a VLM plans and composes flow-matching skills at run time, and an outer loop mines rollouts to find and fine-tune skills. Reports +22.5 pts over π0.5 on BEHAVIOR-1K."
  takeaway_zh: "双循环移动操作智能体：内循环由 VLM 规划并组合流匹配技能，外循环从部署数据中自动发现并微调技能。报告在 BEHAVIOR-1K 上比 π0.5 高 22.5 个百分点。"
- title: "Attention from Action, for Action: Emergent Visual Bottlenecks for Policy Learning"
  type: paper
  arxiv: "2608.13422"
  year: 2026
  venue: CoRL 2026
  code: https://github.com/zheyu-zhuang/seeker
  added: 2026-11-06
  tags: [attention, region-of-interest, dinov3, data-efficiency, real]
  takeaway_en: "Seeker learns where to look from action supervision alone, giving progress-aware crops on frozen DINOv3 features. Reports real-robot success 48.3% to 76.7%, and 20% to 60% under lighting and background shifts."
  takeaway_zh: "Seeker 仅凭动作监督学习“看哪里”，在冻结的 DINOv3 特征上给出随任务进展变化的裁剪区域。报告真机成功率从 48.3% 升到 76.7%，光照与背景变化下从 20% 升到 60%。"
- title: "Spatial-UMI-Dream: Scaling World Action Models with Metric Geometry for UMI Manipulation"
  type: paper
  arxiv: "2611.07229"
  year: 2026
  project: https://weiduoyuan.com/spatial-umi-dream/
  added: 2026-11-06
  topics: [world-models, datasets]
  tags: [umi, wam, rgb-d, metric-depth, benchmark, real, sim]
  takeaway_en: "5B world action model pretrained on 605 h of RGB-D UMI data that predicts RGB, metric depth and actions. Adds RoboTwin-UMI; reports 85% average real success, +24.2 points over the best baseline."
  takeaway_zh: "在 605 小时 RGB-D UMI 数据上预训练的 5B 世界动作模型，同时预测 RGB、度量深度和动作。并提出 RoboTwin-UMI 基准；报告真机平均成功率 85%，比最强基线高 24.2 个百分点。"
- title: "MOMASPLAT: Dynamic Novel-View Demonstration Augmentation for Mobile Manipulation"
  type: paper
  arxiv: "2611.08372"
  year: 2026
  org: UT Austin
  project: https://robin-lab.cs.utexas.edu/momasplat
  added: 2026-11-06
  tags: [mobile-manipulation, data-augmentation, gaussian-splatting, novel-view, real]
  takeaway_en: "Augments mobile-manipulation demos with new base poses, re-rendering the moving object too, via Gaussian splatting and action retargeting. Reports more than doubling the best baseline's success on unseen base poses."
  takeaway_zh: "用高斯泼溅与动作重定向为移动操作示教合成新的底盘位姿视角，连被操作的运动物体也一起重渲染。报告在未见底盘位姿下成功率是最强基线的两倍以上。"
- title: "Latent RL Priors for Data-Efficient Dexterous Manipulation"
  type: paper
  arxiv: "2611.08458"
  year: 2026
  project: https://yixiaowang7.github.io/latent-rl-prior-page/
  added: 2026-11-06
  topics: [learning]
  tags: [dexterous, rl, sim2real, flow-matching, data-efficiency, bimanual]
  takeaway_en: "Distills sim RL rollouts into a frozen flow-matching action decoder, then learns only a visual interface to its latent from a few demos. Reports beating fine-tuned π0.5 and GR00T N1.7 with 5-10x fewer demos."
  takeaway_zh: "把仿真中强化学习的经验蒸馏进冻结的流匹配动作解码器，之后只需用少量示教学习从图像到其潜变量的视觉接口。报告用少 5–10 倍的示教超过微调后的 π0.5 与 GR00T N1.7。"
