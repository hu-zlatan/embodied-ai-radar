# Related lists, courses, docs and communities (shown in the README and on the site).
# Only well-known, real resources; every URL is checked by verify.yml.
# kind: list | course | docs | community   lang: en | zh
- name: Embodied-AI-Guide
  url: https://github.com/TianxingChen/Embodied-AI-Guide
  kind: list
  lang: zh
  note_en: A large Chinese-language beginner's guide to embodied AI, from fundamentals to research directions.
  note_zh: 中文具身智能入门指南，从基础知识一路讲到各研究方向。
- name: Embodied_AI_Paper_List (HCPLab-SYSU)
  url: https://github.com/HCPLab-SYSU/Embodied_AI_Paper_List
  kind: list
  lang: en
  note_en: Paper list accompanying a survey of embodied AI, organized by perception, interaction, agents and sim-to-real.
  note_zh: 配合具身智能综述的论文列表，按感知、交互、智能体与 sim-to-real 组织。
- name: awesome-humanoid-robot-learning
  url: https://github.com/YanjieZe/awesome-humanoid-robot-learning
  kind: list
  lang: en
  note_en: A focused list of humanoid robot learning papers.
  note_zh: 专注于人形机器人学习的论文列表。
- name: Awesome-Robotics-Foundation-Models
  url: https://github.com/robotics-survey/Awesome-Robotics-Foundation-Models
  kind: list
  lang: en
  note_en: Papers on foundation models in robotics, from the survey "Foundation Models in Robotics".
  note_zh: 机器人基础模型相关论文，来自综述《Foundation Models in Robotics》。
- name: Robotic Manipulation (MIT 6.4210, Russ Tedrake)
  url: https://manipulation.csail.mit.edu/
  kind: course
  lang: en
  note_en: Free online textbook and course on perception, planning and control for manipulation, with Drake notebooks.
  note_zh: 免费在线教材与课程，涵盖操作中的感知、规划与控制，附 Drake 交互笔记本。
- name: Underactuated Robotics (MIT, Russ Tedrake)
  url: https://underactuated.mit.edu/
  kind: course
  lang: en
  note_en: Free online textbook on nonlinear dynamics, optimal control and trajectory optimization for walking, flying and swimming robots.
  note_zh: 免费在线教材，讲解行走、飞行、游动机器人的非线性动力学、最优控制与轨迹优化。
- name: CS 285 Deep Reinforcement Learning (UC Berkeley)
  url: https://rail.eecs.berkeley.edu/deeprlcourse/
  kind: course
  lang: en
  note_en: Sergey Levine's deep RL course; lecture videos and slides are public.
  note_zh: Sergey Levine 的深度强化学习课程，讲座视频与课件公开。
- name: LeRobot documentation
  url: https://huggingface.co/docs/lerobot
  kind: docs
  lang: en
  note_en: Hands-on docs for Hugging Face LeRobot — record data, train ACT/diffusion/VLA policies and run them on low-cost arms.
  note_zh: Hugging Face LeRobot 实操文档：采集数据、训练 ACT/扩散/VLA 策略并在低成本机械臂上运行。
- name: Isaac Lab documentation
  url: https://isaac-sim.github.io/IsaacLab/
  kind: docs
  lang: en
  note_en: Docs and tutorials for NVIDIA's GPU-parallel robot learning framework.
  note_zh: NVIDIA GPU 并行机器人学习框架的文档与教程。
- name: MuJoCo documentation
  url: https://mujoco.readthedocs.io/
  kind: docs
  lang: en
  note_en: Reference and modeling guide for the MuJoCo physics engine (MJX, MJCF, Python bindings).
  note_zh: MuJoCo 物理引擎的参考与建模指南（MJX、MJCF、Python 绑定）。
- name: 古月居 (GuYueHome)
  url: https://www.guyuehome.com/
  kind: community
  lang: zh
  note_en: A long-running Chinese ROS and robotics community with tutorials and forums.
  note_zh: 历史悠久的中文 ROS 与机器人社区，提供教程与论坛。
