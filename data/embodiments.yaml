# Embodiment tags for the site's filter. Computed at build time from title + abstract (feed)
# or title + takeaway + tags (curated) with the same scored keyword rule as topics
# (title hit 3, each abstract occurrence 1) but tagged at >= 1: one explicit mention of the robot type is enough. Lowercase keywords.
- id: arm
  en: Robot arm
  zh: 机械臂
  keywords: [robot arm, robotic arm, robot arms, manipulator, franka, ur5, xarm, bimanual, single-arm, dual-arm]
- id: hand
  en: Dexterous hand
  zh: 灵巧手
  keywords: [dexterous, robotic hand, robot hand, multi-fingered, multifingered, anthropomorphic hand, allegro, leap hand, in-hand]
- id: humanoid
  en: Humanoid
  zh: 人形
  keywords: [humanoid]
- id: legged
  en: Quadruped / legged
  zh: 四足 / 足式
  keywords: [quadruped, quadrupedal, legged robot, legged locomotion, robot dog, biped, anymal, unitree go]
- id: mobile
  en: Mobile robot
  zh: 移动机器人
  keywords: [mobile robot, mobile manipulat, wheeled robot, ground robot, mobile base, ugv]
- id: aerial
  en: Drone / aerial
  zh: 无人机
  keywords: [drone, quadrotor, quadcopter, uav, aerial robot, aerial vehicle, multirotor]
- id: vehicle
  en: Autonomous driving
  zh: 自动驾驶
  keywords: [autonomous driving, self-driving, autonomous vehicle, end-to-end driving, driving scene]
- id: underwater
  en: Underwater / marine
  zh: 水下 / 海洋
  keywords: [underwater, auv, marine robot, surface vessel]
